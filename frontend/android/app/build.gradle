import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// Version aus der GEMEINSAMEN, getrackten Quelle frontend/version.json lesen
// (dieselbe Datei fuettert iOS via scripts/apply-version.sh). rootProject ist
// frontend/android, die Datei liegt eine Ebene darueber in frontend/.
def versionJsonFile = new File(rootProject.projectDir, '../version.json')
def appVersionCode = 1
def appVersionName = '1.0.0'
if (versionJsonFile.exists()) {
    def v = new JsonSlurper().parse(versionJsonFile)
    appVersionCode = (v.androidVersionCode ?: 1) as int
    appVersionName = (v.version ?: '1.0.0') as String
} else {
    logger.warn("version.json nicht gefunden unter ${versionJsonFile} — nutze Defaults ${appVersionCode}/${appVersionName}")
}

android {
    namespace = "de.godsapp.konfiquest"
    compileSdk rootProject.ext. compileSdkVersion
    defaultConfig {
        applicationId "de.godsapp.konfiquest"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Release-Keystore aus gradle-Properties (KONFI_*), Werte aus
            // ~/.claude/secrets/keystores/konfi-keystore.env (beim Build via -P durchgereicht).
            if (project.hasProperty('KONFI_KEYSTORE_PATH')) {
                storeFile file(KONFI_KEYSTORE_PATH)
                storePassword KONFI_KEYSTORE_PASSWORD
                keyAlias KONFI_KEY_ALIAS
                keyPassword KONFI_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            // minifyEnabled seit 19.09.2026 an: Die Play Console meldete
            // "DEX-Codeoptimierung unter dem Grenzwert" (Verschleierung 2 %,
            // Frist Februar 2027). Die Regeln, die Capacitor und Firebase vor
            // R8 schuetzen, stehen in proguard-rules.pro -- ohne sie findet
            // die Bruecke ihre Plugins nicht mehr, und zwar erst auf dem
            // Geraet, nicht beim Bauen.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (project.hasProperty('KONFI_KEYSTORE_PATH')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    // Zahl am App-Symbol und eigener Push-Dienst (29.09.2026):
    // KonfiMessagingService ueberschreibt onMessageReceived(RemoteMessage),
    // AppSymbolZahl ruft ShortcutBadger. Beides bringen die Plugins nur als
    // "implementation" mit, fuer den Code der App also nicht sichtbar. Die
    // Fassungen stehen in variables.gradle und gelten dort auch fuer die
    // Plugins -- es bleibt je EINE Fassung im Bau.
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    implementation "me.leolin:ShortcutBadger:$shortcutBadgerVersion@aar"
    // JVM-Unit-Tests unter src/test/ (./gradlew testDebugUnitTest).
    // Instrumentierte Tests auf dem Geraet gibt es nicht; die
    // androidTest-Abhaengigkeiten der Capacitor-Vorlage sind deshalb weg
    // (02.10.2026). Die Fassungen in variables.gradle bleiben, die Plugins
    // lesen sie.
    testImplementation "junit:junit:$junitVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        // Crashlytics haengt an DERSELBEN google-services.json und muss NACH
        // dem google-services-Plugin angewendet werden. Bewusst in demselben
        // if-Zweig: Ohne Config gibt es kein Firebase-Projekt, in das
        // Mapping-Datei und Berichte gehoeren koennten.
        //
        // Dass dieser Zweig ueberhaupt erreicht wird, prueft
        // scripts/prepare-android.sh HART ab — genau weil ein Fehlschlag hier
        // STILL bleibt (siehe die Begruendung dort und der Push-Totalausfall
        // 1.5.0). Beim Crashlytics-Ausfall waere es noch leiser: Die App
        // laeuft, stuerzt aber unbemerkt ab.
        apply plugin: 'com.google.firebase.crashlytics'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Mapping-Datei fuer die Absturzdiagnose hochladen.
//
// WARUM DAS NOETIG IST: Seit 19.09.2026 laeuft der Release-Bau mit
// minifyEnabled true, R8 benennt also alle Klassen um. Ein Absturzbericht
// zeigt dann `a.b.c.d()` statt des echten Namens. Das Crashlytics-Plugin
// laedt die Mapping-Datei nur hoch, wenn das hier eingeschaltet ist — die
// Voreinstellung fuer `mappingFileUploadEnabled` haengt vom Build-Typ ab und
// ist bei einem Release mit Verschleierung genau das, was man braucht.
//
// Nur fuer release: Ein Debug-Bau wird nicht verschleiert und braucht es
// nicht; der Upload kostet dort nur Bauzeit.
//
// NUR MIT DEM CRASHLYTICS-PLUGIN (03.10.2026): `firebaseCrashlytics` bringt
// erst das Plugin mit. Ohne google-services.json (lokaler Bau, Fork) wird es
// oben nicht angewendet, und der Block brach das Konfigurieren ab ("Could not
// find method firebaseCrashlytics()"). withPlugin fuehrt ihn genau dann aus,
// wenn das Plugin angewendet ist -- hier also sofort, mit Datei wie bisher.
// Bewusst NACH dem try: Ein Fehler hier soll den Bau anhalten, nicht im catch
// als logger.info verschwinden. Test androidOhneFirebaseDatei.test.ts.
pluginManager.withPlugin('com.google.firebase.crashlytics') {
    android {
        buildTypes {
            release {
                firebaseCrashlytics {
                    mappingFileUploadEnabled = true
                }
            }
        }
    }
}
