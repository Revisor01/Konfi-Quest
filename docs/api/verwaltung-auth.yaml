  # ==========================================================================
  # BETRIEB / DIAGNOSE (direkt in backend/createApp.js, kein Router)
  # /health, /status und /app-version sind bewusst OHNE Authentifizierung
  # (Docker-Healthcheck, Uptime-Monitoring, Update-Hinweis der Apps).
  # Die drei Metrics-Endpunkte verlangen ein Token und
  # zusaetzlich req.user.is_super_admin.
  # ==========================================================================
  /api/health:
    get:
      tags: ["System & Monitoring"]
      summary: Liveness-Check (ohne Anmeldung)
      description: >
        Minimaler Endpunkt für Docker-Healthcheck und Traefik. Bewusst ohne
        Datenbank-Prüfung: ein haengender DB-Check wuerde einen gesunden
        Container vom Healthcheck killen lassen.
      security: []
      responses:
        "200": { description: "status: OK, message" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: []
        org-scope: false
        objekt-pruefung: "keine"
        hinweis: "Keine Authentifizierung. Gibt keine Daten preis außer der Tatsache, dass der Dienst läuft."

  /api/app-version:
    get:
      tags: ["System & Monitoring"]
      summary: Aktuell im Store veroeffentlichte App-Version (ohne Anmeldung)
      description: >
        Meldet den Apps die aktuell veroeffentlichte Store-Version fuer den
        dezenten Update-Hinweis auf den Dashboards. Quelle ist der offene
        iTunes-Lookup (bundleId de.godsapp.konfiquest), serverseitig 6h
        gecacht; Android traegt dieselbe Version, weil beide Apps im
        Gleichschritt aus version.json released werden (Begruendung in
        backend/utils/storeVersion.js). version ist null, wenn der Lookup
        gerade nicht erreichbar ist — die App zeigt dann keinen Hinweis.
        Die Antwortform ist Vertrag fuer ausgelieferte Apps ab 2.1.1:
        Felder nur ergaenzen, nie entfernen oder umformen.

        MINDESTVERSION UND WARTUNGSHINWEIS (27.09.2026, Feature-Empfehlung
        E-05, additiv): `ios.min_version` und `android.min_version` (String
        `x.y.z` oder null) sowie `wartung` (`{aktiv: boolean, text: string|null}`).
        Quelle sind die Umgebungsvariablen `APP_MIN_VERSION_IOS`,
        `APP_MIN_VERSION_ANDROID` und `WARTUNG_HINWEIS`, gelesen bei jeder
        Anfrage (backend/utils/betriebshinweise.js); leer oder nicht gesetzt
        ergibt null bzw. `aktiv: false, text: null`. Eine Mindestversion, die
        nicht die Form x.y.z hat, wird ignoriert (null) und einmal je Wert
        geloggt. Die App ab 2.3.0 zeigt nativ einen Hinweis "Bitte
        aktualisiere Konfi Quest" mit "Später" und "Aktualisieren" (Knopf zur
        `url` der Plattform), wenn die installierte Version echt unter
        `min_version` liegt (nie im Browser, nie ohne Antwort des Servers).
        Sie sperrt nicht: Der Hinweis laesst sich schliessen, die App bleibt
        bedienbar, und er kommt erst beim naechsten Start wieder (Entscheidung
        27.09.2026 "Keine Zwangsupdates"; vorher war ein nicht wegklickbarer
        Sperrbildschirm vorgesehen — er steckt nur in den Testbuilds iOS 231
        und Android 125 von 2.3.0, in keiner Store-Version). `wartung.text`
        erscheint als Klartext auf den Startseiten und der Anmeldeseite. Die
        Store-Apps 2.1.1 und 2.2.0 lesen nur `version` und `url` und pruefen deren Typ
        (frontend/src/services/updateCheck.ts, an beiden Tags unveraendert) —
        die zusaetzlichen Felder sehen sie nicht.

        Beispiel:
        `{"ios": {"version": "2.3.0", "url": "https://apps.apple.com/...",
        "min_version": "2.3.0"}, "android": {"version": "2.3.0", "url":
        "https://play.google.com/...", "min_version": null}, "wartung":
        {"aktiv": true, "text": "Heute ab 20 Uhr Wartung."}}`
      security: []
      responses:
        "200": { description: "ios: {version|null, url, min_version|null}, android: {version|null, url, min_version|null}, wartung: {aktiv, text|null}" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: []
        org-scope: false
        objekt-pruefung: "keine"
        hinweis: >
          Keine Authentifizierung — die veroeffentlichte Store-Version ist
          oeffentlich einsehbar. Der globale Rate-Limiter gilt. Mindestversion
          und Wartungstext sind ebenso oeffentlich (sie muessen auch vor der
          Anmeldung ankommen) — in WARTUNG_HINWEIS gehoert nichts, was nicht
          jede:r lesen darf.

  /api/status:
    get:
      tags: ["System & Monitoring"]
      summary: Readiness-Check mit Datenbank-Prüfung (ohne Anmeldung)
      description: >
        Prueft die Datenbank mit SELECT 1 und liefert 200 bei gesunder DB,
        sonst 503. Getrennt von /health, weil er echte Abhaengigkeiten prüft.

        MIGRATIONSSTAND (26.09.2026, Audit Datenbank BF-04, additiv): Eine beim
        Start uebersprungene Migration stand vorher nur im Container-Log,
        waehrend hier `database: ok` stand. Jetzt zusaetzlich
        `checks.migrations` (`ok` | `fehler` | `laeuft`) und `migrationen`
        `{gesamt, neu, fehlgeschlagen[]}` mit den Dateinamen der
        uebersprungenen Migrationen (die Fehlermeldung selbst bleibt im Log,
        der Pfad ist oeffentlich). Der HTTP-Status bleibt bei `fehler` 200 --
        die Datenbank ist da; der Deploy-Verify in ci.yml prueft das Feld
        getrennt und bricht ab. Beide Felder fehlen, wenn der Prozess keinen
        Migrationslauf kennt (Testaufbau).

        `gesamt` zaehlt die Dateien in backend/migrations/ (02.10.2026): Seit
        die Dateien bis Stand 173 im Schema-Dump aufgegangen sind, liegen dort
        nur die danach. Die Zahl sagt also nichts darueber, wie viele
        Migrationen die Datenbank insgesamt hat; Form und Typ des Feldes
        bleiben gleich.

        CRON-LEADER (26.09.2026, Audit Betrieb BF-10, additiv): Die Replicas
        waehlen die Replica, die die Hintergrund-Jobs faehrt, per
        Postgres-Advisory-Lock (vorher fest per Umgebungsvariable, ohne
        Ersatz bei Ausfall). `cron_leader` (boolean) sagt, ob DIESE Replica
        den Lock haelt; `checks.cron_leader` (`ok` | `fehlt` | `unbekannt`)
        sagt, ob IRGENDEINE ihn haelt -- aus pg_locks gelesen, deshalb von
        jeder Replica aus gleich beantwortet und damit der Wert fuer eine
        externe Ueberwachung (Traefik verteilt den Aufruf zufaellig).
        `fehlt` heisst: niemand faehrt Erinnerungen, Auto-Loeschung,
        Token-Bereinigung, APM-Schnappschuesse. Der HTTP-Status bleibt 200.

        VERSION (27.09.2026, Sammelbefund S-13, unveraendertes Feld): `version`
        ist die App-Version aus backend/package.json, die `npm run
        version:setzen` mit frontend/version.json (der einen Quelle)
        gleichzieht -- vorher stand hier 1.0.1 auf einem 2.3.0-System.
      security: []
      responses:
        "200": { description: "status, version, commit, uptimeSeconds, cron_leader, checks.database, checks.migrations, checks.cron_leader, migrationen{gesamt, neu, fehlgeschlagen[]}, responseTimeMs" }
        "503": { description: "DEGRADED — Datenbank nicht erreichbar" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: []
        org-scope: false
        objekt-pruefung: "keine"
        hinweis: >
          # HINWEIS: Ohne Anmeldung erreichbar und gibt version und commit
          (GIT_SHA) preis. Bewusst so für die Status-Seite / Uptime Kuma.
          GEPRÜFT 29.09.2026 (Audit Sicherheit BF-18), bleibt: `commit`
          liest der Deploy-Verify (deploy/rollend.sh, notfall-deploy.yml),
          `version` meldet laut CLAUDE.md die App-Version und wird nach
          jedem Deploy abgelesen; beide stehen ohnehin öffentlich (Repo,
          Store). `uptimeSeconds` bleibt als Feld der Antwortform (nur der
          Startzeitpunkt, den auch die öffentlichen Actions-Läufe zeigen).

  /api/metrics:
    get:
      tags: ["System & Monitoring"]
      summary: APM-Kennzahlen aller Replicas (nur super_admin)
      description: >
        Aggregierte Laufzeitdaten: langsamste und meistgenutzte Routen,
        parallele Requests, Live-Verlauf, letzte Fehler. Ist METRICS_PEERS
        gesetzt, werden alle Peers über /metrics/local abgefragt und zu einem
        Gesamtbild inklusive Lastverteilung gemergt.

        ERWEITERT (22.09.2026) — rein additiv, alle bisherigen Felder bleiben
        mit unveränderten Namen und Typen erhalten. Neu sind:

        * `apdex` — {wert, zufrieden, toleriert, frustriert, schwelleMs,
          toleriertBisMs}. Eine Zahl zwischen 0 und 1 für "waren die Anfragen
          schnell genug", gemessen an der SERVERZEIT (ohne Warten auf die
          Leitung). Schwelle 500 ms, frustriert ab 2000 ms; 5xx zählen immer
          als frustriert. Ohne Anfragen ist `wert` null, nicht 0.
        * `ueber1s` — {anzahl, quote, schwelleMs}. Anfragen, deren GESAMTZEIT
          inklusive Leitung über einer Sekunde lag: das gefühlte Warten.
        * `statusKlassen` — {erfolg, ausDemCache, umleitung, nichtGefunden,
          abgelehnt, serverfehler}. Die Summe entspricht totalRequests.
        * `nutzer` — {fensterMinuten, aktiv, betroffen, schluessel,
          betroffeneSchluessel}. Verschiedene angemeldete Konten der letzten
          60 Minuten; `betroffen` sind die mit Warten über 1 s oder einem
          Serverfehler. Gespeichert werden gekürzte Hashes, keine Konto-IDs;
          sie stehen in der Antwort, damit über mehrere Replicas die
          Vereinigung statt der Summe gebildet werden kann.
        * `routesPotenzial` — dieselben Route-Zeilen, sortiert nach GESAMTER
          Serverzeit (Aufrufe × Dauer) statt nach p95.
        * `fehlerGruppen` — Fehler nach Route und Status zusammengefasst, mit
          anzahl, seit, zuletzt und beispielUrl. Zählt über die gesamte
          Laufzeit, während recentErrors nach 50 Einträgen überläuft.

        BEHOBEN (29.09.2026, Audit Leitung BF-12): `recentErrors[].url` und
        `fehlerGruppen[].beispielUrl` hielten die rohe Anfrage-URL — mit
        Suchbegriff (`search-users?q=`), Benutzername (`check-username/`) und
        dem Anmeldeschlüssel aus `?token=`. Beide sind weiter Strings, aber
        geschwärzt (utils/apm.js, urlFuersAnzeige): Query nur mit den Namen
        der Parameter (`?q=***`), Namen, Einladungscodes, Dateinamen und UUIDs
        im Pfad als Platzhalter; Zahlen-Kennungen bleiben. Dieselbe Fassung
        schreibt das Langsam-Log.

        Die Route-Zeilen (routesSlowest/routesBusiest/routesPotenzial) haben
        zusätzlich `p50Ms`, `serverP50Ms` (Median = die typische Anfrage),
        `langsam`, `langsamQuote`, `serverZeitGesamtMs` und `apdex`.

        ERWEITERT (24.09.2026) — ebenfalls rein additiv:

        * `routeSchluessel` — {anzahl, grenze, verworfen}. Wie viele
          Route-Schlüssel gemessen werden und wie viele die Obergrenze
          verworfen hat. `verworfen` gehört bei 0 zu stehen; ein Ausschlag
          heißt, dass ein Pfad mit freiem Text oder einem Zufallsnamen nicht
          auf einen Platzhalter abgebildet wird. Über mehrere Replicas ist
          `anzahl` das Maximum (alle sehen dieselben Routen), `verworfen` die
          Summe (jede räumt für sich).
        * `dbPool` — {gesamt, frei, wartend, max}. Zustand des
          Datenbank-Verbindungspools. `wartend` ist die Zahl, auf die es
          ankommt: Anfragen stehen an, weil alle Plaetze belegt sind. Ein
          Konfi-Dashboard-Aufruf belegt allein zehn Plaetze (neun parallele
          Abfragen plus die aeussere Verbindung). Bei mehreren Replicas ist
          `dbPool` die Summe und `replicas[].dbPool` der Zustand je Replica —
          jede hat ihren EIGENEN Pool, und es blockiert der einzelne volle,
          nicht die Summe. Der Wert steht bewusst NICHT in /api/health: der
          Pfad ist oeffentlich und dient Traefik als Gesundheitspruefung.

        BEHOBEN (22.09.2026): Beim Zusammenführen mehrerer Replicas wurde eine
        Route, die sowohl in routesSlowest als auch in routesBusiest stand,
        doppelt addiert — aus 200 Anfragen wurden 400. Gegen den vorherigen
        Stand nachgemessen.

        BEHOBEN (24.09.2026): Die Normalisierung der Pfade fasste drei
        Pfadarten nicht zusammen — die Namensprüfung beim Registrieren, den
        Einladungscode und die Dateinamen in Chat, Material und Challenges.
        Jede Variante war ein eigener, nie aufgeräumter Schlüssel. Ebenfalls
        behoben: UUIDs mit führender Ziffer wurden gar nicht zusammengefasst,
        weil die Ziffern-Regel vor der UUID-Regel lief.
      responses:
        "200": { description: "Zusammengefuehrter APM-Snapshot inkl. replicas, dbPool, apdex, ueber1s, statusKlassen, nutzer, routesPotenzial, fehlerGruppen und routeSchluessel" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Inline: req.user.is_super_admin, sonst 403"
        hinweis: >
          Bewusst org-uebergreifend — die Daten sind organisationsunabhaengige
          Betriebskennzahlen. Der Authorization-Header wird an die Peers
          weitergereicht.

  /api/metrics/local:
    get:
      tags: ["System & Monitoring"]
      summary: APM-Rohdaten nur dieser Replica (nur super_admin)
      description: >
        Unaggregierter In-Memory-Snapshot der antwortenden Replica. Wird von
        /metrics für die Peer-Aggregation genutzt, ist aber auch direkt
        aufrufbar. Enthält dieselben Felder wie /metrics (siehe dort, inkl.
        der Erweiterungen vom 22.09.2026 und 24.09.2026), nur ohne replicas.
        `dbPool` ist hier der Zustand genau dieser Replica.
      responses:
        "200": { description: "APM-Snapshot dieser Replica" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Inline: req.user.is_super_admin, sonst 403"

  /api/metrics/history:
    get:
      tags: ["System & Monitoring"]
      summary: Gespeicherte APM-Historie (nur super_admin)
      description: >
        Liefert die persistierten Snapshots aus apm_snapshots der letzten N
        Tage, damit das Dashboard Deltas über Deploys hinweg bilden kann.

        ZEITRAUM AUF ZWEI JAHRE ERWEITERT (14.09.2026): Vorher waren 30 Tage
        die Obergrenze. Die Aufbewahrung in services/backgroundService.js hält
        seit demselben Datum zwei Jahre vor (vorher ebenfalls 30 Tage) —
        gemessen 276 Zeilen und 1,8 MB je 30 Tage, also rund 44 MB für zwei
        Jahre. Die Snapshots entstehen zeitgesteuert alle fünf Minuten, NICHT
        je Nutzer:in; die Zeilenzahl wächst also nicht mit der Gemeindegrösse.

        VERDICHTUNG AB 31 TAGEN (26.09.2026, Audit Betrieb BF-14 / S-19,
        additiv): `days=730` lieferte 210.000 Rohzeilen und 35 MB fuer ein
        Mobil-Dashboard. Jetzt: bis 30 Tage roh (alle fuenf Minuten), 31 bis
        180 Tage ein Punkt je Stunde, darueber ein Punkt je Tag -- der
        Zwei-Jahres-Verlauf sind damit rund 730 Zeilen. Je Zeitfenster gilt
        der LETZTE Schnappschuss fuer die kumulierten Zaehler (total_requests,
        total_errors -- die Deltas des Dashboards bleiben damit richtig) und
        das MAXIMUM fuer max_in_flight und worst_p95_ms (samt der Route dieser
        Spitze). `snapshots` bleibt ein Array mit denselben Feldern; neu ist
        `aufloesung` (`5min` | `stunde` | `tag`).
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 730, default: 7 }
          description: >
            Auf 1..730 begrenzt (zwei Jahre, so weit die Aufbewahrung reicht);
            ungueltige Werte und 0 fallen auf 7 zurück, negative auf 1.
            Bis 30 roh, 31..180 stuendlich verdichtet, darueber taeglich.
      responses:
        "200": { description: "days, aufloesung (5min|stunde|tag) und snapshots[] (captured_at, total_requests, total_errors, max_in_flight, worst_p95_ms, worst_route)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Inline: req.user.is_super_admin, sonst 403"
