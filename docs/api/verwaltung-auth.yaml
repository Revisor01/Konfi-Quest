# ============================================================================
# Konfi Quest API — Block 3: Verwaltung & Auth
# Dokumentiert: auth, docs-auth, teamer, organizations, material, users,
# jahrgaenge, badges, wrapped, levels, categories, roles, settings (112 Routen)
# Stand: 2026-08-22, verifiziert am Code (Branch main-Stand des Repos)
# ============================================================================
#
# SCHWERPUNKT-ANALYSE
#
# 1. RECHTEVERGABE (Wer darf wen anlegen/aendern/loeschen?)
#    Rollenhierarchie (utils/roleHierarchy.js, Level 5..1):
#      super_admin(5) > org_admin(4) > admin(3) > teamer(2) > konfi(1)
#    - User-Verwaltung (/api/users bzw. /api/admin/users) ist komplett
#      requireOrgAdmin; zusaetzlich checkUserHierarchy pro Operation:
#        * super_admin darf alle Rollen außer super_admin verwalten
#        * org_admin darf ALLE Rollen der eigenen Org verwalten,
#          AUCH andere org_admins (explizite Regel im Code)
#        * admin duerfte teamer/konfi verwalten, teamer nur konfi —
#          praktisch irrelevant, da die Routen requireOrgAdmin verlangen
#    - Rollen-Zuweisung: role_id wird gegen roles der eigenen Org geprüft;
#      bei Update mit Rollenwechsel prüft canCreateRole die Ziel-Rolle.
#      GET /roles/list/assignable liefert nur zuweisbare Rollen
#      (org_admin: admin/teamer/konfi; super_admin: +org_admin).
#    - Rollen selbst sind hardcoded (5 Systemrollen), routes/roles.js ist
#      read-only; Permissions sind statisch pro Rollenname.
#    - org_admins anlegen: super_admin (jede Org) ODER org_admin (eigene Org)
#      via POST /organizations/:id/admins.
#    - Letzter org_admin einer Org ist gegen Löschen geschuetzt (409).
#    - Selbst-Löschung: über POST /auth/delete-account (jede Rolle, mit
#      Passwort-Bestaetigung); DELETE /users/:id blockt Selbst-Löschung.
#    - Multi-Org-Mitgliedschaften (user_organizations) vergibt NUR der
#      super_admin (POST/DELETE /organizations/:id/members); konfi und
#      super_admin sind als Mitglieds-Rolle explizit verboten.
#
# 2. OFFENE ROUTEN (ohne Auth-Middleware) — alle unter /api/auth:
#      POST /login                    authLimiter: 300/15min pro Client-IP,
#                                     skipSuccessfulRequests
#      POST /register-konfi           registerLimiter: 200/h pro IP; Schutz
#                                     durch Invite-Code (8 Hex-Zeichen, 7 Tage
#                                     gueltig, org-/jahrgangsgebunden) +
#                                     Passwort-Policy + Konfi-Limit-Check
#      POST /request-password-reset   eigener Limiter: 5/15min; neutrale
#                                     Antwort (kein E-Mail-Enumeration-Leak)
#      POST /reset-password           NUR globaler General-Limiter (2000/15min)
#      POST /refresh                  NUR General-Limiter; Refresh-Token-
#                                     Rotation mit 5-Minuten-Grace-Window
#      GET  /check-username/:username NUR General-Limiter
#      GET  /validate-invite/:code    NUR General-Limiter
#    # LÜCKE (NEU): check-username, validate-invite, reset-password und
#    # refresh haben keinen eigenen (strengeren) Rate-Limiter — Username-
#    # Enumeration und Invite-Code-Bruteforce (nur 8 Hex-Zeichen = 4 Byte
#    # Entropie) sind mit bis zu 2000 Requests/15min/IP möglich.
#
# 3. SUPER_ADMIN — Sonderbehandlung:
#    - requireSuperAdmin akzeptiert Rolle 'super_admin' ODER das DB-Flag
#      users.is_super_admin (org_admin mit Flag = faktischer Super-Admin).
#    - Nur super_admin: Org-Liste (GET /organizations), Org anlegen/loeschen,
#      PATCH /organizations/:id/limit (max_konfis / Tarif), trial_ends_at +
#      is_trial im Org-Update, systemweite User-Suche (/search-users),
#      Multi-Org-Mitglieder verwalten (/:id/members), Passwort-Reset
#      org-uebergreifend (PUT /users/:id/reset-password).
#    - super_admin (Rolle) hat KEINE Organisation und ist von Org-/Trial-
#      Sperren beim Login/Refresh ausgenommen; von Jahrgangs-Daten bleibt er
#      ausgesperrt (etablierte Regel; die frueheren rbac-Helfer
#      checkJahrgangAccess/filterByJahrgangAccess waren nie eingehaengt und
#      sind seit 01.09.2026 geloescht — die Regel setzt darfJahrgang in
#      utils/jahrgangsZugriff.js zusammen mit requireAdmin/requireTeamer um).
#    - Fachrouten (badges, levels, material, ...) nutzen requireAdmin/
#      requireTeamer (Rollennamen-Whitelists) — die Rolle super_admin fällt
#      dort durch (403), außer sie agiert via Multi-Org-Switch als org_admin.
#
# 4. MATERIAL UND ZERTIFIKATE:
#    - Material sehen/herunterladen: requireTeamer (org_admin, admin, teamer)
#      — ALLE Materialien der eigenen Org, KEINE Jahrgangs-Einschraenkung
#      (Jahrgangs-/Event-Zuordnung ist nur Filter-Metadatum). Konfis haben
#      keinerlei Material-Zugriff.
#    - Material/Tags anlegen, ändern, löschen, Dateien hochladen/loeschen:
#      requireAdmin (org_admin, admin). Dateien liegen AES-256-GCM-
#      verschlüsselt unter Zufalls-Hex-Namen; Download prüft Hex-Format
#      (Path-Traversal-Schutz) + Org-Zugehoerigkeit der Datei.
#    - Zertifikat-Typen: lesen requireAdmin, CRUD requireOrgAdmin.
#    - Zertifikate VERGIBT/entzieht nur der org_admin
#      (POST/DELETE /teamer/:userId/certificates); Empfaenger muss Rolle
#      teamer in derselben Org haben; Typ muss zur Org gehören und aktiv
#      sein. Ansehen der Zertifikate eines Teamers: requireAdmin.
#      Teamer sehen die eigenen Zertifikate über ihr Dashboard.
#
# NEUE LUECKEN (zusaetzlich zu den bekannten, Details an den Routen):
#  N1  BEHOBEN 26.09.2026. PUT /users/:id/reset-password, PUT /users/:id,
#      DELETE /users/:id und POST /users/:id/jahrgaenge weisen ein Ziel mit
#      Rolle super_admin ODER Flag is_super_admin mit 403 ab, sofern der
#      Aufrufer nicht selbst Super-Admin ist (istSuperAdminKonto in
#      utils/roleHierarchy.js, in checkUserHierarchy und inline im Reset).
#      Vorher konnte ein org_admin derselben Org dessen Passwort setzen und
#      so Super-Admin-Rechte uebernehmen (Privilege Escalation; Audit
#      26.09.2026, Sicherheit BF-01, reproduziert).
#  N2  BEHOBEN. Passwort-Änderung/-Reset revoziert bestehende Refresh-Tokens
#      (90 Tage) und setzt token_invalidated_at: change-password und
#      auth/reset-password am 22.08.2026, die Push-Tokens am 01.09.2026,
#      users/:id/reset-password (samt Alias /api/admin/users/:id/reset-password)
#      und POST /api/admin/konfis/:id/regenerate-password am 14.09.2026.
#      Vorher ueberlebte eine gekaperte Sitzung den Passwortwechsel — und
#      genau die beiden zuletzt geschlossenen Routen sind die, die man
#      benutzt, wenn ein Konto uebernommen wurde.
#  N3  Fehlende Spezial-Rate-Limiter auf 4 offenen Auth-Routen (siehe oben).
#  N4  GET /levels/konfi/:userId: jeder authentifizierte User der Org (auch
#      jeder Konfi) kann Punkte/Level JEDES Konfis abrufen — kein Selbst-
#      oder Rollen-Check.
#  N5  GET /organizations/:id und /:id/stats: JEDE Rolle der eigenen Org
#      (auch konfi/teamer) erhält SELECT * der Organisation inkl. Kontakt-,
#      Trial- und Limit-Daten.
#  N6  POST /organizations/:id/admins: org_admin legt weitere org_admins mit
#      6-Zeichen-Passwort an — die strenge validatePassword-Policy (8+,
#      Gross/Klein/Zahl/Sonderzeichen) wird hier NICHT angewandt.
#  N7  PUT /users/:id: Passwort-Feld ohne jede Policy-Prüfung (weder
#      validatePassword noch Mindestlaenge) — beliebig schwache Passwoerter.
#  N8  POST /auth/update-email: keine Besitz-Verifikation der E-Mail; 409 bei
#      Unique-Kollision erlaubt E-Mail-Enumeration durch eingeloggte User.
#
# BEKANNT (dokumentiert, nicht neu): Multi-Org-Claim-Nachwirkung nach
# Mitgliedschafts-Entzug (Access-Token bis 15 Min + 30s-User-Cache);
# Passwort-Reset-Token unhashed in password_resets; org_admin darf is_active
# der eigenen Org setzen (PUT /organizations/:id); Org-Anlage erlaubt
# 6-Zeichen-Admin-Passwoerter.
# ============================================================================

openapi: 3.1.0
info:
  title: Konfi Quest API — Verwaltung & Auth (Block 3)
  version: "1.0"
  description: >
    Auth/Session, Teamer-Bereich, Organisations-, User-, Jahrgangs-,
    Badge-, Wrapped-, Level-, Kategorie-, Rollen- und Settings-Verwaltung.
    Alle Routen (außer den offenen Auth-Routen) verlangen einen Bearer-JWT
    (15 Min), der von verifyTokenRBAC geprüft wird; die aktive Organisation
    kann per Header X-Active-Organization gewechselt werden (Mitgliedschaft
    wird gegen user_organizations geprüft, 30s-User-Cache).
servers:
  - url: https://konfi-quest.de
tags:
  - name: "Anmeldung & Konto"
    description: "Login, Logout, Token-Refresh, eigenes Profil, Organisationswechsel."
  - name: "Benutzer & Rollen"
    description: "Team-Konten der Leitung: anlegen, ändern, Jahrgangszuweisung, Rollen. /admin/users und /users sind derselbe Router (Alias-Mount)."
  - name: "Doku-Zugang"
    description: "Anmeldung für die passwortgeschützte API-Dokumentation."
  - name: "Organisationen"
    description: "Gemeinden anlegen und verwalten, Mitglieder und Limits (Super-Admin und Leitung)."
  - name: "Passwörter & Einladungen"
    description: "Passwort vergessen und zurücksetzen, Einladungs-Codes, Konfi-Registrierung."
  - name: "System & Monitoring"
    description: "Health-Check, Status und Metriken des Servers."
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT im Authorization-Header. Optional Header X-Active-Organization
        (Multi-Org): schaltet die aktive Organisation um, sofern der User dort
        Mitglied ist (sonst 403).
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
  responses:
    Unauthorized:
      description: Kein/ungueltiges/abgelaufenes Token, inaktiver Account oder inaktive Organisation
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Rolle nicht erlaubt oder kein Zugriff auf das Objekt
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Objekt nicht gefunden (in der aktiven Organisation)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ServerError:
      description: Datenbank-/Serverfehler
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

paths:
  # ==========================================================================
  # AUTH (backend/routes/auth.js — 19 Routen, Mount /api/auth)
  # ==========================================================================
  /api/auth/login:
    post:
      tags: ["Anmeldung & Konto"]
      summary: Login für alle Rollen (case-insensitiver Username)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: "JWT (15 Min) + Refresh-Token (90 Tage, SHA-256-gehasht gespeichert) + User-Objekt (bei Konfi inkl. jahrgang und Punkten; bei `admin` seit 27.08.2026 zusaetzlich assigned_jahrgaenge[] fuer die Warnung beim Jahrgangswechsel)"
        "401": { description: "Ungueltige Anmeldedaten (User unbekannt oder Passwort falsch — gleiche Meldung)" }
        "403": { description: "User deaktiviert (user_inactive), Org gesperrt (org_inactive) oder Trial abgelaufen (org_trial_expired); super_admin ausgenommen" }
        "429": { description: "authLimiter: 300 Fehlversuche/15min pro Client-IP" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: [authLimiter, validateLogin]
        org-scope: false
        objekt-pruefung: "Org-Aktiv- und Trial-Prüfung im Handler; super_admin (Rolle oder Flag) umgeht beide"
        hinweis: "Offene Route; setzt last_login_at"

  /api/auth/change-password:
    post:
      tags: ["Anmeldung & Konto"]
      summary: Eigenes Passwort ändern (mit aktuellem Passwort)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, description: "Policy: min 8, Gross/Klein/Zahl/Sonderzeichen, keine Leerzeichen" }
                device_id: { type: string, description: "Optional: Geraet der aktuellen Sitzung — sein Push-Token wird beim Aufraeumen verschont" }
                platform: { type: string, description: "Optional, zusammen mit device_id (ios/android/web)" }
      responses:
        "200": { description: "Passwort geaendert" }
        "400": { description: "Aktuelles Passwort falsch / Policy verletzt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC, validateChangePassword]
        org-scope: false
        objekt-pruefung: "Nur eigener Account (userId aus Token)"
        # BEHOBEN 22.08.2026 (war N2): setzt token_invalidated_at und
        # revoziert alle offenen Refresh-Tokens. Die Antwort enthält ein
        # frisches Token-Paar für die aufrufende Sitzung, damit der eigene
        # Client nicht mitfliegt.
        # BEHOBEN 01.09.2026 (Rest von N2): Push-Tokens der beendeten
        # Sitzungen werden mitgeloescht — vorher bekam ein ausgesperrtes
        # Geraet weiter Push-Nachrichten (Versand haengt nur an user_id).
        # Mit device_id+platform bleibt das eigene Geraet verschont; ohne
        # (alte Apps) fallen alle Tokens des Users und das eigene Geraet
        # registriert sich beim naechsten App-Start neu.

  /api/auth/delete-account:
    post:
      tags: ["Anmeldung & Konto"]
      summary: Eigenen Account sofort und kaskadierend löschen (alle Rollen)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, description: "Bestaetigung mit aktuellem Passwort" }
      responses:
        "200": { description: "Account geloescht (Hard-Delete in einer Transaktion, Sockets getrennt)" }
        "400": { description: "Passwort fehlt oder falsch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Nur eigener Account; Passwort-Bestaetigung im Handler"
        hinweis: "Auch org_admin kann sich selbst löschen — der Letzter-org_admin-Schutz greift nur in DELETE /users/:id, nicht hier"

  /api/auth/update-email:
    post:
      tags: ["Anmeldung & Konto"]
      summary: Eigene E-Mail-Adresse setzen/entfernen (optional, ohne Verifikation)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: [string, "null"], format: email }
      responses:
        "200": { description: "E-Mail aktualisiert" }
        "400": { description: "Ungueltige E-Mail" }
        "409": { description: "E-Mail bereits verwendet" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC, validateUpdateEmail]
        org-scope: false
        objekt-pruefung: "Nur eigener Account"
        # HINWEIS (N8, bewusst so belassen): keine Besitz-Verifikation der
        # E-Mail. Der 409 verraet eingeloggten Usern, dass eine Adresse
        # vergeben ist — hier ueberwiegt die Bedienbarkeit: ohne die Meldung
        # bliebe unklar, warum die Änderung nicht greift. Anders als bei
        # request-password-reset, wo der Aufrufer NICHT angemeldet ist.

  /api/auth/update-role-title:
    post:
      tags: ["Anmeldung & Konto"]
      summary: Eigene Funktionsbeschreibung (role_title) setzen
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role_title: { type: [string, "null"] }
      responses:
        "200": { description: "Aktualisiert" }
        "403": { description: "Konfis duerfen keinen Titel setzen" }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, super_admin]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Inline-Check: role_name !== 'konfi'"

  /api/auth/me:
    get:
      tags: ["Anmeldung & Konto"]
      summary: Eigenes Profil (inkl. is_super_admin-Flag, Trial-Status der Org)
      description: >
        NEU 27.08.2026: assigned_jahrgaenge kommt mit — die eigenen
        Jahrgangs-Zuweisungen (id, name, can_view, can_edit), ohne zusaetzliche
        Abfrage (rbacVerifier laedt sie ohnehin). Wofuer: Ein `admin` sieht nur
        Konfis seiner zugewiesenen Jahrgaenge; verschiebt er eine Konfi in
        einen fremden Jahrgang, verschwindet sie aus seiner Liste. Die
        Oberflaeche warnt davor, bevor gespeichert wird. Ohne Zuweisung ein
        leeres Array, nie undefined.

        BEHOBEN 26.09.2026: role_name und role_display_name galten fuer die
        STAMM-Gemeinde (die Abfrage las u.role_id), nicht fuer die aktive.
        Wer ueber user_organizations in einer zweiten Gemeinde eine andere
        Rolle hat, bekam hier trotzdem die Rolle vom Konto gemeldet --
        rbacVerifier hatte sie fuer die aktive Gemeinde laengst aufgeloest,
        diese Route ignorierte das Ergebnis. Ein ANZEIGEFEHLER, keine
        Rechteausweitung: Die Rechte haengen an req.user.role_name
        (requireRole/requireAdmin/requireOrgAdmin lesen genau das) und waren
        korrekt. Die App richtet ihre Oberflaeche aber nach dieser Antwort und
        zeigte in der Zweitgemeinde eine Leitungsansicht, deren Knoepfe der
        Server mit 403 abwies. Antwortform unveraendert.
      responses:
        "200": { description: "id, username, display_name, email, role_title, role_name, is_super_admin, trial_ends_at, is_trial, assigned_jahrgaenge[]" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Nur eigene Daten; role_name/role_display_name gelten fuer die AKTIVE Organisation"

  /api/einladungen:
    post:
      tags: ["Benutzer & Rollen"]
      summary: Eine bestehende Person in die eigene Gemeinde einladen
      description: >
        NEU 26.09.2026 (Simon: "ORG Admin kann bestehenden anderen User
        hinzufuegen, der bekommt Einladung und bestaetigt. Schon ist der
        switcher da."). Gesucht wird EXAKT nach Benutzername oder E-Mail --
        keine Teilsuche, sonst liesse sich der Bestand fremder Gemeinden
        durchblaettern. Die Einladung gilt 14 Tage.

        DIE MITGLIEDSCHAFT ENTSTEHT NICHT HIER, sondern erst mit der Annahme:
        Eine Zugehoerigkeit aendert, was jemand sieht und darf, und wird
        deshalb nicht ueber den Kopf der Person hinweg angelegt.

        KONFI IST AUSGESCHLOSSEN -- und zwar zusaetzlich zur Rollenhierarchie:
        canCreateRole('org_admin', 'konfi') liefert TRUE, die Hierarchie allein
        wuerde es durchlassen. Konfis gehoeren zu einem Jahrgang und kommen
        ueber invite_codes.

        Meldung an die eingeladene Person ueber Postfach, Push (Gruppe
        "Anfragen und Freigaben") und E-Mail, nach der Antwort (nachAntwort).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kennung, role_id]
              properties:
                kennung: { type: string, description: "Benutzername ODER E-Mail, exakt (Gross-/Kleinschreibung egal)" }
                role_id: { type: integer, description: "Rolle DIESER Gemeinde; niemals die konfi-Rolle" }
      responses:
        "201": { description: "id, user_id, display_name, username, role_id, role_name, status, expires_at" }
        "400": { description: "Rolle gehoert nicht zu dieser Gemeinde; konfi-Rolle (error_code konfi_nicht_moeglich); Selbst-Einladung" }
        "403": { description: "Nicht org_admin, oder Rolle laut Hierarchie nicht vergebbar" }
        "404": { description: "Kein Konto mit dieser Kennung (error_code nicht_gefunden)" }
        "409": { description: "Schon Mitglied (schon_mitglied) oder schon eingeladen (schon_eingeladen)" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, requireOrgAdmin]
        org-scope: true
        objekt-pruefung: "Rolle gegen roles.organization_id der aktiven Org; Mitgliedschaft ueber BEIDE Quellen geprueft; Teilindex laesst nur eine offene Einladung je Person und Gemeinde"

    get:
      tags: ["Benutzer & Rollen"]
      summary: Offene Einladungen der eigenen Gemeinde
      responses:
        "200": { description: "Array offener, nicht abgelaufener Einladungen mit Namen und Rolle" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, requireOrgAdmin]
        org-scope: true
        objekt-pruefung: "Nur die eigene Organisation, nur status='offen' und expires_at > NOW()"

  /api/einladungen/meine:
    get:
      tags: ["Benutzer & Rollen"]
      summary: Die eigenen offenen Einladungen
      responses:
        "200": { description: "Array (Gemeinde, Rolle, wer eingeladen hat, expires_at)" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Nur eigene Einladungen (user_id = req.user.id). BEWUSST org-uebergreifend: Die Einladung kommt aus einer Gemeinde, in der man noch NICHT Mitglied ist."

  /api/einladungen/{id}/annehmen:
    post:
      tags: ["Benutzer & Rollen"]
      summary: Einladung annehmen -- legt die Mitgliedschaft an
      description: >
        Schreibt in einer Transaktion den Status und die Zeile in
        user_organizations. Danach invalidateUserCache, sonst haelt der
        RBAC-Cache (30 s) die alte Zugehoerigkeit fest und der
        Gemeinde-Umschalter zeigt die neue Gemeinde verspaetet.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "message, organization (id, name, slug, display_name)" }
        "404": { description: "Nicht vorhanden ODER nicht die eigene Einladung -- bewusst dieselbe Antwort, sonst liesse sich durch Durchprobieren erkennen, welche es gibt" }
        "409": { description: "Bereits beantwortet (error_code schon_beantwortet)" }
        "410": { description: "Abgelaufen (error_code expired)" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Nur die eingeladene Person selbst; Status offen; expires_at in der Zukunft"

  /api/einladungen/{id}/ablehnen:
    post:
      tags: ["Benutzer & Rollen"]
      summary: Einladung ablehnen
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "message" }
        "404": { description: "wie bei annehmen" }
        "409": { description: "Bereits beantwortet" }
        "410": { description: "Abgelaufen" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "wie bei annehmen"

  /api/auth/my-organizations:
    get:
      tags: ["Anmeldung & Konto"]
      summary: Alle Organisationen des Users (Primaer-Org + Multi-Org-Mappings) mit Rolle
      responses:
        "200": { description: "Array (id, name, slug, display_name, role_name, is_active); nur aktive Orgs, dedupliziert" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Nur eigene Mitgliedschaften"

  /api/auth/switch-org:
    post:
      tags: ["Anmeldung & Konto"]
      summary: Aktive Organisation wechseln — neues Access-Token mit active_organization_id-Claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id]
              properties:
                organization_id: { type: integer }
      responses:
        "200": { description: "Neues 15-Min-Token, active_organization_id, Rolle in Ziel-Org" }
        "400": { description: "organization_id fehlt" }
        "403": { description: "Keine Mitgliedschaft in Ziel-Org oder Ziel-Org gesperrt" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Mitgliedschaft in user_organizations + is_active der Ziel-Org"
        hinweis: "Trial-Ablauf der Ziel-Org wird hier NICHT geprüft (nur is_active); bekannte Claim-Nachwirkung nach Mitgliedschafts-Entzug bis Token-Ablauf"

  /api/auth/request-password-reset:
    post:
      tags: ["Passwörter & Einladungen"]
      summary: Passwort-Reset-Mail anfordern (immer neutrale Antwort)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: "Neutral: 'Falls ein Konto existiert, wurde eine E-Mail gesendet'" }
        "429": { description: "passwordResetLimiter: 5/15min" }
        "500": { description: "Mail-Versand fehlgeschlagen (nur wenn Konto existiert — schwaecht die Neutralitaet leicht ab)" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: [passwordResetLimiter, validateRequestPasswordReset]
        org-scope: false
        objekt-pruefung: "Token 32 Byte Hex, 24h gueltig"
        hinweis: "BEKANNT: Token wird unhashed in password_resets gespeichert"

  /api/auth/invite-code:
    post:
      tags: ["Passwörter & Einladungen"]
      summary: Einladungscode für einen Jahrgang erzeugen (8 Hex-Zeichen, 7 Tage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jahrgang_id]
              properties:
                jahrgang_id: { type: integer }
      responses:
        "201": { description: "invite_code, jahrgang_name, expires_at (Status ist 200)" }
        "403": { description: "Nur Org-Admins" }
        "404": { description: "Jahrgang nicht in eigener Org" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, validateInviteCode]
        org-scope: true
        objekt-pruefung: "Jahrgang muss zur eigenen Org gehören"
        hinweis: "Inline-Check erlaubt auch is_super_admin-Flag (abweichend von den drei anderen Invite-Routen, die strikt role_name==='org_admin' verlangen)"

  /api/auth/invite-codes:
    get:
      tags: ["Passwörter & Einladungen"]
      summary: Aktive Einladungscodes der eigenen Org (inkl. Nutzungs-Zähler)
      responses:
        "200": { description: "Array mit code, jahrgang, expires_at, used_count" }
        "403": { description: "Nur org_admin (strikt role_name, OHNE Super-Admin-Flag)" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Nur Codes der eigenen Org, nur nicht-abgelaufene"

  /api/auth/invite-codes/{id}/extend:
    post:
      tags: ["Passwörter & Einladungen"]
      summary: Einladungscode um 7 Tage verlaengern
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID des Einladungs-Codes" }
      responses:
        "200": { description: "Neues expires_at" }
        "400": { description: "Abgelaufene Codes nicht verlaengerbar" }
        "403": { description: "Nur org_admin" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Code muss zur eigenen Org gehören"

  /api/auth/invite-codes/{id}:
    delete:
      tags: ["Passwörter & Einladungen"]
      summary: Einladungscode löschen
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID des Einladungs-Codes" }
      responses:
        "200": { description: "Geloescht" }
        "403": { description: "Nur org_admin" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Code muss zur eigenen Org gehören"

  /api/auth/check-username/{username}:
    get:
      tags: ["Passwörter & Einladungen"]
      summary: Username-Verfuegbarkeit prüfen (oeffentlich, case-insensitiv)
      parameters:
        - { name: username, in: path, required: true, schema: { type: string, minLength: 3, pattern: "^[a-zA-Z0-9.-]+$" }, description: "Zu prüfender Benutzername (case-insensitiv)" }
      responses:
        "200": { description: "{ available: bool, message }" }
        "400": { description: "Zu kurz / ungueltige Zeichen" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: []
        org-scope: false
        objekt-pruefung: "keine"
        # LÜCKE (N3): kein eigener Rate-Limiter — systemweite Username-
        # Enumeration mit bis zu 2000 Requests/15min/IP möglich.

  /api/auth/validate-invite/{code}:
    get:
      tags: ["Passwörter & Einladungen"]
      summary: Einladungscode prüfen (oeffentlich) — liefert Jahrgang + Org-Name
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, description: "Einladungs-Code" }
      responses:
        "200": { description: "{ valid: true, jahrgang_name, organization_name }" }
        "404": { description: "Code existiert nicht (error_code: not_found)" }
        "410": { description: "Code abgelaufen (error_code: expired)" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: []
        org-scope: false
        objekt-pruefung: "Nur Existenz + Ablauf"
        # LÜCKE (N3): kein eigener Rate-Limiter — 8-Hex-Codes (4 Byte) sind
        # theoretisch bruteforcebar; gueltiger Code leakt Org-/Jahrgangsname.

  /api/auth/register-konfi:
    post:
      tags: ["Passwörter & Einladungen"]
      summary: Selbst-Registrierung als Konfi mit Einladungscode (inkl. Auto-Login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_code, display_name, username, password]
              properties:
                invite_code: { type: string }
                display_name: { type: string }
                username: { type: string, minLength: 3, pattern: "^[a-zA-Z0-9.-]+$" }
                password: { type: string, description: "volle Passwort-Policy" }
                email: { type: string, format: email, description: "optional" }
      responses:
        "200": { description: "Token + Refresh-Token + Konfi-User; Auto-Enrollment in kuenftige Pflicht-Events des Jahrgangs; Push an Jahrgangs-Admins" }
        "403": { description: "Konfi-Limit der Org erreicht (limit_exceeded)" }
        "404": { description: "Code existiert nicht" }
        "409": { description: "Username vergeben" }
        "410": { description: "Code abgelaufen" }
        "429": { description: "registerLimiter: 200/h pro IP" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: [registerLimiter, validateRegisterKonfi]
        org-scope: false
        objekt-pruefung: "Invite-Code bestimmt Org + Jahrgang; konfi-Rolle wird org-gescopt aufgeloest; Konfi-Limit (max_konfis) hard_block"

  /api/auth/reset-password:
    post:
      tags: ["Passwörter & Einladungen"]
      summary: Passwort mit Reset-Token setzen (oeffentlich)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, description: "volle Passwort-Policy" }
      responses:
        "200": { description: "Passwort zurueckgesetzt, Token als benutzt markiert (Einmal-Nutzung)" }
        "400": { description: "Token ungueltig/abgelaufen/benutzt oder Policy verletzt" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: [validateResetPassword]
        org-scope: false
        objekt-pruefung: "Token-Lookup in password_resets (used_at IS NULL, expires_at > NOW)"
        # BEHOBEN 22.08.2026 (war N2): bestehende Refresh-Tokens werden
        # revoziert und token_invalidated_at gesetzt. Reset-Tokens liegen
        # ausserdem nur noch gehasht in der DB. HINWEIS (war N3): bestehende Refresh-Tokens des Users werden NICHT
        # revoziert; kein eigener Rate-Limiter (Token allerdings 32 Byte Hex).
        # BEHOBEN 01.09.2026 (Rest von N2): alle Push-Tokens des Users werden
        # geloescht — beim Reset ueberlebt keine Sitzung, kein Geraet darf
        # weiter Push-Nachrichten fuer das Konto bekommen. Jedes Geraet
        # registriert sich beim naechsten Login neu.

  /api/auth/refresh:
    post:
      tags: ["Anmeldung & Konto"]
      summary: Access-Token per Refresh-Token erneuern (Rotation, 5-Min-Grace-Window)
      parameters:
        - { name: X-Active-Organization, in: header, required: false, schema: { type: integer }, description: "Aktive Multi-Org — wird nach Mitgliedschafts-Pruefung als Claim uebernommen" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200": { description: "Neues Token-Paar; altes Refresh-Token revoziert (bleibt 5 Min im Grace-Window nutzbar)" }
        "401": { description: "Refresh-Token ungueltig/abgelaufen/zu lange revoziert" }
        "403": { description: "User deaktiviert / Org gesperrt / Trial abgelaufen (super_admin ausgenommen)" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: []
        org-scope: false
        objekt-pruefung: "SHA-256-Hash-Lookup in refresh_tokens; Sperr-Checks wie beim Login"
        hinweis: "token_invalidated_at (Soft-Revoke) wird beim Refresh nicht geprüft — Soft-Revoke wirkt nur auf Access-Tokens, nicht auf die Refresh-Kette"

  /api/auth/logout:
    post:
      tags: ["Anmeldung & Konto"]
      summary: Logout — Refresh-Token revozieren und Push-Token des Geraets entfernen (best effort, immer 200)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
                device_id:
                  type: string
                  description: >
                    Geraete-ID. Wird sie zusammen mit platform mitgesendet,
                    entfernt die Route den Push-Token dieses Geraets für den
                    angemeldeten User. Seit 22.08.2026: Der Client ruft dafuer
                    zwar auch DELETE /notifications/device-token, aber
                    best-effort (Timeout, nur online, nur mit ermittelbarer
                    Geraete-ID) — schlug das fehl, kamen weiter Push-Nachrichten
                    an das abgemeldete Geraet.
                platform:
                  type: string
                  enum: [ios, android]
      responses:
        "200": { description: "Immer 'Logout erfolgreich'; Token wird zusaetzlich sofort expired (kein Grace-Window)" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: >
          Revoziert nur das mitgesendete Token (Hash-Match). Der
          Push-Token-Cleanup ist auf user_id des Tokens gescopt — fremde
          Geraete und andere Nutzer auf demselben Geraet bleiben unberuehrt.

  # ==========================================================================
  # DOCS-AUTH (backend/routes/docsAuth.js — 3 Routen, Mount /api/docs-auth)
  # Anmeldung für die API-Doku unter /docs/api: EIN gemeinsames Passwort
  # (DOCS_PASSWORD), kein Benutzerkonto. Der Reverse-Proxy fragt per
  # Forward-Auth bei /pruefen nach. Neu 2026-08-24.
  # ==========================================================================
  /api/docs-auth/pruefen:
    get:
      tags: ["Doku-Zugang"]
      summary: Forward-Auth-Check des Reverse-Proxys für /docs/api/*
      responses:
        "200": { description: "Doku-Cookie (signiertes JWT, Zweck 'docs') ist gueltig" }
        "302": { description: "Kein/ungueltiges Cookie UND X-Forwarded-Uri gesetzt (Traefik): Redirect auf die Anmeldeseite, Ziel aus X-Forwarded-Host (https fest)" }
        "401": { description: "Kein/ungueltiges Cookie ohne X-Forwarded-Uri (Caddy baut den Redirect selbst)" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: []
        org-scope: false
        objekt-pruefung: "JWT-Verify des kq_docs-Cookies; App-Anmeldetokens werden abgelehnt (Zweck-Claim)"
        hinweis: "Wird vom Proxy bei JEDEM Doku-Aufruf gerufen — bewusst ohne eigenes Limit (nur generalLimiter)"

  /api/docs-auth/anmelden:
    post:
      tags: ["Doku-Zugang"]
      summary: Anmeldung mit dem gemeinsamen Doku-Passwort, setzt das Doku-Cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passwort]
              properties:
                passwort: { type: string }
      responses:
        "200": { description: "Cookie kq_docs gesetzt (JWT 30 Tage, HttpOnly, Secure, SameSite=Lax)" }
        "401": { description: "Passwort falsch (zeitkonstanter Vergleich)" }
        "429": { description: "docsLoginLimiter: 20 Fehlversuche/15min pro Client-IP; Erfolge zaehlen nicht" }
        "503": { description: "DOCS_PASSWORD nicht gesetzt — Doku bleibt gesperrt statt offen" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: [docsLoginLimiter]
        org-scope: false
        objekt-pruefung: "timingSafeEqual gegen DOCS_PASSWORD (SHA-256 nur zur Puffer-Angleichung, nichts wird gespeichert)"
        # NACHGEZOGEN 24.08.2026 (CodeQL-Befund 101): Route war nur durch den
        # generalLimiter (2000/15min) gedeckt — bei einem einzelnen Passwort
        # ohne Benutzernamen praktisch durchprobierbar. Jetzt strenges Limit.

  /api/docs-auth/abmelden:
    post:
      tags: ["Doku-Zugang"]
      summary: Doku-Cookie löschen
      responses:
        "200": { description: "Cookie geloescht (Max-Age=0)" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: []
        org-scope: false
        objekt-pruefung: "Keine — loescht nur das eigene Cookie"

  # ==========================================================================
  # ORGANIZATIONS (backend/routes/organizations.js — 15 Routen,
  # Mount /api/organizations, optional orgLimiter davor)
  # ==========================================================================
  /api/organizations:
    get:
      tags: ["Organisationen"]
      summary: Alle Organisationen mit Team-/Konfi-Zaehlern (nur Super-Admin)
      responses:
        "200": { description: "Array aller Orgs inkl. user_count/konfi_count" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "keine (org-uebergreifend)"
    post:
      tags: ["Organisationen"]
      summary: Organisation anlegen inkl. erstem org_admin und Standard-Daten (Rollen, 27 Badges, 4 Zertifikat-Typen, 6 Levels, 5 Kategorien, 5 Aktivitäten, 3 Beispiel-Challenges)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, display_name, admin_username, admin_password, admin_display_name]
              properties:
                name: { type: string }
                slug: { type: string }
                display_name: { type: string }
                description: { type: string }
                contact_name: { type: string }
                contact_email: { type: string }
                contact_phone: { type: string }
                address: { type: string }
                website_url: { type: string }
                kirchenkreis: { type: string }
                max_konfis: { type: [integer, "null"] }
                admin_username: { type: string }
                admin_password: { type: string, minLength: 6, description: "BEKANNT: nur min 6 Zeichen, keine Policy" }
                admin_display_name: { type: string }
      responses:
        "201": { description: "id, admin_user_id, Anzahl angelegter Standard-Objekte" }
        "409": { description: "Slug existiert bereits" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin, validateCreateOrg]
        org-scope: false
        objekt-pruefung: "keine"

  /api/organizations/search-users:
    get:
      tags: ["Organisationen"]
      summary: Systemweite User-Suche für Multi-Org-Zuweisung (ohne Konfis)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 }, description: "Suchbegriff" }
      responses:
        "200": { description: "Max. 20 aktive Nicht-Konfi-User (username, display_name, email, Primaer-Org, Rolle)" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "keine (org-uebergreifend, bewusst)"

  /api/organizations/current:
    get:
      tags: ["Organisationen"]
      summary: Eigene (aktive) Organisation mit Statistiken
      responses:
        "200": { description: "SELECT * der Org + user/konfi/jahrgang/activity/event/badge_count" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Immer req.user.organization_id"
        hinweis: "Auch Konfis/Teamer sehen den vollen Org-Datensatz (Kontakt-/Trial-/Limit-Felder) — siehe N5"

  /api/organizations/{id}:
    get:
      tags: ["Organisationen"]
      summary: Einzelne Organisation mit Zaehlern
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID der Organisation" }
      responses:
        "200": { description: "SELECT * + user/teamer/admin/konfi/... counts" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [super_admin, "jede Rolle der eigenen Org"]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Inline: is_super_admin ODER organization_id === id"
        # BEHOBEN 22.08.2026 (war N5): Rollen-Check ergaenzt (super_admin ODER
        # Verwaltungsrolle). Konfis erhalten 403 statt Kontakt-, Trial- und
        # Lizenzdaten der Gemeinde.
    put:
      tags: ["Organisationen"]
      summary: Organisation bearbeiten (Stammdaten; trial_ends_at/is_trial nur Super-Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID der Organisation" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, display_name]
              properties:
                name: { type: string }
                slug: { type: string }
                display_name: { type: string }
                description: { type: string }
                contact_name: { type: string }
                contact_email: { type: string }
                contact_phone: { type: string }
                address: { type: string }
                website_url: { type: string }
                kirchenkreis: { type: string }
                is_active: { type: boolean, description: "BEKANNT: auch org_admin darf die eigene Org (de)aktivieren" }
                trial_ends_at: { type: [string, "null"], format: date-time, description: "nur super_admin; setzt license_reminder_sent_at zurueck" }
                is_trial: { type: boolean, description: "nur super_admin" }
      responses:
        "200": { description: "Aktualisiert" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Slug existiert bereits" }
      x-berechtigung:
        rollen: [super_admin, org_admin]
        middleware: [verifyTokenRBAC, validateUpdateOrg]
        org-scope: true
        objekt-pruefung: "Inline: is_super_admin ODER (eigene Org UND role_name==='org_admin'); Trial-Felder werden für org_admin ignoriert"
    delete:
      tags: ["Organisationen"]
      summary: Organisation vollstaendig löschen (explizite CASCADE-Kette in einer Transaktion, inkl. Datei-Cleanup nach COMMIT)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID der Organisation" }
      responses:
        "200": { description: "Org und alle zugehoerigen Daten geloescht; Gast-User fremder Orgs bleiben" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin, validateOrgId]
        org-scope: false
        objekt-pruefung: "Existenz der Org"

  /api/organizations/{id}/limit:
    patch:
      tags: ["Organisationen"]
      summary: Konfi-Limit (max_konfis) setzen — bewusst eigener Super-Admin-Endpunkt, damit org_admin den Tarif nicht aushebeln kann
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID der Organisation" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max_konfis: { type: [integer, "null"], minimum: 0, description: "null = unbegrenzt" }
      responses:
        "200": { description: "Limit gesetzt" }
        "400": { description: "max_konfis ungueltig" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin, validateOrgId]
        org-scope: false
        objekt-pruefung: "Existenz der Org"

  /api/organizations/{id}/users:
    get:
      tags: ["Organisationen"]
      summary: Alle User einer Organisation (inkl. Konfis) mit Rolle und Jahrgangs-Zähler
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID der Organisation" }
      responses:
        "200": { description: "User-Array" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-berechtigung:
        rollen: [super_admin, org_admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Inline: super_admin ODER (org_admin UND eigene Org)"

  /api/organizations/{id}/admins:
    get:
