# ============================================================================
# Konfi Quest API — Block 3: Verwaltung & Auth
# Dokumentiert: auth, docs-auth, teamer, organizations, material, users,
# jahrgaenge, badges, wrapped, levels, categories, roles, settings (112 Routen)
# Stand: 2026-08-22, verifiziert am Code (Branch main-Stand des Repos)
# ============================================================================
#
# SCHWERPUNKT-ANALYSE
#
# 1. RECHTEVERGABE (Wer darf wen anlegen/aendern/loeschen?)
#    Rollenhierarchie (utils/roleHierarchy.js, Level 5..1):
#      super_admin(5) > org_admin(4) > admin(3) > teamer(2) > konfi(1)
#    - User-Verwaltung (/api/users bzw. /api/admin/users) ist komplett
#      requireOrgAdmin; zusaetzlich checkUserHierarchy pro Operation:
#        * super_admin darf alle Rollen außer super_admin verwalten
#        * org_admin darf ALLE Rollen der eigenen Org verwalten,
#          AUCH andere org_admins (explizite Regel im Code)
#        * admin duerfte teamer/konfi verwalten, teamer nur konfi —
#          praktisch irrelevant, da die Routen requireOrgAdmin verlangen
#    - Rollen-Zuweisung: role_id wird gegen roles der eigenen Org geprüft;
#      bei Update mit Rollenwechsel prüft canCreateRole die Ziel-Rolle.
#      GET /roles/list/assignable liefert nur zuweisbare Rollen
#      (org_admin: admin/teamer/konfi; super_admin: +org_admin).
#    - Rollen selbst sind hardcoded (5 Systemrollen), routes/roles.js ist
#      read-only; Permissions sind statisch pro Rollenname.
#    - org_admins anlegen: super_admin (jede Org) ODER org_admin (eigene Org)
#      via POST /organizations/:id/admins.
#    - Letzter org_admin einer Org ist gegen Löschen geschuetzt (409).
#    - Selbst-Löschung: über POST /auth/delete-account (jede Rolle, mit
#      Passwort-Bestaetigung); DELETE /users/:id blockt Selbst-Löschung.
#    - Multi-Org-Mitgliedschaften (user_organizations) vergibt NUR der
#      super_admin (POST/DELETE /organizations/:id/members); konfi und
#      super_admin sind als Mitglieds-Rolle explizit verboten.
#
# 2. OFFENE ROUTEN (ohne Auth-Middleware) — alle unter /api/auth:
#      POST /login                    authLimiter: 300/15min pro Client-IP,
#                                     skipSuccessfulRequests
#      POST /register-konfi           registerLimiter: 200/h pro IP; Schutz
#                                     durch Invite-Code (8 Hex-Zeichen, 7 Tage
#                                     gueltig, org-/jahrgangsgebunden) +
#                                     Passwort-Policy + Konfi-Limit-Check
#      POST /request-password-reset   eigener Limiter: 5/15min; neutrale
#                                     Antwort (kein E-Mail-Enumeration-Leak)
#      POST /reset-password           NUR globaler General-Limiter (2000/15min)
#      POST /refresh                  NUR General-Limiter; Refresh-Token-
#                                     Rotation mit 5-Minuten-Grace-Window
#      GET  /check-username/:username NUR General-Limiter
#      GET  /validate-invite/:code    NUR General-Limiter
#    # LÜCKE (NEU): check-username, validate-invite, reset-password und
#    # refresh haben keinen eigenen (strengeren) Rate-Limiter — Username-
#    # Enumeration und Invite-Code-Bruteforce (nur 8 Hex-Zeichen = 4 Byte
#    # Entropie) sind mit bis zu 2000 Requests/15min/IP möglich.
#
# 3. SUPER_ADMIN — Sonderbehandlung:
#    - requireSuperAdmin akzeptiert Rolle 'super_admin' ODER das DB-Flag
#      users.is_super_admin (org_admin mit Flag = faktischer Super-Admin).
#    - Nur super_admin: Org-Liste (GET /organizations), Org anlegen/loeschen,
#      PATCH /organizations/:id/limit (max_konfis / Tarif), trial_ends_at +
#      is_trial im Org-Update, systemweite User-Suche (/search-users),
#      Multi-Org-Mitglieder verwalten (/:id/members), Passwort-Reset
#      org-uebergreifend (PUT /users/:id/reset-password).
#    - super_admin (Rolle) hat KEINE Organisation und ist von Org-/Trial-
#      Sperren beim Login/Refresh ausgenommen; checkJahrgangAccess und
#      filterByJahrgangAccess sperren ihn bewusst von Jahrgangs-Daten aus.
#    - Fachrouten (badges, levels, material, ...) nutzen requireAdmin/
#      requireTeamer (Rollennamen-Whitelists) — die Rolle super_admin fällt
#      dort durch (403), außer sie agiert via Multi-Org-Switch als org_admin.
#
# 4. MATERIAL UND ZERTIFIKATE:
#    - Material sehen/herunterladen: requireTeamer (org_admin, admin, teamer)
#      — ALLE Materialien der eigenen Org, KEINE Jahrgangs-Einschraenkung
#      (Jahrgangs-/Event-Zuordnung ist nur Filter-Metadatum). Konfis haben
#      keinerlei Material-Zugriff.
#    - Material/Tags anlegen, ändern, löschen, Dateien hochladen/loeschen:
#      requireAdmin (org_admin, admin). Dateien liegen AES-256-GCM-
#      verschlüsselt unter Zufalls-Hex-Namen; Download prüft Hex-Format
#      (Path-Traversal-Schutz) + Org-Zugehoerigkeit der Datei.
#    - Zertifikat-Typen: lesen requireAdmin, CRUD requireOrgAdmin.
#    - Zertifikate VERGIBT/entzieht nur der org_admin
#      (POST/DELETE /teamer/:userId/certificates); Empfaenger muss Rolle
#      teamer in derselben Org haben; Typ muss zur Org gehören und aktiv
#      sein. Ansehen der Zertifikate eines Teamers: requireAdmin.
#      Teamer sehen die eigenen Zertifikate über ihr Dashboard.
#
# NEUE LUECKEN (zusaetzlich zu den bekannten, Details an den Routen):
#  N1  PUT /users/:id/reset-password schuetzt Ziel-User mit is_super_admin-
#      Flag NICHT: org_admin derselben Org kann dessen Passwort setzen und
#      so Super-Admin-Rechte uebernehmen (Privilege Escalation).
#  N2  Passwort-Änderung/-Reset (change-password, reset-password,
#      users/:id/reset-password) revoziert bestehende Refresh-Tokens (90 Tage)
#      nicht und setzt kein token_invalidated_at — gekaperte Sessions
#      ueberleben den Passwortwechsel.
#  N3  Fehlende Spezial-Rate-Limiter auf 4 offenen Auth-Routen (siehe oben).
#  N4  GET /levels/konfi/:userId: jeder authentifizierte User der Org (auch
#      jeder Konfi) kann Punkte/Level JEDES Konfis abrufen — kein Selbst-
#      oder Rollen-Check.
#  N5  GET /organizations/:id und /:id/stats: JEDE Rolle der eigenen Org
#      (auch konfi/teamer) erhält SELECT * der Organisation inkl. Kontakt-,
#      Trial- und Limit-Daten.
#  N6  POST /organizations/:id/admins: org_admin legt weitere org_admins mit
#      6-Zeichen-Passwort an — die strenge validatePassword-Policy (8+,
#      Gross/Klein/Zahl/Sonderzeichen) wird hier NICHT angewandt.
#  N7  PUT /users/:id: Passwort-Feld ohne jede Policy-Prüfung (weder
#      validatePassword noch Mindestlaenge) — beliebig schwache Passwoerter.
#  N8  POST /auth/update-email: keine Besitz-Verifikation der E-Mail; 409 bei
#      Unique-Kollision erlaubt E-Mail-Enumeration durch eingeloggte User.
#
# BEKANNT (dokumentiert, nicht neu): Multi-Org-Claim-Nachwirkung nach
# Mitgliedschafts-Entzug (Access-Token bis 15 Min + 30s-User-Cache);
# Passwort-Reset-Token unhashed in password_resets; org_admin darf is_active
# der eigenen Org setzen (PUT /organizations/:id); Org-Anlage erlaubt
# 6-Zeichen-Admin-Passwoerter.
# ============================================================================

openapi: 3.1.0
info:
  title: Konfi Quest API — Verwaltung & Auth (Block 3)
  version: "1.0"
  description: >
    Auth/Session, Teamer-Bereich, Organisations-, User-, Jahrgangs-,
    Badge-, Wrapped-, Level-, Kategorie-, Rollen- und Settings-Verwaltung.
    Alle Routen (außer den offenen Auth-Routen) verlangen einen Bearer-JWT
    (15 Min), der von verifyTokenRBAC geprüft wird; die aktive Organisation
    kann per Header X-Active-Organization gewechselt werden (Mitgliedschaft
    wird gegen user_organizations geprüft, 30s-User-Cache).
servers:
  - url: https://konfi-quest.de/api
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  responses:
    Unauthorized: { description: "401 — Kein/ungueltiges/abgelaufenes Token" }
    Forbidden: { description: "403 — Rolle nicht erlaubt / fremde Org" }
    NotFound: { description: "404 — Objekt nicht (in dieser Org) gefunden" }
    ServerError: { description: "500 — Datenbank-/Serverfehler" }

paths:
  # ==========================================================================
  # AUTH (backend/routes/auth.js — 19 Routen, Mount /api/auth)
  # ==========================================================================
  /auth/login:
    post:
      summary: Login für alle Rollen (case-insensitiver Username)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: "JWT (15 Min) + Refresh-Token (90 Tage, SHA-256-gehasht gespeichert) + User-Objekt (bei Konfi inkl. jahrgang und Punkten)"
        "401": { description: "Ungueltige Anmeldedaten (User unbekannt oder Passwort falsch — gleiche Meldung)" }
        "403": { description: "User deaktiviert (user_inactive), Org gesperrt (org_inactive) oder Trial abgelaufen (org_trial_expired); super_admin ausgenommen" }
        "429": { description: "authLimiter: 300 Fehlversuche/15min pro Client-IP" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: [authLimiter, validateLogin]
        org-scope: false
        objekt-pruefung: "Org-Aktiv- und Trial-Prüfung im Handler; super_admin (Rolle oder Flag) umgeht beide"
        hinweis: "Offene Route; setzt last_login_at"

  /auth/change-password:
    post:
      summary: Eigenes Passwort ändern (mit aktuellem Passwort)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, description: "Policy: min 8, Gross/Klein/Zahl/Sonderzeichen, keine Leerzeichen" }
      responses:
        "200": { description: "Passwort geaendert" }
        "400": { description: "Aktuelles Passwort falsch / Policy verletzt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC, validateChangePassword]
        org-scope: false
        objekt-pruefung: "Nur eigener Account (userId aus Token)"
        # BEHOBEN 22.08.2026 (war N2): setzt token_invalidated_at und
        # revoziert alle offenen Refresh-Tokens. Die Antwort enthält ein
        # frisches Token-Paar für die aufrufende Sitzung, damit der eigene
        # Client nicht mitfliegt.

  /auth/delete-account:
    post:
      summary: Eigenen Account sofort und kaskadierend löschen (alle Rollen)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, description: "Bestaetigung mit aktuellem Passwort" }
      responses:
        "200": { description: "Account geloescht (Hard-Delete in einer Transaktion, Sockets getrennt)" }
        "400": { description: "Passwort fehlt oder falsch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Nur eigener Account; Passwort-Bestaetigung im Handler"
        hinweis: "Auch org_admin kann sich selbst löschen — der Letzter-org_admin-Schutz greift nur in DELETE /users/:id, nicht hier"

  /auth/update-email:
    post:
      summary: Eigene E-Mail-Adresse setzen/entfernen (optional, ohne Verifikation)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: [string, "null"], format: email }
      responses:
        "200": { description: "E-Mail aktualisiert" }
        "400": { description: "Ungueltige E-Mail" }
        "409": { description: "E-Mail bereits verwendet" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC, validateUpdateEmail]
        org-scope: false
        objekt-pruefung: "Nur eigener Account"
        # HINWEIS (N8, bewusst so belassen): keine Besitz-Verifikation der
        # E-Mail. Der 409 verraet eingeloggten Usern, dass eine Adresse
        # vergeben ist — hier ueberwiegt die Bedienbarkeit: ohne die Meldung
        # bliebe unklar, warum die Änderung nicht greift. Anders als bei
        # request-password-reset, wo der Aufrufer NICHT angemeldet ist.

  /auth/update-role-title:
    post:
      summary: Eigene Funktionsbeschreibung (role_title) setzen
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role_title: { type: [string, "null"] }
      responses:
        "200": { description: "Aktualisiert" }
        "403": { description: "Konfis duerfen keinen Titel setzen" }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, super_admin]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Inline-Check: role_name !== 'konfi'"

  /auth/me:
    get:
      summary: Eigenes Profil (inkl. is_super_admin-Flag, Trial-Status der Org)
      responses:
        "200": { description: "id, username, display_name, email, role_title, role_name, is_super_admin, trial_ends_at, is_trial" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Nur eigene Daten"

  /auth/my-organizations:
    get:
      summary: Alle Organisationen des Users (Primaer-Org + Multi-Org-Mappings) mit Rolle
      responses:
        "200": { description: "Array (id, name, slug, display_name, role_name, is_active); nur aktive Orgs, dedupliziert" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Nur eigene Mitgliedschaften"

  /auth/switch-org:
    post:
      summary: Aktive Organisation wechseln — neues Access-Token mit active_organization_id-Claim
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id]
              properties:
                organization_id: { type: integer }
      responses:
        "200": { description: "Neues 15-Min-Token, active_organization_id, Rolle in Ziel-Org" }
        "400": { description: "organization_id fehlt" }
        "403": { description: "Keine Mitgliedschaft in Ziel-Org oder Ziel-Org gesperrt" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Mitgliedschaft in user_organizations + is_active der Ziel-Org"
        hinweis: "Trial-Ablauf der Ziel-Org wird hier NICHT geprüft (nur is_active); bekannte Claim-Nachwirkung nach Mitgliedschafts-Entzug bis Token-Ablauf"

  /auth/request-password-reset:
    post:
      summary: Passwort-Reset-Mail anfordern (immer neutrale Antwort)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: "Neutral: 'Falls ein Konto existiert, wurde eine E-Mail gesendet'" }
        "429": { description: "passwordResetLimiter: 5/15min" }
        "500": { description: "Mail-Versand fehlgeschlagen (nur wenn Konto existiert — schwaecht die Neutralitaet leicht ab)" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: [passwordResetLimiter, validateRequestPasswordReset]
        org-scope: false
        objekt-pruefung: "Token 32 Byte Hex, 24h gueltig"
        hinweis: "BEKANNT: Token wird unhashed in password_resets gespeichert"

  /auth/invite-code:
    post:
      summary: Einladungscode für einen Jahrgang erzeugen (8 Hex-Zeichen, 7 Tage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jahrgang_id]
              properties:
                jahrgang_id: { type: integer }
      responses:
        "201": { description: "invite_code, jahrgang_name, expires_at (Status ist 200)" }
        "403": { description: "Nur Org-Admins" }
        "404": { description: "Jahrgang nicht in eigener Org" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, validateInviteCode]
        org-scope: true
        objekt-pruefung: "Jahrgang muss zur eigenen Org gehören"
        hinweis: "Inline-Check erlaubt auch is_super_admin-Flag (abweichend von den drei anderen Invite-Routen, die strikt role_name==='org_admin' verlangen)"

  /auth/invite-codes:
    get:
      summary: Aktive Einladungscodes der eigenen Org (inkl. Nutzungs-Zähler)
      responses:
        "200": { description: "Array mit code, jahrgang, expires_at, used_count" }
        "403": { description: "Nur org_admin (strikt role_name, OHNE Super-Admin-Flag)" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Nur Codes der eigenen Org, nur nicht-abgelaufene"

  /auth/invite-codes/{id}/extend:
    post:
      summary: Einladungscode um 7 Tage verlaengern
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Neues expires_at" }
        "400": { description: "Abgelaufene Codes nicht verlaengerbar" }
        "403": { description: "Nur org_admin" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Code muss zur eigenen Org gehören"

  /auth/invite-codes/{id}:
    delete:
      summary: Einladungscode löschen
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Geloescht" }
        "403": { description: "Nur org_admin" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Code muss zur eigenen Org gehören"

  /auth/check-username/{username}:
    get:
      summary: Username-Verfuegbarkeit prüfen (oeffentlich, case-insensitiv)
      parameters:
        - { name: username, in: path, required: true, schema: { type: string, minLength: 3, pattern: "^[a-zA-Z0-9.-]+$" } }
      responses:
        "200": { description: "{ available: bool, message }" }
        "400": { description: "Zu kurz / ungueltige Zeichen" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: []
        org-scope: false
        objekt-pruefung: "keine"
        # LÜCKE (N3): kein eigener Rate-Limiter — systemweite Username-
        # Enumeration mit bis zu 2000 Requests/15min/IP möglich.

  /auth/validate-invite/{code}:
    get:
      summary: Einladungscode prüfen (oeffentlich) — liefert Jahrgang + Org-Name
      parameters:
        - { name: code, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: "{ valid: true, jahrgang_name, organization_name }" }
        "404": { description: "Code existiert nicht (error_code: not_found)" }
        "410": { description: "Code abgelaufen (error_code: expired)" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: []
        org-scope: false
        objekt-pruefung: "Nur Existenz + Ablauf"
        # LÜCKE (N3): kein eigener Rate-Limiter — 8-Hex-Codes (4 Byte) sind
        # theoretisch bruteforcebar; gueltiger Code leakt Org-/Jahrgangsname.

  /auth/register-konfi:
    post:
      summary: Selbst-Registrierung als Konfi mit Einladungscode (inkl. Auto-Login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_code, display_name, username, password]
              properties:
                invite_code: { type: string }
                display_name: { type: string }
                username: { type: string, minLength: 3, pattern: "^[a-zA-Z0-9.-]+$" }
                password: { type: string, description: "volle Passwort-Policy" }
                email: { type: string, format: email, description: "optional" }
      responses:
        "200": { description: "Token + Refresh-Token + Konfi-User; Auto-Enrollment in kuenftige Pflicht-Events des Jahrgangs; Push an Jahrgangs-Admins" }
        "403": { description: "Konfi-Limit der Org erreicht (limit_exceeded)" }
        "404": { description: "Code existiert nicht" }
        "409": { description: "Username vergeben" }
        "410": { description: "Code abgelaufen" }
        "429": { description: "registerLimiter: 200/h pro IP" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: [registerLimiter, validateRegisterKonfi]
        org-scope: false
        objekt-pruefung: "Invite-Code bestimmt Org + Jahrgang; konfi-Rolle wird org-gescopt aufgeloest; Konfi-Limit (max_konfis) hard_block"

  /auth/reset-password:
    post:
      summary: Passwort mit Reset-Token setzen (oeffentlich)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, description: "volle Passwort-Policy" }
      responses:
        "200": { description: "Passwort zurueckgesetzt, Token als benutzt markiert (Einmal-Nutzung)" }
        "400": { description: "Token ungueltig/abgelaufen/benutzt oder Policy verletzt" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: [validateResetPassword]
        org-scope: false
        objekt-pruefung: "Token-Lookup in password_resets (used_at IS NULL, expires_at > NOW)"
        # BEHOBEN 22.08.2026 (war N2): bestehende Refresh-Tokens werden
        # revoziert und token_invalidated_at gesetzt. Reset-Tokens liegen
        # ausserdem nur noch gehasht in der DB. HINWEIS (war N3): bestehende Refresh-Tokens des Users werden NICHT
        # revoziert; kein eigener Rate-Limiter (Token allerdings 32 Byte Hex).

  /auth/refresh:
    post:
      summary: Access-Token per Refresh-Token erneuern (Rotation, 5-Min-Grace-Window)
      parameters:
        - { name: X-Active-Organization, in: header, required: false, schema: { type: integer }, description: "Aktive Multi-Org — wird nach Mitgliedschafts-Pruefung als Claim uebernommen" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
      responses:
        "200": { description: "Neues Token-Paar; altes Refresh-Token revoziert (bleibt 5 Min im Grace-Window nutzbar)" }
        "401": { description: "Refresh-Token ungueltig/abgelaufen/zu lange revoziert" }
        "403": { description: "User deaktiviert / Org gesperrt / Trial abgelaufen (super_admin ausgenommen)" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: []
        org-scope: false
        objekt-pruefung: "SHA-256-Hash-Lookup in refresh_tokens; Sperr-Checks wie beim Login"
        hinweis: "token_invalidated_at (Soft-Revoke) wird beim Refresh nicht geprüft — Soft-Revoke wirkt nur auf Access-Tokens, nicht auf die Refresh-Kette"

  /auth/logout:
    post:
      summary: Logout — Refresh-Token revozieren und Push-Token des Geraets entfernen (best effort, immer 200)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
                device_id:
                  type: string
                  description: >
                    Geraete-ID. Wird sie zusammen mit platform mitgesendet,
                    entfernt die Route den Push-Token dieses Geraets für den
                    angemeldeten User. Seit 22.08.2026: Der Client ruft dafuer
                    zwar auch DELETE /notifications/device-token, aber
                    best-effort (Timeout, nur online, nur mit ermittelbarer
                    Geraete-ID) — schlug das fehl, kamen weiter Push-Nachrichten
                    an das abgemeldete Geraet.
                platform:
                  type: string
                  enum: [ios, android]
      responses:
        "200": { description: "Immer 'Logout erfolgreich'; Token wird zusaetzlich sofort expired (kein Grace-Window)" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: >
          Revoziert nur das mitgesendete Token (Hash-Match). Der
          Push-Token-Cleanup ist auf user_id des Tokens gescopt — fremde
          Geraete und andere Nutzer auf demselben Geraet bleiben unberuehrt.

  # ==========================================================================
  # DOCS-AUTH (backend/routes/docsAuth.js — 3 Routen, Mount /api/docs-auth)
  # Anmeldung für die API-Doku unter /docs/api: EIN gemeinsames Passwort
  # (DOCS_PASSWORD), kein Benutzerkonto. Der Reverse-Proxy fragt per
  # Forward-Auth bei /pruefen nach. Neu 2026-08-24.
  # ==========================================================================
  /docs-auth/pruefen:
    get:
      summary: Forward-Auth-Check des Reverse-Proxys für /docs/api/*
      responses:
        "200": { description: "Doku-Cookie (signiertes JWT, Zweck 'docs') ist gueltig" }
        "302": { description: "Kein/ungueltiges Cookie UND X-Forwarded-Uri gesetzt (Traefik): Redirect auf die Anmeldeseite, Ziel aus X-Forwarded-Host (https fest)" }
        "401": { description: "Kein/ungueltiges Cookie ohne X-Forwarded-Uri (Caddy baut den Redirect selbst)" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: []
        org-scope: false
        objekt-pruefung: "JWT-Verify des kq_docs-Cookies; App-Anmeldetokens werden abgelehnt (Zweck-Claim)"
        hinweis: "Wird vom Proxy bei JEDEM Doku-Aufruf gerufen — bewusst ohne eigenes Limit (nur generalLimiter)"

  /docs-auth/anmelden:
    post:
      summary: Anmeldung mit dem gemeinsamen Doku-Passwort, setzt das Doku-Cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passwort]
              properties:
                passwort: { type: string }
      responses:
        "200": { description: "Cookie kq_docs gesetzt (JWT 30 Tage, HttpOnly, Secure, SameSite=Lax)" }
        "401": { description: "Passwort falsch (zeitkonstanter Vergleich)" }
        "429": { description: "docsLoginLimiter: 20 Fehlversuche/15min pro Client-IP; Erfolge zaehlen nicht" }
        "503": { description: "DOCS_PASSWORD nicht gesetzt — Doku bleibt gesperrt statt offen" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: [docsLoginLimiter]
        org-scope: false
        objekt-pruefung: "timingSafeEqual gegen DOCS_PASSWORD (SHA-256 nur zur Puffer-Angleichung, nichts wird gespeichert)"
        # NACHGEZOGEN 24.08.2026 (CodeQL-Befund 101): Route war nur durch den
        # generalLimiter (2000/15min) gedeckt — bei einem einzelnen Passwort
        # ohne Benutzernamen praktisch durchprobierbar. Jetzt strenges Limit.

  /docs-auth/abmelden:
    post:
      summary: Doku-Cookie löschen
      responses:
        "200": { description: "Cookie geloescht (Max-Age=0)" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: []
        org-scope: false
        objekt-pruefung: "Keine — loescht nur das eigene Cookie"

  # ==========================================================================
  # ORGANIZATIONS (backend/routes/organizations.js — 15 Routen,
  # Mount /api/organizations, optional orgLimiter davor)
  # ==========================================================================
  /organizations:
    get:
      summary: Alle Organisationen mit Team-/Konfi-Zaehlern (nur Super-Admin)
      responses:
        "200": { description: "Array aller Orgs inkl. user_count/konfi_count" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "keine (org-uebergreifend)"
    post:
      summary: Organisation anlegen inkl. erstem org_admin und Standard-Daten (Rollen, 27 Badges, 4 Zertifikat-Typen, 6 Levels, 5 Kategorien, 5 Aktivitäten, 3 Beispiel-Challenges)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, display_name, admin_username, admin_password, admin_display_name]
              properties:
                name: { type: string }
                slug: { type: string }
                display_name: { type: string }
                description: { type: string }
                contact_name: { type: string }
                contact_email: { type: string }
                contact_phone: { type: string }
                address: { type: string }
                website_url: { type: string }
                kirchenkreis: { type: string }
                max_konfis: { type: [integer, "null"] }
                admin_username: { type: string }
                admin_password: { type: string, minLength: 6, description: "BEKANNT: nur min 6 Zeichen, keine Policy" }
                admin_display_name: { type: string }
      responses:
        "201": { description: "id, admin_user_id, Anzahl angelegter Standard-Objekte" }
        "409": { description: "Slug existiert bereits" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin, validateCreateOrg]
        org-scope: false
        objekt-pruefung: "keine"

  /organizations/search-users:
    get:
      summary: Systemweite User-Suche für Multi-Org-Zuweisung (ohne Konfis)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 } }
      responses:
        "200": { description: "Max. 20 aktive Nicht-Konfi-User (username, display_name, email, Primaer-Org, Rolle)" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "keine (org-uebergreifend, bewusst)"

  /organizations/current:
    get:
      summary: Eigene (aktive) Organisation mit Statistiken
      responses:
        "200": { description: "SELECT * der Org + user/konfi/jahrgang/activity/event/badge_count" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Immer req.user.organization_id"
        hinweis: "Auch Konfis/Teamer sehen den vollen Org-Datensatz (Kontakt-/Trial-/Limit-Felder) — siehe N5"

  /organizations/{id}:
    get:
      summary: Einzelne Organisation mit Zaehlern
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "SELECT * + user/teamer/admin/konfi/... counts" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [super_admin, "jede Rolle der eigenen Org"]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Inline: is_super_admin ODER organization_id === id"
        # BEHOBEN 22.08.2026 (war N5): Rollen-Check ergaenzt (super_admin ODER
        # Verwaltungsrolle). Konfis erhalten 403 statt Kontakt-, Trial- und
        # Lizenzdaten der Gemeinde.
    put:
      summary: Organisation bearbeiten (Stammdaten; trial_ends_at/is_trial nur Super-Admin)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, display_name]
              properties:
                name: { type: string }
                slug: { type: string }
                display_name: { type: string }
                description: { type: string }
                contact_name: { type: string }
                contact_email: { type: string }
                contact_phone: { type: string }
                address: { type: string }
                website_url: { type: string }
                kirchenkreis: { type: string }
                is_active: { type: boolean, description: "BEKANNT: auch org_admin darf die eigene Org (de)aktivieren" }
                trial_ends_at: { type: [string, "null"], format: date-time, description: "nur super_admin; setzt license_reminder_sent_at zurueck" }
                is_trial: { type: boolean, description: "nur super_admin" }
      responses:
        "200": { description: "Aktualisiert" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Slug existiert bereits" }
      x-berechtigung:
        rollen: [super_admin, org_admin]
        middleware: [verifyTokenRBAC, validateUpdateOrg]
        org-scope: true
        objekt-pruefung: "Inline: is_super_admin ODER (eigene Org UND role_name==='org_admin'); Trial-Felder werden für org_admin ignoriert"
    delete:
      summary: Organisation vollstaendig löschen (explizite CASCADE-Kette in einer Transaktion, inkl. Datei-Cleanup nach COMMIT)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Org und alle zugehoerigen Daten geloescht; Gast-User fremder Orgs bleiben" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin, validateOrgId]
        org-scope: false
        objekt-pruefung: "Existenz der Org"

  /organizations/{id}/limit:
    patch:
      summary: Konfi-Limit (max_konfis) setzen — bewusst eigener Super-Admin-Endpunkt, damit org_admin den Tarif nicht aushebeln kann
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                max_konfis: { type: [integer, "null"], minimum: 0, description: "null = unbegrenzt" }
      responses:
        "200": { description: "Limit gesetzt" }
        "400": { description: "max_konfis ungueltig" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin, validateOrgId]
        org-scope: false
        objekt-pruefung: "Existenz der Org"

  /organizations/{id}/users:
    get:
      summary: Alle User einer Organisation (inkl. Konfis) mit Rolle und Jahrgangs-Zähler
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "User-Array" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-berechtigung:
        rollen: [super_admin, org_admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Inline: super_admin ODER (org_admin UND eigene Org)"

  /organizations/{id}/admins:
    get:
      summary: org_admins einer Organisation auflisten
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Admin-Array" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-berechtigung:
        rollen: [super_admin, org_admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Inline: super_admin ODER (org_admin UND eigene Org)"
    post:
      summary: Neuen org_admin in einer Organisation anlegen
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, display_name, password]
              properties:
                username: { type: string, description: "systemweit eindeutig (case-insensitiv)" }
                display_name: { type: string }
                password: { type: string, minLength: 6 }
                email: { type: string }
      responses:
        "201": { description: "Neuer Admin" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Org nicht gefunden" }
        "409": { description: "Username/E-Mail existiert bereits" }
      x-berechtigung:
        rollen: [super_admin, org_admin]
        middleware: [verifyTokenRBAC, validateCreateOrgAdmin]
        org-scope: true
        objekt-pruefung: "Inline: super_admin (jede Org) ODER org_admin der eigenen Org; org_admin-Rolle wird in der Ziel-Org aufgeloest"
        # BEHOBEN 22.08.2026 (war N6): die zentrale validatePassword-Policy
        # gilt jetzt auch hier (8 Zeichen, Gross/Klein, Ziffer, Sonderzeichen).

  /organizations/{id}/members:
    get:
      summary: Multi-Org-Mitglieder einer Organisation (Primaer-User + Mappings, dedupliziert)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Array mit is_primary-Kennzeichnung" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin, validateOrgId]
        org-scope: false
        objekt-pruefung: "keine"
    post:
      summary: Bestehenden User als Multi-Org-Mitglied zuweisen (Upsert der Rolle)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id, role_name]
              properties:
                user_id: { type: integer }
                role_name: { type: string, enum: [org_admin, admin, teamer] }
      responses:
        "201": { description: "Mitgliedschaft gespeichert; Chat-Sync (Team-Chat, bei org_admin alle Jahrgangs-Chats); User-Cache invalidiert" }
        "400": { description: "konfi/super_admin als Rolle verboten; Rolle existiert nicht in Ziel-Org; User ist Konfi" }
        "404": { description: "User oder Org nicht gefunden" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin, validateAddMember]
        org-scope: false
        objekt-pruefung: "Ziel-Rolle wird in der Ziel-Org aufgeloest; Konfis explizit ausgeschlossen"

  /organizations/{id}/members/{userId}:
    delete:
      summary: Multi-Org-Mitgliedschaft entziehen (Primaer-Org nicht entfernbar)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: userId, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Mitgliedschaft entfernt; Chat-Sync raeumt Team-/Jahrgangs-Chats auf; Cache invalidiert" }
        "400": { description: "Primaer-Org kann hier nicht entfernt werden" }
        "404": { description: "User oder Mitgliedschaft nicht gefunden" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "users.organization_id !== id (Primaer-Org-Schutz)"
        hinweis: "BEKANNT: laufende Access-Tokens mit active_organization_id-Claim wirken bis Ablauf nach (max 15 Min + 30s Cache)"

  /organizations/{id}/stats:
    get:
      summary: Statistiken einer Organisation (Konfis, Aktivitäten, Events, Badges, Anträge)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Zaehler-Objekt" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-berechtigung:
        rollen: [super_admin, "jede Rolle der eigenen Org"]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Inline: is_super_admin ODER eigene Org"
        # BEHOBEN 22.08.2026 (war N5): Rollen-Check ergaenzt; Konfis
        # erhalten 403.

  # ==========================================================================
  # USERS (backend/routes/users.js — 9 Routen, Mount /api/users UND
  # /api/admin/users; komplette Verwaltung nur org_admin + Rollenhierarchie)
  # ==========================================================================
  /users:
    get:
      summary: Alle Verwaltungs-User der eigenen Org (ohne Konfis/super_admin), mit can_edit-Flag aus der Hierarchie
      responses:
        "200": { description: "User-Array (Rolle, Jahrgangs-Zaehler, can_edit)" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, requireOrgAdmin]
        org-scope: true
        objekt-pruefung: "keine weitere"
    post:
      summary: Verwaltungs-User anlegen (Rolle aus eigener Org, volle Passwort-Policy)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, display_name, password, role_id]
              properties:
                username: { type: string, minLength: 3, maxLength: 50, pattern: "^[a-zA-Z0-9.-]+$" }
                email: { type: string }
                display_name: { type: string }
                role_title: { type: string }
                password: { type: string, description: "validatePassword-Policy" }
                role_id: { type: integer }
      responses:
        "201": { description: "Neuer User; Chat-Sync (Team-Chat, org_admin zusaetzlich Jahrgangs-Chats)" }
        "400": { description: "Rolle nicht in eigener Org / Policy verletzt" }
        "403": { description: "Hierarchie: Ziel-Rolle nicht anlegbar (canCreateRole)" }
        "409": { description: "Username existiert (systemweit)" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, requireOrgAdmin, "checkUserHierarchy('create')", validateCreateUser]
        org-scope: true
        objekt-pruefung: "role_id muss zur eigenen Org gehören; Hierarchie prüft Ziel-Rolle"

  /users/{id}:
    get:
      summary: Einzelnen User mit Jahrgangs-Zuweisungen laden
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "User + assigned_jahrgaenge (can_view/can_edit, assigned_by)" }
        "403": { description: "Hierarchie: Ziel-Rolle nicht einsehbar" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, requireOrgAdmin, "checkUserHierarchy('view')"]
        org-scope: true
        objekt-pruefung: "Ziel-User muss in eigener Org sein; canManageRole(eigene Rolle, Ziel-Rolle)"
    put:
      summary: User bearbeiten (Felder optional; Rolle, is_active, Passwort)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string, minLength: 3, maxLength: 50, pattern: "^[a-zA-Z0-9.-]+$" }
                email: { type: string }
                display_name: { type: string }
                role_title: { type: string }
                role_id: { type: integer, description: "Rollenwechsel: Hierarchie prueft neue Rolle; Sockets werden getrennt" }
                is_active: { type: boolean, description: "false trennt aktive Sockets" }
                password: { type: string }
      responses:
        "200": { description: "Aktualisiert; Chat-Sync bei Rollen-/Aktiv-Wechsel; User-Cache invalidiert" }
        "400": { description: "Rolle nicht in eigener Org / keine Felder" }
        "403": { description: "Hierarchie verletzt (Ziel-User oder neue Rolle)" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Username/E-Mail existiert bereits" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, requireOrgAdmin, "checkUserHierarchy('update')", validateUpdateUser]
        org-scope: true
        objekt-pruefung: "Ziel-User in eigener Org; canManageRole + canCreateRole für neue Rolle"
        # BEHOBEN 22.08.2026 (war N7): das optionale password-Feld wird vor
        # dem Hashen gegen validatePassword geprüft.
    delete:
      summary: User löschen (Hard-Delete mit Referenz-Anonymisierung und History-Purge)
      description: >
        Anonymisiert die Urheberschaft (admin_id/created_by/approved_by ->
        NULL, seit 24.08.2026 auch events.created_by, custom_badges.created_by,
        levels.created_by und user_jahrgang_assignments.assigned_by — vorher
        blockierten diese Fremdschlüssel das Löschen mit 500) und räumt die
        eigene Historie ab, inkl. user_certificates.user_id (ebenfalls seit
        24.08.2026, vorher war jede ausgezeichnete Person unlöschbar).
        Nachweisfotos UND Challenge-Dateien werden nach dem COMMIT von der
        Platte entfernt.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Geloescht; Sockets getrennt; Nachweisfotos und Challenge-Dateien nach COMMIT entfernt" }
        "400": { description: "Selbst-Loeschung verboten" }
        "403": { description: "Hierarchie verletzt" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Letzter org_admin der Org nicht loeschbar" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, requireOrgAdmin, "checkUserHierarchy('delete')", validateUserId]
        org-scope: true
        objekt-pruefung: "Eigene Org; Selbst-Loeschungs-Sperre; Letzter-org_admin-Schutz"

  /users/{id}/jahrgaenge:
    get:
      summary: Jahrgangs-Zuweisungen eines Users
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Array (jahrgang, can_view, can_edit, assigned_by_name)" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, requireOrgAdmin]
        org-scope: true
        objekt-pruefung: "Jahrgänge auf eigene Org gefiltert"
    post:
      summary: Jahrgangs-Zuweisungen komplett ersetzen (delete + insert, transaktional, Chat-Sync)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jahrgang_assignments]
              properties:
                jahrgang_assignments:
                  type: array
                  items:
                    type: object
                    required: [jahrgang_id]
                    properties:
                      jahrgang_id: { type: integer }
                      can_view: { type: boolean, default: true }
                      can_edit: { type: boolean, default: false }
      responses:
        "200": { description: "Zuweisungen ersetzt; Jahrgangs-Chats aller betroffenen Jahrgaenge synchronisiert" }
        "400": { description: "Jahrgang nicht in eigener Org" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, requireOrgAdmin, validateJahrgangAssignments]
        org-scope: true
        objekt-pruefung: "User + alle Jahrgang-IDs müssen zur eigenen Org gehören"
        hinweis: "KEIN checkUserHierarchy — org_admin darf ohnehin alle; Route wird aber nicht durch andere Rollen erreichbar"

  /users/me/jahrgaenge:
    get:
      summary: Eigene Jahrgangs-Zuweisungen (für Teamer-UI)
      responses:
        "200": { description: "Array der eigenen Zuweisungen (auf aktive Org gescopt)" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Nur eigene Daten"

  /users/{id}/reset-password:
    put:
      summary: Passwort eines Users administrativ setzen
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, description: "volle validatePassword-Policy" }
      responses:
        "200": { description: "Passwort gesetzt; aktive Sockets des Users getrennt" }
        "400": { description: "Policy verletzt" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [super_admin, org_admin]
        middleware: [verifyTokenRBAC, validateResetPassword]
        org-scope: true
        objekt-pruefung: "Inline: is_super_admin (org-uebergreifend, auch per Flag) ODER org_admin derselben Org; org_admin darf auch andere org_admins resetten"
        # LÜCKE (N1): der Ziel-User wird NICHT auf is_super_admin/super_admin
        # geprüft. Ein org_admin kann so das Passwort eines org_admins MIT
        # is_super_admin-Flag in seiner Org setzen und dessen Super-Admin-
        # Rechte uebernehmen (Privilege Escalation). Der Kommentar "nur
        # super_admin ist geschuetzt" stimmt nur für die Rolle (org=NULL),
        # nicht für das Flag.
        # LÜCKE (N2): bestehende Refresh-Tokens des Ziel-Users bleiben gueltig.

  # ==========================================================================
  # ALIAS-MOUNT /api/admin/users (backend/createApp.js)
  # backend/routes/users.js wird ZWEIMAL eingehaengt: unter /api/users und
  # unter /api/admin/users. Es ist derselbe Router, dieselben Handler,
  # dieselben Berechtigungen — kein eigener Code, kein zusaetzlicher Guard.
  # Die Pfade sind hier vollstaendig aufgefuehrt, damit die Doku alle
  # erreichbaren Endpunkte abdeckt; die Beschreibungen verweisen jeweils auf
  # den /users-Eintrag.
  # ==========================================================================
  /admin/users:
    get:
      summary: Alle Verwaltungs-User der eigenen Org (Alias von GET /users)
      description: Identischer Handler wie GET /users.
      responses:
        "200": { description: "User-Array (Rolle, Jahrgangs-Zaehler, can_edit)" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, requireOrgAdmin]
        org-scope: true
        objekt-pruefung: "wie GET /users"
        hinweis: "Alias-Mount, kein eigener Code. super_admin fällt durch requireOrgAdmin auf 403, außer er agiert per Multi-Org-Switch als org_admin."
    post:
      summary: Verwaltungs-User anlegen (Alias von POST /users)
      description: Identischer Handler wie POST /users.
      responses:
        "201": { description: "Angelegter User" }
        "400": { description: "Validierung/Passwort-Policy" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, requireOrgAdmin, userHierarchyMiddleware('create'), validateCreateUser]
        org-scope: true
        objekt-pruefung: "wie POST /users (Rollenhierarchie via canCreateRole)"
        hinweis: "Alias-Mount, kein eigener Code."

  /admin/users/{id}:
    get:
      summary: Einzelnen User laden (Alias von GET /users/{id})
      description: Identischer Handler wie GET /users/{id}.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "User inkl. Jahrgangs-Zuweisungen" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, requireOrgAdmin, userHierarchyMiddleware('view')]
        org-scope: true
        objekt-pruefung: "wie GET /users/{id}"
        hinweis: "Alias-Mount, kein eigener Code."
    put:
      summary: User bearbeiten (Alias von PUT /users/{id})
      description: Identischer Handler wie PUT /users/{id}.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "User aktualisiert" }
        "400": { description: "Validierung/Passwort-Policy" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, requireOrgAdmin, userHierarchyMiddleware('update'), validateUpdateUser]
        org-scope: true
        objekt-pruefung: "wie PUT /users/{id}"
        hinweis: "Alias-Mount, kein eigener Code."
    delete:
      summary: User löschen (Alias von DELETE /users/{id})
      description: Identischer Handler wie DELETE /users/{id}.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "User geloescht" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, requireOrgAdmin, userHierarchyMiddleware('delete'), validateUserId]
        org-scope: true
        objekt-pruefung: "wie DELETE /users/{id}; Selbst-Löschung blockiert"
        hinweis: "Alias-Mount, kein eigener Code."

  /admin/users/{id}/jahrgaenge:
    get:
      summary: Jahrgangs-Zuweisungen eines Users (Alias von GET /users/{id}/jahrgaenge)
      description: Identischer Handler wie GET /users/{id}/jahrgaenge.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Array der Zuweisungen" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, requireOrgAdmin]
        org-scope: true
        objekt-pruefung: "wie GET /users/{id}/jahrgaenge"
        hinweis: "Alias-Mount, kein eigener Code."
    post:
      summary: Jahrgangs-Zuweisungen ersetzen (Alias von POST /users/{id}/jahrgaenge)
      description: Identischer Handler wie POST /users/{id}/jahrgaenge.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Zuweisungen ersetzt, Chat synchronisiert" }
        "400": { description: "Validierung" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, requireOrgAdmin, validateJahrgangAssignments]
        org-scope: true
        objekt-pruefung: "wie POST /users/{id}/jahrgaenge"
        hinweis: "Alias-Mount, kein eigener Code."

  /admin/users/me/jahrgaenge:
    get:
      summary: Eigene Jahrgangs-Zuweisungen (Alias von GET /users/me/jahrgaenge)
      description: Identischer Handler wie GET /users/me/jahrgaenge.
      responses:
        "200": { description: "Array der eigenen Zuweisungen (auf aktive Org gescopt)" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Nur eigene Daten"
        hinweis: "Alias-Mount, kein eigener Code. Kein Rollen-Guard — auch Konfis erreichen diesen Pfad und bekommen ihre eigenen (in der Regel leeren) Zuweisungen."

  /admin/users/{id}/reset-password:
    put:
      summary: Passwort administrativ setzen (Alias von PUT /users/{id}/reset-password)
      description: Identischer Handler wie PUT /users/{id}/reset-password.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, description: "volle validatePassword-Policy" }
      responses:
        "200": { description: "Passwort gesetzt; aktive Sockets des Users getrennt" }
        "400": { description: "Policy verletzt" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [super_admin, org_admin]
        middleware: [verifyTokenRBAC, validateResetPassword]
        org-scope: true
        objekt-pruefung: "wie PUT /users/{id}/reset-password (Inline-Check statt requireOrgAdmin)"
        hinweis: "Alias-Mount, kein eigener Code."

  # ==========================================================================
  # BETRIEB / DIAGNOSE (direkt in backend/createApp.js, kein Router)
  # /health und /status sind bewusst OHNE Authentifizierung (Docker-Healthcheck
  # und Uptime-Monitoring). Die drei Metrics-Endpunkte verlangen ein Token und
  # zusaetzlich req.user.is_super_admin.
  # ==========================================================================
  /health:
    get:
      summary: Liveness-Check (ohne Anmeldung)
      description: >
        Minimaler Endpunkt für Docker-Healthcheck und Traefik. Bewusst ohne
        Datenbank-Prüfung: ein haengender DB-Check wuerde einen gesunden
        Container vom Healthcheck killen lassen.
      security: []
      responses:
        "200": { description: "status: OK, message" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: []
        org-scope: false
        objekt-pruefung: "keine"
        hinweis: "Keine Authentifizierung. Gibt keine Daten preis außer der Tatsache, dass der Dienst läuft."

  /status:
    get:
      summary: Readiness-Check mit Datenbank-Prüfung (ohne Anmeldung)
      description: >
        Prueft die Datenbank mit SELECT 1 und liefert 200 bei gesunder DB,
        sonst 503. Getrennt von /health, weil er echte Abhaengigkeiten prüft.
      security: []
      responses:
        "200": { description: "status, version, commit, uptimeSeconds, checks.database, responseTimeMs" }
        "503": { description: "DEGRADED — Datenbank nicht erreichbar" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: []
        org-scope: false
        objekt-pruefung: "keine"
        hinweis: >
          # HINWEIS: Ohne Anmeldung erreichbar und gibt version und commit
          (GIT_SHA) preis. Bewusst so für die Status-Seite / Uptime Kuma.

  /metrics:
    get:
      summary: APM-Kennzahlen aller Replicas (nur super_admin)
      description: >
        Aggregierte Laufzeitdaten: langsamste und meistgenutzte Routen,
        parallele Requests, Live-Verlauf, letzte Fehler. Ist METRICS_PEERS
        gesetzt, werden alle Peers über /metrics/local abgefragt und zu einem
        Gesamtbild inklusive Lastverteilung gemergt.
      responses:
        "200": { description: "Zusammengefuehrter APM-Snapshot inkl. replicas" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Inline: req.user.is_super_admin, sonst 403"
        hinweis: >
          Bewusst org-uebergreifend — die Daten sind organisationsunabhaengige
          Betriebskennzahlen. Der Authorization-Header wird an die Peers
          weitergereicht.

  /metrics/local:
    get:
      summary: APM-Rohdaten nur dieser Replica (nur super_admin)
      description: >
        Unaggregierter In-Memory-Snapshot der antwortenden Replica. Wird von
        /metrics für die Peer-Aggregation genutzt, ist aber auch direkt
        aufrufbar.
      responses:
        "200": { description: "APM-Snapshot dieser Replica" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Inline: req.user.is_super_admin, sonst 403"

  /metrics/history:
    get:
      summary: Gespeicherte APM-Historie (nur super_admin)
      description: >
        Liefert die persistierten Snapshots aus apm_snapshots der letzten N
        Tage, damit das Dashboard Deltas über Deploys hinweg bilden kann.
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 30, default: 7 }
          description: Auf 1..30 begrenzt; ungueltige Werte fallen auf 7 zurück.
      responses:
        "200": { description: "days und snapshots[] (captured_at, total_requests, total_errors, max_in_flight, worst_p95_ms, worst_route)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Inline: req.user.is_super_admin, sonst 403"
