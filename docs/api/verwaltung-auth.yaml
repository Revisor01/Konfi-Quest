# ============================================================================
# Konfi Quest API — Block 3: Verwaltung & Auth
# Dokumentiert: auth, docs-auth, health/status/app-version, metrics,
# organizations, users (beide Mounts), einladungen, anfragen und support
# (seit 03.10.2026; Support-Mail seit 03.10.2026, routes/supportMail.js;
# Uebersicht und Gemeindeliste seit 03.10.2026, routes/supportUebersicht.js;
# Vorgaenge seit 03.10.2026, routes/supportVorgaenge.js, und das oeffentliche
# Support-Formular POST /api/anliegen, routes/anliegen.js) —
# 67 Operationen,
# gezaehlt am 26.09.2026 (die Generatoren zaehlen bei jedem Lauf nach).
# teamer, material und wrapped stehen in teamer-material.yaml; jahrgaenge,
# badges, levels, categories, roles und settings in stammdaten.yaml.
# Stand: 2026-08-22, verifiziert am Code (Branch main-Stand des Repos);
# Kopfzeilen und Rollenangaben nachgezogen am 26.09.2026.
# ============================================================================
#
# SCHWERPUNKT-ANALYSE
#
# 1. RECHTEVERGABE (Wer darf wen anlegen/aendern/loeschen?)
#    Rollenhierarchie (utils/roleHierarchy.js, Level 5..1):
#      super_admin(5) > org_admin(4) > admin(3) > teamer(2) > konfi(1)
#    - User-Verwaltung (/api/users bzw. /api/admin/users) ist requireAdmin
#      (org_admin UND admin; Entscheidung 26.08.2026, bis dahin
#      requireOrgAdmin — Kopfzeile nachgezogen am 26.09.2026); die
#      Reichweite regelt checkUserHierarchy pro Operation:
#        * super_admin darf alle Rollen außer super_admin anlegen; ein
#          super_admin-Konto (Rolle ODER Flag is_super_admin) bearbeitet,
#          loescht oder setzt nur ein Super-Admin zurueck (seit 26.09.2026);
#          einzige Ausnahme seit 03.10.2026: Die Gemeindeleitung nimmt einen
#          Support-Gast ohne Stamm-Gemeinde aus ihrer Gemeinde (DELETE
#          /users/{id}, nur die Mitgliedschaft endet)
#        * org_admin darf ALLE Rollen der eigenen Org verwalten,
#          AUCH andere org_admins (explizite Regel im Code)
#        * admin verwaltet teamer und konfi (seine eigenen Jahrgaenge),
#          teamer und konfi niemanden
#    - Rollen-Zuweisung: role_id wird gegen roles der eigenen Org geprüft;
#      bei Update mit Rollenwechsel prüft canCreateRole die Ziel-Rolle.
#      GET /roles/list/assignable liefert nur zuweisbare Rollen
#      (org_admin: admin/teamer/konfi; super_admin: +org_admin).
#    - Rollen selbst sind hardcoded (5 Systemrollen), routes/roles.js ist
#      read-only; Permissions sind statisch pro Rollenname.
#    - org_admins anlegen: super_admin (jede Org) ODER org_admin (eigene Org)
#      via POST /organizations/:id/admins.
#    - Letzter org_admin einer Org ist gegen Löschen geschuetzt (409).
#    - Selbst-Löschung: über POST /auth/delete-account (jede Rolle, mit
#      Passwort-Bestaetigung); DELETE /users/:id blockt Selbst-Löschung.
#    - Multi-Org-Mitgliedschaften (user_organizations) vergibt der
#      super_admin direkt (POST/DELETE /organizations/:id/members) — und seit
#      dem 26.09.2026 der org_admin per Einladung (POST /api/einladungen; die
#      Mitgliedschaft entsteht erst mit der Annahme durch die Person). konfi
#      und super_admin sind als Mitglieds-Rolle auf beiden Wegen verboten.
#
# 2. OFFENE ROUTEN (ohne Auth-Middleware) — alle unter /api/auth:
#      POST /login                    authLimiter: 300/15min pro Client-IP,
#                                     skipSuccessfulRequests; dazu seit
#                                     27.09.2026 die Kontosperre: 10 falsche
#                                     Passwoerter je Stunde und Konto, danach
#                                     429 auch mit richtigem Passwort
#                                     (utils/kontoSperre.js, Audit Sicherheit
#                                     BF-04 -- BEHOBEN 27.09.2026)
#      POST /register-konfi           registerLimiter: 200/h pro IP; Schutz
#                                     durch Invite-Code (8 Hex-Zeichen, 7 Tage
#                                     gueltig, org-/jahrgangsgebunden) +
#                                     Passwort-Policy + Konfi-Limit-Check
#      POST /request-password-reset   zwei eigene Limiter: 5/15min je Client-IP
#                                     (clientIp, seit 26.09.2026 -- vorher
#                                     req.ip, hinter dem Proxy fuer ALLE
#                                     gleich; Audit Sicherheit BF-05) UND
#                                     3/h je Ziel-E-Mail; neutrale Antwort
#                                     (kein E-Mail-Enumeration-Leak)
#      POST /reset-password           NUR globaler General-Limiter (2000/15min)
#      POST /refresh                  NUR General-Limiter; Refresh-Token-
#                                     Rotation mit 5-Minuten-Grace-Window
#                                     (seit 26.09.2026 genau einmal nutzbar;
#                                     dritte Verwendung widerruft alle
#                                     Refresh-Tokens des Kontos, BF-08)
#      GET  /check-username/:username namensLimiter seit 29.09.2026: 30
#                                     TREFFER ("vergeben") je Viertelstunde
#                                     und Client-IP, danach 429; freie Namen
#                                     zaehlen nicht (Audit Sicherheit BF-18)
#      GET  /validate-invite/:code    NUR General-Limiter
#    Dazu seit 03.10.2026 ausserhalb von /api/auth:
#      POST /api/anfragen             Anfrageformular auf konfi-quest.de:
#                                     5 angenommene je Stunde und Client-IP,
#                                     3 je Tag und E-Mail-Adresse, Honigtopf
#                                     (Abschnitt SUPPORT unten)
#      POST /api/anliegen             Support-Formular auf konfi-quest.de:
#                                     dieselbe Grenze und derselbe Honigtopf
#                                     (utils/oeffentlicheGrenzen.js), eigene
#                                     Zaehler (Abschnitt SUPPORT unten)
#    # LÜCKE (N3, teilweise BEHOBEN 29.09.2026): validate-invite,
#    # reset-password und refresh haben keinen eigenen (strengeren)
#    # Rate-Limiter — Invite-Code-Bruteforce (nur 8 Hex-Zeichen = 4 Byte
#    # Entropie) ist mit bis zu 2000 Requests/15min/IP möglich.
#    # check-username hat seit 29.09.2026 den namensLimiter (siehe oben).
#    "Pro Client-IP" heisst seit 26.09.2026 (Audit Sicherheit BF-13): der
#    Header X-Real-IP zaehlt nur, wenn die Anfrage aus dem Docker-Netz kommt
#    (utils/clientIp.js: Peer in Loopback/Link-Local/privatem Bereich), sonst
#    req.ip. Vorher liess sich der Header von jedem Client setzen, der das
#    Backend ohne den eigenen Proxy erreicht -- und damit jedes Limit umgehen.
#
# 3. SUPER_ADMIN — Sonderbehandlung:
#    - requireSuperAdmin akzeptiert Rolle 'super_admin' ODER das DB-Flag
#      users.is_super_admin (org_admin mit Flag = faktischer Super-Admin).
#    - Nur super_admin: Org-Liste (GET /organizations), Org anlegen/loeschen,
#      PATCH /organizations/:id/limit (max_konfis / Tarif), trial_ends_at +
#      is_trial im Org-Update, systemweite User-Suche (/search-users),
#      Multi-Org-Mitglieder verwalten (/:id/members), Passwort-Reset
#      org-uebergreifend (PUT /users/:id/reset-password). Seit 03.10.2026
#      dazu die Support-Ansicht unter /api/support (Anfragen, Landeskirchen,
#      Kirchenkreise, Statistik, Uebersicht, Gemeindeliste, Support-Mail) und
#      kirchenkreis_id im Org-Update. INTERNE GEMEINDEN (organizations.intern,
#      Migration 194): stehen in keiner Liste und keiner Zahl der
#      Support-Ansicht und nicht in GET /organizations (Zugriff ueber die
#      Kennung bleibt); gesetzt nur direkt in der Datenbank.
#    - KONTEN OHNE GEMEINDE (seit 03.10.2026, Migration 190): users.
#      organization_id ist nullable, aber nur fuer Super-Admins (CHECK
#      users_gemeinde_oder_super_admin); ein solches Konto traegt die
#      gemeindefreie Systemrolle super_admin (roles.organization_id NULL,
#      eindeutig per uq_roles_name_ohne_gemeinde). Angelegt, gesperrt, mit
#      Passwort versehen und geloescht ueber /organizations/support-konten
#      (nur Super-Admin); als Gast in einer Gemeinde ueber
#      POST /organizations/{id}/members. Anmeldung nur aus der Web-Version
#      (kann_ohne_gemeinde, siehe POST /auth/login). Das letzte aktive
#      Super-Admin-Konto laesst sich weder sperren noch loeschen, auch nicht
#      ueber POST /auth/delete-account (409).
#    - super_admin (Rolle) hat KEINE Organisation und ist von Org-/Trial-
#      Sperren beim Login/Refresh ausgenommen -- seit 03.10.2026 NICHT mehr
#      von der Sperre des Kontos (is_active); von Jahrgangs-Daten bleibt er
#      ausgesperrt (etablierte Regel; die frueheren rbac-Helfer
#      checkJahrgangAccess/filterByJahrgangAccess waren nie eingehaengt und
#      sind seit 01.09.2026 geloescht — die Regel setzt darfJahrgang in
#      utils/jahrgangsZugriff.js zusammen mit requireAdmin/requireTeamer um).
#    - Fachrouten (badges, levels, material, ...) nutzen requireAdmin/
#      requireTeamer (Rollennamen-Whitelists) — die Rolle super_admin fällt
#      dort durch (403), außer sie agiert via Multi-Org-Switch als org_admin.
#
# 4. MATERIAL UND ZERTIFIKATE:
#    - Material sehen/herunterladen: requireTeamer (org_admin, admin, teamer)
#      — ALLE Materialien der eigenen Org, KEINE Jahrgangs-Einschraenkung
#      (Jahrgangs-/Event-Zuordnung ist nur Filter-Metadatum). Konfis haben
#      keinerlei Material-Zugriff.
#    - Material/Tags anlegen, ändern, löschen, Dateien hochladen/loeschen:
#      requireAdmin (org_admin, admin). Dateien liegen AES-256-GCM-
#      verschlüsselt unter Zufalls-Hex-Namen; Download prüft Hex-Format
#      (Path-Traversal-Schutz) + Org-Zugehoerigkeit der Datei.
#    - Zertifikat-Typen: lesen requireAdmin, CRUD requireOrgAdmin.
#    - Zertifikate VERGIBT/entzieht nur der org_admin
#      (POST/DELETE /teamer/:userId/certificates); Empfaenger muss Rolle
#      teamer in derselben Org haben; Typ muss zur Org gehören und aktiv
#      sein. Ansehen der Zertifikate eines Teamers: requireAdmin.
#      Teamer sehen die eigenen Zertifikate über ihr Dashboard.
#
# NEUE LUECKEN (zusaetzlich zu den bekannten, Details an den Routen):
#  N1  BEHOBEN 26.09.2026. PUT /users/:id/reset-password, PUT /users/:id,
#      DELETE /users/:id und POST /users/:id/jahrgaenge weisen ein Ziel mit
#      Rolle super_admin ODER Flag is_super_admin mit 403 ab, sofern der
#      Aufrufer nicht selbst Super-Admin ist (istSuperAdminKonto in
#      utils/roleHierarchy.js, in checkUserHierarchy und inline im Reset).
#      Vorher konnte ein org_admin derselben Org dessen Passwort setzen und
#      so Super-Admin-Rechte uebernehmen (Privilege Escalation; Audit
#      26.09.2026, Sicherheit BF-01, reproduziert).
#  N2  BEHOBEN. Passwort-Änderung/-Reset revoziert bestehende Refresh-Tokens
#      (90 Tage) und setzt token_invalidated_at: change-password und
#      auth/reset-password am 22.08.2026, die Push-Tokens am 01.09.2026,
#      users/:id/reset-password (samt Alias /api/admin/users/:id/reset-password)
#      und POST /api/admin/konfis/:id/regenerate-password am 14.09.2026.
#      Vorher ueberlebte eine gekaperte Sitzung den Passwortwechsel — und
#      genau die beiden zuletzt geschlossenen Routen sind die, die man
#      benutzt, wenn ein Konto uebernommen wurde.
#  N3  Fehlende Spezial-Rate-Limiter auf 4 offenen Auth-Routen (siehe oben).
#      TEILWEISE BEHOBEN 29.09.2026: check-username hat den namensLimiter
#      (Audit Sicherheit BF-18); validate-invite, reset-password und refresh
#      weiter nur mit dem allgemeinen Flutschutz.
#  N4  GET /levels/konfi/:userId: jeder authentifizierte User der Org (auch
#      jeder Konfi) kann Punkte/Level JEDES Konfis abrufen — kein Selbst-
#      oder Rollen-Check.
#  N5  GET /organizations/:id und /:id/stats: JEDE Rolle der eigenen Org
#      (auch konfi/teamer) erhält SELECT * der Organisation inkl. Kontakt-,
#      Trial- und Limit-Daten.
#  N6  BEHOBEN 22.08.2026 (Kopf nachgezogen 30.09.2026). POST
#      /organizations/:id/admins und POST /organizations (admin_password)
#      pruefen gegen validatePassword (8+, Gross/Klein/Zahl/Sonderzeichen,
#      keine Leerzeichen). Vorher legte ein org_admin weitere org_admins mit
#      6-Zeichen-Passwort an.
#  N7  BEHOBEN 22.08.2026 (Kopf nachgezogen 30.09.2026). PUT /users/:id
#      prueft ein geschicktes Passwort gegen validatePassword. Vorher ohne
#      jede Policy-Pruefung -- beliebig schwache Passwoerter.
#  N8  POST /auth/update-email: keine Besitz-Verifikation der E-Mail; 409 bei
#      Unique-Kollision erlaubt E-Mail-Enumeration durch eingeloggte User.
#
# BEKANNT (dokumentiert, nicht neu): Multi-Org-Claim-Nachwirkung nach
# Mitgliedschafts-Entzug (Access-Token bis 15 Min + 30s-User-Cache) --
# clientseitig BEHOBEN 26.09.2026 (Audit Grundgeruest BF-05): die App holt
# beim ersten 403 ein Token ohne Claim, siehe DELETE /organizations/{id}/members/{userId}.
# Die drei folgenden standen hier bis 30.09.2026 noch als bekannt und sind
# alle BEHOBEN 22.08.2026 (714b5013): Passwort-Reset-Token unhashed in
# password_resets (seitdem nur der SHA-256-Hash); org_admin durfte is_active
# der eigenen Org setzen (PUT /organizations/:id, seitdem nur super_admin);
# Org-Anlage erlaubte 6-Zeichen-Admin-Passwoerter (N6, seitdem volle Policy).
# ============================================================================

openapi: 3.1.0
info:
  title: Konfi Quest API — Verwaltung & Auth (Block 3)
  version: "1.0"
  description: >
    Auth/Session, Teamer-Bereich, Organisations-, User-, Jahrgangs-,
    Badge-, Wrapped-, Level-, Kategorie-, Rollen- und Settings-Verwaltung.
    Alle Routen (außer den offenen Auth-Routen) verlangen einen Bearer-JWT
    (15 Min), der von verifyTokenRBAC geprüft wird; die aktive Organisation
    kann per Header X-Active-Organization gewechselt werden (Mitgliedschaft
    wird gegen user_organizations geprüft, 30s-User-Cache).
    FREMDE AKTIVE GEMEINDE (seit 29.09.2026): Ohne Mitgliedschaft antworten
    verifyTokenRBAC und die Datei-Routen GET /api/chat/files/:filename und
    GET /api/challenges/files/:filename mit 403 { error: "Kein Zugriff auf
    diese Organisation", error_code: "org_kein_zugriff" }. error_code ist neu;
    der Text bleibt bewusst "Organisation", obwohl alle anderen Meldungen
    "Gemeinde" sagen: Die Store-Apps 2.2.0 und 2.3.0 vergleichen ihn woertlich
    fuer den Rueckfall in die Stamm-Gemeinde. Die aktuelle App prueft zuerst
    error_code; der Text darf "Gemeinde" sagen, sobald keine App ohne diese
    Pruefung mehr ruft.
    ZUGANGS-TOKEN (BEHOBEN 29.09.2026, Audit Sicherheit BF-15): Claims
    id, type, organization_id, role_name, is_super_admin, ggf.
    active_organization_id, iat, exp -- OHNE display_name und email
    (vorher im Klartext, nur base64-kodiert). Gilt für alle fünf
    ausstellenden Stellen (login, refresh, switch-org, register-konfi, das
    neue Paar aus change-password). Geprüft gegen die ausgelieferten Apps
    1.5.3 bis 2.3.0: Sie lesen aus dem Token nur exp (services/api.ts,
    getTokenExp); Name und E-Mail kommen aus `user` der Login-Antwort und
    aus GET /auth/me. Das Backend liest aus dem Token nur id, iat und
    active_organization_id und lädt alles andere aus der Datenbank.
    PROTOKOLL (BEHOBEN 29.09.2026, Audit Sicherheit BF-14): Das
    Server-Protokoll nennt Personen nur mit Konto-Kennung, E-Mail-Adressen
    nur mit Domain und keinen Freitext vom Client (utils/protokoll.js).
    POST /api/auth/login schreibt keine Zeile je erfolgreicher Anmeldung und
    nie den Benutzernamen. Fehlversuche stehen im Protokoll (Simon,
    29.09.2026): falsches Passwort mit der Konto-Kennung, ein unbekannter
    Name als "unbekannter Benutzername" ohne den Namen; gezaehlt werden sie
    in der Kontosperre. Abgewiesene Anmeldungen gesperrter Konten stehen mit
    der Kennung im Protokoll.
    FEHLER IM ANFRAGE-KÖRPER (alle Routen, BEHOBEN 29.09.2026, Audit
    Sicherheit BF-17): Ungültiges JSON antwortet 400 "Die Anfrage enthält
    kein gültiges JSON.", ein Körper über 100 kB 413 "Die Anfrage ist zu
    groß.", ein fremder Zeichensatz oder eine unbekannte Kodierung 415 --
    jeweils { error } ohne Log-Zeile. Vorher 500 "Something went wrong!"
    mit Stack im Log je Anfrage.
servers:
  - url: https://konfi-quest.de
tags:
  - name: "Anmeldung & Konto"
    description: "Login, Logout, Token-Refresh, eigenes Profil, Organisationswechsel."
  - name: "Benutzer & Rollen"
    description: "Team-Konten der Leitung: anlegen, ändern, Jahrgangszuweisung, Rollen. /admin/users und /users sind derselbe Router (Alias-Mount)."
  - name: "Doku-Zugang"
    description: "Anmeldung für die passwortgeschützte API-Dokumentation."
  - name: "Organisationen"
    description: "Gemeinden anlegen und verwalten, Mitglieder und Limits (Super-Admin und Leitung); Support-Konten ohne Gemeinde (nur Super-Admin)."
  - name: "Passwörter & Einladungen"
    description: "Passwort vergessen und zurücksetzen, Einladungs-Codes, Konfi-Registrierung."
  - name: "System & Monitoring"
    description: "Health-Check, Status und Metriken des Servers."
  - name: "Support"
    description: "Support-Ansicht der Web-Version: das öffentliche Anfrageformular (POST /api/anfragen) und unter /api/support Anfragen, Landeskirchen und Kirchenkreise, Statistik, die Übersicht (Dashboard) und die Gemeindeliste mit Gemeindeleitung sowie die Support-Mail -- Posteingang, Verlauf, Antworten, Textbausteine, Fußzeile (nur Super-Admin). Interne Gemeinden (organizations.intern) stehen in keiner Liste und keiner Zahl."
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT im Authorization-Header. Optional Header X-Active-Organization
        (Multi-Org): schaltet die aktive Organisation um, sofern der User dort
        Mitglied ist (sonst 403 mit error_code org_kein_zugriff).
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    GemeindeAnfrage:
      type: object
      description: "Eine Anfrage vom Formular (gemeinde_anfragen, Migration 191). Genau diese Felder."
      properties:
        id: { type: integer }
        gemeinde: { type: string }
        kirchenkreis: { type: [string, "null"], description: "Freitext aus dem Formular" }
        landeskirche: { type: [string, "null"], description: "Freitext aus dem Formular" }
        kontakt_name: { type: string }
        funktion: { type: [string, "null"] }
        email: { type: string }
        mobil: { type: [string, "null"] }
        anzahl_konfis: { type: [integer, "null"] }
        anzahl_teamer: { type: [integer, "null"] }
        nachricht: { type: [string, "null"] }
        status: { type: string, enum: [neu, in_arbeit, angelegt, abgelehnt] }
        notiz: { type: [string, "null"] }
        organization_id: { type: [integer, "null"], description: "die daraus entstandene Gemeinde" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        wunsch_lizenz:
          type: [string, "null"]
          enum: [klein, standard, plus, gross, verbund, null]
          description: "Wunschlizenz aus dem Formular (Migration 192, seit 03.10.2026); null = keine Angabe. Werte wie backend/utils/lizenzen.js."
        ungelesen:
          type: integer
          description: "ungelesene eingehende Mails zu dieser Anfrage (Support-Mail, additiv seit 03.10.2026); GET /api/support/anfragen und PATCH /api/support/anfragen/{id}"
    MailNachricht:
      type: object
      description: >
        Eine Mail der Support-Mail (mail_nachrichten, Migration 193), ein-
        oder ausgehend. Seit Migration 195 gehoert sie zu einem VORGANG
        (vorgang_id) oder liegt im Posteingang; anfrage_id und organization_id
        folgen dem Vorgang (Vorgang einer Anfrage: anfrage_id; sonst die Gemeinde
        des Vorgangs; nie beides), die alten Routen lesen sie. Nur Klartext
        (hoechstens 50.000 Zeichen); von Anhaengen nur Name, Groesse und Typ.
      properties:
        id: { type: integer }
        postfach: { type: string, enum: [moin, support] }
        richtung: { type: string, enum: [ein, aus] }
        anfrage_id: { type: [integer, "null"] }
        organization_id: { type: [integer, "null"] }
        vorgang_id: { type: [integer, "null"], description: "der Vorgang der Mail; null = Posteingang (additiv seit 03.10.2026, Migration 195)" }
        message_id: { type: string, description: "in spitzen Klammern; eigene Antworten <kq-uuid@konfi-quest.de>, Mails ohne Message-ID <kq-ersatz-postfach-uidvalidity-uid@konfi-quest.de>" }
        in_reply_to: { type: [string, "null"] }
        referenzen: { type: array, items: { type: string }, description: "References, aelteste zuerst" }
        von_adresse: { type: [string, "null"], description: "klein geschrieben" }
        von_name: { type: [string, "null"] }
        an_adressen: { type: array, items: { type: string } }
        betreff: { type: string }
        text: { type: string, description: "Klartext; bei ausgehenden samt Fusszeile, wie gesendet. Eingehende ueber 10 MB werden ohne Quelltext uebernommen (Speichergrenze der Backends): dann steht hier 'Diese Mail ist zu groß für die Übernahme (X MB). Bitte im Mailprogramm ansehen.', referenzen ist leer, Absender, Empfaenger, Betreff, Message-ID und In-Reply-To kommen aus dem IMAP-Umschlag" }
        anhaenge:
          type: array
          items:
            type: object
            properties:
              name: { type: [string, "null"] }
              groesse: { type: [integer, "null"], description: "Bytes; bei Mails ueber 10 MB aus dem IMAP-Aufbau geschaetzt (base64: drei Viertel der kodierten Groesse)" }
              typ: { type: [string, "null"] }
        gesendet_am: { type: string, format: date-time }
        gelesen_am: { type: [string, "null"], format: date-time, description: "eingehend: wann im Support gesehen; ausgehend: = gesendet_am" }
        archiviert_am: { type: [string, "null"], format: date-time, description: "nur Mails im Posteingang: wann archiviert (additiv seit 03.10.2026, Migration 195)" }
        verfasst_von: { type: [integer, "null"], description: "Konto, das die Antwort geschrieben hat; faellt mit dem Konto weg" }
        verfasst_von_name: { type: [string, "null"], description: "Anzeigename dazu (zusaetzlich zum Vertrag)" }
        created_at: { type: string, format: date-time }
    MailBaustein:
      type: object
      description: "Textbaustein (mail_bausteine). Platzhalter {{name}}, {{gemeinde}}, {{lizenz}}, {{testphase_bis}}, {{benutzername}}, {{absender}} fuellt die Oberflaeche (GET /api/support/mail/platzhalter)."
      properties:
        id: { type: integer }
        titel: { type: string }
        betreff: { type: [string, "null"] }
        text: { type: string }
        postfach: { type: [string, "null"], enum: [moin, support, null], description: "null = fuer beide" }
        sortierung: { type: integer }
        updated_at: { type: string, format: date-time }
        bearbeitet_von: { type: [integer, "null"] }
    MailEinstellungen:
      type: object
      properties:
        fusszeile: { type: string, description: "unter jeder Antwort, nach dem Trenner '-- '; leer = keine" }
        absendername: { type: string, description: "Name im From der Antworten und Platzhalter {{absender}}" }
    MailAntwort:
      type: object
      required: [text]
      properties:
        text: { type: string, maxLength: 20000, description: "getrimmt, nicht leer; die Fusszeile setzt der Server darunter" }
        betreff: { type: [string, "null"], maxLength: 300, description: "leer = Standardbetreff; die Kennung [Vorgang N] kommt dazu, wenn sie fehlt (bis Migration 195 [Anfrage N] / [Gemeinde N]; eine alte Kennung weicht der neuen)" }
    Landeskirche:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        kirchenkreise:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
    Kirchenkreis:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        landeskirche_id: { type: [integer, "null"] }
        landeskirche: { type: [string, "null"] }
        anzahl_gemeinden: { type: integer, description: "zugeordnete Gemeinden, interne ausgenommen (zusaetzlich zum Vertrag)" }
    SupportReiheMonate:
      type: array
      description: "genau 12 Werte, ein Wert je Monat aus entwicklung.monate, gleiche Reihenfolge (aeltester zuerst), Monate ohne Eintraege als 0"
      items: { type: integer }
    SupportReiheWochen:
      type: array
      description: "genau 12 Werte, ein Wert je Woche aus aktivitaet.wochen, gleiche Reihenfolge (aelteste zuerst), Wochen ohne Eintraege als 0"
      items: { type: integer }
    SupportVorgangListe:
      type: object
      description: >
        Ein Eintrag der Liste GET /api/support/vorgaenge (support_vorgaenge, Migration 195;
        docs/planung/support-vorgaenge.md). Genau diese Felder.
      properties:
        id: { type: integer, description: "die Nummer des Vorgangs; sie steht als [Vorgang N] im Betreff der Mails" }
        art: { $ref: "#/components/schemas/SupportVorgangArt" }
        bereich: { $ref: "#/components/schemas/SupportVorgangBereich" }
        dringlichkeit: { type: string, enum: [normal, dringend] }
        status: { type: string, enum: [neu, in_arbeit, wartet, erledigt], description: "erledigt ist immer archiviert (archiviert_am gesetzt)" }
        betreff: { type: string }
        quelle: { type: string, enum: [anfrage, formular, mail, support], description: "anfrage: Formular fuer Gemeinden (mit Anfrage); formular: Support-Formular auf konfi-quest.de; mail: aus einer Mail oder dem Posteingang; support: vom Support angelegt" }
        organization_id: { type: [integer, "null"], description: "die Gemeinde, sobald bekannt (auch eine interne)" }
        gemeinde_name: { type: [string, "null"], description: "Anzeigename der Gemeinde (display_name, sonst name); sonst der Gemeindename der Anfrage bzw. die Angabe aus dem Formular; sonst null" }
        anfrage_id: { type: [integer, "null"], description: "die Anfrage, an der der Vorgang haengt (Art neue_gemeinde)" }
        ungelesen: { type: integer, description: "ungelesene eingehende Mails des Vorgangs" }
        letzte_aktivitaet: { type: string, format: date-time, description: "das Spaetere von letzter Aenderung (updated_at) und juengster Mail (gesendet_am)" }
        created_at: { type: string, format: date-time }
        archiviert_am: { type: [string, "null"], format: date-time }
    SupportVorgangArt:
      type: string
      enum: [neue_gemeinde, frage, fehler, wunsch, zugang, lizenz, datenschutz, sonstiges]
      description: "Neue Gemeinde, Frage zur Bedienung, Fehler melden, Wunsch oder Idee, Zugang und Konten, Lizenz und Abrechnung, Datenschutz, Sonstiges"
    SupportVorgangBereich:
      type: [string, "null"]
      enum: [konfis, termine, punkte, challenges, chat, badges, material, konten, einstellungen, sonstiges, null]
      description: "Konfis, Termine, Punkte und Antraege, Challenges, Chat, Badges, Material, Konten und Einladungen, Einstellungen, Sonstiges; Pflicht nur im Formular bei Frage, Fehler und Wunsch"
    SupportVorgang:
      description: >
        Das Detail eines Vorgangs (GET, PATCH, POST .../archivieren und
        .../wiederherstellen, POST /vorgaenge): alle Felder der Liste, dazu die Felder unten.
      allOf:
        - { $ref: "#/components/schemas/SupportVorgangListe" }
        - type: object
          properties:
            status_seit: { type: string, format: date-time, description: "laeuft neu, wenn sich der Status aendert" }
            updated_at: { type: string, format: date-time, description: "jede Aenderung, jede Mail; Grundlage der Aufbewahrung" }
            notiz: { type: [string, "null"], description: "intern, nur Support; bei einem Anfrage-Vorgang dieselbe wie die der Anfrage" }
            beschreibung: { type: [string, "null"], description: "Text aus dem Formular; bei einem Anfrage-Vorgang die Nachricht der Anfrage" }
            kontakt_name: { type: [string, "null"], description: "aus dem Support-Formular" }
            kontakt_email: { type: [string, "null"], description: "aus dem Support-Formular; dorthin geht die Antwort" }
            kontakt_funktion: { type: [string, "null"], description: "aus dem Support-Formular" }
            gemeinde_angabe: { type: [string, "null"], description: "Gemeindename, wie die Person ihn im Support-Formular eintrug" }
            einwilligung_am: { type: [string, "null"], format: date-time }
            erstellt_von: { type: [integer, "null"], description: "das Support-Konto, das ihn anlegte; faellt mit dem Konto weg" }
            erstellt_von_name: { type: [string, "null"] }
            verlauf: { type: array, items: { $ref: "#/components/schemas/MailNachricht" }, description: "alle Mails des Vorgangs, aelteste zuerst" }
            anfrage: { oneOf: [{ $ref: "#/components/schemas/GemeindeAnfrage" }, { type: "null" }], description: "die Anfrage mit allen Feldern, bei Art neue_gemeinde" }
            gemeinde:
              type: [object, "null"]
              description: "die Gemeinde, sobald bekannt (auch eine interne)"
              properties:
                id: { type: integer }
                name: { type: string, description: "Systemname" }
                display_name: { type: string }
                is_active: { type: boolean }
                is_trial: { type: boolean }
                trial_ends_at: { type: [string, "null"], format: date-time }
                max_konfis: { type: [integer, "null"] }
                konfi_count: { type: integer, description: "Konfis, die auf das Konfi-Limit zaehlen -- wie GET /api/support/gemeinden" }
                intern: { type: boolean }
                kirchenkreis_id: { type: [integer, "null"] }
                kirchenkreis: { type: [string, "null"] }
                landeskirche_id: { type: [integer, "null"] }
                landeskirche: { type: [string, "null"] }
                wunsch_lizenz: { type: [string, "null"] }
            leitung:
              type: array
              description: "Gemeindeleitung der Gemeinde (Rolle org_admin dort, beide Quellen der Zugehoerigkeit, auch gesperrte); leer ohne Gemeinde"
              items:
                type: object
                properties:
                  id: { type: integer }
                  display_name: { type: string }
                  username: { type: string }
                  email: { type: [string, "null"] }
                  is_active: { type: boolean }
                  last_login_at: { type: [string, "null"], format: date-time }
            empfaenger:
              type: array
              description: >
                Adressen, an die eine Antwort gehen darf (zusaetzlich zum Vertrag), in Rangfolge: Absender
                eingehender Mails des Vorgangs (zuletzt geschrieben zuerst), Kontaktadresse aus dem Formular,
                Adresse der Anfrage, dann Leitung und Absender der Gemeinde wie GET /gemeinden/{id}/empfaenger.
                Jede Adresse einmal, klein geschrieben. Ohne `an` geht die Antwort an die erste.
              items:
                type: object
                properties:
                  adresse: { type: string }
                  name: { type: [string, "null"] }
                  herkunft: { type: string, enum: [absender, kontakt, anfrage, leitung, verlauf] }
    SupportUebersicht:
      type: object
      description: "GET /api/support/uebersicht -- das Dashboard der Support-Ansicht. Interne Gemeinden (organizations.intern) zaehlen nirgends mit."
      properties:
        kennzahlen:
          type: object
          properties:
            gemeinden:
              type: object
              description: "gesperrte Gemeinden (is_active false) stehen nur unter gesperrt; die uebrigen sind testphase, lizenz oder unbegrenzt, sodass gesamt = testphase + lizenz + unbegrenzt + gesperrt"
              properties:
                gesamt: { type: integer }
                testphase: { type: integer, description: "nicht gesperrt, trial_ends_at gesetzt, is_trial true" }
                lizenz: { type: integer, description: "nicht gesperrt, trial_ends_at gesetzt, is_trial false (Lizenz mit Ablaufdatum)" }
                unbegrenzt: { type: integer, description: "nicht gesperrt, trial_ends_at NULL" }
                gesperrt: { type: integer }
            konten:
              type: object
              description: "Konten je Rolle in den Gemeinden: die Rolle gilt je Gemeinde, ueber beide Quellen der Zugehoerigkeit (users.organization_id und user_organizations); ein Konto zaehlt je Rolle hoechstens einmal -- Teamer:in in zwei Gemeinden einmal, Leitung in einer und Teamer:in in einer anderen je einmal. Gesperrte und geloeschte Konten und Support-Konten ohne Gemeinde zaehlen nicht (wie /support/statistik); ein Konto zaehlt, sobald es in mindestens einer nicht internen Gemeinde Mitglied ist."
              properties:
                konfi: { type: integer }
                teamer: { type: integer }
                admin: { type: integer }
                org_admin: { type: integer }
            aktiv_30_tage: { type: integer, description: "Konten mit Anmeldung oder erneuerter Anmeldung in den letzten 30 Tagen, ueber alle Gemeinden je Konto einmal (die Statistik je Gemeinde zaehlt ein Konto in jeder seiner Gemeinden)" }
            anfragen_offen: { type: integer, description: "Anfragen mit Status neu oder in_arbeit" }
            mails_ungelesen: { type: integer, description: "alle eingehenden Mails mit gelesen_am NULL, auch zugeordnete und solche zu internen Gemeinden" }
        entwicklung:
          type: object
          description: "die letzten 12 Kalendermonate in Berliner Zeit, der laufende eingeschlossen, aeltester zuerst, lueckenlos mit 0"
          properties:
            monate: { type: array, items: { type: string, pattern: '^\d{4}-\d{2}$' }, description: "z. B. ['2025-11', ..., '2026-10']" }
            gemeinden_neu: { $ref: "#/components/schemas/SupportReiheMonate" }
            konten_neu:
              type: object
              description: "users.created_at je Monat; jedes Konto genau einmal: team, sobald es in irgendeiner Gemeinde Teamer:in, Admin oder Gemeindeleitung ist, sonst konfi"
              properties:
                konfi: { $ref: "#/components/schemas/SupportReiheMonate" }
                team: { $ref: "#/components/schemas/SupportReiheMonate" }
            konten_gesamt:
              allOf:
                - { $ref: "#/components/schemas/SupportReiheMonate" }
              description: "heute vorhandene Konten (Mitglied einer nicht internen Gemeinde, nicht gesperrt oder geloescht) mit created_at bis zum Monatsende, kumuliert"
            anfragen_neu: { $ref: "#/components/schemas/SupportReiheMonate" }
        aktivitaet:
          type: object
          description: "die letzten 12 ISO-Wochen (Montag bis Sonntag) in Berliner Zeit, die laufende eingeschlossen, aelteste zuerst, lueckenlos mit 0; Gemeinde ueber organization_id der Zeile, interne ausgenommen"
          properties:
            wochen: { type: array, items: { type: string, pattern: '^\d{4}-W\d{2}$' }, description: "ISO-Jahr und -Woche, z. B. ['2026-W29', ..., '2026-W40']; die Woche vom 29.12.2025 ist 2026-W01" }
            antraege:
              allOf:
                - { $ref: "#/components/schemas/SupportReiheWochen" }
              description: "activity_requests (Antraege der Konfis auf Punkte fuer eine Aktivitaet), Zeitpunkt created_at, Gemeinde activity_requests.organization_id"
            buchungen:
              allOf:
                - { $ref: "#/components/schemas/SupportReiheWochen" }
              description: "event_bookings (Anmeldungen zu Terminen), Zeitpunkt booking_date, alle Status, auch die automatischen Buchungen bei Pflichtterminen, Gemeinde event_bookings.organization_id"
            nachrichten:
              allOf:
                - { $ref: "#/components/schemas/SupportReiheWochen" }
              description: "chat_messages (Chat-Nachrichten, auch Umfragen, auch spaeter geloeschte), Zeitpunkt created_at, Gemeinde chat_rooms.organization_id des Raums"
        neueste_anfragen:
          type: array
          description: "die 5 neuesten Anfragen aller Status, nach created_at absteigend, bei gleichem Zeitpunkt die mit der groesseren Kennung"
          items:
            type: object
            properties:
              id: { type: integer }
              gemeinde: { type: string }
              kontakt_name: { type: string }
              status: { type: string, enum: [neu, in_arbeit, angelegt, abgelehnt] }
              wunsch_lizenz: { type: [string, "null"], enum: [klein, standard, plus, gross, verbund, null] }
              created_at: { type: string, format: date-time }
              ungelesen: { type: integer, description: "ungelesene eingehende Mails zu dieser Anfrage, wie in GET /api/support/anfragen" }
        neueste_mails:
          type: array
          description: "die 5 neuesten EINGEHENDEN Mails, zugeordnet oder nicht, nach gesendet_am absteigend; nicht nach intern gefiltert"
          items:
            type: object
            properties:
              id: { type: integer }
              postfach: { type: string, enum: [moin, support] }
              von_name: { type: [string, "null"] }
              von_adresse: { type: [string, "null"] }
              betreff: { type: string }
              gesendet_am: { type: string, format: date-time }
              gelesen_am: { type: [string, "null"], format: date-time }
              anfrage_id: { type: [integer, "null"] }
              organization_id: { type: [integer, "null"] }
              gemeinde_name: { type: [string, "null"], description: "wie in GET /api/support/mail/eingang" }
        testphase_endet:
          type: array
          description: "laufende Testphasen (is_trial true) nicht gesperrter, nicht interner Gemeinden, die in den naechsten 14 Tagen enden (nach jetzt, bis jetzt + 14 Tage einschliesslich), fruehestes Ende zuerst; Lizenzen mit Ablaufdatum stehen hier nicht"
          items:
            type: object
            properties:
              id: { type: integer }
              display_name: { type: string, description: "Anzeigename, sonst Systemname" }
              trial_ends_at: { type: string, format: date-time }
    SupportGemeinde:
      type: object
      description: "Eine Gemeinde in GET /api/support/gemeinden (nicht intern)."
      properties:
        id: { type: integer }
        name: { type: string, description: "organizations.name (Systemname)" }
        display_name: { type: string, description: "Anzeigename; ist keiner gesetzt, der Name" }
        is_active: { type: boolean, description: "false = gesperrt" }
        is_trial: { type: boolean }
        trial_ends_at: { type: [string, "null"], format: date-time, description: "null = unbegrenzt" }
        max_konfis: { type: [integer, "null"] }
        konfi_count: { type: integer, description: "Konfis, die auf das Konfi-Limit zaehlen (Rolle konfi, Stamm-Gemeinde, nicht geloescht -- wie utils/konfiLimit.js), auch gesperrte" }
        team_count: { type: integer, description: "aktive Konten mit der Rolle Teamer:in, Admin oder Gemeindeleitung in dieser Gemeinde, beide Quellen der Zugehoerigkeit (wie /support/statistik: konten.teamer + admin + org_admin)" }
        created_at: { type: string, format: date-time }
        kirchenkreis_id: { type: [integer, "null"] }
        kirchenkreis: { type: [string, "null"], description: "aus der Zuordnung (kirchenkreis_id), nicht aus dem Freitext" }
        landeskirche_id: { type: [integer, "null"] }
        landeskirche: { type: [string, "null"] }
        wunsch_lizenz: { type: [string, "null"], enum: [klein, standard, plus, gross, verbund, null], description: "aus der neuesten Anfrage, aus der die Gemeinde entstanden ist (wie GET /api/organizations/{id}); sonst null" }
        leitung:
          type: array
          description: "Gemeindeleitung: Konten mit der Rolle org_admin in DIESER Gemeinde, beide Quellen der Zugehoerigkeit (users.organization_id und user_organizations); gesperrte stehen drin (is_active), geloeschte und Support-Konten ohne Gemeinde nicht; nach Anzeigename. Ein Super-Admin-Konto mit Gemeinde steht dort, wo es org_admin ist, wie jedes Konto."
          items:
            type: object
            properties:
              id: { type: integer }
              display_name: { type: string }
              username: { type: string }
              email: { type: [string, "null"] }
              is_active: { type: boolean }
              last_login_at: { type: [string, "null"], format: date-time }
  responses:
    Unauthorized:
      description: Kein/ungueltiges/abgelaufenes Token, inaktiver Account oder inaktive Organisation
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Rolle nicht erlaubt oder kein Zugriff auf das Objekt
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Objekt nicht gefunden (in der aktiven Organisation)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ServerError:
      description: Datenbank-/Serverfehler
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

paths:
  # ==========================================================================
  # AUTH (backend/routes/auth.js — 19 Routen, Mount /api/auth)
  # ==========================================================================
  /api/auth/login:
    post:
      tags: ["Anmeldung & Konto"]
      summary: Login für alle Rollen (case-insensitiver Username)
      description: >
        KONTOSPERRE seit 27.09.2026 (Audit Sicherheit BF-04, HOCH): Nach 10
        falschen Passwoertern (401) innerhalb einer Stunde nimmt das Konto
        keine Anmeldung mehr an -- auch nicht mit dem richtigen Passwort
        (429, error_code account_locked). Gezaehlt wird je Konto, nicht je
        IP: Schluessel ist SHA-256 ueber LOWER(username), gerechnet von
        Postgres (dieselbe Funktion wie die Kontosuche); unbekannte
        Benutzernamen werden genauso gezaehlt, die Sperre verraet also
        nicht, ob es ein Konto gibt. Der Zaehler liegt in
        rate_limit_zaehler (Migration 167) und gilt ueber alle Replicas.
        Festes Fenster ab dem ersten Fehlversuch; weitere Versuche
        verlaengern es nicht. Eine erfolgreiche Anmeldung setzt den Zaehler
        auf 0; jedes neu gesetzte Passwort und jedes neu angelegte Konto
        ebenso (POST /auth/change-password, /auth/reset-password,
        /auth/register-konfi, POST und PUT /users, PUT
        /users/{id}/reset-password, POST /admin/konfis und
        /admin/konfis/{id}/regenerate-password, POST /organizations und
        /organizations/{id}/admins). Leere Felder (400), deaktivierte oder
        geloeschte Konten (403) und Serverfehler zaehlen nicht. Keine
        RateLimit-Kopfzeilen fuer die Kontosperre (sie verrieten, wie oft
        ein Konto durchprobiert wurde), nur Retry-After. Die IP-Grenze
        (authLimiter) bleibt davor bestehen. Antwortform wie beim
        authLimiter: { error } mit Status 429, zusaetzlich error_code.


        GERAETEBINDUNG seit 28.09.2026 (Audit Sicherheit BF-08, Migration
        171): Schickt die App device_id mit, wird das Refresh-Token an diese
        Kennung gebunden (refresh_tokens.device_id) und gilt beim Refresh nur
        mit derselben (siehe POST /api/auth/refresh). Ohne device_id -- die
        Store-Apps 2.2.x und 2.3.0 senden sie hier nie -- bleibt es
        ungebunden wie bisher. Antwortform unveraendert.


        OBERGRENZE seit 01.10.2026 (backend/utils/refreshTokenGrenze.js,
        Migration 186): Nach jeder Ausgabe eines Refresh-Tokens -- hier, bei
        POST /api/auth/register-konfi, /api/auth/refresh und
        /api/auth/change-password -- bleiben je Konto hoechstens die ZEHN
        juengsten offenen Refresh-Tokens; aeltere werden beendet
        (revoked_at + expires_at = NOW(), wie beim Logout: keine Gnadenfrist,
        kein Diebstahl-Signal). Mit device_id endet zusaetzlich jedes andere
        offene Token desselben Kontos auf DEMSELBEN Geraet. Ein beendetes
        Token bekommt beim Refresh ein schlichtes 401; die App (auch 2.2.x und
        2.3.0) leert die Sitzung und zeigt die Anmeldeseite mit "Sitzung
        abgelaufen". Antwortform unveraendert. Gemessen 01.10.2026: 1.281
        offene Tokens auf 133 Konten, das groesste mit 208; echte Konten
        hatten hoechstens fuenf Tokens aus den letzten sieben Tagen.


        KONTO OHNE GEMEINDE seit 03.10.2026 (Simon; docs/planung/web-version.md,
        Punkt 12 und 13): Ein Support-Konto (users.organization_id NULL,
        Systemrolle super_admin, Merkmal is_super_admin) meldet sich nur an,
        wenn die Anfrage kann_ohne_gemeinde: true traegt -- das schickt allein
        die Web-Version, die Apps auf iPhone und Android nie. Ohne die Zusage
        403 mit error_code user_inactive und grund konto_ohne_gemeinde (siehe
        unten). Die Store-App 2.3.0 zeigt den Text; 1.5.3 bis 2.2.x zeigen bei
        jeder Ablehnung "Keine Verbindung zum Server" (Fehler ihrer
        Anmeldeseite) und sind trotzdem abgewiesen. Mit der Zusage: 200, im
        User-Objekt organization null, role_name super_admin, is_super_admin
        true. Fuer Konten mit Gemeinde aendert das Feld nichts. Bedienkomfort,
        keine Sicherheitsgrenze -- die Rechte haelt verifyTokenRBAC.
        Tests: backend/tests/routes/kontoOhneGemeindeAnmeldung.test.js.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
                device_id: { type: string, maxLength: 255, description: "Optional (seit 28.09.2026): Geraete-Kennung (iOS identifierForVendor, Android ANDROID_ID, im Browser eine einmal erzeugte Kennung). Bindet das Refresh-Token an das Geraet. Kein Text, leer oder laenger als 255 Zeichen zaehlt wie keine Angabe." }
                kann_ohne_gemeinde: { type: boolean, description: "Optional (seit 03.10.2026): Zusage der Web-Version, dass hier ein Konto ohne Gemeinde arbeiten darf. Nur das boolesche true zaehlt. Die Apps schicken es nie. Ohne das Feld weist der Server ein Konto ohne Gemeinde mit 403 grund konto_ohne_gemeinde ab; fuer alle anderen Konten ohne Wirkung." }
      responses:
        "200":
          description: "JWT (15 Min) + Refresh-Token (90 Tage, SHA-256-gehasht gespeichert) + User-Objekt (bei Konfi inkl. jahrgang und Punkten; bei `admin` seit 27.08.2026 zusaetzlich assigned_jahrgaenge[] fuer die Warnung beim Jahrgangswechsel)"
        "401": { description: "Ungueltige Anmeldedaten (User unbekannt oder Passwort falsch — gleiche Meldung)" }
        "403":
          description: "User deaktiviert ODER soft-geloescht (deleted_at; beides user_inactive, identische Antwort), Org gesperrt (org_inactive) oder Trial abgelaufen (org_trial_expired); super_admin (Rolle oder Merkmal) von Org- und Trial-Sperre ausgenommen, seit 03.10.2026 nicht mehr von der Deaktivierung, nie von der Loeschung. Seit 03.10.2026 auch: Konto ohne Gemeinde ohne kann_ohne_gemeinde (error_code user_inactive, grund konto_ohne_gemeinde, Text 'Dieses Konto gehört zu keiner Gemeinde und ist für die Support-Ansicht im Browser bestimmt. Bitte melde dich auf konfi-quest.de an.')"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  error_code: { type: string, enum: [user_inactive, org_inactive, org_trial_expired] }
                  grund: { type: string, enum: [konto_ohne_gemeinde], description: "Nur wenn ein Konto ohne Gemeinde nicht aus der Web-Version kommt (seit 03.10.2026, additiv)" }
        "429":
          description: >
            Zwei Quellen, gleiche Form { error } (Vertrag mit den Apps; die
            Store-Apps 2.2.x zeigen wegen eines Fehlers der Anmeldeseite bei
            jeder Ablehnung "Keine Verbindung zum Server", ab 2.3.0 steht
            dort der Text aus error): authLimiter -- 300 Fehlversuche/15min pro
            Client-IP (Zähler seit 26.09.2026 replica-übergreifend in der
            Datenbank, Betrieb BF-09), Meldung "Zu viele Login-Versuche.
            Bitte warte 15 Minuten." -- oder die Kontosperre (seit
            27.09.2026): 10 falsche Passwörter je Stunde und Konto, Meldung
            "Zu viele falsche Anmeldeversuche für dieses Konto. Versuche es
            in einer Stunde wieder oder bitte die Leitung deiner Gemeinde um
            ein neues Passwort." mit error_code account_locked und
            Retry-After. Der Text ist fest und nennt keinen Namen.
          headers:
            Retry-After:
              schema: { type: integer }
              description: "Nur bei der Kontosperre: Sekunden bis zum Ende des Fensters (höchstens 3600)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  error_code: { type: string, enum: [account_locked], description: "Nur bei der Kontosperre" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: [authLimiter, validateLogin, kontoSperre]
        org-scope: false
        objekt-pruefung: "Org-Aktiv- und Trial-Prüfung im Handler; super_admin (Rolle oder Flag) umgeht beide; is_active = false und deleted_at IS NOT NULL -> 403 user_inactive fuer jede Rolle"
        hinweis: "Offene Route; setzt last_login_at; setzt nach Erfolg den Zaehler der Kontosperre zurueck"
        # BEHOBEN 03.10.2026 (Pruefung "Konto ohne Gemeinde"): Ein
        # gesperrtes Super-Admin-Konto (is_active = false) bekam hier 200
        # samt Tokens -- die Pruefung lag im Block, der fuer Super-Admins
        # ganz entfiel; verifyTokenRBAC wies danach jede Anfrage mit 401 ab.
        # Jetzt 403 user_inactive wie bei jedem Konto; die Gemeinde-Sperre
        # entfaellt fuer Super-Admins weiter. Gilt ebenso beim Refresh.
        # Tests: backend/tests/routes/superAdminKontoGesperrt.test.js.
        # BEHOBEN 27.09.2026 (Audit Sicherheit BF-04, HOCH): Kontosperre je
        # Konto. Vorher zaehlte nur der authLimiter je IP (1 200 Versuche je
        # Stunde und Adresse); die Einmalpasswoerter (30 772 Bibelstellen,
        # 14,9 Bit) waren damit in 25,6 h je IP, mit 10 IPs in 2,6 h
        # durchprobiert. Jetzt hoechstens 240 Versuche am Tag je Konto, egal
        # von wie vielen Adressen: 128,2 Tage fuer den ganzen Raum, 64,1 im
        # Mittel. Das Passwortformat bleibt (Entscheidung Simon, 27.09.2026).
        # Tests: backend/tests/routes/anmeldesperreJeKonto.test.js.
        # BEHOBEN 26.09.2026 (Audit Sicherheit BF-07): Login, Refresh und
        # verifyTokenRBAC pruefen deleted_at. Vorher konnte sich ein Konfi, den
        # der Auto-Loeschlauf 60 Tage nach der Konfirmation ausgeblendet hatte,
        # bis zur harten Loeschung (Tag 120) weiter anmelden, chatten und
        # buchen -- unsichtbar fuer die Leitung (reproduziert: Login 200,
        # GET /chat/rooms 200). Antwort bewusst identisch mit "deaktiviert".

  /api/auth/change-password:
    post:
      tags: ["Anmeldung & Konto"]
      summary: Eigenes Passwort ändern (mit aktuellem Passwort)
      description: >
        NEU 27.09.2026 (Bericht "Wer bekommt was", BF-20; Simons
        Entscheidung F-12: "Ja, fuer Konten mit E-Mail"): Nach der Antwort
        geht eine Bestaetigung "Passwort geändert" an die hinterlegte Adresse
        (utils/passwortGeaendertMail.js). Die Vorlage
        emailService.sendPasswordChangedEmail gab es, sie wurde bis dahin
        nirgends gerufen. Ohne Adresse keine Mail; das Passwort steht nie
        darin; ein Versandfehler aendert nichts an Antwort und Passwort. Die
        Antwortform ist unveraendert.


        SEIT 27.09.2026 (Audit Sicherheit BF-04): Das neue Passwort hebt
        eine Kontosperre nach Fehlversuchen auf (siehe POST
        /api/auth/login). Antwortform unveraendert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, description: "Policy: min 8, Gross/Klein/Zahl/Sonderzeichen, keine Leerzeichen" }
                device_id: { type: string, description: "Optional: Geraet der aktuellen Sitzung — sein Push-Token wird beim Aufraeumen verschont. Bindet das neue Refresh-Token bewusst NICHT an das Geraet: Auch die Store-Apps 2.2.x/2.3.0 schicken das Feld hier mit, beim Refresh aber nie -- ein gebundenes Token sperrte sie aus. Die aktualisierte App bindet es beim ersten Refresh (siehe POST /api/auth/refresh)." }
                platform: { type: string, description: "Optional, zusammen mit device_id (ios/android/web)" }
      responses:
        "200": { description: "Passwort geaendert" }
        "400": { description: "Aktuelles Passwort falsch / Policy verletzt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC, validateChangePassword]
        org-scope: false
        objekt-pruefung: "Nur eigener Account (userId aus Token)"
        # BEHOBEN 22.08.2026 (war N2): setzt token_invalidated_at und
        # revoziert alle offenen Refresh-Tokens. Die Antwort enthält ein
        # frisches Token-Paar für die aufrufende Sitzung, damit der eigene
        # Client nicht mitfliegt.
        # BEHOBEN 01.09.2026 (Rest von N2): Push-Tokens der beendeten
        # Sitzungen werden mitgeloescht — vorher bekam ein ausgesperrtes
        # Geraet weiter Push-Nachrichten (Versand haengt nur an user_id).
        # Mit device_id+platform bleibt das eigene Geraet verschont; ohne
        # (alte Apps) fallen alle Tokens des Users und das eigene Geraet
        # registriert sich beim naechsten App-Start neu.

  /api/auth/delete-account:
    post:
      tags: ["Anmeldung & Konto"]
      summary: Eigenen Account sofort und kaskadierend löschen (alle Rollen)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, description: "Bestaetigung mit aktuellem Passwort" }
      responses:
        "200": { description: "{ message: 'Account erfolgreich gelöscht' } -- Account geloescht (Hard-Delete in einer Transaktion, Rechte-Cache geleert -- seit 26.09.2026, BF-10 --, Sockets getrennt). Mit dem Konto gehen auch die Leitungs-Mitteilungen UEBER die Person (loescheMitteilungenUeberPerson; BEHOBEN 27.09.2026, Audit 'Wer bekommt was' BF-13 / F-07). Seit 28.09.2026 ueber utils/kontoLoeschen.js, dieselbe Funktion wie DELETE /admin/konfis/{id} (Regel und Umfang dort): alles der Person in ALLEN Gemeinden, Zweiergespraeche ganz, Zaehler der Anmeldesperre, Dateien nach dem COMMIT; was sie fuer eine Gemeinde angelegt hat, bleibt ohne Verweis. Antwortform unveraendert" }
        "400": { description: "Passwort fehlt oder falsch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: "Letzte Person der Gemeindeleitung in ihrer Gemeinde (seit 26.08.2026) -- ODER (seit 03.10.2026) das letzte aktive Super-Admin-Konto (Rolle oder Merkmal, mit oder ohne Gemeinde): 'Das letzte aktive Super-Admin-Konto lässt sich nicht löschen. Lege zuerst ein weiteres an.' (utils/superAdminKonten.js)" }
        "500": { description: "BEHOBEN 28.09.2026: Hatte die Person Antraege in einer WEITEREN Gemeinde, scheiterte die Loeschung am Fremdschluessel activity_requests_konfi_id_fkey (die alte Kaskade raeumte nur die Stamm-Gemeinde ab) -- eine eingeladene Teamer:in konnte ihr Konto nicht loeschen" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Nur eigener Account; Passwort-Bestaetigung im Handler"
        hinweis: "UEBERHOLT seit 26.08.2026: Die letzte Person mit Org-Leitung in ihrer Gemeinde bekommt 409, wie in DELETE /users/:id. Vorher stand hier: Auch org_admin kann sich selbst löschen — der Letzter-org_admin-Schutz greift nur in DELETE /users/:id, nicht hier"

  /api/auth/update-email:
    post:
      tags: ["Anmeldung & Konto"]
      summary: Eigene E-Mail-Adresse setzen/entfernen (optional, ohne Verifikation)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: [string, "null"], format: email }
      responses:
        "200": { description: "E-Mail aktualisiert" }
        "400": { description: "Ungueltige E-Mail" }
        "409": { description: "E-Mail bereits verwendet" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC, validateUpdateEmail]
        org-scope: false
        objekt-pruefung: "Nur eigener Account"
        # HINWEIS (N8, bewusst so belassen): keine Besitz-Verifikation der
        # E-Mail. Der 409 verraet eingeloggten Usern, dass eine Adresse
        # vergeben ist — hier ueberwiegt die Bedienbarkeit: ohne die Meldung
        # bliebe unklar, warum die Änderung nicht greift. Anders als bei
        # request-password-reset, wo der Aufrufer NICHT angemeldet ist.

  /api/auth/update-role-title:
    post:
      tags: ["Anmeldung & Konto"]
      summary: Eigene Funktionsbeschreibung (role_title) setzen
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                role_title: { type: [string, "null"] }
      responses:
        "200": { description: "Aktualisiert" }
        "403": { description: "Konfis duerfen keinen Titel setzen" }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, super_admin]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Inline-Check: role_name !== 'konfi'"

  /api/auth/me:
    get:
      tags: ["Anmeldung & Konto"]
      summary: Eigenes Profil (inkl. is_super_admin-Flag, Trial-Status der Org)
      description: >
        NEU 27.08.2026: assigned_jahrgaenge kommt mit — die eigenen
        Jahrgangs-Zuweisungen (id, name, can_view, can_edit), ohne zusaetzliche
        Abfrage (rbacVerifier laedt sie ohnehin). Wofuer: Ein `admin` sieht nur
        Konfis seiner zugewiesenen Jahrgaenge; verschiebt er eine Konfi in
        einen fremden Jahrgang, verschwindet sie aus seiner Liste. Die
        Oberflaeche warnt davor, bevor gespeichert wird. Ohne Zuweisung ein
        leeres Array, nie undefined.

        BEHOBEN 26.09.2026: role_name und role_display_name galten fuer die
        STAMM-Gemeinde (die Abfrage las u.role_id), nicht fuer die aktive.
        Wer ueber user_organizations in einer zweiten Gemeinde eine andere
        Rolle hat, bekam hier trotzdem die Rolle vom Konto gemeldet --
        rbacVerifier hatte sie fuer die aktive Gemeinde laengst aufgeloest,
        diese Route ignorierte das Ergebnis. Ein ANZEIGEFEHLER, keine
        Rechteausweitung: Die Rechte haengen an req.user.role_name
        (requireRole/requireAdmin/requireOrgAdmin lesen genau das) und waren
        korrekt. Die App richtet ihre Oberflaeche aber nach dieser Antwort und
        zeigte in der Zweitgemeinde eine Leitungsansicht, deren Knoepfe der
        Server mit 403 abwies. Antwortform unveraendert.
      responses:
        "200": { description: "id, username, display_name, email, role_title, role_name, is_super_admin, trial_ends_at, is_trial, assigned_jahrgaenge[]" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Nur eigene Daten; role_name/role_display_name gelten fuer die AKTIVE Organisation"

  /api/einladungen:
    post:
      tags: ["Benutzer & Rollen"]
      summary: Eine bestehende Person in die eigene Gemeinde einladen
      description: >
        NEU 26.09.2026 (Simon: "ORG Admin kann bestehenden anderen User
        hinzufuegen, der bekommt Einladung und bestaetigt. Schon ist der
        switcher da."). Gesucht wird EXAKT nach Benutzername oder E-Mail --
        keine Teilsuche, sonst liesse sich der Bestand fremder Gemeinden
        durchblaettern. Die Einladung gilt 14 Tage.

        DIE MITGLIEDSCHAFT ENTSTEHT NICHT HIER, sondern erst mit der Annahme:
        Eine Zugehoerigkeit aendert, was jemand sieht und darf, und wird
        deshalb nicht ueber den Kopf der Person hinweg angelegt.

        KONFI IST AUSGESCHLOSSEN -- und zwar zusaetzlich zur Rollenhierarchie:
        canCreateRole('org_admin', 'konfi') liefert TRUE, die Hierarchie allein
        wuerde es durchlassen. Konfis gehoeren zu einem Jahrgang und kommen
        ueber invite_codes.

        AUCH ALS ZIEL (BEHOBEN 26.09.2026, Audit Sicherheit BF-03): Ist die
        gefundene Person ein Konfi (Stammrolle), antwortet die Route mit
        demselben 404 wie bei einer unbekannten Kennung -- ohne Name, ohne
        Einladung, ohne Push und Mail. Vorher liess sich ein Konfi einer
        fremden Gemeinde als Teamer:in einladen, und die Route bestaetigte zu
        jeder E-Mail-Adresse im System, ob ein Konto existiert (Enumeration,
        auch von Kindern). Team-Konten bleiben exakt auffindbar; ihre
        Einladung erscheint ohnehin in der Liste.

        KONFI IRGENDWO REICHT (BEHOBEN 28.09.2026, Simon: "Konfi und Team
        geht nicht parallel"; utils/konfiOderTeam.js): Vorher zaehlte nur
        die Stammrolle. Ein Konto, das zuhause Team und ueber
        user_organizations in einer anderen Gemeinde Konfi ist (Altbestand),
        liess sich so in eine weitere Gemeinde einladen. Jetzt dieselbe 404
        nicht_gefunden wie bei einem Konfi. Test
        tests/routes/konfiOderTeam.test.js.

        Meldung an die eingeladene Person ueber Postfach, Push (Gruppe
        "Anfragen und Freigaben") und E-Mail, nach der Antwort (nachAntwort).
        Die Rolle steht darin mit dem festen Wort nach role_name ("Leitung",
        "Gemeindeleitung", "Teamer:in"; utils/rollenNamen.js). BEHOBEN 28.09.2026:
        Vorher stand dort der technische Name ("als admin mitzuarbeiten"),
        weil die Abfrage display_name gar nicht las. Dasselbe Wort nennt die
        Meldung "Einladung angenommen/abgelehnt" an die einladende Person
        (vorher roles.display_name, in bestehenden Gemeinden "Hauptamt").

        ABGELAUFENE EINLADUNG SPERRT NICHT MEHR (BEHOBEN 28.09.2026): Nach 14
        Tagen bleibt der Status 'offen', nur expires_at liegt zurueck; der
        Teilindex idx_org_einladungen_offen kennt nur den Status. Vorher lief
        jede neue Einladung derselben Person in dieselbe Gemeinde deshalb auf
        409 schon_eingeladen, obwohl GET /einladungen und /einladungen/meine
        die alte nicht mehr zeigten. Jetzt loescht die Route in derselben
        Transaktion die abgelaufene offene Einladung genau dieser Person in
        dieser Gemeinde samt Postfach-Eintrag und legt die neue an.
        Beantwortete Einladungen (Verlauf) und die anderer Personen bleiben.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kennung, role_id]
              properties:
                kennung: { type: string, description: "Benutzername ODER E-Mail, exakt (Gross-/Kleinschreibung egal)" }
                role_id: { type: integer, description: "Rolle DIESER Gemeinde; niemals die konfi-Rolle" }
      responses:
        "201": { description: "id, user_id, display_name, username, role_id, role_name, status, expires_at" }
        "400": { description: "Rolle gehoert nicht zu dieser Gemeinde; konfi-Rolle (error_code konfi_nicht_moeglich); Selbst-Einladung" }
        "403": { description: "Nicht org_admin, oder Rolle laut Hierarchie nicht vergebbar" }
        "404": { description: "Kein Konto mit dieser Kennung ODER die Person ist in irgendeiner Gemeinde Konfi -- beides identisch (error_code nicht_gefunden)" }
        "409": { description: "Schon Mitglied (schon_mitglied) oder schon eingeladen (schon_eingeladen; nur bei einer noch gueltigen offenen Einladung)" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, requireOrgAdmin]
        org-scope: true
        objekt-pruefung: "Rolle gegen roles.organization_id der aktiven Org; Mitgliedschaft ueber BEIDE Quellen geprueft; Teilindex laesst nur eine offene Einladung je Person und Gemeinde"

    get:
      tags: ["Benutzer & Rollen"]
      summary: Offene Einladungen der eigenen Gemeinde
      description: >
        Seit dem 27.09.2026 liest die App diese Liste: "Mehr > Benutzer:innen",
        Abschnitt "Offene Einladungen" mit dem Knopf "Zurueckziehen" (DELETE
        /api/einladungen/{id}). Die Seite ruft die Route nur als org_admin --
        dieselbe Bedingung wie beim Einladen; alle anderen bekaemen 403.
        Die App liest id, display_name, username, role_name,
        role_display_name, created_at und expires_at -- diese Felder sind
        damit Vertrag.
      responses:
        "200": { description: "Array offener, nicht abgelaufener Einladungen, neueste zuerst; je Zeile id, organization_id, user_id, role_id, status, expires_at, created_at, organization_display_name, organization_name, role_name, role_display_name, eingeladen_von_name sowie display_name und username der eingeladenen Person" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, requireOrgAdmin]
        org-scope: true
        objekt-pruefung: "Nur die eigene Organisation, nur status='offen' und expires_at > NOW()"

  /api/einladungen/meine:
    get:
      tags: ["Benutzer & Rollen"]
      summary: Die eigenen offenen Einladungen
      responses:
        "200": { description: "Array (Gemeinde, Rolle, wer eingeladen hat, expires_at)" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Nur eigene Einladungen (user_id = req.user.id). BEWUSST org-uebergreifend: Die Einladung kommt aus einer Gemeinde, in der man noch NICHT Mitglied ist."

  /api/einladungen/{id}:
    delete:
      tags: ["Benutzer & Rollen"]
      summary: Offene Einladung zurueckziehen
      description: >
        Setzt status = 'zurueckgezogen' und beantwortet_at = NOW(). Kein
        echtes Loeschen: Die Zeile bleibt als Verlauf stehen, und der
        Teilindex (eine offene Einladung je Person und Gemeinde) gibt den
        Platz fuer eine neue Einladung frei. Nur Einladungen der eigenen
        Gemeinde im Status 'offen' — alles andere ergibt dieselbe 404, ohne
        zu verraten, ob es die Einladung gibt.

        Nachdokumentiert am 26.09.2026 (Audit Dokumentation BF-09): Die Route
        kam mit dem Einladungs-Commit, blieb in der yaml aber aus.


        BEHOBEN 27.09.2026: Bei der eingeladenen Person blieb nach dem
        Zurueckziehen der Postfach-Eintrag "Einladung in eine Gemeinde ...
        Tippe, um zu antworten" (type 'gemeinde_einladung') stehen, zaehlte
        als ungelesen und fuehrte beim Antippen ins Profil, dessen Karte
        (GET /einladungen/meine, Filter status = 'offen') schon leer war.
        Jetzt geht der Eintrag in DERSELBEN Transaktion wie der Statuswechsel
        (utils/postfachAufraeumen.js, loescheMitteilungenZuEinladung ueber
        data.einladung_id); scheitert das, bleibt auch die Einladung offen.
        Nur bei Erfolg -- eine 404 (fremde Gemeinde, schon beantwortet)
        raeumt nichts auf. Die Antwortform ist unveraendert.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: "message ('Einladung zurückgezogen')" }
        "404": { description: "Nicht vorhanden, fremde Gemeinde oder nicht mehr offen — bewusst dieselbe Antwort" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, requireOrgAdmin]
        org-scope: true
        objekt-pruefung: "organization_id = aktive Org UND status = 'offen' im UPDATE selbst; 0 Zeilen -> 404"

  /api/einladungen/{id}/annehmen:
    post:
      tags: ["Benutzer & Rollen"]
      summary: Einladung annehmen -- legt die Mitgliedschaft an
      description: >
        Schreibt in einer Transaktion den Status und die Zeile in
        user_organizations. Danach invalidateUserCache, sonst haelt der
        RBAC-Cache (30 s) die alte Zugehoerigkeit fest und der
        Gemeinde-Umschalter zeigt die neue Gemeinde verspaetet.


        BEHOBEN 27.09.2026 (Bericht "Wer bekommt was", BF-21; Simons
        Entscheidung F-13: "Ja, als Postfach-Eintrag"): Die einladende
        Leitung erfuhr nichts. Jetzt nach der Antwort Push mit
        Postfach-Eintrag (data.type 'gemeinde_einladung_beantwortet',
        status 'angenommen', einladung_id, user_id, organization_id = die
        einladende Gemeinde) an die Person aus eingeladen_von, solange sie
        dort zur Gemeindeleitung gehoert (beide Quellen, aktiv, nicht
        geloescht) -- sonst an die Gemeindeleitung; nie an die eingeladene Person
        selbst. Dazu das Live-Signal 'users' an die Gemeinde (die
        Benutzerliste laedt nach). Die Antwortform ist unveraendert.


        BEHOBEN 28.09.2026: Bei der eingeladenen Person blieb nach der
        Zusage der Postfach-Eintrag "Einladung in eine Gemeinde ... Tippe,
        um zu antworten" (type 'gemeinde_einladung') stehen und zaehlte als
        ungelesen. Er geht jetzt in DERSELBEN Transaktion wie Statuswechsel
        und Mitgliedschaft (loescheMitteilungenZuEinladung, wie beim
        Zurueckziehen). Die Zusage an die Leitung
        ('gemeinde_einladung_beantwortet') bleibt. 404/409/410 raeumen nichts
        auf; einen abgelaufenen Eintrag nimmt das taegliche
        Postfach-Aufraeumen (02:00) mit.


        KONFI UND TEAM NIE ZUGLEICH (BEHOBEN 28.09.2026, Simon: "Konfi und
        Team geht nicht parallel"; utils/konfiOderTeam.js): Die Annahme
        prueft Konto und angebotene Rolle mit dem Stand von JETZT. Vorher
        legte sie die Mitgliedschaft auch an, wenn das Konto inzwischen
        (oder schon vor dem 26.09.2026, Sicherheit BF-03) Konfi war oder die
        Einladung die Konfi-Rolle trug. Dann 409 konfi_und_team; die
        Einladung bleibt offen, nichts wird geschrieben.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "message, organization (id, name, slug, display_name)" }
        "404": { description: "Nicht vorhanden ODER nicht die eigene Einladung -- bewusst dieselbe Antwort, sonst liesse sich durch Durchprobieren erkennen, welche es gibt" }
        "409": { description: "Bereits beantwortet (error_code schon_beantwortet); seit 28.09.2026 auch: das Konto ist irgendwo Konfi oder die angebotene Rolle ist konfi (error_code konfi_und_team)" }
        "410": { description: "Abgelaufen (error_code expired)" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Nur die eingeladene Person selbst; Status offen; expires_at in der Zukunft"

  /api/einladungen/{id}/ablehnen:
    post:
      tags: ["Benutzer & Rollen"]
      summary: Einladung ablehnen
      description: >
        BEHOBEN 27.09.2026 (BF-21 / F-13): Auch die Absage meldet sich bei
        der einladenden Leitung -- Push mit Postfach-Eintrag
        'gemeinde_einladung_beantwortet' (status 'abgelehnt'), Empfaenger
        wie bei annehmen. Kein Live-Signal, die Benutzerliste aendert sich
        nicht. Die Antwortform ist unveraendert.


        BEHOBEN 28.09.2026: Der Postfach-Eintrag 'gemeinde_einladung' der
        eingeladenen Person geht mit der Absage, in einer Transaktion mit
        dem Statuswechsel (wie bei annehmen und beim Zurueckziehen). Die
        Absage an die Leitung bleibt.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "message" }
        "404": { description: "wie bei annehmen" }
        "409": { description: "Bereits beantwortet" }
        "410": { description: "Abgelaufen" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "wie bei annehmen"

  /api/auth/my-organizations:
