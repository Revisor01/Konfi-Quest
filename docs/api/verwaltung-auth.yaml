        hinweis: "Trial-Ablauf der Ziel-Org wird hier NICHT geprüft (nur is_active); bekannte Claim-Nachwirkung nach Mitgliedschafts-Entzug bis Token-Ablauf"

  /api/auth/request-password-reset:
    post:
      tags: ["Passwörter & Einladungen"]
      summary: Passwort-Reset-Mail anfordern (immer neutrale Antwort)
      description: >
        BEHOBEN 27.09.2026 (Bericht "Wer bekommt was", BF-20): Die Abfrage
        nahm den ERSTEN Treffer zu users.email -- ohne deleted_at und
        is_active. Die E-Mail ist nur je Gemeinde eindeutig (Index
        organization_id, email); trug dieselbe Adresse Konten in mehreren
        Gemeinden, bekam nur eines den Link, und geloeschte oder gesperrte
        Konten bekamen ihn auch. Jetzt: nur Konten mit deleted_at IS NULL
        und is_active nicht false (wie beim Login), und JEDES bekommt einen
        eigenen Token und eine eigene Mail. Bei mehreren Konten nennt die
        Mail Gemeinde (auch im Betreff) und Benutzername; bei einem Konto
        bleibt sie ohne diese Zeilen. Die Mail sagt seit demselben Tag
        "24 Stunden gueltig" (stand faelschlich "1 Stunde"; der Token galt
        immer 24 h).
        Der Versand laeuft seit 27.09.2026 NACH der Antwort (nachAntwort):
        Vorher wartete die Antwort auf den SMTP-Server, ihre Laufzeit
        verriet damit, ob -- und wie viele -- Konten es zur Adresse gibt.
        Die Antwort ist fuer null, ein und mehrere Konten dieselbe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { description: "Neutral: 'Falls ein Konto existiert, wurde eine E-Mail gesendet' -- unveraendert, auch bei mehreren Konten keine Aufzaehlung" }
        "429": { description: "passwordResetLimiter: 5/15min je Client-IP (clientIp) ODER passwordResetEmailLimiter: 3/h je Ziel-E-Mail (normalisiert: trim + lowercase; zaehlt auch fuer unbekannte Adressen, damit der 429 kein Konto verraet); beide Zaehler seit 26.09.2026 replica-uebergreifend in der Datenbank, Betrieb BF-09)" }
        "500": { description: "Datenbankfehler. BEHOBEN: Ein fehlgeschlagener Mail-Versand liefert KEIN 500 mehr (seit 22.08.2026 abgefangen, seit 27.09.2026 nach der Antwort) -- vorher 'Mail-Versand fehlgeschlagen (nur wenn Konto existiert)', was die Neutralitaet schwaechte." }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: [passwordResetLimiter, passwordResetEmailLimiter, validateRequestPasswordReset]
        org-scope: false
        objekt-pruefung: "Token 32 Byte Hex, 24h gueltig"
        # BEHOBEN 26.09.2026 (Audit Sicherheit BF-05, HOCH): passwordResetLimiter
        # zaehlte auf req.ip -- hinter dem Proxy fuer ALLE dieselbe Adresse,
        # also fuenf Reset-Anfragen je Viertelstunde fuer die ganze Plattform
        # (reproduziert: 6x mit verschiedenen X-Real-IP -> 200,200,200,200,200,429).
        # Jetzt ipKeyGenerator(clientIp(req)) wie alle uebrigen IP-Limiter,
        # dazu passwordResetEmailLimiter je Ziel-Adresse.
        hinweis: "BEHOBEN 22.08.2026 (war: BEKANNT: Token wird unhashed in password_resets gespeichert) -- seitdem nur der SHA-256-Hash, eingeloest wird per Klartext-Token aus der Mail"

  /api/auth/invite-code:
    post:
      tags: ["Passwörter & Einladungen"]
      summary: Einladungscode für einen Jahrgang erzeugen (8 Hex-Zeichen, 7 bis 90 Tage gültig)
      description: >
        GUELTIGKEIT WAEHLBAR (28.09.2026, Audit E-08; Simon: "codes laenger
        als 7 Tage ist gut. Mach es flexibel. Aber mit Zwang die ablaufen zu
        lassen."): gueltig_tage 7, 14, 30, 60 oder 90, optional. Ohne das
        Feld (oder mit null) gilt der Code wie bisher 7 Tage — so schicken
        es die Apps im Store (2.2.0, 2.3.0). Jeder andere Wert: 400 "Ein
        Einladungscode gilt 7, 14, 30, 60 oder 90 Tage.", es wird kein Code
        angelegt. Einen Code ohne Ablauf gibt es nicht
        (invite_codes.expires_at NOT NULL; utils/einladungsGueltigkeit.js).
        Antwort additiv um gueltig_tage erweitert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jahrgang_id]
              properties:
                jahrgang_id: { type: integer }
                gueltig_tage: { type: [integer, "null"], enum: [7, 14, 30, 60, 90, null], default: 7, description: "Seit 28.09.2026, optional" }
      responses:
        "201": { description: "invite_code, jahrgang_name, expires_at, gueltig_tage (seit 28.09.2026) — Status ist 200" }
        "400": { description: "gueltig_tage nicht 7, 14, 30, 60 oder 90 — { error }" }
        "403": { description: "Nur die Gemeindeleitung" }
        "404": { description: "Jahrgang nicht in eigener Org" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, validateInviteCode]
        org-scope: true
        objekt-pruefung: "Jahrgang muss zur eigenen Org gehören"
        hinweis: "Inline-Check erlaubt auch is_super_admin-Flag (abweichend von den drei anderen Invite-Routen, die strikt role_name==='org_admin' verlangen)"

  /api/auth/invite-codes:
    get:
      tags: ["Passwörter & Einladungen"]
      summary: Aktive Einladungscodes der eigenen Org (inkl. Nutzungs-Zähler)
      responses:
        "200": { description: "Array mit code, jahrgang, expires_at, used_count" }
        "403": { description: "Nur org_admin (strikt role_name, OHNE Super-Admin-Flag)" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Nur Codes der eigenen Org, nur nicht-abgelaufene"

  /api/auth/invite-codes/{id}/extend:
    post:
      tags: ["Passwörter & Einladungen"]
      summary: Einladungscode verlaengern (um 7 bis 90 Tage, hoechstens bis 90 Tage im Voraus)
      description: >
        VERLAENGERN WAEHLBAR, IMMER MIT ABLAUF (28.09.2026, Audit E-08):
        tage 7, 14, 30, 60 oder 90, optional — ohne Body wie bisher um 7
        Tage (die Apps im Store schicken keinen). Das neue Ablaufdatum ist
        das bisherige plus tage, aber NIE mehr als 90 Tage ab jetzt; was
        darueber hinausginge, wird gekuerzt (begrenzt: true). Bleibt bis zur
        Grenze nicht einmal ein Tag, 400 und das Datum bleibt. Ein Tag sind
        24 Stunden (vorher Kalendertage per setDate — ueber eine
        Zeitumstellung eine Stunde Unterschied). Abgelaufene Codes bleiben
        abgelaufen (400 wie bisher) — der Vorschlag aus E-08, auch
        abgelaufene zu verlaengern, ist nach Simons Entscheidung ("mit Zwang
        die ablaufen zu lassen") bewusst nicht umgesetzt.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID des Einladungs-Codes" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tage: { type: [integer, "null"], enum: [7, 14, 30, 60, 90, null], default: 7, description: "Seit 28.09.2026, optional" }
      responses:
        "200": { description: "{ message, expires_at, begrenzt } — begrenzt (seit 28.09.2026): die 90-Tage-Grenze hat gekuerzt" }
        "400": { description: "Abgelaufene Codes nicht verlaengerbar; tage nicht 7, 14, 30, 60 oder 90; oder der Code gilt schon 90 Tage im Voraus — jeweils { error } auf Deutsch" }
        "403": { description: "Nur org_admin" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Code muss zur eigenen Org gehören"

  /api/auth/invite-codes/{id}:
    delete:
      tags: ["Passwörter & Einladungen"]
      summary: Einladungscode löschen
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID des Einladungs-Codes" }
      responses:
        "200": { description: "Geloescht" }
        "403": { description: "Nur org_admin" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Code muss zur eigenen Org gehören"

  /api/auth/check-username/{username}:
    get:
      tags: ["Passwörter & Einladungen"]
      summary: Username-Verfuegbarkeit prüfen (oeffentlich, case-insensitiv)
      parameters:
        - { name: username, in: path, required: true, schema: { type: string, minLength: 3, pattern: "^[a-zA-Z0-9.-]+$" }, description: "Zu prüfender Benutzername (case-insensitiv)" }
      description: >-
        BEHOBEN 29.09.2026 (N3, Audit Sicherheit BF-18): eigene Grenze
        namensLimiter -- je Client-IP zaehlen nur Treffer ("vergeben"), 30 je
        Viertelstunde, danach 429 fuer jede Pruefung dieser IP. Freie Namen
        zaehlen nicht: Eine Konfi-Gruppe registriert sich gemeinsam aus einem
        Gemeinde-WLAN und prueft bei jedem Tastendruck. Zaehler in
        rate_limit_zaehler (Praefix namenspruefung), ueber alle Replicas. Die
        App faengt den 429 ab (auch 2.2.x) und zeigt dann keinen Hinweis;
        POST /register-konfi prueft den Namen selbst (409).
      responses:
        "200": { description: "{ available: bool, message }" }
        "400": { description: "Zu kurz / ungueltige Zeichen" }
        "429": { description: "Mehr als 30 Treffer je Viertelstunde von dieser IP (seit 29.09.2026)" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: [namensLimiter]
        org-scope: false
        objekt-pruefung: "keine"

  /api/auth/validate-invite/{code}:
    get:
      tags: ["Passwörter & Einladungen"]
      summary: Einladungscode prüfen (oeffentlich) — liefert Jahrgang + Org-Name
      parameters:
        - { name: code, in: path, required: true, schema: { type: string }, description: "Einladungs-Code" }
      responses:
        "200": { description: "{ valid: true, jahrgang_name, organization_name }" }
        "404": { description: "Code existiert nicht (error_code: not_found)" }
        "410": { description: "Code abgelaufen (error_code: expired)" }
        "429": { description: "{ error } -- mehr als 60 unbekannte Codes (404) je Viertelstunde von derselben Adresse (einladungscodeLimiter, seit 29.09.2026)" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: [einladungscodeLimiter]
        org-scope: false
        objekt-pruefung: "Nur Existenz + Ablauf"
        # LÜCKE (N3): kein eigener Rate-Limiter — 8-Hex-Codes (4 Byte) sind
        # theoretisch bruteforcebar; gueltiger Code leakt Org-/Jahrgangsname.
        # BEHOBEN 29.09.2026 (Limiter): einladungscodeLimiter, je Adresse
        # (clientIp), gemeinsamer Store, gezaehlt nur 404 -- gueltige (200)
        # und abgelaufene (410) Codes zaehlen nicht, damit ein abgelaufener
        # Code an der Tafel nicht die ganze Gruppe fuer den neuen sperrt.
        # 60 je Viertelstunde (vorher 2000 je Replica ueber den allgemeinen
        # Flutschutz). Die Codelaenge (32 Bit) bleibt -- Frage an Simon.
        # Tests: backend/tests/routes/oeffentlicheGrenzen.test.js.

  /api/auth/register-konfi:
    post:
      tags: ["Passwörter & Einladungen"]
      summary: Selbst-Registrierung als Konfi mit Einladungscode (inkl. Auto-Login)
      description: >
        GEAENDERT 27.09.2026 (Audit wer-bekommt-was BF-03, F-02, F-03): Die
        Meldung "Neue Registrierung" (Push und Postfach,
        new_konfi_registration) geht an die Leitung des Jahrgangs:
        org_admin (und admin mit is_super_admin-Merkmal) immer, admin mit
        can_view-Zuweisung auf den Jahrgang der Einladung, Teamer:innen nie
        (backend/utils/jahrgangLeitungSicht.js) -- genau wer die neue Konfi
        in GET /api/admin/konfis sieht. Beide Quellen der Zugehoerigkeit,
        Rolle je Gemeinde. Vorher verlangte die Empfaengerliste auch von
        org_admin eine Zuweisung (die Gemeindeleitung fiel heraus, sobald ein
        Admin zugewiesen war), die can_view-Pruefung fehlte, und ohne
        zugewiesenen Admin ging die Meldung als Rueckfall an ALLE Admins der
        Gemeinde. Den Rueckfall gibt es nicht mehr: Ohne zugewiesenen Admin
        bekommt sie die Gemeindeleitung. Antwortform unveraendert.


        SEIT 27.09.2026 (Audit Sicherheit BF-04): Wurde der gewaehlte
        Benutzername vorher durchprobiert, startet das neue Konto trotzdem
        ohne Kontosperre (siehe POST /api/auth/login).


        GERAETEBINDUNG seit 28.09.2026 (Audit Sicherheit BF-08): Mit
        device_id ist das ausgestellte Refresh-Token an das Geraet gebunden,
        ohne bleibt es ungebunden (siehe POST /api/auth/login und
        /api/auth/refresh). Antwortform unveraendert.


        OBERGRENZE seit 01.10.2026: hoechstens zehn offene Refresh-Tokens je
        Konto, eines je Geraet (siehe POST /api/auth/login).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [invite_code, display_name, username, password]
              properties:
                invite_code: { type: string }
                display_name: { type: string }
                username: { type: string, minLength: 3, pattern: "^[a-zA-Z0-9.-]+$" }
                password: { type: string, description: "volle Passwort-Policy" }
                email: { type: string, format: email, description: "optional" }
                device_id: { type: string, maxLength: 255, description: "Optional (seit 28.09.2026): Geraete-Kennung, bindet das Refresh-Token an das Geraet (wie beim Login)" }
      responses:
        "200": { description: "Token + Refresh-Token + Konfi-User; Auto-Enrollment in kuenftige Pflicht-Events des Jahrgangs; Push an die Leitung des Jahrgangs (die Gemeindeleitung immer, Admins mit can_view auf den Jahrgang)" }
        "403": { description: "Konfi-Limit der Org erreicht (limit_exceeded)" }
        "404": { description: "Code existiert nicht" }
        "409": { description: "\"Benutzername bereits vergeben\" -- systemweit, ohne Gross/klein. Seit 30.09.2026 auch bei gleichzeitiger Registrierung: die verbindliche Pruefung steht in der Transaktion unter pg_advisory_xact_lock je Namen (utils/benutzernameSperre.js, dieselbe Sperre wie POST /users, /organizations und /admin/konfis); die Pruefung davor spart nur das Hashen. Vorher kamen zwei gleichzeitige Registrierungen mit \"Anna\"/\"anna\" beide durch (200/200)" }
        "410": { description: "Code abgelaufen" }
        "429": { description: "registerLimiter: 200/h pro IP (Zähler seit 26.09.2026 replica-übergreifend in der Datenbank, Betrieb BF-09)" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: [registerLimiter, validateRegisterKonfi]
        org-scope: false
        objekt-pruefung: "Invite-Code bestimmt Org + Jahrgang; konfi-Rolle wird org-gescopt aufgeloest; Konfi-Limit (max_konfis) hard_block"

  /api/auth/reset-password:
    post:
      tags: ["Passwörter & Einladungen"]
      summary: Passwort mit Reset-Token setzen (oeffentlich)
      description: >
        NEU 27.09.2026 (BF-20; Simons Entscheidung F-12: "Ja, fuer Konten mit
        E-Mail"): Nach der Antwort geht eine Bestaetigung "Passwort geändert"
        an die hinterlegte Adresse des Kontos (utils/passwortGeaendertMail.js,
        emailService.sendPasswordChangedEmail). Ohne Adresse keine Mail; ein
        Versandfehler aendert nichts an Antwort und Passwort.


        SEIT 27.09.2026 (Audit Sicherheit BF-04): Das neue Passwort hebt
        eine Kontosperre nach Fehlversuchen auf (siehe POST
        /api/auth/login). Antwortform unveraendert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword: { type: string, description: "volle Passwort-Policy" }
      responses:
        "200": { description: "Passwort zurueckgesetzt, Token als benutzt markiert (Einmal-Nutzung)" }
        "400": { description: "Token ungueltig/abgelaufen/benutzt oder Policy verletzt" }
        "429": { description: "{ error } -- mehr als 20 ungueltige Tokens je Viertelstunde von derselben Adresse (resetTokenLimiter, seit 29.09.2026)" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: [resetTokenLimiter, validateResetPassword]
        org-scope: false
        objekt-pruefung: "Token-Lookup in password_resets (used_at IS NULL, expires_at > NOW)"
        # BEHOBEN 22.08.2026 (war N2): bestehende Refresh-Tokens werden
        # revoziert und token_invalidated_at gesetzt. Reset-Tokens liegen
        # ausserdem nur noch gehasht in der DB. HINWEIS (war N3): bestehende Refresh-Tokens des Users werden NICHT
        # revoziert; kein eigener Rate-Limiter (Token allerdings 32 Byte Hex).
        # BEHOBEN 01.09.2026 (Rest von N2): alle Push-Tokens des Users werden
        # geloescht — beim Reset ueberlebt keine Sitzung, kein Geraet darf
        # weiter Push-Nachrichten fuer das Konto bekommen. Jedes Geraet
        # registriert sich beim naechsten Login neu.
        # BEHOBEN 29.09.2026 (Rest von N3, Limiter): resetTokenLimiter, je
        # Adresse, gemeinsamer Store, gezaehlt nur "Ungueltiger oder
        # abgelaufener Reset-Token" (nicht die Passwort-Policy), 20 je
        # Viertelstunde. Tests: backend/tests/routes/oeffentlicheGrenzen.test.js.

  /api/auth/refresh:
    post:
      tags: ["Anmeldung & Konto"]
      summary: Access-Token per Refresh-Token erneuern (Rotation, 5-Min-Grace-Window genau einmal)
      description: >
        OBERGRENZE seit 01.10.2026: Nach der Rotation bleiben je Konto
        hoechstens die zehn juengsten offenen Refresh-Tokens, eines je Geraet
        (siehe POST /api/auth/login). Das gerade rotierte Token ist dann schon
        widerrufen und zaehlt nicht mit; die Gnadenfrist gilt unveraendert,
        auch wenn das Konto an der Grenze steht
        (backend/tests/routes/refreshTokenGrenze.test.js).
      parameters:
        - { name: X-Active-Organization, in: header, required: false, schema: { type: integer }, description: "Aktive Multi-Org — wird nach Mitgliedschafts-Pruefung als Claim uebernommen" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string }
                device_id: { type: string, maxLength: 255, description: "Optional (seit 28.09.2026): Geraete-Kennung. Pflicht fuer gebundene Tokens; bindet ein ungebundenes Token beim Rotieren an das Geraet. Kein Text, leer oder laenger als 255 Zeichen zaehlt wie keine Angabe." }
                kann_ohne_gemeinde: { type: boolean, description: "Optional (seit 03.10.2026): wie bei POST /api/auth/login. Die Web-Version schickt es bei jedem Refresh mit; ohne das Feld endet der Refresh eines Kontos ohne Gemeinde mit 403 grund konto_ohne_gemeinde (das eingereichte Token ist dann rotiert und widerrufen, ein neues gibt es nicht). Fuer alle anderen Konten ohne Wirkung." }
      responses:
        "200": { description: "Neues Token-Paar; altes Refresh-Token revoziert und traegt ersetzt_durch. Es bleibt 5 Min im Grace-Window GENAU EINMAL nutzbar (gnade_genutzt_at) -- dabei wird der Nachfolger der ersten Rotation widerrufen und sofort ablaufen gelassen, so dass je Geraet genau ein Token offen bleibt. Das neue Token uebernimmt die Geraetebindung des alten; war das alte ungebunden und kam device_id mit, ist das neue daran gebunden" }
        "401": { description: "Refresh-Token unbekannt, abgelaufen, per Logout widerrufen oder ausserhalb des 5-Min-Fensters (kein Widerruf weiterer Tokens). ODER dritte Verwendung eines rotierten Tokens innerhalb des Fensters: Diebstahl-Signal, ALLE Refresh-Tokens des Kontos werden widerrufen (revoked_at + expires_at = NOW()), gleiche Fehlermeldung. ODER (seit 28.09.2026) gebundenes Token mit anderer oder fehlender device_id: nur DIESES Token wird widerrufen und sofort ablaufen gelassen (auch im Grace-Window, ohne dessen Gnade zu verbrauchen; der Nachfolger des echten Geraets bleibt), gleiche Fehlermeldung" }
        "429": { description: "{ error } -- mehr als 300 abgelehnte Tokens (401) je Viertelstunde von derselben Adresse (refreshLimiter, seit 29.09.2026). Erfolgreiche Erneuerungen, 403, 400 und 500 zaehlen nicht. ACHTUNG: Die App (2.2.x, 2.3.0) meldet sich bei jeder abgelehnten Erneuerung ab, auch bei 429 -- deshalb so weit wie die Fehlversuche beim Login; ein Geraet erzeugt hoechstens zwei 401, bevor die App den Token verwirft" }
        "403": { description: "{ error, error_code } -- User deaktiviert oder soft-geloescht (deleted_at, beides user_inactive; seit 26.09.2026, Audit Sicherheit BF-07) / Org gesperrt (org_inactive) / Trial abgelaufen (org_trial_expired); super_admin von Org- und Trial-Sperre ausgenommen, seit 03.10.2026 nicht mehr von der Deaktivierung, nie von der Loeschung. Code, Reihenfolge (erst Konto, dann Gemeinde) und Text sind seit 28.09.2026 dieselben wie bei POST /api/auth/login (eine Quelle, SPERR_MELDUNGEN); die App zeigt den Text nach einem abgelehnten Refresh auf der Anmeldeseite statt 'Sitzung abgelaufen'. Das eingereichte Refresh-Token ist dann bereits rotiert und widerrufen, ein neues wird nicht ausgestellt. Seit 03.10.2026 auch: Konto ohne Gemeinde ohne kann_ohne_gemeinde -> { error, error_code: user_inactive, grund: konto_ohne_gemeinde }, Text wie bei der Anmeldung" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: [refreshLimiter]
        org-scope: false
        objekt-pruefung: "SHA-256-Hash-Lookup in refresh_tokens; Sperr-Checks wie beim Login"
        hinweis: "token_invalidated_at (Soft-Revoke) wird beim Refresh nicht geprüft — Soft-Revoke wirkt nur auf Access-Tokens, nicht auf die Refresh-Kette"
        # BEHOBEN 26.09.2026 (Audit Sicherheit BF-08): Das Grace-Window war
        # unbegrenzt oft nutzbar -- dreimal derselbe rotierte Token: 200, 200,
        # 200 und drei offene 90-Tage-Tokens; ein abgegriffenes Refresh-Token
        # gab 90 Tage Zugriff, ohne aufzufallen. Jetzt genau eine Wieder-
        # verwendung (Migration 166: ersetzt_durch, gnade_genutzt_at), danach
        # Widerruf aller Refresh-Tokens des Kontos. Antwortform unveraendert.
        # OFFEN bleibt die Geraetebindung (device_id) aus derselben Empfehlung.
        # BEHOBEN 28.09.2026 (Rest von BF-08, Geraetebindung): Migration 171
        # (refresh_tokens.device_id, nullable). Login, register-konfi und
        # Refresh speichern die mitgeschickte device_id am Token; die
        # Rotation uebernimmt sie. Gebundenes Token + andere oder fehlende
        # device_id -> 401 und Widerruf dieses Tokens (bewusst nicht der
        # Familie: der Versuch ist gescheitert, und eine auf dem echten Geraet
        # geaenderte Kennung soll nicht alle Geraete abmelden). Ungebundene
        # Tokens (Store-Apps 2.2.x/2.3.0 senden nie eine Kennung, Tokens von
        # vorher) gelten wie bisher; die aktualisierte App bindet sie beim
        # ersten Refresh. change-password bindet nicht. Antwortformen
        # unveraendert. Tests: backend/tests/routes/refreshGeraetebindung.test.js.
        # BEHOBEN 28.09.2026 (Audit Grundgeruest BF-11): Die 403-Antwort des
        # Refresh wich von der Anmeldung ab -- ein deaktiviertes Konto bekam
        # user_inactive mit dem Text der gesperrten Organisation, der Testphase
        # fehlte der zweite Satz, und Konto-Sperre plus abgelaufene Testphase
        # meldete org_trial_expired statt user_inactive. Jetzt eine Quelle fuer
        # beide Routen. Form unveraendert (403 { error, error_code }).
        # Tests: backend/tests/routes/refreshSperrGrund.test.js.
        # BEHOBEN 01.10.2026 (Produktionsmessung Nr. 13 der Gesamtabnahme,
        # Nachtrag zu BF-08): keine Obergrenze fuer offene Refresh-Tokens --
        # 1.281 offene auf 133 Konten, das groesste mit 208, jedes ein
        # 90-Tage-Schluessel. Jetzt zehn je Konto, eines je Geraet, bei jeder
        # Ausgabe durchgesetzt; Migration 186 zieht den Bestand einmal nach
        # (812 Tokens auf 12 Konten, 714 davon Demo-, Review- und
        # Testkonten). Antwortform unveraendert. Tests:
        # backend/tests/routes/refreshTokenGrenze.test.js,
        # backend/tests/utils/migration186Bestand.test.js.

  /api/auth/logout:
    post:
      tags: ["Anmeldung & Konto"]
      summary: Logout — Refresh-Token revozieren und Push-Token des Geraets entfernen (best effort, immer 200)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token: { type: string }
                device_id:
                  type: string
                  description: >
                    Geraete-ID. Wird sie zusammen mit platform mitgesendet,
                    entfernt die Route den Push-Token dieses Geraets für den
                    angemeldeten User. Seit 22.08.2026: Der Client ruft dafuer
                    zwar auch DELETE /notifications/device-token, aber
                    best-effort (Timeout, nur online, nur mit ermittelbarer
                    Geraete-ID) — schlug das fehl, kamen weiter Push-Nachrichten
                    an das abgemeldete Geraet.
                platform:
                  type: string
                  enum: [ios, android]
      responses:
        "200": { description: "Immer 'Logout erfolgreich'; Token wird zusaetzlich sofort expired (kein Grace-Window)" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: >
          Revoziert nur das mitgesendete Token (Hash-Match). Der
          Push-Token-Cleanup ist auf user_id des Tokens gescopt — fremde
          Geraete und andere Nutzer auf demselben Geraet bleiben unberuehrt.

  # ==========================================================================
  # DOCS-AUTH (backend/routes/docsAuth.js — 3 Routen, Mount /api/docs-auth)
  # Anmeldung für die API-Doku unter /docs/api: EIN gemeinsames Passwort
  # (DOCS_PASSWORD), kein Benutzerkonto. Der Reverse-Proxy fragt per
  # Forward-Auth bei /pruefen nach. Neu 2026-08-24.
  # ==========================================================================
  /api/docs-auth/pruefen:
    get:
      tags: ["Doku-Zugang"]
      summary: Forward-Auth-Check des Reverse-Proxys für /docs/api/*
      responses:
        "200": { description: "Doku-Cookie (signiertes JWT, Zweck 'docs') ist gueltig" }
        "302": { description: "Kein/ungueltiges Cookie UND X-Forwarded-Uri gesetzt (Traefik): Redirect auf die Anmeldeseite, Ziel aus X-Forwarded-Host (https fest)" }
        "401": { description: "Kein/ungueltiges Cookie ohne X-Forwarded-Uri (Caddy baut den Redirect selbst)" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: []
        org-scope: false
        objekt-pruefung: "JWT-Verify des kq_docs-Cookies; App-Anmeldetokens werden abgelehnt (Zweck-Claim)"
        hinweis: "Wird vom Proxy bei JEDEM Doku-Aufruf gerufen — bewusst ohne eigenes Limit (nur generalLimiter)"

  /api/docs-auth/anmelden:
    post:
      tags: ["Doku-Zugang"]
      summary: Anmeldung mit dem gemeinsamen Doku-Passwort, setzt das Doku-Cookie
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [passwort]
              properties:
                passwort: { type: string }
      responses:
        "200": { description: "Cookie kq_docs gesetzt (JWT 30 Tage, HttpOnly, Secure, SameSite=Lax)" }
        "401": { description: "Passwort falsch (zeitkonstanter Vergleich)" }
        "429": { description: "docsLoginLimiter: 20 Fehlversuche/15min pro Client-IP; Erfolge zaehlen nicht (Zähler seit 26.09.2026 replica-übergreifend in der Datenbank, Betrieb BF-09 — vorher galt das Limit je Replica, also doppelt)" }
        "503": { description: "DOCS_PASSWORD nicht gesetzt — Doku bleibt gesperrt statt offen" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: [docsLoginLimiter]
        org-scope: false
        objekt-pruefung: "timingSafeEqual gegen DOCS_PASSWORD (SHA-256 nur zur Puffer-Angleichung, nichts wird gespeichert)"
        # NACHGEZOGEN 24.08.2026 (CodeQL-Befund 101): Route war nur durch den
        # generalLimiter (2000/15min) gedeckt — bei einem einzelnen Passwort
        # ohne Benutzernamen praktisch durchprobierbar. Jetzt strenges Limit.

  /api/docs-auth/abmelden:
    post:
      tags: ["Doku-Zugang"]
      summary: Doku-Cookie löschen
      responses:
        "200": { description: "Cookie geloescht (Max-Age=0)" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: []
        org-scope: false
        objekt-pruefung: "Keine — loescht nur das eigene Cookie"

  # ==========================================================================
  # ORGANIZATIONS (backend/routes/organizations.js — 15 Routen,
  # Mount /api/organizations, optional orgLimiter davor)
  # ==========================================================================
  /api/organizations:
    get:
      tags: ["Organisationen"]
      summary: Alle Organisationen mit Team-/Konfi-Zaehlern (nur Super-Admin)
      description: >
        Seit 03.10.2026 (Migration 191, nur neue Felder): kirchenkreis_id
        (aus organizations.*), dazu landeskirche_id und landeskirche aus dem
        zugeordneten Kirchenkreis (sonst null). Alle bisherigen Felder
        bleiben, auch die Textspalte kirchenkreis.

        INTERNE GEMEINDEN AUSGENOMMEN (seit 03.10.2026, Migration 194):
        Gemeinden mit organizations.intern = true -- die Review- und
        Test-Gemeinden fuer die Stores -- stehen nicht in der Liste. Sie ist
        die Gemeinde-Auswahl der Support-Ansicht (Mails zuordnen, Posteingang)
        und der Verwaltung. Die Antwortform bleibt GLEICH: nur weniger
        Eintraege, kein neues Feld (intern waere hier immer false und wird
        weggelassen). Zugriff ueber die Kennung (GET und PUT
        /organizations/{id}) bleibt moeglich; GET zeigt intern.
      responses:
        "200": { description: "Array aller Orgs ausser den internen: organizations.* (seit 03.10.2026 mit kirchenkreis_id, ohne intern) inkl. user_count/konfi_count/event_count, dazu landeskirche_id und landeskirche" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "keine (org-uebergreifend)"
    post:
      tags: ["Organisationen"]
      summary: Gemeinde anlegen inkl. erster Gemeindeleitung und Standard-Daten (4 Rollen, 36 Badges, 4 Zertifikat-Typen, 6 Levels, 14 Kategorien, 9 Aktivitäten, 3 Beispiel-Challenges)
      description: >
        Standardrollen (display_name): org_admin "Org-Leitung", admin
        "Leitung", teamer "Teamer:in", konfi "Konfirmand:in" (seit
        28.09.2026; vorher "Organisations-Admin" und "Hauptamt"). Bestehende
        Gemeinden behalten ihre display_name-Werte -- keine Migration; die
        App beschriftet Rollen nach role_name.

        BEHOBEN 29.09.2026 (Nebenbefund Screens/Leitung BF-15):
        (1) GANZ ODER GAR NICHT: Gemeinde, Rollen, erste Gemeindeleitung und
        alle Vorlagen entstehen in EINER Transaktion; scheitert ein Schritt,
        bleibt nichts stehen (500) -- vorher eine halbe Gemeinde mit belegtem
        Systemnamen. (2) admin_username wird SYSTEMWEIT und ohne Gross/klein
        geprueft wie in POST /api/users und POST /api/organizations/{id}/admins:
        409 "Benutzername existiert bereits (muss systemweit eindeutig sein)",
        nichts wird angelegt. Vorher griff nur der Index
        (organization_id, username) -- in einer neuen Gemeinde nie; die
        Anmeldung per LOWER(username) wurde mehrdeutig. (3) SYSTEMNAME MIT
        UMLAUTEN: Die App bildet name/slug aus dem Anzeigenamen und verliert
        dabei Umlaute ("Büsum" -> "bsum"). Entspricht ein geschickter Wert
        genau dieser Bildung, bildet der Server ihn neu mit ä->ae, ö->oe,
        ü->ue, ß->ss ("buesum"); ein eigener Wert bleibt, nur Umlaute darin
        werden ebenso umgeschrieben (utils/gemeindeSystemname.js). Nur beim
        Anlegen -- bestehende Gemeinden werden nicht umbenannt, PUT speichert
        weiter, was geschickt wird. Antwortform unveraendert.
        NACHTRAG 30.09.2026: Die App ab 2.3.0 bildet name/slug selbst mit
        derselben Umschrift (frontend/src/utils/gemeindeSystemname.ts, Test
        gegen diese Funktion); der Server behaelt, was sie schickt. Die
        Store-App 2.2.x schickt weiter die verlustbehaftete Form.

        STARTBESTAND (nachgezaehlt 30.09.2026; die Zusammenfassung nannte
        bis dahin 27 Badges, 5 Kategorien und 5 Aktivitaeten): 4 Rollen
        (org_admin, admin, teamer, konfi); 36 Badges -- 27 fuer Konfis und
        9 fuers Team (target_role 'teamer'); 4 Zertifikat-Typen; 6 Levels;
        14 Kategorien; 9 Aktivitaeten -- 5 fuer Konfis mit Punkten und 4 fuers
        Team ohne Punkte und Punktetyp; 3 Beispiel-Challenges als Entwurf
        ohne Jahrgang. Die Zaehler der Antwort nennen dieselben Zahlen.

        BEHOBEN 30.09.2026: Das Feld message nannte nur die 5 Aktivitaeten
        fuer Konfis, default_activities_created daneben 9. Jetzt nennen beide
        9. Die App liest message nicht.

        SEIT 03.10.2026: Die Anlage steht in utils/gemeindeAnlegen.js; dieselbe
        Funktion ruft POST /api/support/anfragen/{id}/anlegen. Fuer dieselbe
        Anfrage legt die Route Stueck fuer Stueck dasselbe an wie vorher
        (tests/routes/gemeindeAnlegenGemeinsam.test.js, Pruefsumme vom Stand
        davor). Neu und optional: kirchenkreis_id -- dann steht dessen Name in
        der Textspalte kirchenkreis, ein geschickter Freitext zaehlt nicht.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, slug, display_name, admin_username, admin_password, admin_display_name]
              properties:
                name: { type: string }
                slug: { type: string }
                display_name: { type: string }
                description: { type: string }
                contact_name: { type: string }
                contact_email: { type: string }
                contact_phone: { type: string }
                address: { type: string }
                website_url: { type: string }
                kirchenkreis: { type: string, description: "Freitext; mit kirchenkreis_id uebergangen" }
                kirchenkreis_id: { type: [integer, "null"], description: "seit 03.10.2026, optional: Zuordnung zu einem Kirchenkreis (GET /api/support/kirchenkreise); unbekannt 400 'Kirchenkreis nicht gefunden', kein Verweis 400 'Ungültiger Kirchenkreis' -- nichts angelegt" }
                max_konfis: { type: [integer, "null"] }
                admin_username: { type: string, description: "systemweit eindeutig (case-insensitiv), seit 29.09.2026 geprueft" }
                admin_password: { type: string, minLength: 8, description: "Volle Passwort-Policy (validatePassword): min 8 Zeichen, Gross- und Kleinbuchstabe, Zahl, Sonderzeichen, keine Leerzeichen; sonst 400. BEHOBEN 22.08.2026 (N6) -- hier bis 30.09.2026 noch als 'nur min 6 Zeichen, keine Policy' beschrieben" }
                admin_display_name: { type: string }
      responses:
        "201": { description: "id, admin_user_id, default_badges_created (36), default_certificates_created (4), default_levels_created (6), default_categories_created (14), default_activities_created (9), default_challenges_created (3), message (dieselben Zahlen als Text)" }
        "400": { description: "Validierungsfehler {error, details[{field, message}]}: Pflichtfeld leer oder admin_password verletzt die Passwort-Policy; nichts wird angelegt" }
        "409": { description: "\"Gemeinde-Slug existiert bereits\" (auch nach dem Umschreiben der Umlaute) oder \"Benutzername existiert bereits (muss systemweit eindeutig sein)\" (seit 29.09.2026). Seit 30.09.2026 auch bei gleichzeitiger Anlage: Pruefen und Anlegen in EINER Transaktion unter pg_advisory_xact_lock je Namen (klein geschrieben; utils/benutzernameSperre.js, dieselbe Sperre in POST /users, POST /organizations/{id}/admins und POST /organizations) -- die zweite Anlage wartet und bekommt diese 409. Vorher kamen zwei gleichzeitige Anlagen desselben Namens beide durch (201/201, zwei Konten), weil der einzige eindeutige Index (organization_id, username) Gross/klein unterscheidet und nur in einer Gemeinde greift; die zweite Gemeinde entsteht dabei nicht" }
        "500": { description: "Fehler beim Anlegen; seit 29.09.2026 bleibt dabei nichts von der Gemeinde stehen" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin, validateCreateOrg]
        org-scope: false
        objekt-pruefung: "keine"
        hinweis: "Seit 27.09.2026 (Audit Sicherheit BF-04): Der erste org_admin startet ohne Kontosperre, auch wenn sein Benutzername vorher durchprobiert wurde"

  /api/organizations/search-users:
    get:
      tags: ["Organisationen"]
      summary: Systemweite User-Suche für Multi-Org-Zuweisung (ohne Konfis)
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 2 }, description: "Suchbegriff" }
      responses:
        "200": { description: "Max. 20 aktive Nicht-Konfi-User (username, display_name, email, Primaer-Org, Rolle). Support-Konten ohne Gemeinde stehen mit primary_organization_name null und primary_role_name super_admin darin -- so werden sie als Gast in eine Gemeinde aufgenommen (POST /organizations/{id}/members)" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "keine (org-uebergreifend, bewusst)"

  /api/organizations/support-konten:
    get:
      tags: ["Organisationen"]
      summary: Alle Support-Konten (Super-Admin ohne Gemeinde) mit ihren Gast-Gemeinden
      description: >
        NEU 03.10.2026 (Simon; docs/planung/web-version.md, Punkt 10 bis 15).
        Ein Support-Konto hat keine Gemeinde (users.organization_id NULL),
        traegt die Systemrolle super_admin und das Merkmal is_super_admin
        (Migration 190) und hat dieselben Rechte wie jeder Super-Admin. Es
        meldet sich nur in der Web-Version an (POST /api/auth/login,
        kann_ohne_gemeinde). Diese Liste zeigt nur Konten ohne Gemeinde;
        Super-Admins mit Gemeinde stehen in deren Benutzerliste. Geloeschte
        (deleted_at) fehlen.
      responses:
        "200":
          description: "Array, nach Anzeigename sortiert"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    username: { type: string }
                    display_name: { type: string }
                    email: { type: [string, "null"] }
                    is_active: { type: boolean }
                    last_login_at: { type: [string, "null"], format: date-time }
                    created_at: { type: string, format: date-time }
                    gemeinden:
                      type: array
                      description: "Gast-Mitgliedschaften (user_organizations): id, name, display_name, role_name"
                      items: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Kein Super-Admin (Rolle oder Merkmal)" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "nur users.organization_id IS NULL"
        hinweis: "Eigene Datei backend/routes/supportKonten.js, eingehaengt in organizations.js vor /:id. Tests: backend/tests/routes/supportKonten.test.js"
    post:
      tags: ["Organisationen"]
      summary: Support-Konto anlegen (ohne Gemeinde, Systemrolle super_admin, Merkmal is_super_admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, display_name, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 50, pattern: "^[a-zA-Z0-9.-]+$", description: "Systemweit frei, ohne Gross/klein -- geprueft unter derselben Sperre wie POST /users (utils/benutzernameSperre.js)" }
                display_name: { type: string }
                password: { type: string, description: "volle validatePassword-Policy" }
                email: { type: string, description: "Optional; fuer 'Passwort vergessen'" }
      responses:
        "201": { description: "{ id, username, display_name, email, is_active, created_at, gemeinden: [] }" }
        "400": { description: "Benutzername, Anzeigename, Passwort oder E-Mail ungueltig" }
        "403": { description: "Kein Super-Admin" }
        "409": { description: "Benutzername existiert bereits (muss systemweit eindeutig sein)" }
        "500": { description: "u. a. 'Die Rolle für Support-Konten fehlt. Bitte den Migrationsstand prüfen.' -- die Systemrolle aus Migration 190 fehlt" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "Rolle = Systemrolle super_admin (organization_id NULL); das neue Konto startet ohne Kontosperre nach Fehlversuchen"

  /api/organizations/support-konten/{id}:
    patch:
      tags: ["Organisationen"]
      summary: Support-Konto sperren oder entsperren
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "User-ID des Support-Kontos" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_active]
              properties:
                is_active: { type: boolean, description: "false sperrt, true entsperrt (nur echte Booleans)" }
      responses:
        "200": { description: "{ id, username, display_name, email, is_active }. Sperren beendet alle Sitzungen: token_invalidated_at, alle Refresh-Tokens widerrufen und sofort abgelaufen, Push-Tokens geloescht, Rechte-Cache geleert, Sockets getrennt. Danach Anmeldung und Refresh 403 user_inactive" }
        "400": { description: "is_active fehlt oder ist kein Boolean" }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "Kein Support-Konto (Konto mit Gemeinde, geloescht oder unbekannt) -- dann aendert sich nichts" }
