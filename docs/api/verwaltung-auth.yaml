  # ==========================================================================
  # USERS (backend/routes/users.js — 9 Routen, Mount /api/users UND
  # /api/admin/users; requireAdmin + Rollenhierarchie, siehe Dateikopf)
  # ==========================================================================
  /api/users:
    get:
      tags: ["Benutzer & Rollen"]
      summary: Alle Verwaltungs-User der eigenen Org (ohne Konfis/super_admin), mit can_edit-Flag aus der Hierarchie
      responses:
        "200": { description: "User-Array (Rolle und Jahrgangs-Zaehler DIESER Gemeinde, can_edit, mitgliedschaft 'stamm'|'weitere' -- additiv seit 26.09.2026; weitere_gemeinden (integer): in wie vielen ANDEREN Gemeinden die Person ausserdem Mitglied ist, bei 'weitere' mindestens 1, nur die Zahl, keine Namen -- additiv seit 27.09.2026, der Loesch-Dialog erkennt daran, dass DELETE das Konto nicht loescht). can_edit folgt seit 08.10.2026 derselben Regel wie checkUserHierarchy: bei einem Super-Admin-Konto (Rolle ODER Merkmal is_super_admin) false, ausser der Aufrufer ist selbst Super-Admin (Befund 03.10.2026, behoben 08.10.2026: bis dahin can_edit nur nach der Rolle, Bearbeiten/Loeschen/Passwort endeten mit 403). can_delete (boolean, additiv seit 08.10.2026): darf DELETE /users/:id; meist gleich can_edit, beim Support-Gast (Konto ohne Stamm-Gemeinde) fuer die Gemeindeleitung true trotz can_edit false. Das Merkmal is_super_admin selbst steht nicht in der Antwort." }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin]
        org-scope: true
        objekt-pruefung: "BEIDE Quellen der Zugehoerigkeit (users.organization_id ODER user_organizations, Rolle je Gemeinde)"
        # BEHOBEN 26.09.2026 (Audit Leitung BF-01): Bis dahin nur die
        # Stamm-Gemeinde -- wer ueber eine Gemeinde-Einladung mitarbeitete,
        # fehlte in der Liste und bekam nie Rolle oder Jahrgaenge.
        # BEHOBEN 03.10.2026 (Pruefung "Konto ohne Gemeinde"): Ein Konto ohne
        # Gemeinde (users.organization_id NULL, Support-Konto als Gast ueber
        # POST /organizations/{id}/members) fehlte, weil `NULL <> $1` nicht
        # wahr ist; weitere_gemeinden zaehlte falsch. Jetzt steht es als
        # 'weitere' mit seiner Rolle hier, weitere_gemeinden zaehlt nur echte
        # Gemeinden. Antwortform unveraendert.
    post:
      tags: ["Benutzer & Rollen"]
      summary: Verwaltungs-User anlegen (Rolle aus eigener Org, volle Passwort-Policy)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [display_name, password, role_id]
              properties:
                username: { type: string, minLength: 3, maxLength: 50, pattern: "^[a-zA-Z0-9.-]+$", description: "Optional (seit 23.08.2026; hier bis 30.09.2026 als Pflicht gefuehrt): fehlt er oder ist leer, erzeugt der Server ihn aus display_name wie bei Konfis (Umlaute ausgeschrieben, bei Kollision mit Zahl: anna.muster2) und gibt ihn in der Antwort zurueck. Mitgeschickt muss er systemweit frei sein, ohne Gross/klein -- sonst 409" }
                email: { type: string }
                display_name: { type: string }
                role_title: { type: string }
                password: { type: string, description: "validatePassword-Policy" }
                role_id: { type: integer }
      responses:
        "201": { description: "Neuer User; Chat-Sync (Team-Chat, org_admin zusaetzlich Jahrgangs-Chats)" }
        "400": { description: "Rolle nicht in eigener Org / Policy verletzt" }
        "403": { description: "Hierarchie: Ziel-Rolle nicht anlegbar (canCreateRole)" }
        "409": { description: "\"Benutzername existiert bereits (muss systemweit eindeutig sein)\" -- systemweit, ohne Gross/klein. Seit 30.09.2026 auch bei gleichzeitiger Anlage: Pruefen und Anlegen in EINER Transaktion unter pg_advisory_xact_lock je Namen (klein geschrieben; utils/benutzernameSperre.js, dieselbe Sperre in POST /users, POST /organizations/{id}/admins und POST /organizations) -- die zweite Anlage wartet und bekommt diese 409. Vorher kamen zwei gleichzeitige Anlagen desselben Namens beide durch (201/201, zwei Konten), weil der einzige eindeutige Index (organization_id, username) Gross/klein unterscheidet und nur in einer Gemeinde greift. Ohne mitgeschickten username nimmt der Server bei gleichzeitiger Anlage den naechsten freien erzeugten Namen (anna.muster2) statt 409. E-Mail-Konflikt in derselben Gemeinde: \"Benutzername oder E-Mail existiert bereits\"" }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, "userHierarchyMiddleware('create')", validateCreateUser]
        org-scope: true
        objekt-pruefung: "role_id muss zur eigenen Org gehören; Hierarchie prüft Ziel-Rolle"
        hinweis: "Seit 27.09.2026 (Audit Sicherheit BF-04): Das neue Konto startet ohne Kontosperre, auch wenn sein Benutzername vorher durchprobiert wurde"

  /api/users/{id}:
    get:
      tags: ["Benutzer & Rollen"]
      summary: Einzelnen User mit Jahrgangs-Zuweisungen laden
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "User-ID" }
      responses:
        "200": { description: "User + assigned_jahrgaenge (can_view/can_edit, assigned_by)" }
        "403": { description: "Hierarchie: Ziel-Rolle nicht einsehbar" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, "userHierarchyMiddleware('view')"]
        org-scope: true
        objekt-pruefung: "Ziel-User muss in der aktiven Org arbeiten (users.organization_id ODER user_organizations); canManageRole(eigene Rolle, Ziel-Rolle DIESER Org); Super-Admin-Konten nur fuer Super-Admins (403)"
        # BEHOBEN 03.10.2026: Ein Gast ohne Gemeinde (Support-Konto) bekam
        # hier und in checkUserHierarchy 404 statt 200 bzw. 403 "Super-Admin-
        # Konten kann nur ein Super-Admin bearbeiten." (Vergleich mit <>).
        hinweis: >
          GEAENDERT 26.09.2026: role_id, role_name und assigned_jahrgaenge
          gelten fuer die AKTIVE Organisation. Wer hier org_admin und in
          seiner Stamm-Gemeinde Teamer:in ist, wird als org_admin angezeigt;
          die Jahrgaenge der anderen Gemeinden stehen nicht in der Antwort.
          Die Antwortform ist unveraendert (dieselben Felder, dieselben Typen)
          — nur die Werte beziehen sich jetzt auf die richtige Gemeinde."
    put:
      tags: ["Benutzer & Rollen"]
      summary: User bearbeiten (Felder optional; Rolle, is_active, Passwort)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "User-ID" }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string, minLength: 3, maxLength: 50, pattern: "^[a-zA-Z0-9.-]+$", description: "Seit 30.09.2026: Ein NEUER Name (ohne Gross/klein verglichen mit dem bisherigen) muss systemweit frei sein, ohne Gross/klein, das eigene Konto ausgenommen -- sonst 409. Geprueft in der Transaktion des Updates unter pg_advisory_xact_lock je Namen (utils/benutzernameSperre.js, dieselbe Sperre wie beim Anlegen). Der unveraenderte Name (so schicken ihn die Store-Apps 2.2.x und 2.3.0 bei jedem Speichern mit) und eine reine Aenderung der Schreibweise des eigenen Namens (anna -> Anna) werden nicht geprueft und gehen wie bisher durch -- auch neben einer Dublette im Altbestand. BEHOBEN 30.09.2026: vorher ohne jede Pruefung; Umbenennen auf den Namen eines Kontos einer anderen Gemeinde oder auf 'ADMIN1' neben 'admin1' gab 200, die Anmeldung wurde mehrdeutig" }
                email: { type: string }
                display_name: { type: string }
                role_title: { type: string }
                role_id: { type: integer, description: "Rollenwechsel: Hierarchie prueft neue Rolle; Sockets werden getrennt" }
                is_active: { type: boolean, description: "false trennt aktive Sockets" }
                password: { type: string, description: "Seit 27.09.2026 (BF-20 / F-12): Wird ein Passwort gesetzt, geht nach der Antwort eine Bestaetigung an die hinterlegte Adresse des Kontos -- ohne das Passwort, mit dem Hinweis, dass die Leitung es gesetzt hat (ausser beim eigenen Konto). Seit 27.09.2026 (Sicherheit BF-04) hebt es ausserdem eine Kontosperre nach Fehlversuchen auf" }
      responses:
        "200": { description: "Aktualisiert; Chat-Sync bei Rollen-/Aktiv-Wechsel; User-Cache bei JEDER Aenderung invalidiert (seit 26.09.2026 -- vorher nur bei role_id, is_active=false wirkte bis zu 30 s spaeter)" }
        "400": { description: "Rolle nicht in eigener Org / keine Felder" }
        "403": { description: "Hierarchie verletzt (Ziel-User oder neue Rolle)" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "\"Benutzername existiert bereits (muss systemweit eindeutig sein)\" -- neuer username vergeben (seit 30.09.2026, siehe username), nichts wird geaendert; \"Benutzername oder E-Mail existiert bereits\" bei einem Konflikt am Index (organization_id, email); seit 28.09.2026 auch: der Rollenwechsel machte das Konto zugleich Konfi und Team (error_code konfi_und_team)" }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, "userHierarchyMiddleware('update')", validateUpdateUser]
        # BEHOBEN 28.09.2026 (Simon: "Konfi und Team geht nicht parallel";
        # utils/konfiOderTeam.js): Die Konfi-Rolle bot die Oberflaeche nie
        # an, der Server schrieb sie aber -- in einer weiteren Gemeinde nach
        # user_organizations und zuhause auch bei bestehender weiterer
        # Mitgliedschaft. Jetzt 409 konfi_und_team: in einer weiteren
        # Gemeinde nie Konfi, zuhause nur ohne weitere Gemeinde, und Team nur,
        # wenn die Person nirgends sonst Konfi ist (Team -> Team in einem
        # Altbestands-Mischkonto bleibt moeglich, ebenso Konfi -> Team, das es
        # aufloest; eine unveraenderte role_id geht immer durch). Rollenwechsel
        # zuhause schreiben seither auch die Zeile der
        # Stamm-Gemeinde in user_organizations mit (Altbestand aus Migration
        # 101), in einer Transaktion. Test tests/routes/konfiOderTeam.test.js.
        # BEHOBEN 26.09.2026 (Audit Sicherheit BF-10): invalidateUserCache lief
        # nur bei role_id. Nach is_active=false arbeitete die alte Sitzung bis
        # zum 30-s-TTL von rbac.js weiter (reproduziert: PUT, direkt danach GET
        # mit alter Sitzung -> 200). Jetzt bei jeder Aenderung; dasselbe nach
        # DELETE /users/:id, DELETE /admin/konfis/:id und POST /auth/delete-account.
        # Wirkt je Replica -- der gemeinsame Store bleibt offen (S-10).
        org-scope: true
        objekt-pruefung: "Ziel-User in der aktiven Org ueber BEIDE Quellen; canManageRole + canCreateRole für neue Rolle. Zusatzmitglied (user_organizations): NUR role_id, geschrieben nach user_organizations.role_id; geaenderte Kontofelder oder Passwort -> 400 nur_rolle_in_weiterer_gemeinde (seit 26.09.2026). \"Geaendert\" wie die Oberflaeche liest (27.09.2026): leerer Text = NULL, Leerzeichen am Rand zaehlen nicht -- die Store-App 2.2.x schickt leere Felder als null und Namen getrimmt, in der Datenbank stehen sie teils als ''."
        # BEHOBEN 22.08.2026 (war N7): das optionale password-Feld wird vor
        # dem Hashen gegen validatePassword geprüft.
        # BEHOBEN 26.09.2026 (Audit Leitung BF-01): vorher nur STAMM-Org,
        # Zusatzmitglieder bekamen 404. Kontofelder bleiben bewusst bei der
        # Stamm-Gemeinde -- sonst kaeme die Leitung von Gemeinde B ueber das
        # Passwort einer eingeladenen Teamer:in in deren Gemeinde A hinein.
        hinweis: >
          BEWUSST enger als GET und die Jahrgangs-Routen (26.09.2026): Die
          Middleware laesst seither auch Personen durch, die ueber
          user_organizations in der aktiven Org arbeiten — diese Route weist
          sie danach trotzdem mit 404 ab. Bearbeitet werden hier Konto-Daten
          (Name, Mail, Rolle am Konto, is_active), die der GANZEN Person
          gehoeren und nicht einer einzelnen Gemeinde. Eine Zweitgemeinde
          darf sie nicht umschreiben. Was je Gemeinde gilt, laeuft ueber die
          Jahrgangs-Routen."
    delete:
      tags: ["Benutzer & Rollen"]
      summary: User aus der Gemeinde entfernen -- Hard-Delete nur, wenn die Person keiner anderen Gemeinde angehört
      description: >
        Drei Fälle (seit 27.09.2026), die Antwort trägt additiv
        `konto_bleibt` (boolean):
        (1) Die Person ist in einer anderen Gemeinde zuhause und arbeitet hier
        über user_organizations mit: nur diese Mitgliedschaft endet,
        `{ message: 'Mitgliedschaft in dieser Gemeinde beendet', konto_bleibt: true }`.
        BEHOBEN 27.09.2026: Mit der Mitgliedschaft gehen die Plaetze in ALLEN
        Chat-Raeumen dieser Gemeinde (vorher nur, was syncTeamChat und
        syncJahrgangChat fuer zugewiesene Jahrgaenge erfassten -- Gruppen,
        Zweierraeume und Jahrgangs-Chats ohne Zuweisung blieben, samt Push
        zu jeder Nachricht). Antwortform unveraendert. Seit 27.09.2026
        raeumen Fall 1, Fall 2 und DELETE /organizations/{id}/members/{userId}
        ueber DIESELBE Funktion (utils/mitgliedschaftEnde.js: Zuweisungen und
        Chat-Plaetze der Gemeinde), damit die Wege nicht wieder
        auseinanderlaufen (Audit "Wer bekommt was", BF-08).
        BEHOBEN 27.09.2026 (BF-13 / F-07): Dieselbe Funktion nimmt in Fall 1
        und Fall 2 auch die eigenen Postfach-Mitteilungen der Person aus
        DIESER Gemeinde mit (notifications.organization_id); die aus anderen
        Gemeinden bleiben. Vorher las sie das Postfach der alten Gemeinde
        weiter, und es zaehlte an Glocke und App-Symbol.
        (2) Die Person ist hier zuhause UND hat eine Zeile in
        user_organizations für eine andere Gemeinde: Das Konto zieht um,
        `{ message: 'Aus dieser Gemeinde entfernt; das Konto bleibt in einer anderen Gemeinde bestehen', konto_bleibt: true }`.
        Neue Stamm-Gemeinde ist bevorzugt eine aktive, darunter die älteste
        Mitgliedschaft (created_at, bei Gleichstand die Zeilen-ID);
        users.organization_id und users.role_id übernehmen Gemeinde und Rolle
        dieser Mitgliedschaft, ihre Zeile und eine etwaige Zeile für diese
        Gemeinde verschwinden. Mit ihr gehen die Jahrgangs-Zuweisungen dieser
        Gemeinde und die Plätze in ALLEN Chat-Räumen dieser Gemeinde (Team,
        Jahrgänge, Gruppen, Zweiergespräche); was die Person hier angelegt
        hat, bleibt unverändert und wird nicht anonymisiert. Rechte-Cache
        geleert, Sockets getrennt; token_invalidated_at bleibt unberührt, weil
        rbac.js und die Socket-Anmeldung Gemeinde und Rolle je Anfrage aus der
        Datenbank lesen. Keine Namen fremder Gemeinden in der Antwort.
        (3) Die Person gehört nur dieser Gemeinde an: Hard-Delete wie folgt,
        `{ message: 'Benutzer erfolgreich gelöscht', konto_bleibt: false }`.

        SUPPORT-GAST (seit 03.10.2026, Simon): Ein Super-Admin-Konto ist fuer
        alle ausser Super-Admins gesperrt (403 "Super-Admin-Konten kann nur ein
        Super-Admin bearbeiten.") -- mit EINER Ausnahme: Die Gemeindeleitung
        (org_admin der aktiven Gemeinde) darf ein Support-Konto OHNE
        Stamm-Gemeinde (users.organization_id NULL), das hier ueber
        user_organizations Gast ist, aus ihrer Gemeinde nehmen. Das ist immer
        Fall 1: nur die Mitgliedschaft endet, das Konto bleibt
        (`konto_bleibt: true`). Weiter 403: Leitung und Team, ein
        Super-Admin-Konto MIT Stamm-Gemeinde, und fuer die Gemeindeleitung
        Bearbeiten, Passwort, Jahrgaenge und Detailansicht des Gasts. Fremde
        Gemeinde: 404 wie bei jedem Konto. Regel: checkUserHierarchy
        (utils/roleHierarchy.js); Tests: kontoOhneGemeinde.test.js.

        Hard-Delete (Fall 3):
        Anonymisiert die Urheberschaft (admin_id/created_by/approved_by ->
        NULL, seit 24.08.2026 auch events.created_by, custom_badges.created_by,
        levels.created_by und user_jahrgang_assignments.assigned_by — vorher
        blockierten diese Fremdschlüssel das Löschen mit 500) und räumt die
        eigene Historie ab, inkl. user_certificates.user_id (ebenfalls seit
        24.08.2026, vorher war jede ausgezeichnete Person unlöschbar).
        Nachweisfotos UND Challenge-Dateien werden nach dem COMMIT von der
        Platte entfernt. Seit 25.09.2026 gehen auch die Postfach-Mitteilungen
        "Neuer Antrag eingegangen" bei der Leitung mit, die auf Anträge der
        geloeschten Person zeigten (utils/postfachAufraeumen.js).
        BEHOBEN 27.09.2026 (Audit "Wer bekommt was", BF-13 / F-07): Ebenso
        alle Leitungs-Mitteilungen UEBER die Person
        (loescheMitteilungenUeberPerson: Registrierung, Abmeldung,
        Opt-out/-in, Challenge-Beitrag, Teamer-Zu-/Absage, neuer Antrag,
        Einladung beantwortet -- Kennung konfi_id bzw. user_id im data-Teil).
        Vorher standen sie mit Name und Grund bis zum 365-Tage-Aufraeumen bei
        der Leitung.
        GEAENDERT 28.09.2026 (Simon: "konto löschen muss wirklich alles
        löschen."): Fall 3 hat keinen eigenen Loeschblock mehr, sondern ruft
        utils/kontoLoeschen.js -- dieselbe Funktion wie DELETE
        /admin/konfis/{id}, POST /auth/delete-account und die
        Auto-Loeschung (Regel und Umfang bei DELETE /admin/konfis/{id} in
        konfis-events). BEHOBEN dabei: Auf die frei werdenden Plaetze der
        Person rueckt jetzt die Warteliste nach (Team-Platz an wartende
        Teamer:innen), mit Push; Zweiergespraeche mit ihr gehen ganz (vorher
        nur, wenn niemand mehr darin sass); Einladungscodes der Person
        bleiben der Gemeinde (vorher geloescht); der Zaehler der
        Anmeldesperre geht mit. Fall 1 und 2 unveraendert -- dort bleibt das
        Konto.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "User-ID" }
      responses:
        "200": { description: "{ message, konto_bleibt } -- Fall 1/2: Mitgliedschaft beendet bzw. Konto in eine andere Gemeinde umgezogen (konto_bleibt true, seit 27.09.2026); Fall 3: geloescht (konto_bleibt false). Rechte-Cache geleert (seit 26.09.2026, BF-10); Sockets getrennt; beim Loeschen alle Dateien der Person (Nachweisfotos, Challenge- und Chat-Dateien, dazu die Dateien ihrer Zweiergespraeche) nach COMMIT entfernt" }
        "400": { description: "Selbst-Loeschung verboten" }
        "403": { description: "Hierarchie verletzt" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Letzter org_admin der Org nicht entfernbar (gilt fuer Loeschen und Umzug)" }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, "userHierarchyMiddleware('delete')", validateUserId]
        org-scope: true
        objekt-pruefung: "Stamm-Mitglied OHNE weitere Gemeinde: Konto loeschen (users.organization_id). Stamm-Mitglied MIT weiterer Gemeinde (user_organizations-Zeile einer anderen Org): Konto zieht dorthin um, hier endet die Zugehoerigkeit samt Jahrgaengen und allen Chat-Plaetzen -- seit 27.09.2026. Zusatzmitglied (user_organizations): NUR die Mitgliedschaft in dieser Gemeinde endet (user_organizations-Zeile, Jahrgaenge dieser Gemeinde, alle Chat-Plaetze dieser Gemeinde), Antwort 200 'Mitgliedschaft in dieser Gemeinde beendet' -- seit 26.09.2026. In allen Faellen: Selbst-Loeschungs-Sperre, Hierarchie- und Super-Admin-Schutz (userHierarchyMiddleware); Letzter-org_admin-Schutz fuer Stamm-Mitglieder"
        # BEHOBEN 27.09.2026 (Entscheidung Simon): Bis dahin loeschte DELETE
        # eine hier beheimatete Person samt Konto, auch wenn sie in weiteren
        # Gemeinden Mitglied war -- per CASCADE auf user_organizations verlor
        # die andere Gemeinde sie ohne Warnung. Jetzt Fall 2 (Umzug).
        hinweis: >
          Geloescht wird die ganze Person nur durch die Gemeinde, an der das
          Konto haengt -- das darf keine andere. Fuer ein Zusatzmitglied
          bedeutet DELETE deshalb seit dem 26.09.2026 (Audit Leitung BF-01)
          das Ende der Mitgliedschaft, nicht des Kontos; vorher kam 404 und
          die Person liess sich aus der Gemeinde gar nicht entfernen. Der
          Letzter-org_admin-Schutz zaehlt weiterhin ueber users.organization_id.
          Seit dem 27.09.2026 loescht auch die Gemeinde, an der das Konto
          haengt, die ganze Person nur noch, wenn sie keiner anderen Gemeinde
          angehoert -- sonst zieht das Konto dorthin um (Fall 2). Ob das so
          kommt, sieht die Oberflaeche vorher an weitere_gemeinden in
          GET /api/users.

  /api/users/{id}/jahrgaenge:
    get:
      tags: ["Benutzer & Rollen"]
      summary: Jahrgangs-Zuweisungen eines Users
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "User-ID" }
      responses:
        "200": { description: "Array (jahrgang, can_view, can_edit, assigned_by_name)" }
        "403": { description: "Hierarchie: Ziel-Rolle nicht einsehbar (canManageRole)" }
        "404": { description: "Ziel-User arbeitet nicht in der aktiven Organisation" }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, "userHierarchyMiddleware('view')"]
        org-scope: true
        objekt-pruefung: "Ziel-User muss in der aktiven Org arbeiten (users.organization_id ODER user_organizations); canManageRole(eigene Rolle, Ziel-Rolle DIESER Org); Jahrgänge auf die aktive Org gefiltert"
        hinweis: >
          GEAENDERT 31.08.2026: war requireOrgAdmin. admin darf die Zuweisungen
          der von ihm verwalteten Personen (teamer, konfi) sehen — die von
          anderen Admins und der Gemeindeleitung nicht (403), fremde Organisationen
          gar nicht (404). requireAdmin allein waere eine Rechteausweitung
          gewesen; die Grenze zieht checkUserHierarchy.
          BEHOBEN 26.09.2026: checkUserHierarchy suchte den Ziel-User allein
          ueber users.organization_id. Wer ueber user_organizations in der
          Gemeinde arbeitet, war dort nicht verwaltbar (404) — obwohl das
          Handbuch den Vorgang beschreibt. Jetzt zaehlen beide Quellen, und
          die Hierarchie prueft die Rolle DIESER Organisation (uo.role_id),
          nicht die am Nutzerkonto."
    post:
      tags: ["Benutzer & Rollen"]
      summary: Jahrgangs-Zuweisungen setzen (transaktional, Chat-Sync; fuer admin nur die eigenen Jahrgaenge)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "User-ID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jahrgang_assignments]
              properties:
                jahrgang_assignments:
                  type: array
                  items:
                    type: object
                    required: [jahrgang_id]
                    properties:
                      jahrgang_id: { type: integer }
                      can_view: { type: boolean, default: true }
                      can_edit: { type: boolean, default: false }
      responses:
        "200": { description: "Zuweisungen gesetzt; Jahrgangs-Chats aller betroffenen Jahrgaenge synchronisiert. assignments_count zaehlt die uebergebenen Zuweisungen (Antwortform unveraendert)" }
        "400": { description: "Jahrgang nicht in eigener Org" }
        "403": { description: "Hierarchie: Ziel-Rolle nicht verwaltbar (canManageRole) ODER ein Jahrgang liegt ausserhalb der eigenen Zuweisungen" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, "userHierarchyMiddleware('update')", validateJahrgangAssignments]
        org-scope: true
        objekt-pruefung: >
          Ziel-User muss in der aktiven Org arbeiten (users.organization_id
          ODER user_organizations); canManageRole(eigene Rolle, Ziel-Rolle
          DIESER Org); alle Jahrgang-IDs müssen zur aktiven Org gehören; seit
          31.08.2026 fuer admin zusaetzlich zu seinen eigenen Zuweisungen
          (can_edit) — sonst 403. org_admin und super_admin ausgenommen.
        hinweis: >
          GEAENDERT 31.08.2026: war requireOrgAdmin ohne Hierarchie-Pruefung.
          Wer Teamer:innen anlegen darf, muss ihnen auch Jahrgaenge geben
          koennen — sonst ist die neue Teamer:in fuer niemanden zustaendig.
          admin kommt damit an teamer und konfi, NICHT an andere Admins oder
          die Gemeindeleitung (403) und nicht an fremde Organisationen (404).
          BEHOBEN 31.08.2026: Die Route loeschte zuvor ALLE Zuweisungen des
          Ziel-Users und schrieb die uebergebene Liste neu. Ein admin nahm
          damit einer Teamer:in still Jahrgaenge weg, die er selbst gar nicht
          verantwortet. Seither ersetzt ein admin NUR die Zuweisungen auf
          seine eigenen Jahrgaenge; fremde bleiben unberuehrt, und ein
          fremder Ziel-Jahrgang wird mit 403 abgewiesen. org_admin ersetzt
          weiterhin alle. Zusaetzlich wird der Benutzer-Cache geleert, damit
          eine neue Zuweisung sofort greift statt erst nach 30 Sekunden.
          BEHOBEN 26.09.2026: Die Existenzpruefung suchte den Ziel-User allein
          ueber users.organization_id — wer ueber user_organizations in der
          Gemeinde arbeitet, bekam 404 und war dort nicht verwaltbar. Jetzt
          zaehlen beide Quellen (dasselbe Muster wie utils/orgMitglieder.js
          bei den Push-Empfaengern). Die Zuweisungen der ANDEREN Gemeinden
          bleiben dabei unberuehrt: Das DELETE ist seit 31.08.2026 an die
          Organisation gebunden."

