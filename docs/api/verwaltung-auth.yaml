        objekt-pruefung: "users.organization_id !== id (Primaer-Org-Schutz)"
        # BEHOBEN 27.09.2026 (Audit "Wer bekommt was", BF-08, HOCH): Vorher
        # entfernte dieser Weg nur user_organizations; die Syncs danach
        # erfassen Team-Chat und Jahrgaenge mit Zuweisung. Gruppen,
        # Zweierraeume, Termin-Chats und Jahrgangs-Chats ohne Zuweisung
