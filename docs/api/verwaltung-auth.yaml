  /api/users/{id}/reset-password:
    put:
      tags: ["Benutzer & Rollen"]
      summary: Passwort eines Users administrativ setzen
      description: >
        GEAENDERT 14.09.2026: Der Reset beendet jetzt alle Sitzungen des
        Ziel-Users — token_invalidated_at wird gesetzt, alle Refresh-Tokens
        werden widerrufen und die Push-Tokens geloescht. Die Person muss sich
        auf jedem Geraet mit dem neuen Passwort neu anmelden. Am Request und
        an der Antwortform aendert sich nichts.


        NEU 27.09.2026 (Bericht "Wer bekommt was", BF-20; Simons
        Entscheidung F-12): Nach der Antwort geht eine Bestaetigung an die
        hinterlegte Adresse des Kontos -- "die Leitung deiner Gemeinde hat
        ein neues Passwort gesetzt", OHNE das Passwort (die Leitung gibt es
        persoenlich weiter). Ohne Adresse keine Mail; ein Versandfehler
        aendert nichts. Am Request und an der Antwortform aendert sich
        nichts.


        SEIT 27.09.2026 (Audit Sicherheit BF-04): Das neue Passwort hebt
        eine Kontosperre nach Fehlversuchen auf (siehe POST
        /api/auth/login) -- der Weg der Leitung, wenn jemand ausgesperrt
        ist.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "User-ID" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, description: "volle validatePassword-Policy" }
      responses:
        "200": { description: "Passwort gesetzt; aktive Sockets des Users getrennt und seit 14.09.2026 alle Sitzungen beendet" }
        "400": { description: "Policy verletzt" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Konto nicht gefunden -- seit 03.10.2026 auch, wenn die Aenderung keine Zeile trifft (dann werden weder Sitzungen beendet noch Mails verschickt)" }
      x-berechtigung:
        rollen: [super_admin, org_admin]
        middleware: [verifyTokenRBAC, validateResetPassword]
        org-scope: true
        objekt-pruefung: "Inline: is_super_admin (org-uebergreifend, auch per Flag) ODER org_admin derselben Org; org_admin darf auch andere org_admins resetten -- aber kein Konto mit Rolle super_admin oder Flag is_super_admin (403, seit 26.09.2026)"
        # BEHOBEN 26.09.2026 (war N1): der Ziel-User wird jetzt auf
        # super_admin-Rolle ODER is_super_admin-Flag geprueft; nur ein
        # Super-Admin darf ein solches Konto zuruecksetzen. Vorher konnte ein
        # org_admin das Passwort eines org_admins MIT is_super_admin-Flag in
        # seiner Org setzen und dessen Super-Admin-Rechte uebernehmen
        # (Privilege Escalation). Der Kommentar "nur super_admin ist
        # geschuetzt" stimmte nur für die Rolle (org=NULL), nicht für das Flag.
        # BEHOBEN 14.09.2026 (war N2): der Reset setzt jetzt
        # token_invalidated_at, widerruft alle Refresh-Tokens des Ziel-Users
        # und loescht dessen Push-Tokens. Vorher lief die alte Sitzung weiter
        # — Access-Token bis zu 15 Minuten, Refresh-Token mit Rotation bis zu
        # 90 Tage. Genau diese Route wird benutzt, wenn ein Konto uebernommen
        # wurde. Gleiche Behandlung wie in der Selbstbedienungs-Route
        # PUT /api/auth/change-password.
        # BEHOBEN 03.10.2026 (Pruefung "Konto ohne Gemeinde"): Fuer ein Konto
        # ohne Gemeinde (organization_id NULL) traf das UPDATE mit
        # `organization_id = $3` keine Zeile -- die Route meldete 200
        # "erfolgreich", widerrief die Sitzungen und schickte die Mail, das
        # Passwort blieb das alte. Jetzt IS NOT DISTINCT FROM und Pruefung
        # von rowCount (0 Zeilen -> 404, sonst nichts).
        # Tests: backend/tests/routes/kontoOhneGemeinde.test.js.

