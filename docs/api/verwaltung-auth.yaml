        # gehen sie mit: DELETE FROM notifications WHERE user_id = ... AND
        # organization_id = <diese Org>, in derselben Transaktion.
        hinweis: >
          BEKANNT: laufende Access-Tokens mit active_organization_id-Claim
          wirken serverseitig bis Ablauf nach (max 15 Min + 30s Cache).
          BEHOBEN 26.09.2026 auf Client-Seite (Audit Grundgeruest BF-05): Die
          App holt beim ersten 403 "Kein Zugriff auf diese Organisation"
          (seit 29.09.2026 erkannt an error_code org_kein_zugriff) per
          POST /auth/refresh OHNE X-Active-Organization ein Token ohne Claim,
          baut den Socket damit neu auf und faellt sauber auf die Stamm-Org
