        entsteht der Vorgang der Anfrage (Art neue_gemeinde, Quelle anfrage,
        Betreff "Anfrage: <Gemeinde>", Status neu); scheitert er, gibt es auch
        keine Anfrage (500). Die Antwort der Route bleibt { ok: true }.

        HONIGTOPF: Ist `website` nicht leer, antwortet die Route ebenfalls 201
        { ok: true } -- auch bei sonst ungueltigen Feldern --, speichert aber
        nichts und schickt nichts.

        GRENZEN (Zaehler im gemeinsamen Store beider Replicas): 5 angenommene
        Anfragen je Stunde und Client-IP (clientIp: X-Real-IP nur aus dem
        Docker-Netz), danach 429; abgewiesene (400) zaehlen nicht, der
        Honigtopf zaehlt mit. Dazu 3 angenommene Anfragen je Tag und
        E-Mail-Adresse (ohne Gross/klein und Leerraum, ueber alle
        Client-Adressen; gezaehlt wird ein SHA-256-Pruefwert der Adresse).

        PROTOKOLL: nur die Kennung der Anfrage ("Gemeinde-Anfrage 12
        eingegangen"), bei Fehlern Kennung und Fehlercode -- keine Daten der
        Anfrage, auch nicht die Domain der Adresse.

        AUFBEWAHRUNG: abgelehnte Anfragen loescht der 02:00-Lauf 180 Tage nach
        der Ablehnung (BackgroundService.cleanupAbgelehnteAnfragen, gezaehlt ab
        status_seit); neue und in Arbeit befindliche nach 365 Tagen ohne
        Aenderung (cleanupUnbewegteAnfragen, gezaehlt ab updated_at); eine
        angelegte geht mit ihrer Gemeinde (DELETE /organizations/{id}); mit der
        Anfrage geht ihr Vorgang samt Mails. Datenschutzerklaerung Abschnitt 9c.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gemeinde, kontakt_name, email, einwilligung]
              properties:
                gemeinde: { type: string, maxLength: 200, description: "getrimmt, nicht leer" }
                kirchenkreis: { type: [string, "null"], maxLength: 200 }
                landeskirche: { type: [string, "null"], maxLength: 200 }
                kontakt_name: { type: string, maxLength: 200, description: "verantwortliche Person; getrimmt, nicht leer" }
                funktion: { type: [string, "null"], maxLength: 200 }
                email: { type: string, maxLength: 254, description: "gueltige Adresse; dorthin geht die Bestaetigung" }
                mobil: { type: [string, "null"], maxLength: 40, description: "nur Ziffern, Leerzeichen und + ( ) / -" }
                anzahl_konfis: { type: [integer, string, "null"], minimum: 0, maximum: 100000, description: "ungefaehr; Zahl oder Ziffernfolge, leer = null" }
                anzahl_teamer: { type: [integer, string, "null"], minimum: 0, maximum: 100000 }
                wunsch_lizenz:
                  type: [string, "null"]
                  enum: [klein, standard, plus, gross, verbund, "", null]
                  description: "Wunschlizenz (seit 03.10.2026, Migration 192); leer = keine Angabe. Anderes -> 400 'Bitte eine Lizenz aus der Liste wählen'."
                nachricht: { type: [string, "null"], maxLength: 5000 }
                einwilligung: { type: boolean, const: true, description: "muss genau true sein (nicht \"true\", nicht 1)" }
                website: { type: string, description: "Honigtopf: muss leer sein oder fehlen" }
      responses:
        "201": { description: "{ ok: true } -- gespeichert, oder Honigtopf gefuellt (dann nichts gespeichert)" }
        "400": { description: "{ error: 'Validierungsfehler', details: [{ field, message }] } -- ohne die Eingaben; nichts gespeichert, keine Mail" }
        "429": { description: "{ error } -- 'Zu viele Anfragen von dieser Verbindung. ...' (je Client-IP) oder 'Für diese E-Mail-Adresse sind heute schon mehrere Anfragen eingegangen. ...' (je Adresse)" }
        "500": { description: "{ error: 'Die Anfrage konnte nicht gespeichert werden. Bitte versucht es später erneut.' }" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: [ipGrenze, honigtopf, adressGrenze, express-validator]
        org-scope: false
        objekt-pruefung: "keine; Tests: backend/tests/routes/anfragen.test.js, tests/services/anfragenAufraeumen.test.js"

  /api/anliegen:
    post:
      tags: ["Support"]
      summary: Anliegen vom Support-Formular auf konfi-quest.de (OEFFENTLICH, ohne Anmeldung)
      description: >
        NEU 03.10.2026 (docs/planung/support-vorgaenge.md, Entscheidung 4;
        backend/routes/anliegen.js). Jedes Anliegen wird ein Vorgang der Quelle
        formular mit Status neu (support_vorgaenge, Migration 195; einwilligung_am
        = jetzt) und antwortet 201 { ok: true } -- ohne Nummer und ohne Zuordnung.
        Die Art "Neue Gemeinde" gibt es hier nie (dafuer POST /api/anfragen).

        ZUORDNUNG: Gehoert `email` (ohne Gross/klein) zu GENAU EINEM aktiven Konto
        (nicht Konfi) einer Gemeinde -- beide Quellen der Zugehoerigkeit,
        users.organization_id und user_organizations, die Rolle je Gemeinde --,
        bekommt der Vorgang diese organization_id; sonst bleibt sie leer, und der
        Support ordnet sie zu. Die Angabe `gemeinde` bleibt in jedem Fall als
        gemeinde_angabe am Vorgang.

        BESTAETIGUNG: NACH der Antwort geht eine Mail mit FESTEM Text an `email`
        (keine Eingabe aus dem Formular darin, nur die Nummer des Vorgangs --
        sonst liesse sich ueber den Server beliebiger Text an fremde Adressen
        schicken) vom Postfach support@ mit [Vorgang N] im Betreff, damit Antworten
        im Vorgang landen. Sie steht im Verlauf des Vorgangs, der Status bleibt neu.
        Auf einem Server mit RUN_BACKGROUND_JOBS=false (backend-test) geht nichts
        hinaus; scheitert die Mail, bleibt das Anliegen.

        HONIGTOPF, GRENZEN, PROTOKOLL wie POST /api/anfragen (utils/oeffentlicheGrenzen.js,
        eigene Zaehler): Ist `website` nicht leer, 201 { ok: true } ohne Speichern
        und ohne Mail; 5 angenommene Anliegen je Stunde und Client-IP, 3 je Tag und
        E-Mail-Adresse (SHA-256-Pruefwert), danach 429; abgewiesene (400) zaehlen
        nicht. Protokoll nur "Anliegen 12 eingegangen", keine Daten daraus; zum
        Anliegen wird keine IP-Adresse gespeichert.

        AUFBEWAHRUNG: Ein erledigter Vorgang ist archiviert; archivierte Vorgaenge
        loescht der 02:00-Lauf 730 Tage nach dem Archivieren, wenn sie sich seitdem
        nicht geaendert haben (BackgroundService.cleanupArchivierteVorgaenge).
        Datenschutzerklaerung Abschnitt 9e.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [gemeinde, name, email, art, betreff, beschreibung, einwilligung]
              properties:
                gemeinde: { type: string, maxLength: 200, description: "Freitext; getrimmt, nicht leer" }
                name: { type: string, maxLength: 200, description: "getrimmt, nicht leer" }
                email: { type: string, maxLength: 254, description: "gueltige Adresse; dorthin geht die Bestaetigung" }
                funktion: { type: [string, "null"], maxLength: 200 }
                art:
                  type: string
                  enum: [frage, fehler, wunsch, zugang, lizenz, datenschutz, sonstiges]
                  description: "ohne neue_gemeinde; anderes -> 400 'Bitte eine Art aus der Liste wählen'"
                bereich:
                  type: [string, "null"]
                  enum: [konfis, termine, punkte, challenges, chat, badges, material, konten, einstellungen, sonstiges, "", null]
                  description: "Pflicht bei Art frage, fehler und wunsch ('Bitte einen Bereich wählen'); sonst leer erlaubt"
                dringlichkeit: { type: string, enum: [normal, dringend], default: normal, description: "fehlt sie, gilt normal" }
                betreff: { type: string, maxLength: 120, description: "einzeilig (Zeilenumbrueche werden Leerzeichen), nicht leer" }
                beschreibung: { type: string, maxLength: 5000, description: "getrimmt, nicht leer" }
                einwilligung: { type: boolean, const: true, description: "muss genau true sein (nicht \"true\", nicht 1)" }
                website: { type: string, description: "Honigtopf: muss leer sein oder fehlen" }
      responses:
        "201": { description: "{ ok: true } -- gespeichert, oder Honigtopf gefuellt (dann nichts gespeichert)" }
        "400": { description: "{ error: 'Validierungsfehler', details: [{ field, message }] } -- ohne die Eingaben; nichts gespeichert, keine Mail" }
        "429": { description: "{ error } -- 'Zu viele Anliegen von dieser Verbindung. ...' (je Client-IP) oder 'Für diese E-Mail-Adresse sind heute schon mehrere Anliegen eingegangen. ...' (je Adresse)" }
        "500": { description: "{ error: 'Das Anliegen konnte nicht gespeichert werden. Bitte versucht es später erneut.' }" }
      x-berechtigung:
        rollen: [oeffentlich]
        middleware: [ipGrenze, honigtopf, adressGrenze, express-validator]
        org-scope: false
        objekt-pruefung: "keine; Tests: backend/tests/routes/anliegen.test.js"

  # --------------------------------------------------------------------------
  # /api/support (backend/routes/support.js, Mount /api/support): ALLE Routen
  # verifyTokenRBAC + requireSuperAdmin (Rolle oder Merkmal, mit oder ohne
  # Gemeinde); Gemeindeleitung, Leitung, Team und Konfis 403. Protokoll nur
  # mit Code und Meldung, nie err.detail. Tests: backend/tests/routes/
  # support.test.js, gemeindeAnlegenGemeinsam.test.js, supportUebersicht.test.js,
  # supportGemeinden.test.js, supportInterneGemeinden.test.js.
  # --------------------------------------------------------------------------
  /api/support/anfragen:
    get:
      tags: ["Support"]
      summary: Anfragen vom Formular, neueste zuerst
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [neu, in_arbeit, angelegt, abgelehnt] }, description: "filtert; ein anderer Wert 400" }
      responses:
        "200":
          description: "Array, nach created_at absteigend; je Anfrage ungelesen (additiv seit 03.10.2026, Support-Mail)"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/GemeindeAnfrage" }
        "400": { description: "unbekannter status" }
        "403": { description: "Kein Super-Admin" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "keine (alle Anfragen)"

  /api/support/anfragen/{id}:
    patch:
      tags: ["Support"]
      summary: Status und Notiz einer Anfrage setzen
      description: >
        Aendert sich der Status, beginnt status_seit neu (die 180-Tage-Frist
        abgelehnter Anfragen zaehlt ab dort); derselbe Status noch einmal
        laesst sie stehen. bearbeitet_von = aufrufendes Konto. Eine Anfrage,
        aus der eine Gemeinde entstanden ist (angelegt mit organization_id),
        behaelt den Status: ein anderer gibt 409; die Notiz bleibt aenderbar.
        "angelegt" laesst sich auch von Hand setzen (Gemeinde auf anderem Weg
        angelegt) -- dann ohne organization_id.

        VORGANG (seit 03.10.2026): Der Vorgang der Anfrage folgt -- neu und in
        Arbeit bleiben offen, angelegt und abgelehnt sind erledigt (und damit im
        Archiv); ein Vorgang "wartet" bleibt "wartet", solange die Anfrage "in
        Arbeit" ist; die Notiz ist dieselbe. Fehlt der Vorgang (Anfrage aus einem
        aelteren Stand), entsteht er hier.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [neu, in_arbeit, angelegt, abgelehnt] }
                notiz: { type: [string, "null"], maxLength: 5000, description: "getrimmt; leer = null" }
      responses:
        "200": { description: "Die Anfrage", content: { application/json: { schema: { $ref: "#/components/schemas/GemeindeAnfrage" } } } }
        "400": { description: "weder status noch notiz ('Nichts zu ändern: status oder notiz angeben'), unbekannter status, Notiz zu lang" }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "{ error: 'Anfrage nicht gefunden' }" }
        "409": { description: "{ error: 'Aus dieser Anfrage ist schon eine Gemeinde entstanden. Der Status bleibt „angelegt\".' }" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "Existenz der Anfrage, Zeile gesperrt (FOR UPDATE)"

  /api/support/anfragen/{id}/anlegen:
    post:
      tags: ["Support"]
      summary: Aus einer Anfrage eine Gemeinde samt erster Gemeindeleitung anlegen
      description: >
        DIESELBE Anlage wie POST /api/organizations (utils/gemeindeAnlegen.js:
        Rollen, erste Gemeindeleitung, 36 Abzeichen, 4 Zertifikatsarten, 6
        Stufen, 14 Kategorien, 9 Aktivitaeten, 3 Beispiel-Challenges,
        Benutzername systemweit unter derselben Sperre, Laufzeit und
        Konfi-Limit nach denselben Regeln) -- in EINER Transaktion mit der
        Anfrage: Danach status angelegt, organization_id gesetzt,
        bearbeitet_von = aufrufendes Konto. Scheitert die Anlage, bleibt die
        Anfrage unveraendert und es entsteht nichts.

        SYSTEMNAME: Ohne display_name ist `name` der Name der Gemeinde, wie er
        im Formular steht; der Systemname (name/slug) entsteht daraus mit
        Umlauten als ae/oe/ue/ss ("Kirchengemeinde Büsum" ->
        kirchengemeinde-buesum). Mit display_name ist `name` der Systemname
        wie bei POST /organizations (dieselbe Regel); sieht er nicht wie einer
        aus (Leerzeichen, Grossbuchstaben ...), entsteht er aus display_name.

        KIRCHENKREIS nur ueber kirchenkreis_id; dessen Name steht dann auch in
        der Textspalte kirchenkreis (Apps bis 2.3.0). Die Freitexte der
        Anfrage (kirchenkreis, landeskirche) werden nicht uebernommen.
        Kontakt- und Leitungsangaben nur aus dem Koerper (die Oberflaeche
        fuellt sie aus der Anfrage vor); E-Mail der Gemeindeleitung:
        admin_email, sonst contact_email.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "Kennung der Anfrage" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, admin_username, admin_display_name, admin_password]
              properties:
                name: { type: string, maxLength: 200 }
                display_name: { type: string, maxLength: 200 }
                kirchenkreis_id: { type: [integer, "null"] }
                description: { type: string }
                contact_name: { type: string }
                contact_email: { type: string }
                contact_phone: { type: string }
                address: { type: string }
                website_url: { type: string }
                max_konfis: { type: [integer, "null"], minimum: 0, description: "wie POST /organizations; leer = unbegrenzt" }
                trial_ends_at: { type: [string, "null"], format: date-time, description: "wie POST /organizations: fehlt das Feld, 30 Tage Testphase; null = unbegrenzt" }
                is_trial: { type: boolean, description: "nur zusammen mit trial_ends_at" }
                admin_username: { type: string }
                admin_display_name: { type: string }
                admin_email: { type: string, description: "gueltige Adresse; fehlt sie, contact_email" }
                admin_password: { type: string, description: "volle validatePassword-Policy" }
      responses:
        "201":
          description: "Angelegt"
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization_id: { type: integer }
                  admin_id: { type: integer }
        "400": { description: "Validierungsfehler (details je Feld), 'Konfi-Limit muss eine Zahl ab 0 oder leer sein', 'Kirchenkreis nicht gefunden', 'Ungültiger Kirchenkreis', 'Aus diesem Namen lässt sich kein Systemname bilden'" }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "{ error: 'Anfrage nicht gefunden' }" }
        "409": { description: "'Benutzername existiert bereits (muss systemweit eindeutig sein)', 'Gemeinde-Slug existiert bereits' (wie POST /organizations) oder 'Aus dieser Anfrage ist schon eine Gemeinde entstanden.'" }
        "500": { description: "{ error: 'Datenbankfehler' } -- nichts angelegt, Anfrage unveraendert" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "Anfrage existiert und ist nicht angelegt (FOR UPDATE)"

  /api/support/landeskirchen:
    get:
      tags: ["Support"]
      summary: Landeskirchen mit ihren Kirchenkreisen
      responses:
        "200":
          description: "Array nach Name (ohne Gross/klein); kirchenkreise ebenso sortiert"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Landeskirche" }
        "403": { description: "Kein Super-Admin" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "keine"
    post:
      tags: ["Support"]
      summary: Landeskirche anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 200, description: "getrimmt, nicht leer" } } }
      responses:
        "201": { description: "Die Landeskirche, kirchenkreise: []", content: { application/json: { schema: { $ref: "#/components/schemas/Landeskirche" } } } }
        "400": { description: "Name fehlt oder zu lang" }
        "403": { description: "Kein Super-Admin" }
        "409": { description: "{ error: 'Diese Landeskirche gibt es schon' } (Name ohne Gross/klein)" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "keine"

  /api/support/landeskirchen/{id}:
    put:
      tags: ["Support"]
      summary: Landeskirche umbenennen
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 200 } } }
      responses:
        "200": { description: "Die Landeskirche samt Kirchenkreisen", content: { application/json: { schema: { $ref: "#/components/schemas/Landeskirche" } } } }
        "400": { description: "Name fehlt oder zu lang" }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "{ error: 'Landeskirche nicht gefunden' }" }
        "409": { description: "{ error: 'Diese Landeskirche gibt es schon' }" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "Existenz"
    delete:
      tags: ["Support"]
      summary: Landeskirche loeschen -- nur ohne Kirchenkreise
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ message: 'Landeskirche gelöscht' }" }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "{ error: 'Landeskirche nicht gefunden' }" }
        "409": { description: "{ error: 'An dieser Landeskirche hängen noch N Kirchenkreise. Ordne sie zuerst einer anderen zu oder lösche sie.' } -- nichts geloescht" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "Existenz, keine Kirchenkreise (FOR UPDATE)"

  /api/support/kirchenkreise:
    get:
      tags: ["Support"]
      summary: Kirchenkreise mit Landeskirche und Zahl der zugeordneten Gemeinden
      description: "anzahl_gemeinden zaehlt keine internen Gemeinden (organizations.intern)."
      responses:
        "200":
          description: "Array: zuerst die ohne Landeskirche, dann nach Landeskirche und Name"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Kirchenkreis" }
        "403": { description: "Kein Super-Admin" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "keine"
    post:
      tags: ["Support"]
      summary: Kirchenkreis anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 200 }
                landeskirche_id: { type: [integer, "null"], description: "darf fehlen" }
      responses:
        "201": { description: "Der Kirchenkreis", content: { application/json: { schema: { $ref: "#/components/schemas/Kirchenkreis" } } } }
        "400": { description: "Name fehlt oder zu lang; 'Ungültige Landeskirche'; { error: 'Landeskirche nicht gefunden' }" }
        "403": { description: "Kein Super-Admin" }
        "409": { description: "{ error: 'Diesen Kirchenkreis gibt es in dieser Landeskirche schon' } (eindeutig je Landeskirche und Name ohne Gross/klein, auch ohne Landeskirche)" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "Landeskirche existiert"

  /api/support/kirchenkreise/{id}:
    put:
      tags: ["Support"]
      summary: Kirchenkreis umbenennen oder einer Landeskirche zuordnen
      description: >
        landeskirche_id nur, wenn mitgeschickt (null loest die Zuordnung);
        fehlt das Feld, bleibt sie. Der neue Name zieht in die Textspalte
        organizations.kirchenkreis aller zugeordneten Gemeinden
        (utils/kirchenkreisZuordnung.js), in derselben Transaktion.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 200 }
                landeskirche_id: { type: [integer, "null"] }
      responses:
        "200": { description: "Der Kirchenkreis", content: { application/json: { schema: { $ref: "#/components/schemas/Kirchenkreis" } } } }
        "400": { description: "wie POST" }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "{ error: 'Kirchenkreis nicht gefunden' }" }
        "409": { description: "{ error: 'Diesen Kirchenkreis gibt es in dieser Landeskirche schon' }" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "Existenz"
    delete:
      tags: ["Support"]
      summary: Kirchenkreis loeschen -- die Gemeinden bleiben, ohne Zuordnung
      description: >
        Setzt organizations.kirchenkreis_id UND die gespiegelte Textspalte
        kirchenkreis der zugeordneten Gemeinden auf NULL, dann loeschen -- in
        einer Transaktion. gemeinden_ohne_zuordnung meldet die sichtbaren
        Gemeinden; interne verlieren die Zuordnung ebenfalls, zaehlen aber
        nicht mit.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: "Geloescht"
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, description: "'Kirchenkreis gelöscht'" }
                  gemeinden_ohne_zuordnung: { type: integer, description: "Gemeinden, die die Zuordnung verlieren, ohne interne" }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "{ error: 'Kirchenkreis nicht gefunden' }" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "Existenz (FOR UPDATE)"

  /api/support/statistik:
    get:
      tags: ["Support"]
      summary: Statistik je Gemeinde -- Konten je Rolle, aktive Konten, Jahrgaenge; ohne Namen von Personen
      description: >
        Alle Gemeinden (auch gesperrte und solche ohne Konten), nach Name --
        ausser den internen (organizations.intern, seit 03.10.2026; Migration
        194). Zusammenfassen je Kirchenkreis und Landeskirche macht die
        Oberflaeche. KONTEN je Gemeinde aus beiden Quellen der Zugehoerigkeit
        (utils/orgMitglieder.js, zaehleKontenJeGemeinde): Rolle je Gemeinde
        (Stamm users.role_id, weitere user_organizations.role_id; steht die
        Stamm-Gemeinde in beiden, zaehlt die Person einmal mit der Rolle am
        Konto); geloeschte und gesperrte Konten nicht; Support-Konten ohne
        Gemeinde nicht, auch nicht als Gast. AKTIV_30_TAGE: davon die Konten
        mit Anmeldung (last_login_at) oder erneuerter Anmeldung (Refresh-Token)
        in den letzten 30 Tagen -- je Konto, wer in zwei Gemeinden mitarbeitet,
        zaehlt in beiden. KIRCHENKREIS und LANDESKIRCHE aus der Zuordnung
        (kirchenkreis_id), nicht aus dem Freitext.
      responses:
        "200":
          description: "{ stand, gemeinden }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  stand: { type: string, format: date-time }
                  gemeinden:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string, description: "Anzeigename (organizations.display_name, sonst name)" }
                        systemname: { type: string, description: "organizations.name (zusaetzlich zum Vertrag)" }
                        is_active: { type: boolean }
                        kirchenkreis_id: { type: [integer, "null"] }
                        kirchenkreis: { type: [string, "null"] }
                        landeskirche_id: { type: [integer, "null"] }
                        landeskirche: { type: [string, "null"] }
                        konten:
                          type: object
                          properties:
                            konfi: { type: integer }
                            teamer: { type: integer }
                            admin: { type: integer }
                            org_admin: { type: integer }
                        aktiv_30_tage: { type: integer }
                        jahrgaenge: { type: integer }
        "403": { description: "Kein Super-Admin" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "keine (alle Gemeinden ausser den internen); keine Personennamen in der Antwort"

  /api/support/uebersicht:
    get:
      tags: ["Support"]
      summary: Übersicht (Dashboard) -- Kennzahlen, Entwicklung über 12 Monate, Aktivität über 12 Wochen, neueste Anfragen und Mails, Testphasen
      description: >
        Das Dashboard der Web-Ansicht (docs/planung/support-web.md,
        routes/supportUebersicht.js). INTERNE GEMEINDEN (organizations.intern)
        zaehlen nirgends mit; Mails werden nicht nach intern gefiltert.

        ZEITRAEUME: Kalendermonate und ISO-Wochen (Montag bis Sonntag) in der
        Zeitzone Europe/Berlin, die laufende eingeschlossen, aeltester bzw.
        aelteste zuerst, lueckenlos mit 0 -- immer genau 12. Ausgangspunkt ist
        der Zeitpunkt der Anfrage; weder die Uhr noch die Sitzungszone der
        Datenbank spielen eine Rolle. Zeilen um Mitternacht Berlin liegen im
        Berliner Monat bzw. in der Berliner Woche (nicht im UTC-Nachbarn);
        Wochen tragen das ISO-Jahr (29.12.2025 bis 04.01.2026 ist 2026-W01).

        WELCHE TABELLEN: Antraege = activity_requests (created_at), Buchungen
        = event_bookings (booking_date, alle Status), Nachrichten =
        chat_messages (created_at; die Gemeinde kommt vom Raum, chat_rooms).
        Die Gemeinde einer Zeile ist ihre organization_id; eine Zeile ohne
        Gemeinde zaehlt nicht.

        KONTEN, einheitlich mit GET /support/statistik: Rolle je Gemeinde ueber
        beide Quellen der Zugehoerigkeit (utils/orgMitglieder.js,
        MITGLIEDSCHAFTEN_SQL). In der Entwicklung zaehlt jedes Konto einmal
        (team oder konfi), sodass konten_gesamt je Monat um konten_neu.konfi +
        konten_neu.team waechst, solange kein Konto wegfaellt.

        Acht Abfragen fuer die ganze Antwort, keine Schleife ueber Gemeinden,
        auf einer Verbindung in einer schreibgeschuetzten Transaktion
        (REPEATABLE READ: alle Zahlen aus demselben Stand) und ohne JIT.
        Gemessen am 03.10.2026 (PostgreSQL 16, 150 Gemeinden, 6.000 Konten,
        300.000 Nachrichten, 80.000 Buchungen, 40.000 Antraege): 1.070 ms mit
        JIT, 188 ms ohne (Median aus acht Aufrufen); allein die Wochenabfrage
        1.150 ms gegen 58 ms. Tests: backend/tests/routes/supportUebersicht.test.js,
        supportInterneGemeinden.test.js.
      responses:
        "200":
          description: "{ kennzahlen, entwicklung, aktivitaet, neueste_anfragen, neueste_mails, testphase_endet }"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SupportUebersicht" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Kein Super-Admin" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "keine (alle Gemeinden ausser den internen); keine Personennamen ausser Kontaktname und Absender der Anfragen und Mails"

  /api/support/gemeinden:
    get:
      tags: ["Support"]
      summary: Gemeindeliste mit Zuordnung, Laufzeit, Zählern und Gemeindeleitung
      description: >
        Alle Gemeinden ausser den internen (organizations.intern), auch
        gesperrte; sortiert nach Landeskirche, Kirchenkreis und Anzeigename
        ohne Unterschied zwischen Gross und Klein, Gemeinden ohne Zuordnung
        zuletzt (ein Kirchenkreis ohne Landeskirche steht nach denen mit
        Landeskirche, vor Gemeinden ganz ohne Zuordnung). Je Gemeinde die
        Gemeindeleitung direkt dabei (leitung), damit die Support-Ansicht
        sofort zum Admin der Gemeinde kommt. Drei Abfragen, keine Schleife
        ueber Gemeinden. Kollidiert nicht mit /api/support/gemeinden/{id}/...
        der Support-Mail. Tests: backend/tests/routes/supportGemeinden.test.js,
        supportInterneGemeinden.test.js.
      responses:
        "200":
          description: "Array"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportGemeinde" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Kein Super-Admin" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "keine (alle Gemeinden ausser den internen); Name, Benutzername und E-Mail der Gemeindeleitung in der Antwort"

  # --------------------------------------------------------------------------
  # Support-Mail (backend/routes/supportMail.js, in routes/support.js HINTER
  # verifyTokenRBAC + requireSuperAdmin eingehaengt; docs/planung/
  # support-mail.md). Zwei Postfaecher: moin (Anfragen, Erstkontakt) und
  # support (bestehende Gemeinden). Abholen per IMAP nur lesend auf dem
  # Cron-Leader (services/mailAbholung.js), Zuordnen eingehender Mails an
  # einer Stelle (utils/mailZuordnung.js), Versand services/mailVersand.js.
  # Auf einem Server mit RUN_BACKGROUND_JOBS=false (backend-test) wird weder
  # abgeholt noch gesendet. Protokoll ohne Inhalte und Adressen. Tests:
  # backend/tests/routes/supportMail.test.js, supportMailAntworten.test.js,
  # tests/services/mailAbholung.test.js, mailVersand.test.js,
  # mailHintergrund.test.js, tests/utils/mailZuordnung.test.js,
  # mailPostfaecher.test.js.
  # --------------------------------------------------------------------------
  # --------------------------------------------------------------------------
  # /api/support/vorgaenge (backend/routes/supportVorgaenge.js, Migration 195;
  # docs/planung/support-vorgaenge.md): jede Anfrage, Mail und jedes Anliegen
  # aus dem Formular ist ein Vorgang. Alle Routen hinter requireSuperAdmin.
  # Tests: backend/tests/routes/supportVorgaenge.test.js,
  # supportMailVorgaenge.test.js, anfragenVorgang.test.js, anliegen.test.js,
  # tests/services/mailAbholungVorgaenge.test.js, vorgaengeAufraeumen.test.js,
  # tests/schema/migration195SupportVorgaenge.test.js.
  # --------------------------------------------------------------------------
  /api/support/vorgaenge:
    get:
      tags: ["Support"]
      summary: Vorgaenge -- die Liste des Supports, mit Filtern und Suche
      description: >
        Neueste Aktivitaet zuerst (letzte_aktivitaet, dann Nummer), hoechstens
        1.000. filter: offen (Vorgabe: nicht archiviert, Status neu, in_arbeit
        oder wartet), neu, in_arbeit, wartet (je nicht archiviert), erledigt
        (Status erledigt), archiv (ALLE archivierten, auch die erledigten),
        alle (nicht archiviert, jeder Status -- Zusatz). art und gemeinde
        (Kennung) verbinden sich mit dem Filter. suche: Nummer ("12" oder "#12"),
        Betreff, Beschreibung, Gemeinde (Name, Anfrage, Angabe im Formular),
        Kontakt und Absender bzw. Betreff der Mails, ohne Unterschied Gross/klein;
        % und _ im Suchtext sind Text. Vorgaenge interner Gemeinden
        (organizations.intern) stehen hier wie jeder andere -- der Support
        bearbeitet sie --; nur die Zahlen der Uebersicht lassen sie weg.
      parameters:
        - { name: filter, in: query, required: false, schema: { type: string, enum: [offen, neu, in_arbeit, wartet, erledigt, archiv, alle], default: offen } }
        - { name: art, in: query, required: false, schema: { $ref: "#/components/schemas/SupportVorgangArt" } }
        - { name: gemeinde, in: query, required: false, schema: { type: integer, minimum: 1 }, description: "Kennung der Gemeinde (organization_id)" }
        - { name: suche, in: query, required: false, schema: { type: string, maxLength: 200 } }
      responses:
        "200":
          description: "Array"
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SupportVorgangListe" }
        "400": { description: "unbekannter filter oder unbekannte art, ungueltige gemeinde, zu langer Suchtext" }
        "403": { description: "Kein Super-Admin" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin, express-validator]
        org-scope: false
        objekt-pruefung: "keine (alle Vorgaenge)"
    post:
      tags: ["Support"]
      summary: Einen Vorgang anlegen -- auf Wunsch zugleich eine Mail an die Gemeinde
      description: >
        { art, bereich?, dringlichkeit?, betreff, organization_id?, text?, an? }.
        Quelle support, Status neu, erstellt_von = aufrufendes Konto. Mit `text`
        geht zugleich eine Mail vom Postfach support an `an` (muss unter den
        Empfaengern der Gemeinde stehen, GET /gemeinden/{id}/empfaenger; ohne
        Angabe der erste), mit [Vorgang N] im Betreff; der Vorgang geht auf
        in_arbeit, die Mail steht im Verlauf. Dafuer ist organization_id
        noetig (400). Scheitert der Versand (502, 503), entsteht kein Vorgang.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [art, betreff]
              properties:
                art: { $ref: "#/components/schemas/SupportVorgangArt" }
                bereich: { $ref: "#/components/schemas/SupportVorgangBereich" }
                dringlichkeit: { type: string, enum: [normal, dringend], default: normal }
                betreff: { type: string, maxLength: 300, description: "einzeilig, nicht leer" }
                organization_id: { type: [integer, "null"] }
                text: { type: [string, "null"], maxLength: 20000, description: "Mail an die Gemeinde; leer = keine Mail" }
                an: { type: [string, "null"], maxLength: 320 }
      responses:
        "201": { description: "Das Detail des neuen Vorgangs", content: { application/json: { schema: { $ref: "#/components/schemas/SupportVorgang" } } } }
        "400": { description: "Validierungsfehler; Text ohne Gemeinde ('Für eine Mail braucht der Vorgang eine Gemeinde.'); Adresse nicht unter den Empfaengern; Gemeinde ohne bekannte Adresse -- dann entsteht nichts" }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "{ error: 'Gemeinde nicht gefunden' }" }
        "502": { description: "Versand gescheitert -- nichts angelegt" }
        "503": { description: "Postfach nicht eingerichtet oder 'Auf diesem Server ist der Versand aus.' (RUN_BACKGROUND_JOBS=false)" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin, express-validator]
        org-scope: false
        objekt-pruefung: "Existenz der Gemeinde; Empfaenger aus den Empfaengern der Gemeinde"

  /api/support/vorgaenge/{id}:
    get:
      tags: ["Support"]
      summary: Ein Vorgang mit Verlauf, Anfrage, Gemeinde und Gemeindeleitung
      description: >
        Alle Felder der Liste, dazu notiz, beschreibung, kontakt_*, gemeinde_angabe,
        einwilligung_am, erstellt_von(_name), verlauf (Mails, aelteste zuerst),
        anfrage (bei Art neue_gemeinde), gemeinde, leitung und -- zusaetzlich
        zum Vertrag -- empfaenger (Adressen, an die eine Antwort gehen darf).
        Liest nur; gelesen setzt POST /mail/gelesen.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Das Detail", content: { application/json: { schema: { $ref: "#/components/schemas/SupportVorgang" } } } }
        "400": { description: "ungueltige Kennung" }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "{ error: 'Vorgang nicht gefunden' }" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "Existenz"
    patch:
      tags: ["Support"]
      summary: Einordnen -- Art, Bereich, Dringlichkeit, Status, Betreff, Gemeinde, Notiz
      description: >
        Nur die genannten Felder aendern sich (mindestens eines, sonst 400).
        STATUS: status_seit laeuft neu, wenn sich der Status aendert. "erledigt"
        legt den Vorgang ins Archiv (archiviert_am); ein anderer Status holt
        einen erledigten aus dem Archiv. GEMEINDE: organization_id setzen oder
        mit null loesen; die Mails des Vorgangs folgen (organization_id an der
        Mail, die alten Routen lesen sie; bei einem Anfrage-Vorgang bleibt
        anfrage_id, nie beides). ANFRAGE: Bei einem Anfrage-Vorgang folgt die
        Anfrage -- neu -> neu, in_arbeit und wartet -> in_arbeit, erledigt ->
        abgelehnt, eine angelegte bleibt angelegt --, ihre Notiz ist die des
        Vorgangs, und jede Aenderung zaehlt als Bewegung der Anfrage
        (365-Tage-Frist). bearbeitet_von der Anfrage = aufrufendes Konto.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                art: { $ref: "#/components/schemas/SupportVorgangArt" }
                bereich: { $ref: "#/components/schemas/SupportVorgangBereich" }
                dringlichkeit: { type: string, enum: [normal, dringend] }
                status: { type: string, enum: [neu, in_arbeit, wartet, erledigt] }
                betreff: { type: string, maxLength: 300, description: "einzeilig, nicht leer" }
                organization_id: { type: [integer, "null"] }
                notiz: { type: [string, "null"], maxLength: 5000, description: "getrimmt; leer = null" }
      responses:
        "200": { description: "Das Detail", content: { application/json: { schema: { $ref: "#/components/schemas/SupportVorgang" } } } }
        "400": { description: "kein Feld ('Nichts zu ändern: …'), unbekannter Wert, Betreff leer oder zu lang, Notiz zu lang" }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "{ error: 'Vorgang nicht gefunden' } oder { error: 'Gemeinde nicht gefunden' } -- dann aendert sich nichts" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin, express-validator]
        org-scope: false
        objekt-pruefung: "Existenz von Vorgang und Gemeinde, Zeile gesperrt (FOR UPDATE)"
    delete:
      tags: ["Support"]
      summary: Einen Vorgang loeschen -- samt seinen Mails und einer daran haengenden Anfrage
      description: >
        Der Vorgang, seine Mails IN KONFI QUEST (im Postfach bleibt alles --
        Konfi Quest liest die Postfaecher nur) und die Anfrage dahinter, falls
        es eine gibt (eine daraus entstandene Gemeinde bleibt). Nicht
        rueckgaengig.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ message: 'Vorgang gelöscht' }" }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "{ error: 'Vorgang nicht gefunden' }" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "Existenz"

  /api/support/vorgaenge/{id}/antworten:
    post:
      tags: ["Support"]
      summary: Antwort im Vorgang -- Mail mit [Vorgang N] im Betreff
      description: >
        { betreff?, text, an? }. Vom Postfach moin (Vorgang einer Anfrage),
        sonst support; Fusszeile, Message-ID, In-Reply-To/References auf die
        letzte Mail des Vorgangs und Standardbetreff wie bei den alten
        Antwort-Routen ("Re: <letzter Betreff>", ohne Verlauf der Betreff des
        Vorgangs bzw. "Eure Anfrage für <Gemeinde>"); Kennung [Vorgang N], eine
        alte Kennung [Anfrage N]/[Gemeinde N] im Betreff weicht ihr. `an` muss
        unter `empfaenger` im Detail stehen (ohne Unterschied Gross/klein); ohne
        Angabe geht die Mail an die erste. Die Mail gehoert zum Vorgang
        (vorgang_id; anfrage_id/organization_id folgen ihm). Ein Vorgang im
        Status neu geht auf in_arbeit, mit ihm die Anfrage dahinter; ein
        Vorgang "wartet" oder "in Arbeit" bleibt. Scheitert der Versand,
        wird nichts gespeichert.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                betreff: { type: [string, "null"], maxLength: 300 }
                text: { type: string, maxLength: 20000 }
                an: { type: [string, "null"], maxLength: 320 }
      responses:
        "201": { description: "{ nachricht: MailNachricht }" }
        "400": { description: "Validierungsfehler; Adresse nicht unter den Empfaengern ('Diese Adresse gehört nicht zu den Empfängern dieses Vorgangs.'); kein Empfaenger bekannt" }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "{ error: 'Vorgang nicht gefunden' }" }
        "502": { description: "Versand gescheitert -- nichts gespeichert" }
        "503": { description: "Postfach nicht eingerichtet oder 'Auf diesem Server ist der Versand aus.' (RUN_BACKGROUND_JOBS=false)" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin, express-validator]
        org-scope: false
        objekt-pruefung: "Existenz; Empfaenger aus den Empfaengern des Vorgangs (keine freie Adresse)"

  /api/support/vorgaenge/{id}/archivieren:
    post:
      tags: ["Support"]
      summary: Einen Vorgang archivieren
      description: >
        Setzt archiviert_am (ein vorhandener Zeitpunkt bleibt); der Vorgang
        verschwindet aus den offenen Listen, bleibt unter filter=archiv mit
        Suche und behaelt seinen Status. Eine neue Mail im Vorgang holt ihn
        zurueck (nicht mehr archiviert, Status in_arbeit, Mail ungelesen).
        Archivierte Vorgaenge loescht der 02:00-Lauf 730 Tage nach dem
        Archivieren, wenn sie sich seitdem nicht geaendert haben -- Vorgaenge
        einer Anfrage folgen den Fristen der Anfrage.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Das Detail", content: { application/json: { schema: { $ref: "#/components/schemas/SupportVorgang" } } } }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "{ error: 'Vorgang nicht gefunden' }" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "Existenz"

  /api/support/vorgaenge/{id}/wiederherstellen:
    post:
      tags: ["Support"]
      summary: Einen archivierten Vorgang wiederherstellen
      description: >
        Loescht archiviert_am. Ein erledigter Vorgang geht dabei auf in_arbeit
        (status_seit laeuft neu), jeder andere behaelt seinen Status; die
        Anfrage dahinter folgt. Ein nicht archivierter Vorgang bleibt, wie er ist.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Das Detail", content: { application/json: { schema: { $ref: "#/components/schemas/SupportVorgang" } } } }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "{ error: 'Vorgang nicht gefunden' }" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "Existenz"

  /api/support/vorgaenge/sammel:
    post:
      tags: ["Support"]
      summary: Sammelaktion fuer mehrere Vorgaenge -- archivieren, wiederherstellen, loeschen, Status setzen
      description: >
        { ids, aktion, status? } (1 bis 500 Kennungen). Wirkt wie die Einzel-Routen,
        in einer Transaktion; unbekannte und doppelte Kennungen werden
        uebergangen. aktion status verlangt `status`; "erledigt" archiviert, ein
        anderer Status holt aus dem Archiv, Anfrage-Vorgaenge ziehen ihre Anfrage mit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, aktion]
              properties:
                ids: { type: array, minItems: 1, maxItems: 500, items: { type: integer, minimum: 1 } }
                aktion: { type: string, enum: [archivieren, wiederherstellen, loeschen, status] }
                status: { type: string, enum: [neu, in_arbeit, wartet, erledigt], description: "nur bei aktion status, dort Pflicht" }
      responses:
        "200":
          description: "{ aktion, anzahl, ids } -- ids: die tatsaechlich betroffenen Vorgaenge, aufsteigend"
          content:
            application/json:
              schema:
                type: object
                properties:
                  aktion: { type: string }
                  anzahl: { type: integer }
                  ids: { type: array, items: { type: integer } }
        "400": { description: "ids fehlt, leer, zu lang oder keine Zahlen; unbekannte aktion; status fehlt oder unbekannt" }
        "403": { description: "Kein Super-Admin" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin, express-validator]
        org-scope: false
        objekt-pruefung: "keine (alle Vorgaenge)"

  /api/support/mail/nachrichten/{id}/einsortieren:
    post:
      tags: ["Support"]
      summary: Eine Mail in einen bestehenden oder neuen Vorgang einsortieren
      description: >
        { vorgang_id } oder { neu: { art, bereich?, dringlichkeit?, betreff?,
        organization_id? } } -- genau eines. Neuer Vorgang: Quelle mail,
        Status neu, erstellt_von = aufrufendes Konto, Betreff der Mail ohne
        Re:/AW:, wenn keiner angegeben. Liegt die Mail im Posteingang, geht ihr
        ganzer Faden mit -- soweit er noch im Posteingang liegt; eine Mail, die
        schon in einem Vorgang liegt, wird allein verschoben. Eine archivierte
        Mail ist danach nicht mehr archiviert. anfrage_id und organization_id an
        der Mail folgen dem Vorgang. Der Vorgang gilt als bewegt.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vorgang_id: { type: integer, minimum: 1 }
                neu:
                  type: object
                  required: [art]
                  properties:
                    art: { $ref: "#/components/schemas/SupportVorgangArt" }
                    bereich: { $ref: "#/components/schemas/SupportVorgangBereich" }
                    dringlichkeit: { type: string, enum: [normal, dringend] }
                    betreff: { type: [string, "null"], maxLength: 1000 }
                    organization_id: { type: [integer, "null"] }
      responses:
        "200":
          description: "{ anzahl, vorgang_id, ids }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  anzahl: { type: integer }
                  vorgang_id: { type: integer }
                  ids: { type: array, items: { type: integer } }
        "400": { description: "weder vorgang_id noch neu, oder beides; ungueltige Werte" }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "'Mail nicht gefunden', 'Vorgang nicht gefunden' oder 'Gemeinde nicht gefunden' -- dann aendert sich nichts" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin, express-validator]
        org-scope: false
        objekt-pruefung: "Existenz von Mail, Vorgang (FOR UPDATE) und Gemeinde"

  /api/support/mail/nachrichten/{id}/archivieren:
    post:
      tags: ["Support"]
      summary: Eine Mail im Posteingang archivieren
      description: >
        Setzt archiviert_am (ein vorhandener Zeitpunkt bleibt). Nur fuer Mails im
        Posteingang -- ohne Vorgang, Anfrage und Gemeinde; sonst 409. Die Mail
        verschwindet aus GET /mail/eingang und steht unter archiv=1. Archivierte
        Mails loescht der 02:00-Lauf wie alle des Posteingangs 180 Tage nach dem
        Eingang in Konfi Quest.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ id, archiviert_am }", content: { application/json: { schema: { type: object, properties: { id: { type: integer }, archiviert_am: { type: [string, "null"], format: date-time } } } } } }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "{ error: 'Mail nicht gefunden' }" }
        "409": { description: "'Das geht nur für Mails im Posteingang. Mails eines Vorgangs gehen mit dem Vorgang.'" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "Mail existiert und liegt im Posteingang"

  /api/support/mail/nachrichten/{id}/wiederherstellen:
    post:
      tags: ["Support"]
      summary: Eine archivierte Mail zurueck in den Eingang legen
      description: "Loescht archiviert_am; eine nicht archivierte Mail bleibt, wie sie ist. Nur fuer Mails im Posteingang (409)."
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ id, archiviert_am: null }", content: { application/json: { schema: { type: object, properties: { id: { type: integer }, archiviert_am: { type: [string, "null"], format: date-time } } } } } }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "{ error: 'Mail nicht gefunden' }" }
        "409": { description: "'Das geht nur für Mails im Posteingang. …'" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "Mail existiert und liegt im Posteingang"

  /api/support/mail/sammel:
    post:
      tags: ["Support"]
      summary: Sammelaktion fuer Mails im Posteingang -- archivieren, wiederherstellen, loeschen
      description: >
        { ids, aktion } (1 bis 500 Kennungen). Wirkt wie die Einzel-Routen auf die
        Mails des Posteingangs; Mails in Vorgaengen, ausgehende und unbekannte
        Kennungen werden uebergangen. Geloescht wird nur in Konfi Quest, nie im
        Postfach.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, aktion]
              properties:
                ids: { type: array, minItems: 1, maxItems: 500, items: { type: integer, minimum: 1 } }
                aktion: { type: string, enum: [archivieren, wiederherstellen, loeschen] }
      responses:
        "200":
          description: "{ aktion, anzahl, ids } -- ids: die tatsaechlich betroffenen Mails, aufsteigend"
          content:
            application/json:
              schema:
                type: object
                properties:
                  aktion: { type: string }
                  anzahl: { type: integer }
                  ids: { type: array, items: { type: integer } }
        "400": { description: "ids fehlt, leer, zu lang oder keine Zahlen; unbekannte aktion" }
        "403": { description: "Kein Super-Admin" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin, express-validator]
        org-scope: false
        objekt-pruefung: "keine (Mails des Posteingangs)"

  /api/support/mail/status:
    get:
      tags: ["Support"]
      summary: Zustand der Postfaecher moin und support
      description: >
        Beide Postfaecher in fester Reihenfolge. Eingerichtet ist ein
        Postfach, wenn Benutzer, Passwort und IMAP-Host als
        Umgebungsvariablen gesetzt sind (leer = nicht gesetzt). abgeholt_am,
        fehler und fehler_am aus mail_abholstand (Fehler ohne Adressen).
        auf_diesem_server (zusaetzlich zum Vertrag): false auf einem Server
        mit RUN_BACKGROUND_JOBS=false -- dort wird weder abgeholt noch
        gesendet.
      responses:
        "200":
          description: "{ postfaecher }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  postfaecher:
                    type: array
                    items:
                      type: object
                      properties:
                        postfach: { type: string, enum: [moin, support] }
                        adresse: { type: string }
                        eingerichtet: { type: boolean }
                        abgeholt_am: { type: [string, "null"], format: date-time }
                        fehler: { type: [string, "null"] }
                        fehler_am: { type: [string, "null"], format: date-time }
                        auf_diesem_server: { type: boolean }
        "403": { description: "Kein Super-Admin" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "keine; keine Zugangsdaten in der Antwort"

  /api/support/mail/zaehler:
    get:
      tags: ["Support"]
      summary: Ungelesene eingehende Mails und offene Vorgaenge -- rote Zahlen der Support-Ansicht
      description: >
        Ungelesen heisst: eingehend, gelesen_am leer, nicht archiviert.
        anfragen, gemeinden, je_anfrage, je_gemeinde zaehlen nach anfrage_id bzw.
        organization_id der Mail (die alten Apps lesen sie); eingang: im
        Posteingang -- ohne Vorgang, Anfrage und Gemeinde. Seit 03.10.2026
        (Migration 195, additiv): posteingang -- dieselbe Zahl, die die
        Web-Ansicht liest: ungelesen, nicht einsortiert, nicht archiviert --
        und vorgaenge: nicht archivierte Vorgaenge mit Status neu ODER mit
        einer ungelesenen Mail. Interne Gemeinden zaehlen bei vorgaenge mit: Ihre
        Vorgaenge stehen in der Liste, die Zahl muss zu ihr passen.
      responses:
        "200":
          description: "anfragen/gemeinden/eingang: Summen; je_anfrage und je_gemeinde: Kennung -> Anzahl (nur mit mindestens einer); vorgaenge und posteingang (additiv)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  vorgaenge: { type: integer, description: "nicht archivierte Vorgaenge mit Status neu oder ungelesener Mail (additiv seit 03.10.2026)" }
                  posteingang: { type: integer, description: "ungelesene, nicht einsortierte, nicht archivierte Mails (additiv seit 03.10.2026)" }
                  anfragen: { type: integer }
                  gemeinden: { type: integer }
                  eingang: { type: integer, description: "nicht zugeordnet (kein Vorgang, keine Anfrage, keine Gemeinde)" }
                  je_anfrage: { type: object, additionalProperties: { type: integer } }
                  je_gemeinde: { type: object, additionalProperties: { type: integer } }
        "403": { description: "Kein Super-Admin" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "keine (alle Mails)"

  /api/support/mail/eingang:
    get:
      tags: ["Support"]
      summary: Posteingang -- eingehende Mails, nicht zugeordnete (Vorgabe) oder alle, neueste zuerst
      description: >
        Nur eingehende Mails, hoechstens 1.000 (die neuesten). zuordnung=offen
        (Vorgabe, wie bisher) liefert nur die ohne Vorgang, Anfrage und
        Gemeinde -- den Posteingang der App und der Web-Ansicht;
        zuordnung=alle (seit 03.10.2026, additiv) auch die zu einem Vorgang,
        einer Anfrage oder Gemeinde. archiv=1 (seit 03.10.2026, Migration 195,
        additiv) liefert nur die archivierten Mails des Posteingangs (archiviert_am
        gesetzt), ohne archiv oder mit archiv=0 nur die nicht archivierten. Je Mail anfrage_id, organization_id und gemeinde_name
        (seit 03.10.2026, additiv): bei Zuordnung zu einer Gemeinde deren
        Anzeigename (display_name, sonst name), bei Zuordnung zu einer Anfrage
        der Gemeindename aus der Anfrage, sonst null; ohne zuordnung bleiben
        anfrage_id, organization_id und gemeinde_name null. Mails werden NICHT
        nach organizations.intern gefiltert: auch Mails zu einer internen
        Gemeinde stehen da, mit deren Namen. auszug: Text ohne zitierte
        Zeilen, Leerraum zusammengefasst, hoechstens 200 Zeichen. Nicht
        zugeordnete Mails -- auch archivierte -- loescht der naechtliche Lauf nach
        180 Tagen (im Postfach bleiben sie).
      parameters:
        - { name: postfach, in: query, required: false, schema: { type: string, enum: [moin, support] }, description: "filtert; ein anderer Wert 400" }
        - { name: zuordnung, in: query, required: false, schema: { type: string, enum: [offen, alle], default: offen }, description: "offen = nur nicht zugeordnete (Vorgabe), alle = alle eingehenden; ein anderer Wert 400" }
        - { name: archiv, in: query, required: false, schema: { type: string, enum: ["0", "1"], default: "0" }, description: "1 = nur die archivierten (seit 03.10.2026, additiv); ein anderer Wert 400" }
      responses:
        "200":
          description: "Array, neueste zuerst"
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    postfach: { type: string, enum: [moin, support] }
                    von_adresse: { type: [string, "null"] }
                    von_name: { type: [string, "null"] }
                    betreff: { type: string }
                    auszug: { type: string }
                    gesendet_am: { type: string, format: date-time }
                    gelesen_am: { type: [string, "null"], format: date-time }
                    anhaenge: { type: array, items: { type: object } }
                    anfrage_id: { type: [integer, "null"], description: "zugeordnete Anfrage (seit 03.10.2026, additiv)" }
                    organization_id: { type: [integer, "null"], description: "zugeordnete Gemeinde, auch eine interne (seit 03.10.2026, additiv)" }
                    gemeinde_name: { type: [string, "null"], description: "Anzeigename der Gemeinde bzw. Gemeindename der Anfrage; null ohne Zuordnung (seit 03.10.2026, additiv)" }
                    vorgang_id: { type: [integer, "null"], description: "der Vorgang der Mail; null im Posteingang (seit 03.10.2026, additiv)" }
                    archiviert_am: { type: [string, "null"], format: date-time, description: "archivierte Mail des Posteingangs (seit 03.10.2026, additiv)" }
        "400": { description: "unbekanntes Postfach oder unbekannter Wert fuer zuordnung oder archiv" }
        "403": { description: "Kein Super-Admin" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "keine (alle Mails)"

  /api/support/mail/nachrichten/{id}:
    get:
      tags: ["Support"]
      summary: Eine Mail mit ihrem Faden
      description: >
        Die Mail mit allen Feldern und verlauf: alle Mails desselben Fadens
        (sie selbst eingeschlossen), aelteste zuerst. Ein Faden sind alle
        Mails, deren Schluessel (Message-ID, In-Reply-To, References) sich
        ueberschneiden -- auch ueber eine Mail, die Konfi Quest nicht
        gespeichert hat. Liest nur; gelesen setzt POST /mail/gelesen.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: "MailNachricht + verlauf"
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/MailNachricht" }
                  - type: object
                    properties:
                      verlauf: { type: array, items: { $ref: "#/components/schemas/MailNachricht" } }
        "400": { description: "ungueltige Kennung" }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "{ error: 'Mail nicht gefunden' }" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "Existenz"
    delete:
      tags: ["Support"]
      summary: Eine Mail im Posteingang loeschen (nur aus Konfi Quest)
      description: >
        Nur Mails im Posteingang -- ohne Vorgang, Anfrage und Gemeinde; die Mails
        eines Vorgangs gehen mit dem Vorgang (409). Im Postfach selbst bleibt die
        Mail: Konfi Quest liest die Postfaecher nur, es loescht, verschiebt und
        markiert dort nichts.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "{ message: 'Mail gelöscht' }" }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "{ error: 'Mail nicht gefunden' }" }
        "409": { description: "'Das geht nur für Mails im Posteingang. Mails eines Vorgangs gehen mit dem Vorgang.'" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "Mail existiert und liegt im Posteingang"

  /api/support/mail/gelesen:
    post:
      tags: ["Support"]
      summary: Mails als gelesen markieren (nur in Konfi Quest, nicht im Postfach)
      description: >
        Setzt gelesen_am = jetzt fuer die genannten EINGEHENDEN Mails ohne
        Datum; ausgehende und schon gelesene bleiben, unbekannte Kennungen
        zaehlen nicht. Am Postfach selbst aendert sich nichts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, minItems: 1, maxItems: 1000, items: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: "{ gelesen: Anzahl der geaenderten Mails }"
          content: { application/json: { schema: { type: object, properties: { gelesen: { type: integer } } } } }
        "400": { description: "ids fehlt, leer, zu lang oder keine Zahlen" }
        "403": { description: "Kein Super-Admin" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "keine (alle Mails)"

  /api/support/mail/nachrichten/{id}/zuordnen:
    post:
      tags: ["Support"]
      summary: Eine Mail samt ganzem Faden einer Anfrage oder Gemeinde zuordnen -- oder zurueck in den Posteingang
      description: >
        { anfrage_id } oder { organization_id } oder {} (Posteingang); beides
        zugleich 400. Der GANZE Faden (wie verlauf in GET
        /mail/nachrichten/{id}) bekommt die neue Zuordnung, in einer
        Transaktion. Zu einer Anfrage zaehlt das als Bewegung (updated_at,
        365-Tage-Frist unbewegter Anfragen). Seit den Vorgaengen (Migration
        195) geht die Zuordnung ueber den Vorgang: zu einer Anfrage in DEREN
        Vorgang, zu einer Gemeinde in den juengsten offenen Vorgang der
        Gemeinde (sonst ein neuer "Schriftwechsel"), {} loest vorgang_id,
        anfrage_id und organization_id; anfrage_id und organization_id an der
        Mail bleiben gefuellt. Die Web-Ansicht sortiert ueber POST
        /mail/nachrichten/{id}/einsortieren.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                anfrage_id: { type: [integer, "null"] }
                organization_id: { type: [integer, "null"] }
      responses:
        "200":
          description: "{ anzahl, anfrage_id, organization_id, ids } -- ids: alle Mails des Fadens (Form zusaetzlich zum Vertrag, der keine Antwort festlegt)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  anzahl: { type: integer }
                  anfrage_id: { type: [integer, "null"] }
                  organization_id: { type: [integer, "null"] }
                  ids: { type: array, items: { type: integer } }
        "400": { description: "beides angegeben ('Entweder anfrage_id oder organization_id angeben, nicht beides.') oder keine Zahl" }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "'Mail nicht gefunden', 'Anfrage nicht gefunden' oder 'Gemeinde nicht gefunden' -- dann aendert sich nichts" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "Existenz von Mail und Ziel (Anfrage FOR UPDATE)"

  /api/support/mail/nachrichten/{id}/antworten:
    post:
      tags: ["Support"]
      summary: Antwort auf eine eingehende Mail an ihren Absender, vom selben Postfach
      description: >
        Wie POST /anfragen/{id}/antworten, aber an von_adresse der Mail und
        vom Postfach der Mail; In-Reply-To/References auf diese Mail;
        Standardbetreff "Re: <Betreff>". Die Antwort bekommt die Zuordnung
        der Mail (Posteingang bleibt Posteingang); gehoert die Mail zu einem
        Vorgang, kommt [Vorgang N] in den Betreff, die Antwort gehoert dazu, und
        ein Vorgang im Status neu geht auf in_arbeit (mit ihm die Anfrage dahinter).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MailAntwort" } } }
      responses:
        "201": { description: "{ nachricht: MailNachricht }" }
        "400": { description: "Validierungsfehler; 'Antworten geht nur auf eingehende Mails.'; Mail ohne Absender" }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "{ error: 'Mail nicht gefunden' }" }
        "502": { description: "Versand gescheitert -- nichts gespeichert" }
        "503": { description: "'Das Postfach … ist noch nicht eingerichtet.' oder 'Auf diesem Server ist der Versand aus.' (RUN_BACKGROUND_JOBS=false)" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin, express-validator]
        org-scope: false
        objekt-pruefung: "Mail existiert und ist eingehend; Empfaenger ist ihr Absender (keine freie Adresse)"

  /api/support/anfragen/{id}/verlauf:
    get:
      tags: ["Support"]
      summary: Mails einer Anfrage, aelteste zuerst
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: "Array", content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MailNachricht" } } } } }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "{ error: 'Anfrage nicht gefunden' }" }
      x-berechtigung:
        rollen: [super_admin]
        middleware: [verifyTokenRBAC, requireSuperAdmin]
        org-scope: false
        objekt-pruefung: "Existenz der Anfrage"

  /api/support/anfragen/{id}/antworten:
    post:
      tags: ["Support"]
      summary: Antwort auf eine Anfrage -- vom Postfach moin an die Adresse der Anfrage
      description: >
        Der Server setzt die Fusszeile unter den Text (Trenner "-- "), From
        "<Absendername> <moin@...>", Reply-To das Postfach, eigene
        Message-ID <kq-uuid@konfi-quest.de>, In-Reply-To/References auf die
        letzte Mail des Verlaufs und die Kennung [Vorgang N] im Betreff, wenn
        sie fehlt (der Vorgang der Anfrage; fehlt er, wird er angelegt -- seit
        Migration 195 statt [Anfrage N]). Standardbetreff ohne Verlauf "Eure Anfrage für
        <Gemeinde>", mit Verlauf "Re: <letzter Betreff>" (ohne doppeltes
        Re:). Gesendet wird mit der Anmeldung des Postfachs (Zertifikat
        geprueft wie beim bisherigen Versand). Danach gespeichert (richtung
        aus, gelesen_am = gesendet_am, verfasst_von); die Mail gehoert zum
        Vorgang (vorgang_id; anfrage_id bleibt gefuellt), die Anfrage gilt als
        bewegt (updated_at), im Status neu geht sie auf in_arbeit (und ihr
        Vorgang mit ihr). Nach der
        Antwort wird dieselbe Mail per IMAP im Gesendet-Ordner abgelegt
        (Markierung \Sent, sonst ein Ordner "Sent"/"Gesendet"/..., sonst wird
        "Sent" angelegt); scheitert das, bleibt die Mail gesendet (nur
        Protokoll).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/MailAntwort" } } }
      responses:
        "201":
          description: "{ nachricht }"
          content:
            application/json:
              schema:
                type: object
                properties:
                  nachricht: { $ref: "#/components/schemas/MailNachricht" }
        "400": { description: "Text fehlt/leer/ueber 20.000 Zeichen, Betreff ueber 300 Zeichen" }
        "403": { description: "Kein Super-Admin" }
        "404": { description: "{ error: 'Anfrage nicht gefunden' }" }
        "500": { description: "'Die Mail wurde gesendet, aber nicht gespeichert.' (Datenbankfehler nach dem Versand)" }
        "502": { description: "{ error: 'Die Mail konnte nicht gesendet werden. Bitte versucht es später noch einmal.' } -- nichts gespeichert, Status unveraendert" }
