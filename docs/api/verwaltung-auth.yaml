        Seit 03.10.2026: Die Anfrage vom Formular, aus der die Gemeinde entstanden ist
        (gemeinde_anfragen.organization_id), geht mit — Datenschutzerklärung Abschnitt 9c.
        Antwortform unverändert.
      parameters:
