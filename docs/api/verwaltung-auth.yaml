          (utils/kontoLoeschen.js, für alle Konten in einem Durchgang) — auch Anträge,
          Dateien, Zweiergespräche und Buchungen in anderen Gemeinden (Nachrücken dort).
        Behoben 29.09.2026: Vorher `DELETE FROM users WHERE organization_id` — Spuren eines
        Kontos in einer anderen Gemeinde (Antrag, angelegter Termin) ließen die Löschung am
