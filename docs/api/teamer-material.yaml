# =====================================================================
# Konfi Quest API - OpenAPI 3.1 - BLOCK 3 von 3
# Dokumentierte Dateien (Stand main, 23.08.2026, am Code verifiziert):
#   backend/routes/teamer.js   -> Prefix /api/teamer   (21 Routen)
#   backend/routes/material.js -> Prefix /api/material (13 Routen)
#   backend/routes/wrapped.js  -> Prefix /api/wrapped  (5 Routen)
#
# Mount-Prefixe geprüft in backend/createApp.js (Zeilen 442-446):
#   app.use('/api/teamer',   require('./routes/teamer')(...))
#   app.use('/api/wrapped',  wrappedRouter)          // aus routes/wrapped.js
#   app.use('/api/material', require('./routes/material')(...))
#
# Rollen: super_admin, org_admin, admin, teamer, konfi
# Middleware (backend/middleware/rbac.js):
#   verifyTokenRBAC  = JWT prüfen, User inkl. aktiver Organisation (Header
#                      X-Active-Organization) und assigned_jahrgaenge laden.
#                      In den Route-Dateien heißt dieselbe Middleware
#                      "rbacVerifier".
#   requireOrgAdmin  = requireRole('org_admin')
#   requireAdmin     = requireRole('org_admin', 'admin')
#   requireTeamer    = requireRole('org_admin', 'admin', 'teamer')
#   requireRole prüft ausschliesslich req.user.role_name - super_admin fällt
#   damit ueberall auf 403, außer die Route hat gar keinen Rollen-Guard.
#
# =====================================================================
# SCHWERPUNKT-ANALYSE (alle Aussagen am Code verifiziert)
# =====================================================================
#
# 1. ZWEI SORTEN "TEAMER-ROUTEN" IN EINER DATEI
#    /api/teamer enthält zwei voellig verschiedene Gruppen:
#    a) SELBSTBEDIENUNG der Teamer:in (profile, konfi-history, badges,
#       badges/unseen, badges/mark-seen, dashboard, tageslosung,
#       bible-translation, activities, requests). Diese Routen hängen zwar
#       an requireTeamer (org_admin/admin/teamer), fuenf von ihnen haben aber
#       zusaetzlich einen Inline-Check `role_name !== 'teamer' -> 403`:
#       /profile, /konfi-history, /badges, /badges/unseen, /badges/mark-seen,
#       /dashboard. Für org_admin/admin sind diese Routen also faktisch
#       gesperrt.
#       # INKONSISTENZ: /teamer/activities, /teamer/requests (GET/POST/DELETE),
#       /teamer/tageslosung und PUT /teamer/bible-translation haben diesen
#       Inline-Check NICHT. Ein org_admin/admin kann dort Teamer-Anträge
#       stellen und löschen und seine Bibeluebersetzung setzen. Praktisch
#       harmlos (immer nur eigene Daten), aber das Muster ist uneinheitlich.
#    b) LEITUNGS-EINSICHT in Teamer:innen (/:userId/badges,
#       /:userId/certificates, /certificate-types/*). requireAdmin bzw.
#       requireOrgAdmin, kein Teamer-Zugriff.
#
# 2. JAHRGANGSGRENZE (assigned_jahrgaenge)
#    GREIFT genau EINMAL in diesen drei Dateien:
#    - GET /api/teamer/konfis: Rolle 'teamer' sieht nur Konfis der
#      can_view-Jahrgänge; ohne Zuweisung kommt eine LEERE Liste. Für
#      org_admin/admin entfaellt der Filter (alle Konfis der Org).
#    GREIFT NIRGENDS SONST. Insbesondere:
#    - /api/material/* kennt überhaupt keine Jahrgangsgrenze. Material kann
#      zwar Jahrgängen zugeordnet werden (material_jahrgaenge, Filter
#      ?jahrgang_id), das ist aber reine Ablage-Struktur: GET /api/material
#      liefert ohne Query-Filter ALLE Materialien der Organisation an jede
#      Teamer:in, auch solche, die ausschliesslich fremden Jahrgängen
#      zugeordnet sind. Gleiches gilt für GET /api/material/{id} und den
#      Datei-Download GET /api/material/files/{fileRef}.
#      # HINWEIS M1: Wer Material als "nur für Jahrgang X" ablegt, sollte
#      wissen, dass die Zuordnung nicht als Berechtigung wirkt.
#    - POST /api/wrapped/generate/{jahrgangId}: requireAdmin, Jahrgang nur
#      org-geprüft. Ein 'admin' kann für JEDEN Jahrgang der Org Wrapped
#      erzeugen und damit freigeben - passt zum Muster der uebrigen
#      Admin-Routen, ist aber keine Jahrgangs-Beschraenkung.
#
# 3. ORG-SCOPE - WO ER FEHLT ODER ANDERS GREIFT
#    Fast alle Routen filtern konsequent auf req.user.organization_id.
#    Abweichungen (am Code belegt):
#    - # HINWEIS W1: GET /api/wrapped/me liest wrapped_snapshots NUR über
#      user_id + wrapped_type, ohne organization_id. Für Multi-Org-User
#      (Header X-Active-Organization) kommt damit der neueste Snapshot
#      zurück, egal aus welcher Organisation er stammt. Es sind immer die
#      EIGENEN Daten, aber der Org-Kontext wird ignoriert.
#    - # HINWEIS W2: GET /api/wrapped/history/{userId} prüft die
#      Org-Zugehoerigkeit der Zielperson gegen users.organization_id, also
#      gegen die PRIMAER-Organisation, nicht gegen die aktive Org aus dem
#      Header. Die Snapshot-Query selbst filtert ebenfalls nur auf user_id.
#      Bei Multi-Org-Setups kann ein Admin damit Snapshots sehen, die in einer
#      anderen Organisation entstanden sind.
#    - # HINWEIS W3: DELETE /api/wrapped/{jahrgangId} löscht über
#      `jahrgang_id = $1 AND organization_id = $2`. Teamer-Snapshots haben
#      kein jahrgang_id (der Teamer-INSERT setzt die Spalte nicht) und werden
#      deshalb von dieser Route nie gelöscht. Es gibt keinen Endpunkt, der
#      Teamer-Wrapped wieder entfernt.
#    - # HINWEIS T1: POST /api/teamer/requests prüft die Idempotenz-client_id
#      per `WHERE client_id = $1` OHNE user_id/organization_id. Existiert die
#      UUID bereits, wird der fremde Datensatz mit 200 zurueckgegeben (er
#      enthält user_id, comment, photo_filename, status). Da client_id eine
#      clientseitig erzeugte UUIDv4 ist, ist das praktisch nicht erratbar -
#      aber die Konfi-Variante in routes/konfi.js hat denselben Schnitt, es
#      ist also ein durchgaengiges Muster, kein Einzelfall.
#    - # HINWEIS T2: GET /api/teamer/{userId}/certificates filtert
#      user_certificates auf user_id + organization_id, prüft aber NICHT,
#      ob der Ziel-User überhaupt die Rolle 'teamer' hat - anders als
#      GET /api/teamer/{userId}/badges und POST /api/teamer/{userId}/certificates,
#      die auf r.name = 'teamer' prüfen. Folge ist lediglich, dass ein Admin
#      für beliebige User-IDs der eigenen Org eine (in der Praxis leere)
#      Zertifikatsliste abrufen kann.
#    - # HINWEIS T3: DELETE /api/teamer/certificate-types/{id} zählt die
#      Verwendung mit `SELECT COUNT(*) FROM user_certificates WHERE
#      certificate_type_id = $1` OHNE organization_id. Der Typ selbst wird
#      org-gescopt gelöscht, aber die 409-Sperre kann durch Zertifikate einer
#      FREMDEN Organisation ausgelöst werden. Auswirkung: ein org-eigener Typ
#      laesst sich unter Umstaenden nicht löschen, obwohl er in der eigenen
#      Org unbenutzt ist. Kein Datenabfluss, aber ein Fehlverhalten.
#
# 4. DATEIEN (Material-Uploads)
#    - Upload: POST /api/material/{id}/files, requireAdmin, multer
#      memoryStorage, Limit 20 MB, max 10 Dateien pro Request
#      (createApp.js:149). Zweistufige Prüfung: multer-fileFilter auf die
#      gemeldete MIME-Liste, danach Magic-Bytes-Prüfung mit file-type auf
#      dem Buffer (415 bei Nichtuebereinstimmung). text/plain und text/csv
#      sind von der Magic-Bytes-Prüfung ausgenommen, weil sie keine Signatur
#      haben.
#    - Ablage: AES-256-GCM-verschlüsselt (utils/photoCrypto), zufaelliger
#      64-Hex-Dateiname in backend/uploads/material. Das Verzeichnis wird
#      nicht statisch ausgeliefert.
#    - Abruf: GET /api/material/files/{fileRef}, requireTeamer. Der Dateiname
#      wird durch path.basename und einen /^[a-f0-9]{64}$/-Test geführt
#      (Path-Traversal-Schutz), die Org-Zugehoerigkeit über den JOIN auf
#      materials.organization_id geprüft.
#    -> Konfis haben auf /api/material KEINEN Zugriff (requireTeamer auf allen
#       13 Routen).
#
# 5. WER DARF WAS SCHREIBEN (Kurzfassung über alle drei Dateien)
#    org_admin allein: Zertifikat-Typen anlegen/aendern/loeschen, Zertifikate
#      zuweisen/entfernen, Teamer-Wrapped generieren, Wrapped eines Jahrgangs
#      löschen.
#    org_admin + admin: Material und Material-Tags anlegen/aendern/loeschen,
#      Dateien hoch- und wieder herunterladen bzw. löschen, Konfi-Wrapped
#      eines Jahrgangs generieren, Teamer-Badges und -Zertifikate einsehen.
#    org_admin + admin + teamer: Material und Tags LESEN, Dateien
#      herunterladen, Teamer-Aktivitäten sehen und Anträge stellen/loeschen.
#    Punkte werden in diesen drei Dateien NICHT direkt vergeben. Teamer-Punkte
#    entstehen erst, wenn ein Antrag aus POST /api/teamer/requests über
#    PUT /api/admin/activities/requests/{id} (Block 2) genehmigt wird.
#
# ZUSAMMENFASSUNG DER BEFUNDE IN DIESEM BLOCK:
#   M1  Material kennt keine Jahrgangsgrenze - jede Teamer:in sieht und laedt
#       alles Material der Organisation, auch fremden Jahrgängen zugeordnetes.
#   W1  GET /api/wrapped/me ohne organization_id-Filter (Multi-Org).
#   W2  GET /api/wrapped/history/{userId} prüft Primaer-Org statt aktiver Org.
#   W3  DELETE /api/wrapped/{jahrgangId} erreicht Teamer-Snapshots nicht -
#       Teamer-Wrapped ist nicht loeschbar.
#   T1  POST /api/teamer/requests: client_id-Idempotenz ohne user/org-Scope.
#   T2  GET /api/teamer/{userId}/certificates ohne Rollen-Prüfung.
#   T3  DELETE /api/teamer/certificate-types/{id}: 409-Sperre zählt
#       organisationsuebergreifend.
#   T4  Inline-Check "nur Rolle teamer" nur auf 6 von 12 Selbstbedienungs-
#       Routen - uneinheitlich.
# =====================================================================
openapi: 3.1.0
info:
  title: Konfi Quest API - Teamer, Material & Wrapped (Block 3)
  version: "1.0.0"
  description: >
    Teil 3 der API-Dokumentation: Teamer-Selbstbedienung und
    Teamer-Verwaltung (/api/teamer), Materialverwaltung mit Dateien
    (/api/material) und Jahresrueckblick (/api/wrapped). Berechtigungen sind
    je Route in der Erweiterung x-berechtigung dokumentiert.
servers:
  - url: https://konfi-quest.de
tags:
  - name: "Abzeichen"
    description: "Abzeichen-Verwaltung und die verdienten Abzeichen von Konfis und Teamer:innen."
  - name: "Material"
    description: "Materialablage: Dateien, Tags, Verknüpfung mit Terminen."
  - name: "Teamer:innen"
    description: "Eigener Bereich der Teamer:innen: Dashboard, Konfis, Anträge, Zertifikate, Konfi-Historie."
  - name: "Wrapped"
    description: "Jahresrückblick: erzeugen, ansehen, löschen."
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT im Authorization-Header. Optional Header X-Active-Organization
        (Multi-Org): schaltet die aktive Organisation um, sofern der User dort
        Mitglied ist (sonst 403).
  parameters:
    pathId:
      description: "Numerische ID des Objekts im Pfad (welches Objekt, sagt die jeweilige Route)"
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    pathUserId:
      description: "User-ID der Teamerin / des Teamers"
      name: userId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
    pathJahrgangId:
      description: "ID des Jahrgangs"
      name: jahrgangId
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Message:
      type: object
      properties:
        message: { type: string }
  responses:
    Unauthorized:
      description: Kein/ungueltiges/abgelaufenes Token, inaktiver Account oder inaktive Organisation
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Rolle nicht erlaubt oder kein Zugriff auf das Objekt
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Objekt nicht gefunden (in der aktiven Organisation)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ServerError:
      description: Datenbank-/Serverfehler
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

paths:
  # ===================================================================
  # backend/routes/teamer.js  (Prefix /api/teamer)
  # Guards: requireTeamer (org_admin/admin/teamer), requireAdmin
  # (org_admin/admin), requireOrgAdmin (nur org_admin). Sechs
  # Selbstbedienungs-Routen haben zusaetzlich einen Inline-Check auf
  # role_name === 'teamer' (siehe Analyse Punkt 1).
  # ===================================================================
  /api/teamer/profile:
    get:
      tags: ["Teamer:innen"]
      summary: Eigenes Teamer-Profil inkl. eingefrorener Konfi-Vergangenheit
      description: >
        Stammdaten der eingeloggten Teamer:in (display_name, username, E-Mail,
        role_title, teamer_since, Organisation, bible_translation). Existiert
        ein konfi_profiles-Datensatz aus der Konfi-Zeit, wird er als
        konfi_data mitgeliefert (eingefrorene Punkte, Jahrgangsname, damals
        erreichte Badges); sonst ist konfi_data null. Die Erkennung hängt am
        Vorhandensein des Profils, nicht am Jahrgangsnamen - ein geloeschter
        Jahrgang setzt nur jahrgang_name auf leer, die Punkte bleiben sichtbar.
      x-berechtigung:
        rollen: [teamer]
        middleware: [verifyTokenRBAC, "Inline-Check role_name === 'teamer'"]
        org-scope: false
        objekt-pruefung: "nur eigene Daten (WHERE id/user_id = req.user.id)"
        hinweis: >
          Kein requireTeamer, sondern ein eigener Inline-Guard. Die
          User-Abfrage läuft über WHERE u.id = $1 ohne organization_id -
          unkritisch, da es die eigene Zeile ist.
      responses:
        "200":
          description: Profil
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      display_name: { type: string }
                      username: { type: string }
                      email: { type: string }
                      role_title: { type: string }
                      teamer_since: { type: [string, "null"], format: date }
                      organization_name: { type: string }
                      bible_translation: { type: string }
                  konfi_data:
                    type: [object, "null"]
                    description: "gottesdienst_points, gemeinde_points, jahrgang_name, badges[] - null bei Teamer:innen ohne Konfi-Vergangenheit"
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: "Aufrufer ist kein Teamer (org_admin/admin bekommen hier 403)" }
        "500": { $ref: '#/components/responses/ServerError' }
    patch:
      tags: ["Teamer:innen"]
      summary: Eigenen Konfispruch setzen (Listen-Wahl ODER Freitext)
      description: >
        Gegenstueck zu PATCH /api/konfi/profile für Teamer:innen. Entweder
        konfspruch_id + translation (kuratierte Liste, org-gescopt und
        is_active geprüft) oder konfspruch_freitext +
        konfspruch_freitext_referenz (Referenz Pflicht, max. 100 Zeichen;
        Text max. 1000 Zeichen). Genau eine Quelle bleibt aktiv, die jeweils
        andere wird geleert. Anders als bei Konfis wird die
        konfi_profiles-Zeile per Upsert (ON CONFLICT user_id) angelegt:
        direkt als Teamer:in angelegte Accounts haben noch keine. Bestehende
        Zeilen befoerderter Konfis behalten ihre eingefrorenen Punkte.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                konfspruch_id: { type: integer }
                translation: { type: string, enum: [luther2017, bigs, gute_nachricht, elberfelder] }
                konfspruch_freitext: { type: string, maxLength: 1000 }
                konfspruch_freitext_referenz: { type: string, maxLength: 100 }
      x-berechtigung:
        rollen: [teamer]
        middleware: [verifyTokenRBAC, requireTeamer, "Inline-Check role_name === 'teamer'"]
        org-scope: true
        objekt-pruefung: "nur eigenes Profil (user_id = req.user.id); Listen-Spruch org-gescopt (organization_id IS NULL OR = eigene Org)"
      responses:
        "200": { description: "success + konfspruch (source liste|freitext)" }
        "400": { description: "Weder gueltige Listen-Wahl noch Freitext, leerer Text, fehlende Referenz oder Laengenlimit verletzt" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: "Aufrufer ist kein Teamer" }
        "404": { description: "Listen-Spruch nicht vorhanden, inaktiv oder fremde Organisation" }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/teamer/konfsprueche:
    get:
      tags: ["Teamer:innen"]
      summary: Kuratierte Konfispruch-Liste für das Auswahl-Modal (Teamer-Sicht)
      description: >
        Gegenstueck zu GET /api/konfi/konfsprueche: alle aktiven Sprueche
        (globale mit organization_id NULL plus eigene der Organisation) mit
        Referenz, Fundstelle und den vier Uebersetzungen (fehlende Texte als
        leerer String).
      x-berechtigung:
        rollen: [teamer]
        middleware: [verifyTokenRBAC, requireTeamer, "Inline-Check role_name === 'teamer'"]
        org-scope: true
        objekt-pruefung: "organization_id IS NULL OR = eigene Org, nur is_active"
      responses:
        "200": { description: "Array (id, reference, book, chapter, verse, uebersetzungen{4 Keys})" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: "Aufrufer ist kein Teamer" }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/teamer/konfis:
    get:
      tags: ["Teamer:innen"]
      summary: Konfis der zugewiesenen Jahrgänge (Auswahl für Direktnachrichten)
      description: >
        Liste der Konfis für die Chat-Auswahl. Für die Rolle teamer werden
        nur Konfis der can_view-Jahrgänge geliefert; ohne jede Zuweisung
        kommt eine leere Liste. org_admin und admin erhalten alle Konfis der
        Organisation. Geloeschte Konfis (deleted_at) sind ausgeschlossen.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "Rolle teamer: Jahrgangsgrenze über assigned_jahrgaenge mit can_view; org_admin/admin: kein Jahrgangsfilter"
        hinweis: >
          Die einzige Route dieser drei Dateien, in der die Jahrgangsgrenze
          tatsaechlich greift. Anders als bei GET /api/events greift sie hier
          auch bei leerer Zuweisung (leere Liste statt Vollzugriff).
      responses:
        "200": { description: "Array (id, name, username, jahrgang_name, jahrgang_id)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/teamer/konfi-history:
    get:
      tags: ["Teamer:innen"]
      summary: Eigene Punkte-Historie aus der Konfi-Zeit
      description: >
        Für befoerderte Teamer:innen: alle Aktivitäten, Bonuspunkte und
        Event-Punkte aus der Konfi-Zeit, nach Datum absteigend
        zusammengefuehrt, plus die eingefrorenen Summen aus konfi_profiles.
      x-berechtigung:
        rollen: [teamer]
        middleware: [verifyTokenRBAC, requireTeamer, "Inline-Check role_name === 'teamer'"]
        org-scope: true
        objekt-pruefung: "nur eigene Daten (user_id = Token) und nur die eigene Organisation"
      responses:
        "200": { description: "history[] (id, title, points, category, date, comment, source_type activity|bonus|event) + totals {gottesdienst, gemeinde, total}" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: "Aufrufer ist kein Teamer" }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/teamer/badges:
    get:
      tags: ["Abzeichen"]
      summary: Eigene Teamer-Abzeichen mit Fortschritt
      description: >
        Alle Abzeichen der Organisation mit target_role='teamer' (aktive plus
        bereits erreichte inaktive) samt earned-Status und berechnetem
        Fortschritt. Der Fortschritt wird pro Kriterium bestimmt und ist
        bewusst deckungsgleich mit der Wertung in routes/badges.js:
        activity_count, event_count, unique_activities, teamer_year (nur Jahre
        ab users.teamer_since), category_activities, specific_activity,
        activity_combination, streak und time_based. Punkte-Kriterien
        (total_points etc.) sind für Teamer irrelevant und liefern 0;
        collection und yearly sind in der Wertung noch nicht implementiert und
        liefern ebenfalls 0.
        Seit 24.08.2026 werden UNVERDIENTE geheime Abzeichen (is_hidden) nicht
        mehr ausgeliefert — vorher standen Name, Beschreibung und Fortschritt
        offen da, während der Konfi-Pfad sie korrekt zurückhielt. Verdiente
        geheime Abzeichen kommen weiterhin mit. Die Gesamtzahlen stehen in den
        Kopfzeilen X-Badges-Secret-Total und X-Badges-Visible-Total, damit die
        Anzeige "x Geheimnisse zu entdecken" weiter stimmt; der Rumpf bleibt
        bewusst ein Array, weil zwei Ansichten ihn so lesen.
        Seit 27.08.2026 (Befund N2): Der Fortschritt kommt aus dem gemeinsamen
        Rechenkern utils/badgeProgress.js, den sich Konfi- und Teamer-Pfad
        teilen. Die Antwortform ist unveraendert. Zwei Verhaltensaenderungen:
        (1) Abzeichen ohne hinterlegte Bedingung (specific_activity ohne
        required_activity_name, category_activities ohne required_category,
        activity_combination ohne required_activities, oder unlesbares
        criteria_extra) werden nicht mehr ausgeliefert — sie sind unerreichbar,
        weil die Wertung genau dieses Feld prueft. Verdiente Abzeichen bleiben
        immer sichtbar. Konfis hatten diese Ausblendung bereits.
        (2) Die Kopfzeilen zaehlen nur noch AKTIVE Abzeichen. Vorher zaehlten
        auch abgeschaltete mit, sofern verdient — dieselbe Zahl bedeutete also
        je nach Rolle etwas anderes.
      x-berechtigung:
        rollen: [teamer]
        middleware: [verifyTokenRBAC, requireTeamer, "Inline-Check role_name === 'teamer'"]
        org-scope: true
        objekt-pruefung: "nur eigene Daten; alle Teilabfragen mit user_id + organization_id"
      responses:
        "200":
          description: "Array von Abzeichen (custom_badges.* + earned, awarded_date, progress_points, progress_percentage); ohne unverdiente geheime und ohne unerreichbare (Bedingung fehlt)"
          headers:
            X-Badges-Secret-Total:
              description: "Anzahl der AKTIVEN geheimen Abzeichen, auch der nicht ausgelieferten. Abgeschaltete zaehlen seit 27.08.2026 nicht mehr mit (angeglichen an den Konfi-Pfad)."
              schema: { type: integer }
            X-Badges-Visible-Total:
              description: "Anzahl der AKTIVEN offen sichtbaren Abzeichen. Wird derzeit von keiner Ansicht gelesen (die zaehlen aus der Liste), bleibt aber als Zusage der Schnittstelle bestehen."
              schema: { type: integer }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: "Aufrufer ist kein Teamer" }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/teamer/badges/unseen:
    get:
      tags: ["Abzeichen"]
      summary: Anzahl der noch nicht gesehenen eigenen Abzeichen
      x-berechtigung:
        rollen: [teamer]
        middleware: [verifyTokenRBAC, requireTeamer, "Inline-Check role_name === 'teamer'"]
        org-scope: true
        objekt-pruefung: "nur eigene user_badges (user_id + organization_id)"
        hinweis: >
          Zaehlt alle ungesehenen user_badges, ohne auf target_role='teamer'
          einzuschraenken. Bei befoerderten Konfis können darin auch alte
          Konfi-Abzeichen stecken.
          Seit 27.08.2026 vom Web-Frontend NICHT mehr aufgerufen: Der Zaehler
          kommt aus newBadges in GET /api/notifications/badge-counts, das
          korrekt auf target_role filtert. Der Endpunkt bleibt vorerst fuer
          ausgelieferte App-Versionen bestehen; ueber seine Abschaffung ist
          noch nicht entschieden.
      responses:
        "200": { description: "unseen (Anzahl)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: "Aufrufer ist kein Teamer" }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/teamer/badges/mark-seen:
    put:
      tags: ["Abzeichen"]
      summary: Eigene Abzeichen als gesehen markieren
      x-berechtigung:
        rollen: [teamer]
        middleware: [verifyTokenRBAC, requireTeamer, "Inline-Check role_name === 'teamer'"]
        org-scope: true
        objekt-pruefung: "UPDATE nur auf eigene user_badges (user_id + organization_id)"
      responses:
        "200": { description: Abzeichen als gesehen markiert }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: "Aufrufer ist kein Teamer" }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/teamer/{userId}/badges:
    get:
      tags: ["Abzeichen"]
      summary: Erreichte Abzeichen einer Teamer:in (Leitungs-Einsicht)
      description: >
        Für die Teamer-Detailseite der Leitung. Liefert bewusst nur die
        erreichten Abzeichen ohne Fortschrittsberechnung - die teure Berechnung
        aus GET /api/teamer/badges wäre hier ungenutzt. Der Zielbenutzer muss
        die Rolle teamer haben, zur eigenen Organisation gehören und darf
        nicht gelöscht sein.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin]
        org-scope: true
        objekt-pruefung: "Ziel-User muss Rolle 'teamer' haben, zur aktiven Org gehören und deleted_at IS NULL (sonst 404); Abzeichen nur target_role='teamer'"
      parameters: [ { $ref: '#/components/parameters/pathUserId' } ]
      responses:
        "200": { description: "earned[] (id, name, description, icon, color, criteria_type, criteria_value, is_hidden, earned_at)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: "Teamer:in nicht gefunden (fremde Org, falsche Rolle oder geloescht)" }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/teamer/certificate-types:
    get:
      tags: ["Teamer:innen"]
      summary: Aktive Zertifikat-Typen der Organisation auflisten
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin]
        org-scope: true
        objekt-pruefung: "nur is_active = true der eigenen Org; keine personenbezogenen Daten"
        hinweis: >
          Lesen ist requireAdmin, Schreiben requireOrgAdmin. Teamer:innen sehen
          ihre Zertifikate ausschliesslich über GET /api/teamer/dashboard.
      responses:
        "200": { description: "Array (id, name, icon, is_active, created_at)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }
    post:
      tags: ["Teamer:innen"]
      summary: Zertifikat-Typ anlegen
      description: Icon-Vorgabe 'ribbon', wenn nichts angegeben wird. Der Name ist je Organisation eindeutig.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateCreateCertificateType]
        org-scope: true
        objekt-pruefung: "organization_id wird serverseitig aus dem Token gesetzt"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                icon: { type: string, maxLength: 50, default: ribbon }
      responses:
        "201": { description: "id, name, icon, is_active, created_at" }
        "400": { description: Name fehlt oder ist leer }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { description: Name in dieser Organisation bereits vergeben }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/teamer/certificate-types/{id}:
    put:
      tags: ["Teamer:innen"]
      summary: Zertifikat-Typ bearbeiten
      description: Teilaktualisierung von name, icon und is_active. Ohne aenderbares Feld kommt 400.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateUpdateCertificateType]
        org-scope: true
        objekt-pruefung: "UPDATE mit organization_id-Bedingung (404 sonst)"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                icon: { type: string, maxLength: 50 }
                is_active: { type: boolean }
      responses:
        "200": { description: Aktualisiert }
        "400": { description: Leerer Name oder keine Aenderungen angegeben }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: Name in dieser Organisation bereits vergeben }
        "500": { $ref: '#/components/responses/ServerError' }
    delete:
      tags: ["Teamer:innen"]
      summary: Zertifikat-Typ löschen (nur wenn nirgends vergeben)
      description: >
        Vor dem Löschen wird geprüft, ob der Typ bereits an Teamer:innen
        vergeben wurde; in dem Fall kommt 409.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin]
        org-scope: true
        objekt-pruefung: "DELETE mit organization_id-Bedingung (404 sonst)"
        hinweis: >
          # BEFUND T3: Die Verwendungspruefung zählt user_certificates nur
          über certificate_type_id, ohne organization_id. Zertifikate einer
          fremden Organisation können die 409-Sperre auslösen, obwohl der Typ
          in der eigenen Org unbenutzt ist. Kein Datenabfluss, aber der Typ
          laesst sich dann nicht löschen.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: Geloescht }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: Typ ist bereits vergeben und kann nicht geloescht werden }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/teamer/{userId}/certificates:
    get:
      tags: ["Teamer:innen"]
      summary: Zertifikate einer Teamer:in auflisten (Leitungs-Einsicht)
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin]
        org-scope: true
        objekt-pruefung: "user_certificates gefiltert auf user_id + organization_id"
        hinweis: >
          # BEFUND T2: Anders als die Badge- und die POST-Variante prüft diese
          Route NICHT, ob der Ziel-User die Rolle 'teamer' hat. Für beliebige
          User-IDs der eigenen Org kommt daher 200 mit (in der Praxis) leerer
          Liste statt 404.
      parameters: [ { $ref: '#/components/parameters/pathUserId' } ]
      responses:
        "200": { description: "Array (id, issued_date, expiry_date, created_at, certificate_type_id, name, icon)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }
    post:
      tags: ["Teamer:innen"]
      summary: Zertifikat an eine Teamer:in vergeben
      description: >
        Prueft, dass der Ziel-User zur eigenen Organisation gehört und die
        Rolle teamer hat, und dass der Zertifikat-Typ zur Organisation gehört
        und aktiv ist. Nach dem Speichern gehen eine Push-Nachricht und ein
        Live-Update an die Empfaenger:in; Fehler dabei kippen die Vergabe nicht.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateCertificate]
        org-scope: true
        objekt-pruefung: "Ziel-User: organization_id + Rolle 'teamer' (404 sonst); certificate_type: organization_id + is_active (404 sonst)"
      parameters: [ { $ref: '#/components/parameters/pathUserId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [certificate_type_id, issued_date]
              properties:
                certificate_type_id: { type: integer, minimum: 1 }
                issued_date: { type: string, format: date }
                expiry_date: { type: string, format: date }
      responses:
        "201": { description: "message, id, issued_date, expiry_date" }
        "400": { description: Pflichtfelder fehlen oder Datum ungueltig }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Teamer:in oder Zertifikat-Typ nicht gefunden bzw. Typ inaktiv }
        "409": { description: Dieses Zertifikat ist der Teamer:in bereits zugewiesen }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/teamer/{userId}/certificates/{certId}:
    delete:
      tags: ["Teamer:innen"]
      summary: Zertifikat einer Teamer:in entfernen
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin]
        org-scope: true
        objekt-pruefung: "DELETE mit id + user_id + organization_id (404 sonst)"
      parameters:
        - { $ref: '#/components/parameters/pathUserId' }
        - name: certId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: "ID des Zertifikats"
      responses:
        "200": { description: Entfernt }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/teamer/dashboard:
    get:
      tags: ["Teamer:innen"]
      summary: Teamer-Dashboard (Zertifikate, Termine, Abzeichen, Konfiguration)
      description: >
        Liefert Begruessung, alle aktiven Zertifikat-Typen der Organisation mit
        eigenem Status (valid | expired | not_earned), die nächsten bis zu
        fuenf zukuenftigen, nicht abgesagten Termine, für die die Teamer:in
        selbst gebucht ist, die letzten drei erreichten Teamer-Abzeichen mit
        Zaehlern sowie die Dashboard-Konfiguration der Organisation
        (show_zertifikate, show_challenges, show_konfispruch, show_events,
        show_badges, show_losung und section_order aus den
        settings-Schluesseln teamer_dashboard_*). Dazu kommt der eigene
        Konfispruch aus konfi_profiles (aufgeloeste Listen-Wahl oder
        Freitext, null ohne Eintrag oder bei abgeschaltetem Schalter — dann
        wird die Tabelle gar nicht erst abgefragt). Zuletzt wird geprüft,
        ob ein Teamer-Wrapped-Snapshot vorliegt. Die Challenges-Teaser
        selbst laedt das Frontend separat über GET /api/challenges/admin.
      x-berechtigung:
        rollen: [teamer]
        middleware: [verifyTokenRBAC, requireTeamer, "Inline-Check role_name === 'teamer'"]
        org-scope: true
        objekt-pruefung: "nur eigene Daten; Zertifikate/Abzeichen/Termine mit user_id + organization_id"
        hinweis: >
          Die Wrapped-Prüfung fragt wrapped_snapshots nur über user_id +
          wrapped_type ab, ohne organization_id - dieselbe Multi-Org-Unschaerfe
          wie in GET /api/wrapped/me (Befund W1).
      responses:
        "200":
          description: Dashboard-Daten
          content:
            application/json:
              schema:
                type: object
                properties:
                  greeting: { type: object, description: "display_name, hour" }
                  certificates: { type: array, items: { type: object }, description: "id, name, icon, issued_date, expiry_date, status" }
                  events: { type: array, items: { type: object }, description: "id, title, event_date, location, teamer_only, teamer_needed, is_registered, booking_status" }
                  badges: { type: object, description: "recent[], earned_count, total_count" }
                  config: { type: object, description: "show_zertifikate, show_challenges, show_konfispruch, show_events, show_badges, show_losung, section_order" }
                  has_wrapped: { type: boolean }
                  konfspruch: { type: [object, "null"], description: "source (liste|freitext), reference, text, ggf. id + translation" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: "Aufrufer ist kein Teamer" }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/teamer/tageslosung:
    get:
      tags: ["Teamer:innen"]
      summary: Tageslosung in der eigenen Bibeluebersetzung (Teamer-Sicht)
      description: >
        Beachtet den Organisations-Schalter teamer_dashboard_show_losung: ist
        er auf false oder 0 gesetzt, kommt 204 ohne Inhalt. Sonst wird die
        Losung in der eigenen Uebersetzung geladen (DB-Cache im Service). Bei
        einem Fehler wird die zuletzt gecachte Losung mit fallback: true
        ausgeliefert, statt die Karte leer zu lassen.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "liest den Org-Schalter und die eigene Uebersetzungs-Praeferenz"
        hinweis: >
          # BEFUND T4: Kein Inline-Check auf role_name === 'teamer', anders als
          bei /profile, /dashboard und den Badge-Routen. org_admin und admin
          können diese Route ebenfalls aufrufen. Gegenstueck für Konfis ist
          GET /api/konfi/tageslosung mit eigenem Schalter.
      responses:
        "200": { description: "success, data (losung, lehrtext), translation, ggf. fallback: true" }
        "204": { description: Tageslosung im Teamer-Dashboard der Organisation abgeschaltet }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { description: Losung konnte nicht geladen werden und es lag keine gecachte Losung vor }

  /api/teamer/bible-translation:
    put:
      tags: ["Teamer:innen"]
      summary: Bibeluebersetzung für die Tageslosung setzen (Teamer-Sicht)
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: false
        objekt-pruefung: "UPDATE users SET bible_translation WHERE id = req.user.id - nur das eigene Profil"
        hinweis: >
          # BEFUND T4: kein Inline-Teamer-Check. Die Prüfung der Uebersetzung
          erfolgt inline im Handler (keine validateBibleTranslation-Middleware
          wie in der Konfi-Route).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [translation]
              properties:
                translation: { type: string, enum: [LUT, ELB, GNB, BIGS, NIV, LSG, RVR60] }
      responses:
        "200": { description: "success, message, translation" }
        "400": { description: "Ungueltige Uebersetzung (Antwort enthaelt valid_translations)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/teamer/activities:
    get:
      tags: ["Teamer:innen"]
      summary: Beantragbare Teamer-Aktivitäten auflisten
      description: Aktivitäten der Organisation mit target_role='teamer', mit zusammengefassten Kategorienamen.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "keine personenbezogenen Daten"
        hinweis: >
          Anders als GET /api/konfi/activities wird hier NICHT auf die im
          Jahrgang aktivierten Punkt-Typen gefiltert - Teamer hängen an keinem
          Jahrgang.
      responses:
        "200": { description: "Array (id, name, points, type, category_names)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/teamer/requests:
    get:
      tags: ["Teamer:innen"]
      summary: Eigene Teamer-Anträge auflisten
      description: Nur Anträge zu Aktivitäten mit target_role='teamer', neueste zuerst.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "nur eigene Anträge (user_id = Token, organization_id)"
      responses:
        "200": { description: "Array (activity_requests.* + activity_name, activity_points, activity_type, activity_target_role)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }
    post:
      tags: ["Teamer:innen"]
      summary: Neuen Teamer-Antrag einreichen
      description: >
        Legt einen Antrag mit status pending an. Idempotent über optionale
        client_id (UUID): existiert der Antrag bereits, kommt 200 mit dem
        bestehenden Datensatz. Danach werden eine Bestaetigungs-Benachrichtigung
        an die Antragstellerin, eine In-App-Mitteilung UND eine Push-Nachricht
        an die gesamte Leitung (Rollen admin und org_admin) sowie ein
        Live-Update ausgelöst; Fehler dabei kippen den Antrag nicht. Bis
        26.08.2026 gab es hier nur Push — Teamer-Antraege fehlten damit im
        Mitteilungscenter der Leitung (Befund M6, behoben).
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer, validateCreateTeamerRequest]
        org-scope: true
        objekt-pruefung: "Aktivität muss zur eigenen Org gehören UND target_role='teamer' haben (404 sonst); user_id wird aus dem Token gesetzt"
        hinweis: >
          # BEFUND T1: Der Idempotenz-Check läuft über
          `WHERE client_id = $1` ohne user_id/organization_id. Eine bereits
          vergebene UUID liefert den fremden Datensatz mit 200 zurück. In der
          Praxis nicht erratbar (UUIDv4) und identisch zur Konfi-Route
          POST /api/konfi/requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activity_id, requested_date]
              properties:
                activity_id: { type: integer, minimum: 1 }
                requested_date: { type: string, format: date }
                description: { type: string, description: "Kommentar (Spalte comment)" }
                photo_filename: { type: string, description: "Dateiname aus POST /api/konfi/upload-photo (steht auch Teamern offen)" }
                client_id: { type: string, format: uuid }
      responses:
        "200": { description: Bereits vorhandener Antrag (Idempotenz ueber client_id) }
        "201": { description: "id + message" }
        "400": { description: Validierungsfehler (activity_id, requested_date, client_id) }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Aktivitaet nicht gefunden oder keine Teamer-Aktivitaet }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/teamer/requests/{id}:
    delete:
      tags: ["Teamer:innen"]
      summary: Eigenen offenen Teamer-Antrag löschen
      description: Nur Anträge mit status pending. Danach Live-Update an die Leitung.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer, "param('id').isInt", handleValidationErrors]
        org-scope: true
        objekt-pruefung: "nur eigener Antrag (id + user_id + organization_id, 404 sonst)"
        hinweis: >
          Anders als DELETE /api/konfi/requests/{id} wird hier KEIN
          zugehoeriges Nachweisfoto mitgeloescht - die Datei bleibt in
          uploads/ liegen.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: Geloescht }
        "400": { description: Antrag ist nicht mehr pending }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  # ===================================================================
  # backend/routes/material.js  (Prefix /api/material)
  # Lesen und Herunterladen: requireTeamer (org_admin, admin, teamer).
  # Alles Schreibende: requireAdmin (org_admin, admin).
  # Konfis haben auf keine dieser Routen Zugriff.
  # Keine Route kennt eine Jahrgangsgrenze (Befund M1).
  # ===================================================================
  # Die Tag-Routen (/api/material/tags, GET/POST/PUT/DELETE) wurden am
  # 27.08.2026 ENTFERNT (Simons Entscheidung). Sie boten ein vollstaendiges
  # CRUD, hatten aber keine Zeile Oberflaeche und kein Wort im Handbuch --
  # eine unfertig gebliebene Funktion (Befund 13 aus dem Rollen-Bericht).
  # Vor dem Entfernen in Produktion nachgemessen: 1 Tag, 0 Zuordnungen.
  # Tabellen per Migration 130 abgeraeumt.

  /api/material:
    get:
      tags: ["Material"]
      summary: Materialien der Organisation auflisten (mit Filtern)
      description: >
        Alle Materialien der aktiven Organisation, neueste zuerst, jeweils mit
        Zaehlern (Dateien, Termine, Jahrgänge) sowie den zugeordneten Tags,
        Terminen und Jahrgängen. Optionale Filter: tag_id, event_id,
        jahrgang_id und eine Volltextsuche (search) über Titel und
        Beschreibung.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "materials.organization_id UND Jahrgangs-Schranke für Teamer:innen"
        hinweis: >
          # BEFUND M1 BEHOBEN am 24.08.2026: Material mit Jahrgang sehen nur
          Teamer:innen, die diesem Jahrgang mit can_view zugewiesen sind;
          Material ohne Jahrgang sehen alle. Leitung (admin, org_admin) sieht
          weiterhin alles, sonst wäre es nicht verwaltbar. Die Bindung an
          einen Termin (material_events) bleibt bewusst reine Suchhilfe und
          grenzt nichts ab. Die Filter-Parameter selbst werden nicht auf die
          Organisation geprüft, was folgenlos ist, da die Zuordnungstabellen
          ohnehin nur org-eigene Materialien treffen.
      parameters:
        - name: tag_id
          in: query
          required: false
          schema: { type: integer }
          description: Nur Material mit diesem Tag
        - name: search
          in: query
          required: false
          schema: { type: string }
          description: Teilstring-Suche in Titel und Beschreibung
        - name: event_id
          in: query
          required: false
          schema: { type: integer }
          description: Nur Material zu diesem Termin
        - name: jahrgang_id
          in: query
          required: false
          schema: { type: integer }
          description: Nur Material dieses Jahrgangs
      responses:
        "200": { description: "Array (id, title, description, created_at, created_by_name, file_count, event_count, jahrgang_count, tags[], events[], jahrgaenge[])" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }
    post:
      tags: ["Material"]
      summary: Material anlegen
      description: >
        Legt ein Material an und verknuepft es mit Terminen, Jahrgängen und
        Tags. Alle uebergebenen IDs werden gegen die eigene Organisation
        geprüft (utils/orgOwnership.allIdsBelongToOrg); fremde IDs fuehren zu
        400. Danach Live-Update an die Leitung.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateCreateMaterial]
        org-scope: true
        objekt-pruefung: "event_ids, jahrgang_ids und tag_ids müssen der eigenen Org gehören (400 sonst); organization_id und created_by aus dem Token"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string, minLength: 1, maxLength: 255 }
                description: { type: string }
                event_ids: { type: array, items: { type: integer } }
                jahrgang_ids: { type: array, items: { type: integer } }
                tag_ids: { type: array, items: { type: integer } }
      responses:
        "201": { description: "id, title, description, created_at" }
        "400": { description: Titel fehlt oder mindestens eine ID gehoert zu einer fremden Organisation }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/material/by-event/{eventId}:
    get:
      tags: ["Material"]
      summary: Materialien zu einem Termin auflisten
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "materials.organization_id; der Termin selbst wird nicht separat geprüft - ein fremder eventId liefert schlicht eine leere Liste"
        hinweis: "Jahrgangs-Schranke für Teamer:innen (Befund M1 behoben am 24.08.2026): Material mit Jahrgang nur für dessen Teamer:innen, ohne Jahrgang für alle; Leitung sieht alles."
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: "ID des Termins"
      responses:
        "200": { description: "Array (id, title, description, created_at, created_by_name, file_count)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/material/{id}:
    get:
      tags: ["Material"]
      summary: Einzelnes Material mit Dateien, Tags, Terminen und Jahrgängen
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "Material org-gescopt (404 sonst)"
        hinweis: "Jahrgangs-Schranke für Teamer:innen (Befund M1 behoben am 24.08.2026): Material mit Jahrgang nur für dessen Teamer:innen, ohne Jahrgang für alle; Leitung sieht alles."
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "id, title, description, created_at, created_by_name, tags[], events[], jahrgaenge[], files[] (id, original_name, stored_name, mime_type, file_size, created_at)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }
    put:
      tags: ["Material"]
      summary: Material bearbeiten
      description: >
        Teilaktualisierung von Titel und Beschreibung. Werden event_ids,
        jahrgang_ids oder tag_ids uebergeben, werden die jeweiligen Zuordnungen
        komplett ersetzt (löschen und neu setzen); nicht uebergebene Felder
        bleiben unverändert. Alle IDs werden gegen die eigene Organisation
        geprüft.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateUpdateMaterial]
        org-scope: true
        objekt-pruefung: "Material muss zur eigenen Org gehören (404 sonst); event_ids/jahrgang_ids/tag_ids org-geprüft (400 sonst)"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, minLength: 1, maxLength: 255 }
                description: { type: string }
                event_ids: { type: array, items: { type: integer } }
                jahrgang_ids: { type: array, items: { type: integer } }
                tag_ids: { type: array, items: { type: integer } }
      responses:
        "200": { description: Aktualisiert }
        "400": { description: Mindestens eine ID gehoert zu einer fremden Organisation }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }
    delete:
      tags: ["Material"]
      summary: Material samt Dateien löschen
      description: >
        Loescht das Material (Zuordnungen und material_files per CASCADE) und
        entfernt anschliessend die verschluesselten Dateien vom Dateisystem.
        Ein Fehler beim Löschen einer Datei wird nur protokolliert.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin]
        org-scope: true
        objekt-pruefung: "DELETE mit organization_id-Bedingung (404 sonst); die Dateiliste wird über denselben Org-JOIN ermittelt"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: Geloescht }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/material/{id}/files:
    post:
      tags: ["Material"]
      summary: Dateien zu einem Material hochladen (verschlüsselt at-rest)
      description: >
        multipart/form-data, Feld "files", bis zu 10 Dateien pro Request, je
        max. 20 MB (multer memoryStorage, createApp.js). Zweistufige Prüfung:
        erst der MIME-Filter von multer (Bilder, PDF, Video, Audio,
        Office- und OpenDocument-Formate, ZIP, text/plain, text/csv), dann eine
        Magic-Bytes-Prüfung auf dem Buffer (415 bei Nichtuebereinstimmung;
        text/plain und text/csv sind ausgenommen, weil sie keine Signatur
        haben). Gespeichert wird AES-256-GCM-verschlüsselt unter einem
        zufaelligen 64-Hex-Dateinamen.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, "multer materialUpload.array('files', 10)"]
        org-scope: true
        objekt-pruefung: "Material muss zur eigenen Org gehören (404 sonst)"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items: { type: string, format: binary }
                  maxItems: 10
      responses:
        "201": { description: "Array der angelegten Dateien (id, original_name, mime_type, file_size, created_at)" }
        "400": { description: Keine Dateien im Request oder Datei nicht lesbar }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "413": { description: "Datei ueberschreitet 20 MB (globaler Multer-Handler in createApp.js)" }
        "415": { description: Dateityp nicht verifizierbar (Magic-Bytes) }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/material/files/{fileRef}:
    get:
      tags: ["Material"]
      summary: Material-Datei herunterladen (entschluesselt)
      description: >
        Liefert die entschluesselte Datei als Download mit dem urspruenglichen
        Dateinamen und dem gespeicherten MIME-Typ. Der Pfadparameter wird durch
        path.basename und einen Test auf genau 64 Hex-Zeichen geführt
        (Path-Traversal-Schutz).
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "Datei wird über JOIN auf materials.organization_id geprüft (404 bei fremder Org); Dateiname muss /^[a-f0-9]{64}$/ erfuellen"
        hinweis: >
          # BEFUND M1 BEHOBEN am 24.08.2026: Der Download unterliegt derselben
          Jahrgangs-Schranke wie die Liste - eine Teamer:in bekommt Dateien
          eines fremden Jahrgangs mit 404 verweigert, auch bei bekanntem
          stored_name. Die stored_name-Werte stehen in GET /api/material/{id}.
      parameters:
        - name: fileRef
          in: path
          required: true
          description: >
            Beim GET der 64-stellige stored_name der Datei (aus
            GET /api/material/{id}), NICHT die numerische id.
          schema: { type: string, pattern: "^[a-f0-9]{64}$" }
      responses:
        "200": { description: Datei als Download (Content-Type aus mime_type, Content-Disposition attachment) }
        "400": { description: Ungueltiger Dateiname }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Datei nicht gefunden (fremde Org oder auf dem Server nicht vorhanden) }
        "500": { description: Datei konnte nicht entschluesselt werden / Serverfehler }
    delete:
      tags: ["Material"]
      summary: Einzelne Material-Datei löschen
      description: >
        Loescht den Datenbankeintrag und die Datei vom Dateisystem und setzt
        updated_at des Materials neu. Ein Fehler beim Löschen der Datei wird
        nur protokolliert.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin]
        org-scope: true
        objekt-pruefung: "Datei wird über JOIN auf materials.organization_id geprüft (404 sonst)"
        hinweis: >
          Achtung, derselbe Pfad wird mit ZWEI verschiedenen Kennungen
          bedient: der GET erwartet den 64-stelligen stored_name, der DELETE
          die numerische material_files.id. Im Code sind das zwei getrennte
          Routen (/files/:filename und /files/:fileId); in OpenAPI müssen sie
          sich einen Pfad teilen, daher der neutrale Name fileRef.
      parameters:
        - name: fileRef
          in: path
          required: true
          description: "Beim DELETE die numerische material_files.id"
          schema: { type: integer, minimum: 1 }
      responses:
        "200": { description: Geloescht }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  # ===================================================================
  # backend/routes/wrapped.js  (Prefix /api/wrapped)
  # Der Router exportiert zusaetzlich generateAllKonfiWrapped und
  # generateAllTeamerWrapped als Funktionen für den Cron
  # (backgroundService) - das sind KEINE HTTP-Routen und daher hier nicht
  # dokumentiert.
  # ===================================================================
  /api/wrapped/me:
    get:
      tags: ["Wrapped"]
      summary: Eigenen Jahresrueckblick abrufen
      description: >
        Liefert den neuesten eigenen Wrapped-Snapshot. Die Art richtet sich
        nach der Rolle: role_name 'teamer' erhält wrapped_type 'teamer', alle
        anderen 'konfi'. Ohne Snapshot kommt 404. Für die Rolle konfi greift
        seit 26.08.2026 das Freigabe-Gate (Befund M7, behoben): Ist der
        aktuelle Jahrgang nicht freigegeben (jahrgaenge.wrapped_released_at
        NULL oder in der Zukunft), kommt 403 — vorher lieferte der Endpunkt
        den Snapshot auch ohne Freigabe, nur das Dashboard prüfte den
        Schalter. Teamer-Wrapped kennt keine Freigabe.
      x-berechtigung:
        rollen: ["alle authentifizierten"]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "nur eigene Daten (WHERE user_id = req.user.id)"
        hinweis: >
          # BEFUND W1: Die Abfrage filtert NICHT auf organization_id. Bei
          Multi-Org-Nutzung kommt der neueste Snapshot unabhaengig von der
          aktiven Organisation zurück. Es sind immer eigene Daten, aber der
          Org-Kontext wird ignoriert. Ausserdem gibt es keinen Rollen-Guard:
          jede authentifizierte Rolle darf die Route aufrufen (für
          org_admin/admin/super_admin ist das Ergebnis in aller Regel 404).
      responses:
        "200": { description: "data (Snapshot-JSON), computed_at, year, wrapped_type" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: "Konfi-Wrapped noch nicht freigegeben (Freigabe-Gate seit 26.08.2026)" }
        "404": { description: Kein Wrapped-Snapshot vorhanden }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/wrapped/generate/{jahrgangId}:
    post:
      tags: ["Wrapped"]
      summary: Konfi-Jahresrueckblick für einen ganzen Jahrgang erzeugen und freigeben
      description: >
        Erzeugt (oder überschreibt) die Snapshots aller nicht geloeschten
        Konfis des Jahrgangs parallel, setzt jahrgaenge.wrapped_released_at auf
        jetzt - damit ist der Rueckblick für die Konfis sichtbar - und schickt
        allen Konfis eine Push-Nachricht. Laeuft in einer Transaktion; ein
        Fehler bei einzelnen Konfis wird nur gezählt (errors), nicht
        zurueckgerollt.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, "param('jahrgangId').isInt", handleValidationErrors]
        org-scope: true
        objekt-pruefung: "Jahrgang muss zur aktiven Org gehören (404 sonst); organization_id der Snapshots kommt aus dem Token"
        hinweis: >
          Keine Jahrgangsgrenze: ein 'admin' kann für JEDEN Jahrgang der
          Organisation den Rueckblick erzeugen und freigeben, auch außerhalb
          der eigenen Zuweisungen. Teamer:innen haben keinen Zugriff (403).
      parameters: [ { $ref: '#/components/parameters/pathJahrgangId' } ]
      responses:
        "200": { description: "message, generated (Anzahl), errors (Anzahl), jahrgang (Name), year" }
        "400": { description: Ungueltige jahrgangId }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Jahrgang nicht gefunden (fremde Organisation) }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/wrapped/generate-teamer:
    post:
      tags: ["Wrapped"]
      summary: Teamer-Jahresrueckblick für alle Teamer:innen der Organisation erzeugen
      description: >
        Erzeugt (oder überschreibt) die Snapshots aller Teamer:innen der
        Organisation nacheinander und schickt ihnen eine Push-Nachricht. Es
        gibt keine Freigabe-Markierung wie bei den Jahrgängen - der Rueckblick
        ist sofort über GET /api/wrapped/me abrufbar.
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, requireOrgAdmin]
        org-scope: true
        objekt-pruefung: "nur Teamer:innen mit users.organization_id = aktive Org"
        hinweis: >
          Die Teamer-Auswahl filtert nicht auf deleted_at (anders als die
          Konfi-Variante). Geloeschte Teamer:innen bekaemen also weiterhin
          einen Snapshot, sofern die Zeile noch existiert.
      responses:
        "200": { description: "message, generated (Anzahl), errors (Anzahl), year" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/wrapped/{jahrgangId}:
    delete:
      tags: ["Wrapped"]
      summary: Jahresrueckblick eines Jahrgangs löschen und Freigabe zuruecknehmen
      description: >
        Loescht alle Snapshots des Jahrgangs und setzt
        jahrgaenge.wrapped_released_at auf NULL, womit der Rueckblick für die
        Konfis wieder verschwindet.
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, requireOrgAdmin, "param('jahrgangId').isInt", handleValidationErrors]
        org-scope: true
        objekt-pruefung: "Jahrgang muss zur aktiven Org gehören (404 sonst); DELETE mit jahrgang_id + organization_id"
        hinweis: >
          # BEFUND W3: Teamer-Snapshots werden ohne jahrgang_id gespeichert und
          von dieser Route deshalb nie erfasst. Einen Endpunkt zum Löschen des
          Teamer-Rueckblicks gibt es nicht.
      parameters: [ { $ref: '#/components/parameters/pathJahrgangId' } ]
      responses:
        "200": { description: "message, deleted (Anzahl geloeschter Snapshots)" }
        "400": { description: Ungueltige jahrgangId }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Jahrgang nicht gefunden (fremde Organisation) }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/wrapped/history/{userId}:
    get:
      tags: ["Wrapped"]
      summary: Alle Jahresrueckblicke einer Person auflisten
      description: >
        Alle Snapshots (beide Arten, alle Jahre) der angefragten Person, nach
        Jahr absteigend. Jede Person darf ihre eigene Historie abrufen;
        daneben duerfen admin und org_admin die Historie von Personen der
        eigenen Organisation abrufen.
      x-berechtigung:
        rollen: ["alle authentifizierten (eigene Daten)", org_admin, admin]
        middleware: [verifyTokenRBAC, "param('userId').isInt", handleValidationErrors, "Inline-Check Eigentuemer ODER admin/org_admin derselben Org"]
        org-scope: true
        objekt-pruefung: >
          req.user.id === userId erlaubt immer; sonst muss role_name 'admin'
          oder 'org_admin' sein UND users.organization_id des Ziels der eigenen
          organization_id entsprechen (403 sonst). Kein requireAdmin-Guard,
          die Prüfung steht inline im Handler.
        hinweis: >
          # BEFUND W2: Die Org-Prüfung nutzt users.organization_id, also die
          PRIMAER-Organisation der Zielperson, nicht die aktive Org aus dem
          Header X-Active-Organization. Die Snapshot-Abfrage selbst filtert
          ausserdem nur auf user_id, ohne organization_id - bei Multi-Org
          können also Snapshots aus einer anderen Organisation mitkommen.
          Teamer:innen erhalten für fremde userIds 403.
      parameters: [ { $ref: '#/components/parameters/pathUserId' } ]
      responses:
        "200": { description: "Array (id, wrapped_type, year, data, computed_at)" }
        "400": { description: Ungueltige userId }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: Weder eigene Daten noch admin/org_admin derselben Organisation }
        "500": { $ref: '#/components/responses/ServerError' }
