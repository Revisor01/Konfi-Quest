# ============================================================================
# Konfi Quest API — Block 1: Chat, Challenges, Notifications
# OpenAPI 3.1 — verifiziert am Code (backend/routes/chat.js, challenges.js,
# notifications.js), Stand Branch main, 2026-08-22.
#
# Mount-Punkte (backend/createApp.js):
#   /api/chat           -> routes/chat.js           (24 Routen)
#   /api/challenges     -> routes/challenges.js     (13 Routen)
#   /api/notifications  -> routes/notifications.js  ( 9 Routen)
#
# ROLLEN-MODELL (middleware/rbac.js):
#   req.user.type = 'konfi'  für Rolle konfi
#                   'teamer' für Rolle teamer
#                   'admin'  für Rollen admin, org_admin UND super_admin
#   Alle "Admin-Bypass"-Prüfungen im Chat (userType === 'admin') gelten also
#   für admin + org_admin (+ super_admin), NIE für teamer.
#   requireTeamer = requireRole('org_admin', 'admin', 'teamer').
#
# ============================================================================
# DIE FUENF CHAT-KERNFRAGEN (am Code verifiziert)
# ============================================================================
#
# 1. WER DARF WEN ANSCHREIBEN?
#    Kontaktlisten:
#    - GET /chat/team-contacts: nur admin/org_admin/teamer. Liefert ALLE
#      aktiven admin/org_admin/teamer der AKTIVEN Org (ohne E-Mail/Login-Daten).
#      Seit 2026-09-25 zaehlt auch eine Mitgliedschaft via user_organizations,
#      mit der dortigen EFFEKTIVEN Rolle (TEAM_MITGLIED_ROLLE, wie /admins);
#      vorher nur Stamm-Konten (u.organization_id) -- Multi-Org-Leitungen
#      fehlten in der Team-Liste ihrer Zweit-Gemeinde (behoben 2026-09-25).
#    - GET /chat/admins: nur Konfis. Liefert org_admin (immer, auch
#      Multi-Org-Leitungen via user_organizations), Konten mit
#      is_super_admin-Flag sowie die Admins und Teamer:innen des eigenen
#      Jahrgangs (seit 2026-09-01, vorher alle Admins); filtert
#      is_active/deleted_at. username wird nicht mehr ausgeliefert
#      (2026-08-23). Die Route hat derzeit keine Aufrufer, das Frontend
#      nutzt /available-users.
#    - GET /chat/available-users: nur Konfis. Wie /admins, aber ohne bereits
#      bestehende Direktchats; liefert NIE andere Konfis. type ist dreiwertig
#      ('admin' | 'teamer' | 'konfi') — vorher kam hart 'admin' zurück.
#    Direktchat (POST /chat/direct):
#    - Ziel muss Mitglied der aktiven Organisation sein (Org-Grenze hart);
#      seit 2026-09-01 zaehlt auch eine Mitgliedschaft via
#      user_organizations, mit der dortigen EFFEKTIVEN Rolle (wie rbac.js
#      beim Org-Wechsel) — vorher galten Multi-Org-Konten als "nicht in
#      deiner Organisation".
#    - Konfi -> Konfi: 403 ("Konfis können keine anderen Konfis anschreiben").
#    - Konfi -> org_admin/super_admin (Rolle oder Flag): erlaubt, immer.
#    - Konfi -> admin/teamer: NUR mit gemeinsamem Jahrgang (can_view).
#      Wer ohne Zuweisung ist, ist für Konfis unsichtbar und nicht
#      erreichbar. Die Grenze gilt in /admins, /available-users, POST /direct
#      UND POST /rooms (participants). (teamer seit 2026-08-23; admin seit
#      2026-09-01 — Simons Korrektur "Konfis duerfen nur org Admins und
#      Admins und Teamer ihres Jahrgangs anschreiben!". Die Regel ist damit
#      in beiden Richtungen symmetrisch; die vorher dokumentierte bewusste
#      Unsymmetrie "Konfi -> admin immer" ist damit aufgehoben.)
#    - org_admin/super_admin (Rolle oder Flag) -> Konfi: erlaubt, jeder
#      Konfi der Org.
#    - admin -> Konfi: NUR Konfis der zugewiesenen Jahrgänge (can_view) —
#      wie teamer. Konfi ohne Jahrgang erreicht nur die Leitung.
#      (NEU 2026-09-01: Simons Jahrgangsregel vom 31.08.2026 galt im ganzen
#      Backend, der Direktchat war die letzte Ausnahme. Vorher stand hier
#      "admin -> Konfi: erlaubt, jeder Konfi der Org". Bestehende Raeume
#      werden NICHT nachtraeglich gesperrt, gebunden ist nur das Anlegen.)
#    - teamer -> Konfi: NUR Konfis der zugewiesenen Jahrgänge (can_view).
#      Konfi ohne Jahrgang ist für teamer nicht erreichbar. Dieselbe Grenze
#      gilt in POST /chat/rooms für Konfis in der participants-Liste und
#      seit 2026-09-01 auch beim nachtraeglichen Hinzufuegen
#      (POST /rooms/:id/participants, dort nur fuer Admins relevant).
#      (BEHOBEN 2026-08-23; vorher erreichte jede Teamer:in jeden Konfi.)
#    - teamer <-> teamer/admin: erlaubt.
#    - Über Organisationsgrenzen: nie (Ziel-Lookup ist org-gescopt -> 403).
#    ABER siehe LUECKE 1: POST /chat/rooms umgeht das Konfi-Konfi-Verbot.
#
# 2. WER SIEHT WEN in Mitgliederlisten (GET /chat/rooms/:roomId/participants)?
#    - Teilnehmer des Raums (konfi/teamer): sehen ALLE Teilnehmer mit Name,
#      Rolle, role_title und (bei Konfis) Jahrgang.
#    - admin/org_admin: sehen die Teilnehmerliste JEDES Raums ihrer Org,
#      auch ohne selbst Teilnehmer zu sein (Admin-Bypass).
#    - Konfis sehen also in Jahrgangs-/Gruppen-/Event-Chats die anderen
#      Konfis des Raums namentlich — das ist die einzige Stelle, an der
#      Konfis andere Konfis "sehen" (anschreiben können sie sie nicht).
#
# 3. WER DARF WELCHEN RAUM SEHEN / BETRETEN?
#    - GET /chat/rooms (Liste): strikt teilnahmebasiert — jeder (auch
#      admin/org_admin) sieht in der LISTE nur Räume, in denen er selbst
#      chat_participants-Eintrag hat (org-gescopt). Jahrgangs- und Team-Chat-
#      Mitgliedschaft wird beim Aufruf per TTL-Sync (10 Min) nachgezogen:
#      konfi -> eigener Jahrgangs-Chat; teamer/admin -> zugewiesene
#      Jahrgänge + Team-Chat; org_admin -> ALLE Jahrgangs-Chats + Team-Chat.
#    - Betreten/Lesen einzelner Räume (GET /rooms/:roomId, /messages,
#      mark-read, POST /messages): Teilnehmer ODER Admin-Bypass —
#      admin/org_admin können JEDEN Raum ihrer Org oeffnen, lesen und darin
#      schreiben — AUSSER fremde Direktchats (GEAENDERT 2026-08-23: ein
#      Zwiegespraech ist privat, dort greift der Admin-Bypass nicht mehr).
#      Gruppen-, Jahrgangs-, Team- und Termin-Chats bleiben offen.
#      teamer und konfi ausschliesslich als Teilnehmer.
#      Zentral in darfRaumOeffnen() (chat.js), genutzt von /rooms/:id,
#      /messages (GET+POST), mark-read, participants, reactions, polls,
#      DELETE /messages/:id und dem Export.
#    - Export (GET /rooms/:roomId/export): nur admin/org_admin (explizit
#      NICHT teamer), kompletter Verlauf — aber nur für Räume, die man
#      oeffnen darf (403 bei fremdem Direktchat).
#    - Org-Grenze: ueberall hart (jede Query prüft organization_id).
#    - Socket-Raum `room_<id>` (joinRoom/typing/stopTyping, server.js):
#      dieselbe Regel wie oben — Teilnehmer ODER Admin-Bypass, dazu die
#      Org-Grenze. (BEHOBEN 2026-08-23; vorher wurde NUR die Organisation
#      geprüft, jeder Angemeldete derselben Gemeinde konnte damit jedem Raum
#      beitreten und über newMessage/pollUpdated/reactionAdded alle neuen
#      Nachrichten fremder Chats mitlesen.)
#
# 4. WER DARF NACHRICHTEN LOESCHEN (DELETE /chat/messages/:messageId)?
#    - Eigene Nachrichten: jede Rolle (auch Konfi), Soft-Delete.
#    - Fremde Nachrichten: nur admin/org_admin, und nur in Räumen, die sie
#      oeffnen duerfen — in fremden Direktchats also nicht mehr
#      (GEAENDERT 2026-08-23). teamer duerfen NUR eigene löschen.
#    - Raum löschen (DELETE /rooms/:roomId): nur admin/org_admin; mit
#      Nachrichten nur per ?force=true; Jahrgangs-Chats nie direkt.
#    - Team-Chat leeren (DELETE /rooms/:roomId/messages, NEU 2026-08-26):
#      nur admin/org_admin, nur der automatische Team-Chat (is_team_chat) —
#      alle Nachrichten samt Dateianhaengen hart weg, Raum und Mitglieder
#      bleiben.
#
# 5. CHALLENGES — WER SIEHT WELCHE BEITRAEGE / ANONYMITAET?
#    - Zentrale Sichtbarkeitslogik (PUBLIC_SUBMISSION_SQL, eine Stelle):
#      oeffentlich = moderation_status='approved' UND (visibility='public'
#      ODER (visibility='konfi_choice' UND konfi_consent IN
#      ('publish','anonymous'))). visibility='private' ist NIE oeffentlich,
#      'hidden' schlägt alles.
#    - Galerie (GET /konfi/:id): nur fremde OEFFENTLICHE Beitraege; bei
#      anonymen Beitraegen werden display_name, role_name UND jahrgang_name
#      bereits im SQL auf NULL gesetzt — der Name verlässt das Backend nie.
#    - Eigene Beitraege: immer sichtbar (mit Moderationsstatus).
#    - Leitung (GET /admin/:id/submissions): sieht IMMER alles inkl. Namen —
#      Anonymitaet gilt gegenueber der Gruppe, nicht gegenueber der Leitung.
#      org_admin org-weit; admin und teamer nur Challenges ihrer zugewiesenen
#      Jahrgänge ('nur_team'-Challenges org-weit für das ganze Team).
#      GEAENDERT 2026-08-31: admin war vorher wie org_admin org-weit.
#    - Export (GET /admin/:id/export): strenger als die Sammelansicht —
#      konfi_consent='private' ("nur für die Leitung") landet NIE im Export;
#      anonyme Beitraege erscheinen als "Anonym".
#    - Anonymisierung ist Einbahnstrasse (anonymize ohne Gegenstueck) und seit
#      2026-08-24 fuer ALLE Sichtbarkeiten erlaubt (vorher nur konfi_choice):
#      der Konsens 'anonymous' allein entscheidet ueber die Namens-Anzeige in
#      Galerie und Export. Ausgenommen bleiben 'private'-Zusagen und bereits
#      anonyme Beitraege (409).
#      Konfis können Beitraege nicht selbst zurueckziehen (DELETE -> immer 403).
#    - ABZEICHEN ERST NACH FREIGABE (Entscheid 2026-08-24, gleiche Regel fuer
#      alle Rollen inkl. Leitung): has_badge/marks zaehlen nur eigene
#      Beitraege mit moderation_status='approved'. Ohne Moderation ist jeder
#      Beitrag sofort approved -> Abzeichen sofort. has_submission ("schon
#      eingereicht") haengt bewusst NICHT an der Freigabe.
#    - Dateiabruf (GET /files/:filename): Owner immer; org_admin org-weit;
#      admin und teamer nur zugewiesene Jahrgänge bzw. 'nur_team' org-weit;
#      Konfi nur oeffentliche Beitraege seines Jahrgangs. Auth NUR per
#      Authorization-Header (bewusst kein ?token= wie im Chat).
#
# ============================================================================
# GEFUNDENE LUECKEN (Details als "# LUECKE:" an den betroffenen Routen)
# ============================================================================
# LUECKE 1 (POST /chat/rooms): Konfis können das Konfi-zu-Konfi-Verbot
#   umgehen: type='direct' ist für Konfis erlaubt, und die participants-Liste
#   wird NUR gegen die Org geprüft, nicht gegen Rollen. Ein Konfi kann so
#   einen "direct"-Raum mit anderen Konfis (auch mehreren) anlegen und mit
#   ihnen chatten — POST /direct blockiert genau das.
# LUECKE 2 (anonyme Umfragen) — BEHOBEN 2026-08-23: GET /rooms/:roomId/messages
#   und das pollUpdated-Event lieferten bei anonymous=true zwar keinen
#   user_name, aber weiterhin user_id und user_type JEDER Stimme. Über die
#   Teilnehmerliste (Frage 2) liess sich daraus aufloesen, wer was gewählt
#   hat. Jetzt kommen fremde Stimmen mit user_id=null und user_type=null; nur
#   die EIGENE Stimme behält ihre Kennung, damit der Client sie markieren
#   kann. Das gilt auch gegenueber der Leitung — anders als bei Challenges,
#   wo sie bewusst alles sieht.
# LUECKE 4 (POST /chat/messages/:messageId/vote) — BEHOBEN 2026-08-23: Die
#   Route hatte eine eigene, unvollstaendige Kopie der Abstimmlogik und
#   ignorierte exclusive_options komplett (kein FOR-UPDATE-Lock, keine
#   Belegt-Prüfung). Bei einer exklusiven Umfrage liess sich darueber dieselbe
#   Option mehrfach belegen, während /polls/:pollId/vote korrekt 409 liefert.
#   Beide Routen teilen sich jetzt denselben Handler; /polls/:pollId/vote sucht
#   die Umfrage ohnehin per poll_id UND per message_id.
# LUECKE 3 (GET /chat/files/:filename): Token wird auch als ?token=
#   Query-Parameter akzeptiert (landet in Access-Logs/Referrern). Die
#   Challenges-Route verzichtet aus genau diesem Grund bewusst darauf.
#   Ausserdem prüft die Mitgliedschaft hier nur user_id (ohne user_type) und
#   es gibt KEINEN Admin-Bypass: ein Admin, der Nachrichten eines fremden
#   Raums lesen darf, kann dessen Dateien nicht abrufen (Inkonsistenz, keine
#   Rechteausweitung).
# HINWEIS — ERLEDIGT 2026-08-23: admin/org_admin konnten JEDEN Raum der Org
#   lesen, beschreiben und exportieren, auch private Direktchats zweier
#   anderer Nutzer. Direktchats sind davon jetzt ausgenommen. Teamer können über POST /chat/rooms
#   Gruppenraeume mit beliebigen Org-Nutzern (auch Konfis fremder Jahrgänge)
#   anlegen und Jahrgangs-Chats für JEDEN Jahrgang der Org erstellen
#   (keine Zuweisungspruefung beim Anlegen).
# ============================================================================

openapi: 3.1.0
info:
  title: Konfi Quest API — Chat, Challenges, Notifications (Block 1)
  version: "1.0.0"
  description: >
    Teildokumentation der Konfi-Quest-API: Chat-System, Challenges 2.0 und
    Push-/Badge-Notifications. Schwerpunkt: Berechtigungen (x-berechtigung
    je Route). Rollen: super_admin, org_admin, admin, teamer, konfi.
servers:
  - url: https://konfi-quest.de
security:
  - bearerAuth: []
tags:
  - name: "Benachrichtigungen"
    description: "Push-Gerätetokens, Benachrichtigungs-Einstellungen, Badge-Zähler."
  - name: "Challenges (Konfis)"
    description: "Challenges aus Teilnehmenden-Sicht: ansehen, Beiträge einreichen und zurückziehen."
  - name: "Challenges (Leitung)"
    description: "Challenges anlegen, moderieren und auswerten."
  - name: "Chat"
    description: "Chaträume, Nachrichten, Dateien, Umfragen und Reaktionen."

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT im Authorization-Header. Optional Header X-Active-Organization
        (Multi-Org): schaltet die aktive Organisation um, sofern der User dort
        Mitglied ist (sonst 403).
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    ChatRoom:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, description: Bei Direktchats der Name des Gegenuebers }
        type: { type: string, enum: [direct, group, jahrgang, admin_team] }
        organization_id: { type: integer }
        jahrgang_id: { type: [integer, "null"] }
        jahrgang_name: { type: [string, "null"] }
        created_by: { type: integer }
        created_at: { type: string, format: date-time }
        event_id: { type: [integer, "null"] }
        participant_count: { type: integer }
        partner_user_type: { type: [string, "null"], description: Rolle des Direktchat-Partners (admin/teamer/konfi) }
        is_team_only: { type: boolean }
        unread_count: { type: integer }
        last_message:
          type: [object, "null"]
          properties:
            content: { type: [string, "null"] }
            sender_name: { type: string }
            created_at: { type: string, format: date-time }
            file_name: { type: [string, "null"] }
            message_type: { type: string }
        last_message_at: { type: [string, "null"], format: date-time }
    ChatMessage:
      type: object
      properties:
        id: { type: integer }
        room_id: { type: integer }
        sender_id: { type: integer }
        sender_type: { type: string, enum: [admin, teamer, konfi] }
        sender_name: { type: string }
        message_type: { type: string, enum: [text, image, video, file, poll] }
        content: { type: [string, "null"], description: Bei geloeschten Nachrichten der Platzhaltertext }
        is_deleted: { type: boolean }
        file_path: { type: [string, "null"] }
        file_name: { type: [string, "null"] }
        file_size: { type: [integer, "null"] }
        reply_to_id: { type: [integer, "null"] }
        reply_to_content: { type: [string, "null"] }
        reply_to_sender_name: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        reactions:
          type: array
          items: { $ref: '#/components/schemas/Reaction' }
        poll_id: { type: [integer, "null"] }
        question: { type: [string, "null"] }
        options: { type: [array, "null"], items: { type: string } }
        multiple_choice: { type: boolean }
        anonymous: { type: boolean }
        exclusive_options: { type: boolean }
        expires_at: { type: [string, "null"], format: date-time }
        votes:
          type: array
          description: >
            Stimmen der Umfrage. Bei anonymous=true fehlt user_name —
            user_id/user_type sind aber enthalten (siehe LUECKE 2 im Kopf).
          items:
            type: object
            properties:
              user_id: { type: integer }
              user_type: { type: string }
              option_index: { type: integer }
              user_name: { type: [string, "null"] }
    Reaction:
      type: object
      properties:
        id: { type: integer }
        message_id: { type: integer }
        user_id: { type: integer }
        user_type: { type: string }
        emoji: { type: string, enum: [like, heart, laugh, wow, sad, pray] }
        user_name: { type: string }
        created_at: { type: string, format: date-time }
    TeamContact:
      type: object
      properties:
        id: { type: integer }
        display_name: { type: string }
        role_name: { type: string, enum: [admin, org_admin, teamer] }
        role_description: { type: string, description: role_title oder Fallback ("Teamer:in"/"Admin") }
    KonfiChallenge:
      type: object
      description: Challenge in der Teilnehmer-Sicht (mapChallengeForKonfi).
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        challenge_type: { type: string, enum: [wahrnehmung, beitrag, praxis, frei] }
        audience: { type: string, enum: [konfis, konfis_und_team, nur_team] }
        visibility: { type: string, enum: [public, konfi_choice, private] }
        moderated: { type: boolean }
        allowed_media:
          type: array
          items: { type: string, enum: [text, photo, audio, video, link] }
        allow_multiple: { type: boolean }
        badge_icon: { type: string }
        badge_name: { type: string }
        author_user_id: { type: [integer, "null"] }
        author_freetext: { type: [string, "null"] }
        author_display_name: { type: [string, "null"] }
        starts_at: { type: string, format: date-time }
        ends_at: { type: string, format: date-time }
        status: { type: string, enum: [draft, scheduled, active, ended], description: "Abgeleitet, nie gespeichert" }
        has_badge: { type: boolean, description: "Abgeleitet aus EXISTS eigener Submission mit moderation_status='approved' — Abzeichen erst nach Freigabe (2026-08-24, gilt fuer alle Rollen)" }
        has_submission: { type: boolean, description: "Schon eingereicht (unabhaengig von der Freigabe)" }
        earned_at: { type: [string, "null"], format: date-time, description: "Wann der eigene Stempel verdient wurde (fruehester freigegebener eigener Beitrag). ADDITIV seit 2026-09-16, wortgleich zu GET /challenges/konfi — fuers Stempel-Popover in Leitungs- und Teamer-Ansicht" }
        own_submission_count: { type: integer }
    Submission:
      type: object
      properties:
        id: { type: integer }
        media_type: { type: string, enum: [text, photo, audio, video, link] }
        text_content: { type: [string, "null"] }
        file_path: { type: [string, "null"], description: "Hex-Dateiname fuer GET /challenges/files/{filename}" }
        file_name: { type: [string, "null"] }
        link_url: { type: [string, "null"] }
        link_title: { type: [string, "null"], description: "Titel des verlinkten Stuecks; vom Server beim Einreichen einmalig geholt (oEmbed/iTunes-Lookup). NULL bei Alt-Beitraegen und fehlgeschlagenem Abruf." }
        link_author: { type: [string, "null"], description: "Interpret; gleiche Herkunft wie link_title. Bewusst KEIN Cover/Bild (Datenschutzentscheid 24.08.2026)." }
        konfi_consent: { type: [string, "null"], enum: [publish, private, anonymous, null], description: "Beim Einreichen nur bei visibility=konfi_choice gesetzt; 'anonymous' kann seit 2026-08-24 durch nachtraegliches Anonymisieren der Leitung bei JEDER Sichtbarkeit stehen" }
        moderation_status: { type: string, enum: [pending, approved, hidden] }
        moderation_note: { type: [string, "null"], description: "Optionale Begruendung der Leitung beim Ausblenden (Migration 126); wird beim Freigeben/Wieder-Einblenden geleert" }
        created_at: { type: string, format: date-time }
    GallerySubmission:
      type: object
      description: Fremder oeffentlicher Beitrag in der Galerie. Bei anonymen Beitraegen sind display_name, role_name und jahrgang_name serverseitig NULL.
      properties:
        id: { type: integer }
        media_type: { type: string }
        text_content: { type: [string, "null"] }
        file_path: { type: [string, "null"] }
        file_name: { type: [string, "null"] }
        link_url: { type: [string, "null"] }
        link_title: { type: [string, "null"] }
        link_author: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        display_name: { type: [string, "null"] }
        role_name: { type: [string, "null"] }
        jahrgang_name: { type: [string, "null"] }
        is_anonymous: { type: boolean }

paths:

  # ==========================================================================
  # CHAT — Kontaktlisten und Direktchats
  # ==========================================================================

  /api/chat/team-contacts:
    get:
      tags: ["Chat"]
      summary: Team-Kontaktliste für Direktchats
      description: >
        Liefert alle aktiven Admins, Org-Admins und Teamer:innen der aktiven
        Organisation (ohne den Aufrufer selbst) — bewusst nur die für einen
        Chat noetigen Felder, keine E-Mail/Login-Daten. Mitgliedschaft und
        Rolle werden wie bei /chat/admins ueber Stamm-Organisation ODER
        user_organizations aufgeloest (Rolle je Organisation); Multi-Org-
        Mitglieder erscheinen damit auch im Team ihrer Zweit-Gemeinde
        (seit 2026-09-25, vorher nur Stamm-Konten).
      responses:
        '200':
          description: Liste der Team-Mitglieder
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TeamContact' }
        '403': { description: Aufrufer ist Konfi, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Explizite role_name-Prüfung im Handler (admin/org_admin/teamer), sonst 403"
        hinweis: "Konfis nutzen stattdessen GET /chat/admins bzw. /chat/available-users"

  /api/chat/admins:
    get:
      tags: ["Chat"]
      summary: Anschreibbare Team-Mitglieder (Konfi-Sicht)
      description: >
        Nur für Konfis: die Leitung (org_admin, auch Multi-Org via
        user_organizations), Super-Admins sowie die Admins und Teamer:innen
        mit gemeinsamem Jahrgang. Konfis können ausschliesslich diese
        Personen anschreiben (Regel vom 2026-09-01).
      responses:
        '200':
          description: Liste (id, display_name) — username wird seit 23.08.2026 nicht mehr ausgeliefert
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    display_name: { type: string }
        '403': { description: Aufrufer ist kein Konfi }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "req.user.type muss 'konfi' sein; Admins und Teamer:innen nur mit gemeinsamem Jahrgang, org_admin/is_super_admin immer (KONFI_SIEHT_TEAMMITGLIED)"
        hinweis: >
          Seit 2026-09-01 symmetrisch: Die Liste bietet exakt an, was
          teamAnschreibenVerboten beim Anschreiben erlaubt. Vorher blieben
          Admins auch ohne Zustaendigkeit sichtbar; diese bewusste
          Unsymmetrie hat Simon am 2026-09-01 aufgehoben. Multi-Org-
          Leitungen (Rolle nur in user_organizations) erscheinen seither
          ebenfalls (TEAM_MITGLIED_ROLLE).

  /api/chat/available-users:
    get:
      tags: ["Chat"]
      summary: Noch nicht angeschriebene Chat-Partner (Konfi-Sicht)
      description: >
        Nur für Konfis: Team-Mitglieder der Org, mit denen noch KEIN
        Direktchat besteht. Liefert nie andere Konfis
        (permissions: direct_only_admin).
      responses:
        '200':
          description: Verfuegbare Partner plus Jahrgangsname
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        type: { type: string, const: admin }
                        role_name: { type: string }
                        role_description: { type: string }
                  jahrgang: { type: string }
                  permissions: { type: string, const: direct_only_admin }
        '400': { description: Konfi ist keinem Jahrgang zugewiesen }
        '403': { description: Aufrufer ist kein Konfi }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "req.user.type muss 'konfi' sein; Jahrgang muss existieren; Admins und Teamer:innen nur mit gemeinsamem Jahrgang, org_admin/is_super_admin immer (KONFI_SIEHT_TEAMMITGLIED)"
        hinweis: >
          Seit 2026-09-01 symmetrisch zur Admin-Jahrgangsbindung (Simons
          Korrektur, s. Kernfragen oben); Multi-Org-Leitungen erscheinen
          ueber TEAM_MITGLIED_ROLLE.

  /api/chat/direct:
    post:
      tags: ["Chat"]
      summary: Direktchat erstellen oder vorhandenen zurueckgeben
      description: >
        Legt einen 1:1-Direktchat mit target_user_id an (oder liefert den
        bestehenden Raum). user_type des Ziels wird IMMER serverseitig aus
        der EFFEKTIVEN Rolle in der aktiven Org abgeleitet (inkl.
        user_organizations). Konfi-zu-Konfi ist verboten.
        Jahrgangsgrenze, seit 01.09.2026 in BEIDEN Richtungen: Teamer:innen
        (seit 23.08.2026) und Admins (seit 01.09.2026) erreichen nur Konfis
        ihrer zugewiesenen Jahrgänge (can_view) — und Konfis erreichen
        umgekehrt nur Admins und Teamer:innen ihres Jahrgangs. org_admin
        und super_admin (Rolle oder Flag) erreichen alle und bleiben fuer
        alle erreichbar. Wer ohne Zuweisung ist, erreicht gar keinen Konfi
        und ist fuer Konfis unsichtbar; einen Konfi ohne Jahrgang erreicht
        nur die Leitung. Team-Kontakte untereinander bleiben unberuehrt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_user_id]
              properties:
                target_user_id: { type: integer }
      responses:
        '200':
          description: Raum-ID (created=false bei bestehendem Raum)
          content:
            application/json:
              schema:
                type: object
                properties:
                  room_id: { type: integer }
                  created: { type: boolean }
        '400': { description: target_user_id fehlt }
        '403': { description: "Ziel nicht in eigener Org, Konfi-zu-Konfi-Versuch, admin/teamer schreibt einen Konfi ausserhalb der zugewiesenen Jahrgaenge an, ODER Konfi schreibt einen Admin/eine Teamer:in ohne gemeinsamen Jahrgang an" }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: >
          Ziel-User muss Mitglied der aktiven Org sein (primaer ODER via
          user_organizations, effektive Rolle; sonst 403); konfi->konfi
          wird geblockt; admin->konfi und teamer->konfi nur bei passender
          Jahrgangs-Zuweisung (can_view), Quelle ist darfKonfi
          (utils/jahrgangsZugriff.js); konfi->admin und konfi->teamer nur
          bei gemeinsamem Jahrgang (teamAnschreibenVerboten);
          org_admin/super_admin sind in beiden Richtungen ausgenommen.
          Dieselbe Prüfung greift in POST /chat/rooms und
          POST /chat/rooms/:id/participants, sonst wäre sie über das
          participants-Feld bzw. nachtraegliches Hinzufuegen umgehbar.
        hinweis: >
          "admin -> Konfi ohne Jahrgangspruefung" wurde am 2026-09-01
          geschlossen (vorher: jeder Konfi der Org, auch fremde Jahrgänge);
          am selben Tag hat Simon auch die Gegenrichtung gebunden
          ("Konfis duerfen nur org Admins und Admins und Teamer ihres
          Jahrgangs anschreiben!") — die zuvor dokumentierte bewusste
          Unsymmetrie ist aufgehoben. Bestehende Direktraeume werden nicht
          nachtraeglich gesperrt, die Pruefung laeuft aber VOR dem Dedup —
          ein erneuter Anlege-Versuch fuer ein inzwischen verbotenes Paar
          gibt 403, der Raum selbst bleibt nutzbar.

  # ==========================================================================
  # CHAT — Räume
  # ==========================================================================

  /api/chat/rooms:
    post:
      tags: ["Chat"]
      summary: Chat-Raum erstellen (group/direct/jahrgang)
      description: >
        Erstellt einen Raum. Konfis duerfen nur type='direct'. Bei
        type='jahrgang' werden alle Konfis des Jahrgangs automatisch
        hinzugefuegt. Existiert der Jahrgangs-Chat schon, ist der Aufruf ein
        Beitritt: der vorhandene Raum kommt mit created=false zurueck und
        fehlende Konfis werden nachgetragen (BEHOBEN 30.08.2026 — vorher 409,
        wodurch spaeter angelegte Konfis nie in den Jahrgangschat kamen).
        participants werden org-gescopt validiert, user_type serverseitig
        aus der Rolle abgeleitet.

        type='direct' NUR ZU ZWEIT (BEHOBEN 26.09.2026, Audit Chat BF-01):
        participants muss genau EINE weitere Person enthalten, sonst 400
        (error_code direct_nur_zu_zweit). Vorher kam der Typ ungeprueft vom
        Client; wer kein Konfi war, konnte zwei Konfis in einen
        'direct'-Raum setzen -- ein Gruppenraum, den die Leitung wegen
        darfRaumOeffnen ('direct' = privat) weder lesen noch exportieren
        konnte und in dem Konfis einander schrieben. Der eigentliche Weg fuer
        Zweiergespraeche ist POST /chat/direct; 'direct' bleibt hier nur aus
        Vertragsgruenden erhalten. Bestand: Migration 164 stellt
        'direct'-Raeume mit mehr als zwei Personen auf 'group'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, name]
              properties:
                type: { type: string, enum: [group, direct, jahrgang], description: "'admin_team' wird vom Validator abgewiesen" }
                name: { type: string }
                participants:
                  type: array
                  description: User-IDs (oder Objekte mit user_id); nur Org-Mitglieder werden uebernommen
                  items: { type: [integer, object] }
                jahrgang_id: { type: integer, description: Pflicht bei type=jahrgang }
      responses:
        '200':
          description: Raum erstellt (created=true) oder bestehender Jahrgangs-Chat beigetreten (created=false)
          content:
            application/json:
              schema:
                type: object
                properties:
                  room_id: { type: integer }
                  created: { type: boolean }
        '400': { description: "Typ/Name fehlt, ungueltiger Typ, jahrgang_id fehlt, ODER type='direct' ohne genau eine weitere Person (error_code direct_nur_zu_zweit, seit 26.09.2026)" }
        '403': { description: "Konfi mit type != direct, Jahrgang nicht in eigener Org, ODER Konfi-Teilnehmer ausserhalb der zugewiesenen Jahrgaenge (admin/teamer)" }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC, validateCreateRoom]
        org-scope: true
        objekt-pruefung: >
          Konfis nur type='direct'; jahrgang_id und participants werden
          gegen die Org geprüft. Konfi-Teilnehmer zusaetzlich gegen die
          Jahrgangsbindung des Aufrufers: teamer seit 2026-08-23, admin
          seit 2026-09-01 (org_admin/super_admin ausgenommen); Konfis
          koennen keine anderen Konfis und (seit 2026-09-01) weder
          fremdjahrgaengige Teamer:innen noch fremdjahrgaengige Admins
          eintragen.
        # LUECKE (Audit 2026-08-22): Konfis konnten hier mit type='direct'
        # + participants=[andere Konfi-IDs] das Konfi-zu-Konfi-Verbot aus
        # POST /chat/direct umgehen; teamer konnten Gruppenraeume mit
        # beliebigen Org-Nutzern anlegen. BEHOBEN 2026-08-22/23 (Rollen-
        # und Jahrgangspruefung der participants-Liste, Raum wird bei
        # Verstoss wieder geloescht); seit 2026-09-01 gilt die
        # Jahrgangsgrenze auch fuer admin.
        # BEHOBEN 26.09.2026 (Audit Chat BF-01, HOCH): type='direct' war fuer
        # Nicht-Konfis mit beliebig vielen participants moeglich -- ein
        # Gruppenraum, der ueberall als privates Zweiergespraech galt und den
        # die Leitung nicht lesen konnte. Jetzt genau eine weitere Person
        # (400 direct_nur_zu_zweit); Bestand ueber Migration 164 auf 'group'.
        # WEITERHIN OFFEN: Jahrgangs-Chats lassen sich für JEDEN Jahrgang
        # der Org anlegen (keine Zuweisungspruefung bei type='jahrgang').
        hinweis: "Siehe LUECKE-Kommentar; emitRoomsChanged an alle finalen Teilnehmer"
    get:
      tags: ["Chat"]
      summary: Eigene Chat-Räume auflisten
      description: >
        Liefert alle Räume, in denen der Nutzer Teilnehmer ist, mit
        unread_count, letzter Nachricht und Direktchat-Partnername. Beim
        Aufruf läuft höchstens 1x je 10 Min ein Mitgliedschafts-Sync
        (Jahrgangs-Chats + Team-Chat): konfi -> eigener Jahrgang,
        teamer/admin -> zugewiesene Jahrgänge, org_admin -> alle Jahrgänge
        der Org; Team-Chat für alle Nicht-Konfis.
      responses:
        '200':
          description: Raumliste (nach letzter Nachricht sortiert)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatRoom' }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Nur Räume mit eigenem chat_participants-Eintrag (KEIN Admin-Bypass in der Liste)"
        hinweis: "Admins sehen fremde Räume zwar nicht in der Liste, können sie aber per ID oeffnen (siehe /rooms/{roomId})"

  /api/chat/rooms/{roomId}:
    get:
      tags: ["Chat"]
      summary: Raum-Details inkl. Teilnehmerliste
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: integer }, description: "ID des Chatraums" }
      responses:
        '200':
          description: Raum mit participants-Array
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/ChatRoom' }
                  - type: object
                    properties:
                      participants:
                        type: array
                        items:
                          type: object
                          properties:
                            user_id: { type: integer }
                            display_name: { type: string }
                            user_type: { type: string }
        '403': { description: Kein Teilnehmer und kein Admin der Org }
        '404': { description: Raum nicht gefunden }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Teilnehmer des Raums ODER Admin-Bypass (type 'admin' = admin/org_admin: jeder Raum der eigenen Org)"
        hinweis: "Admin-Bypass umfasst auch fremde Direktchats"
    delete:
      tags: ["Chat"]
      summary: Chat-Raum löschen (nur Admins)
      description: >
        Loescht Raum inkl. Nachrichten, Umfragen, Dateien. Mit vorhandenen
        Nachrichten nur mit ?force=true. Jahrgangs-Chats sind nie direkt
        loeschbar (nur über das Löschen des Jahrgangs).
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: integer }, description: "ID des Chatraums" }
        - { name: force, in: query, required: false, schema: { type: string, enum: ["true", "false"] }, description: "true: Raum trotz vorhandener Nachrichten löschen" }
      responses:
        '200': { description: Geloescht }
        '403': { description: Aufrufer ist kein Admin-Typ }
        '404': { description: Raum nicht in eigener Org }
        '409': { description: Nachrichten vorhanden (ohne force) ODER Jahrgangs-Chat }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "req.user.type muss 'admin' sein; Raum muss zur eigenen Org gehören"
        hinweis: "teamer und konfi nie; auch fremde Direktchats loeschbar"

  # ==========================================================================
  # CHAT — Nachrichten
  # ==========================================================================

  /api/chat/rooms/{roomId}/messages:
    get:
      tags: ["Chat"]
      summary: Nachrichten eines Raums laden
      description: >
        Paginiert (limit/offset, neueste zuerst, Antwort chronologisch) oder
        inkrementell per ?after=messageId (bis 200 neue Nachrichten).
        Enthaelt Reactions, Reply-Daten und Poll-Daten inkl. Votes.
        limit ist auf 200 gedeckelt — derselbe Wert wie im after-Zweig.
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: integer }, description: "ID des Chatraums" }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 50, minimum: 1, maximum: 200 }, description: "Anzahl Nachrichten pro Seite. Hoehere Werte werden auf 200 gedeckelt, unbrauchbare (0, negativ, nicht-numerisch) auf die Vorgabe 50 (Deckelung 24.09.2026)" }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0, minimum: 0 }, description: "Anzahl zu überspringender Nachrichten (Blättern)" }
        - { name: after, in: query, required: false, schema: { type: integer }, description: Nur Nachrichten mit id > after (Live-Nachladen) }
      responses:
        '200':
          description: Nachrichtenliste
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatMessage' }
        '403': { description: Kein Teilnehmer und kein Admin der Org }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Teilnehmer ODER Admin-Bypass (admin/org_admin lesen jeden Raum der Org)"
        # LUECKE: Bei anonymen Umfragen (anonymous=true) fehlt in votes zwar
        # user_name, user_id/user_type jeder Stimme werden aber ausgeliefert —
        # über die Teilnehmerliste namentlich aufloesbar (LUECKE 2 im Kopf).
        hinweis: "Geloeschte Nachrichten kommen als Platzhalter (is_deleted=true) mit"
    post:
      tags: ["Chat"]
      summary: Nachricht senden (Text oder Datei)
      description: >
        multipart/form-data mit optionalem Feld 'file' (verschluesselte
        Ablage, Magic-Bytes-Prüfung) oder JSON mit content. client_id (UUID)
        macht den Aufruf idempotent. reply_to wird gegen den Raum validiert.
        Verteilt via WebSocket und Push an alle Teilnehmer.
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: integer }, description: "ID des Chatraums" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                content: { type: string, maxLength: 4000 }
                message_type: { type: string, default: text }
                reply_to: { type: integer }
                client_id: { type: string, format: uuid }
                file: { type: string, format: binary }
      responses:
        '200':
          description: Gesendete Nachricht (bzw. bestehende bei client_id-Duplikat)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '400': { description: Weder Inhalt noch Datei / Datei unlesbar / Validierungsfehler }
        '403': { description: Kein Teilnehmer und kein Admin der Org }
        '415': { description: Dateityp per Magic Bytes nicht verifizierbar }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC, chatUpload.single, validateSendMessage, rateLimiters.chatMessageLimiter, rateLimiters.uploadLimiter]
        org-scope: true
        objekt-pruefung: "Teilnehmer ODER Admin-Bypass — admin/org_admin können in JEDEN Raum der Org schreiben (auch fremde Direktchats)"
    delete:
      tags: ["Chat"]
      summary: "Team-Chat leeren: ALLE Nachrichten löschen, Raum bleibt (NEU 2026-08-26)"
      description: >
        Bewusste Leitungs-Funktion (Muelleimer im Chat-Header): loescht alle
        Nachrichten des automatischen Team-Chats hart — inklusive
        Dateianhaengen (best effort nach dem DB-Delete), Umfragen, Stimmen
        und Reaktionen (ON-DELETE-CASCADE der chat_messages-FKs). Der Raum
        und seine Mitglieder bleiben bestehen; vorher war der einzige Weg
        das Löschen des Raums, den der Team-Chat-Sync leer neu anlegt.
        Nur fuer den automatischen Team-Chat (is_team_chat=true) — alle
        anderen Raeume liefern 409. WebSocket: 'chatCleared' an den Raum,
        'roomsChanged' an alle Teilnehmer.
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: integer }, description: "ID des Chatraums" }
      responses:
        '200': { description: "{ message, deleted_count }" }
        '403': { description: Rolle nicht org_admin/admin }
        '404': { description: Raum nicht in eigener Org }
        '409': { description: Kein Team-Chat (is_team_chat=false) }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Raum org-gescopt geladen; nur is_team_chat=true wird geleert"

  /api/chat/rooms/{roomId}/mark-read:
    post:
      tags: ["Chat"]
      summary: Raum als gelesen markieren
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: integer }, description: "ID des Chatraums" }
      responses:
        '200': { description: "Upsert von chat_read_status.last_read_at = NOW()" }
        '403': { description: Kein Teilnehmer und kein Admin der Org }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Teilnehmer ODER Admin-Bypass"

  /api/chat/rooms/{roomId}/export:
    get:
      tags: ["Chat"]
      summary: Kompletten Chat-Verlauf exportieren (nur Leitung)
      description: >
        Gesamter Verlauf als Text (default) oder JSON, geloeschte Nachrichten
        als Platzhalter. Bewusst NUR admin/org_admin (super_admin technisch
        eingeschlossen) — nicht teamer, nicht konfi.
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: integer }, description: "ID des Chatraums" }
        - { name: format, in: query, required: false, schema: { type: string, enum: [txt, json], default: txt }, description: "Export-Format: txt (Standard) oder json" }
      responses:
        '200':
          description: Download (Content-Disposition attachment)
          content:
            text/plain: { schema: { type: string } }
            application/json: { schema: { type: object } }
        '400': { description: Ungueltige Raum-ID }
        '403': { description: Aufrufer ist nicht Leitung (admin/org_admin/super_admin) }
        '404': { description: Raum nicht in eigener Org (bewusst 404 statt 403) }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, super_admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "type='admin' UND role_name in (admin, org_admin, super_admin); Raum org-gescopt"
        hinweis: "Keine Teilnahme nötig — jeder Raum der Org exportierbar, auch fremde Direktchats"

  /api/chat/messages/{messageId}:
    delete:
      tags: ["Chat"]
      summary: Nachricht löschen (Soft-Delete)
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: integer }, description: "ID der Nachricht" }
      responses:
        '200': { description: Geloescht (deleted_at gesetzt); WebSocket-Event messageDeleted }
        '403': { description: Weder eigene Nachricht noch Admin der Org }
        '404': { description: Nachricht nicht gefunden }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Eigene Nachricht (user_id+user_type) ODER type='admin' in derselben Org (fremde Nachrichten org-weit)"
        hinweis: "teamer/konfi nur eigene; admin/org_admin jede Nachricht der Org"
        behoben: "26.08.2026 — Diese Regel stand hier korrekt, der Code hielt sie
          aber nicht ein: die Pruefung fiel auf darfRaumOeffnen zurueck, das fuer
          jede:n Teilnehmer:in true liefert. Damit konnte jede Konfi per API
          fremde Nachrichten im selben Raum loeschen (nicht ueber die App: die
          Oberflaeche bot die Schaltflaeche nie an). Rollen-Check ergaenzt,
          durch Tests abgesichert."

  # ==========================================================================
  # CHAT — Teilnehmerverwaltung
  # ==========================================================================

  /api/chat/rooms/{roomId}/participants:
    get:
      tags: ["Chat"]
      summary: Teilnehmerliste eines Raums
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: integer }, description: "ID des Chatraums" }
      responses:
        '200':
          description: Teilnehmer mit Name, Rolle, role_title, Jahrgang (nur Konfis)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    user_id: { type: integer }
                    user_type: { type: string }
                    joined_at: { type: string, format: date-time }
                    name: { type: string }
                    role_title: { type: [string, "null"] }
                    role_name: { type: string }
                    role_display_name: { type: string }
                    jahrgang_id: { type: [integer, "null"] }
                    jahrgang_name: { type: [string, "null"] }
        '403': { description: Kein Teilnehmer und kein Admin der Org }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Teilnehmer ODER Admin-Bypass (admin/org_admin: jeder Raum der Org)"
    post:
      tags: ["Chat"]
      summary: Teilnehmer zu Gruppenchat hinzufuegen (nur Admins)
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: integer }, description: "ID des Chatraums" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer }
      responses:
        '201': { description: Hinzugefuegt (user_type serverseitig aus Rolle abgeleitet) }
        '400': { description: user_id fehlt ODER Raum ist kein Gruppenchat }
        '403': { description: "Aufrufer ist kein Admin-Typ ODER admin traegt einen Konfi ausserhalb der zugewiesenen Jahrgaenge ein" }
        '404': { description: Raum oder Ziel-User nicht in eigener Org }
        '409': { description: Bereits Teilnehmer }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: >
          type='admin'; nur room.type='group'; Ziel-User org-gescopt.
          Konfi-Ziele zusaetzlich gegen die Jahrgangsbindung des Aufrufers
          (seit 2026-09-01): admin nur mit zugewiesenem Jahrgang (can_view),
          org_admin/super_admin ausgenommen — sonst waere die Grenze aus
          POST /rooms per nachtraeglichem Eintragen umgehbar.
        hinweis: "teamer können keine Teilnehmer hinzufuegen (wohl aber Räume mit Teilnehmern ANLEGEN, siehe POST /rooms)"

  /api/chat/rooms/{roomId}/participants/{userId}/{userType}:
    delete:
      tags: ["Chat"]
      summary: Teilnehmer aus Gruppenchat entfernen (nur Admins)
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: integer }, description: "ID des Chatraums" }
        - { name: userId, in: path, required: true, schema: { type: integer }, description: "User-ID der zu entfernenden Person" }
        - { name: userType, in: path, required: true, schema: { type: string, enum: [admin, teamer, konfi] }, description: "Typ des Eintrags: konfi, teamer oder admin" }
      responses:
        '200': { description: Entfernt }
        '400': { description: Raum ist kein Gruppenchat }
        '403': { description: Aufrufer ist kein Admin-Typ }
        '404': { description: Raum nicht in eigener Org ODER Teilnehmer nicht gefunden }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "type='admin'; nur room.type='group'"

  /api/chat/rooms/{roomId}/leave:
    delete:
      tags: ["Chat"]
      summary: Raum selbst verlassen (teamer/konfi)
      description: >
        Admins können nie verlassen; jahrgang- und direct-Räume sind
        generell nicht verlassbar; Event-Chats verlassen Konfis nur über
        die Event-Abmeldung.
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: integer }, description: "ID des Chatraums" }
      responses:
        '200': { description: Verlassen }
        '400': { description: Raumtyp nicht verlassbar (jahrgang/direct) ODER Event-Chat als Konfi }
        '403': { description: Admin-Typ darf nicht verlassen }
        '404': { description: Raum nicht in eigener Org ODER kein Teilnehmer }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Eigener chat_participants-Eintrag; admin/org_admin explizit 403"

  # ==========================================================================
  # CHAT — Dateien, Badge, Umfragen, Reaktionen
  # ==========================================================================

  /api/chat/files/{filename}:
    get:
      tags: ["Chat"]
      summary: Chat-Datei abrufen (entschluesselt)
      description: >
        Liefert eine im Chat hochgeladene Datei. Auth per
        Authorization-Header ODER ?token= (für Video-Elemente). Nur
        Hex-Dateinamen; Path-Traversal-Schutz via basename.
        Seit 22.08.2026 wird der Token gegen die Datenbank geprüft (Konto
        aktiv, nicht gelöscht, kein Soft-Revoke) und die aktive Organisation
        über user_organizations aufgeloest — Multi-Org-Nutzer erreichen ihre
        Dateien damit auch in der Zweit-Organisation.
      security: []
      parameters:
        - { name: filename, in: path, required: true, schema: { type: string, pattern: "^[a-f0-9]+$" }, description: "Serverseitiger Dateiname (Hex) aus der Upload-Antwort bzw. Nachricht" }
        - { name: token, in: query, required: false, schema: { type: string }, description: JWT-Fallback fuer Media-Tags }
      responses:
        '200': { description: "Dateiinhalt (Content-Type aus Original-Dateiname)", content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '400': { description: Ungueltiger Dateiname }
        '401': { description: Token fehlt oder ungueltig }
        '403': { description: Kein Teilnehmer des Raums }
        '404': { description: "Datei nicht gefunden (auch bei fremder Org oder wenn die Nachricht soft-gelöscht ist — seit 26.08.2026 werden Anhänge gelöschter Nachrichten nicht mehr ausgeliefert; die Datei bleibt für eine Wiederherstellung erhalten)" }
        '500': { description: Server-/Entschluesselungsfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: ["manuelle JWT-Pruefung mit DB-Abgleich (kein verifyTokenRBAC — Query-Parameter-Auth)"]
        org-scope: true
        objekt-pruefung: "Nachricht mit file_path muss in der AKTIVEN Org liegen UND Aufrufer muss chat_participants-Eintrag im Raum haben (nur user_id, ohne user_type)"
        # BEHOBEN 22.08.2026: Frueher `req.user = decoded` — Token-Angaben
        # galten ungeprueft für die volle Laufzeit (geloeschte/gesperrte
        # Konten kamen weiter an Dateien), und organization_id war immer die
        # PRIMAER-Org, weshalb Multi-Org-Nutzer in der Zweit-Organisation 404
        # bekamen. Jetzt DB-Abgleich inkl. Soft-Revoke und Aufloesung der
        # aktiven Org (403 bei fehlender Mitgliedschaft).
        # LUECKE (offen): Token auch als Query-Parameter akzeptiert
        # (Access-Logs/Referrer); kein Admin-Bypass (Admins können
        # Nachrichten fremder Räume lesen, deren Dateien aber nicht abrufen —
        # Inkonsistenz); Mitgliedschafts-Check ohne user_type (unkritisch,
        # user_id global eindeutig).

  /api/chat/rooms/{roomId}/polls:
    post:
      tags: ["Chat"]
      summary: Umfrage in einem Raum erstellen (nur Admins)
      description: >
        Legt eine Poll-Nachricht an. exclusive_options (jede Option max. 1
        Person) erzwingt Einzelauswahl. anonymous default true. Verteilung
        via WebSocket und Push wie normale Nachrichten.
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: integer }, description: "ID des Chatraums" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, options]
              properties:
                question: { type: string }
                options: { type: array, minItems: 2, items: { type: string } }
                multiple_choice: { type: boolean, default: false }
                expires_in_hours: { type: number }
                anonymous: { type: boolean, default: true }
                exclusive_options: { type: boolean, default: false }
      responses:
        '201':
          description: Erstellte Umfrage (id, message_id, options, votes=[])
        '400': { description: Frage/Optionen fehlen oder ungueltig }
        '403': { description: Aufrufer ist kein Admin-Typ }
        '404': { description: Raum nicht in eigener Org }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, validateCreatePoll]
        org-scope: true
        objekt-pruefung: "type='admin'; Raum muss zur Org gehören (Teilnahme nicht nötig)"
        hinweis: "teamer können keine Umfragen erstellen"

  /api/chat/polls/{pollId}/vote:
    post:
      tags: ["Chat"]
      summary: Abstimmen (per Poll-ID oder Message-ID)
      description: >
        Toggle-Semantik: erneutes Abstimmen auf dieselbe Option entfernt die
        Stimme. Einzelauswahl ersetzt vorhandene Stimme. Bei
        exclusive_options ist eine belegte Option gesperrt (409).
      parameters:
        - { name: pollId, in: path, required: true, schema: { type: integer }, description: Poll-ID; Fallback-Lookup per message_id }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [option_index]
              properties:
                option_index: { type: integer }
      responses:
        '200': { description: "Stimme gesetzt/entfernt (action: added|removed)" }
        '400': { description: option_index fehlt/ungueltig ODER Umfrage abgelaufen }
        '403': { description: Kein Zugriff auf den Raum (wird VOR Ablauf und Options-Index geprueft) }
        '404': { description: Umfrage nicht gefunden }
        '409': { description: Exklusive Option bereits vergeben }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: >
          darfRaumOeffnen: Teilnehmer des Raums, oder Leitung in einem Raum
          der eigenen Gemeinde — ausser in fremden Direktchats. BEHOBEN
          2026-08-28: Die Route hatte eine eigene Kopie der Pruefung, die
          strikt einen Teilnehmer-Eintrag verlangte. Dadurch durfte die
          Leitung in einem Gruppenchat eine Umfrage anlegen, aber nicht in
          ihr abstimmen. Ausserdem lief die Pruefung erst NACH Ablauf- und
          Options-Check und verriet so den Zustand fremder Umfragen.

  /api/chat/messages/{messageId}/vote:
    post:
      tags: ["Chat"]
      summary: Abstimmen per Message-ID (Frontend-Kompatibilitaet)
      description: >
        Aeltere Adressform derselben Route. Seit 2026-08-23 teilen sich beide
        denselben Handler — Toggle-Semantik, Einzelauswahl-Ersetzung und
        exclusive_options gelten hier genauso.
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: integer }, description: "ID der Nachricht" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [option_index]
              properties:
                option_index: { type: integer }
      responses:
        '200': { description: Stimme abgegeben }
        '400': { description: option_index fehlt/ungueltig ODER Umfrage abgelaufen }
        '403': { description: Kein Zugriff auf den Raum (wird VOR Ablauf und Options-Index geprueft) }
        '404': { description: Keine Umfrage zu dieser Nachricht }
        '409': { description: Exklusive Option bereits vergeben }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: >
          Identisch zu /polls/{pollId}/vote — darfRaumOeffnen (Teilnehmer oder
          Leitung der eigenen Gemeinde, ausser in fremden Direktchats).
        hinweis: "Reicht an denselben Handler weiter wie /polls/{pollId}/vote"

  /api/chat/messages/{messageId}/reactions:
    post:
      tags: ["Chat"]
      summary: Reaktion setzen/entfernen (Toggle)
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: integer }, description: "ID der Nachricht" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji: { type: string, enum: [like, heart, laugh, wow, sad, pray] }
      responses:
        '200': { description: "action: added|removed" }
        '400': { description: Emoji fehlt oder nicht in Whitelist }
        '403': { description: Fremde Org ODER kein Teilnehmer }
        '404': { description: Nachricht nicht gefunden }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Org-Check der Nachricht + Teilnehmer-Pflicht (kein Admin-Bypass beim SETZEN)"
    get:
      tags: ["Chat"]
      summary: Reaktionen einer Nachricht lesen
      parameters:
        - { name: messageId, in: path, required: true, schema: { type: integer }, description: "ID der Nachricht" }
      responses:
        '200':
          description: Reaktionsliste mit user_name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Reaction' }
        '403': { description: Fremde Org ODER kein Teilnehmer (Nicht-Admins) }
        '404': { description: Nachricht nicht gefunden }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Org-Check; Teilnehmer-Pflicht nur für Nicht-Admins (admin/org_admin lesen org-weit)"

  # ==========================================================================
  # CHALLENGES — Teilnehmer-Endpunkte (Konfis UND Team je nach audience)
  # ==========================================================================

  /api/challenges/konfi:
    get:
      tags: ["Challenges (Konfis)"]
      summary: Aktive Challenges, Archiv und eigene Abzeichen
      description: >
        Teilnehmer-Einstieg (trotz Pfadname auch für das Team). Nie
        Entwuerfe, nie ungestartete. Scope: Konfi -> Challenges seines
        Jahrgangs (nie 'nur_team'); admin/teamer -> zugewiesene Jahrgänge
        ('konfis_und_team') + org-weite 'nur_team'; org_admin -> alle der Org
        mit Team-Beteiligung ('konfis_und_team', 'nur_team').
        GEAENDERT 2026-08-31: admin ist an seine Jahrgangs-Zuweisungen
        gebunden (vorher org-weit wie org_admin).
      responses:
        '200':
          description: Gruppierte Challenge-Listen
          content:
            application/json:
              schema:
                type: object
                properties:
                  active:
                    type: array
                    items: { $ref: '#/components/schemas/KonfiChallenge' }
                  archive:
                    type: array
                    items: { $ref: '#/components/schemas/KonfiChallenge' }
                  marks:
                    description: >
                      ERHALTENE Stempel. Die Form ist ein Vertrag der
                      ausgelieferten Apps (2.1.1 zeichnet jeden Eintrag als
                      erhaltenen Stempel) — die Liste bleibt ein Array und
                      enthaelt ausschliesslich erhaltene Stempel. Nicht
                      erhaltene stehen in `offene_stempel`.
                      ERGAENZT 2026-09-14 (additiv): `earned_at` und
                      `description` fuers Stempel-Popover.
                    type: array
                    items:
                      type: object
                      properties:
                        challenge_id: { type: integer }
                        badge_icon: { type: string }
                        badge_name: { type: string }
                        title: { type: string }
                        earned_at:
                          type: string
                          format: date-time
                          nullable: true
                          description: >
                            Zeitpunkt der Verleihung — der FRUEHESTE
                            freigegebene eigene Beitrag
                            (challenge_submissions.approved_at, Rueckfall auf
                            created_at bei Bestandszeilen vor Migration 146).
                        description:
                          type: string
                          nullable: true
                          description: Beschreibung der Challenge, fuers Popover.
                  offene_stempel:
                    description: >
                      NEU 2026-09-14, additiv. Stempel, die es zu holen gab
                      oder gibt, zu denen aber KEIN freigegebener eigener
                      Beitrag vorliegt — in der Oberflaeche grau. Enthaelt
                      laufende UND abgelaufene Challenges (Entscheid: alle,
                      die man je haette holen koennen), unterschieden ueber
                      `status`. Gleiches Scoping wie `active`/`archive`.
                      BEWUSST EIN EIGENES FELD statt eines Merkers in
                      `marks`: alte App-Versionen wuerden einen Merker
                      ignorieren und fremde Stempel als eigene zeigen.
                    type: array
                    items:
                      type: object
                      properties:
                        challenge_id: { type: integer }
                        badge_icon: { type: string }
                        badge_name: { type: string }
                        title: { type: string }
                        description: { type: string, nullable: true }
                        status:
                          type: string
                          enum: [active, ended]
                        ends_at: { type: string, format: date-time, nullable: true }
        '403': { description: Rolle weder konfi noch Team (z.B. super_admin) }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [konfi, teamer, admin, org_admin]
        middleware: [rbacVerifier]
        org-scope: true
        objekt-pruefung: "Jahrgangs-Scoping je Rolle (s. Beschreibung); super_admin explizit ausgeschlossen"

  /api/challenges/konfi/{id}:
    get:
      tags: ["Challenges (Konfis)"]
      summary: Challenge-Detail mit Galerie und eigenen Beitraegen
      description: >
        Galerie enthält NUR fremde oeffentliche Beitraege
        (PUBLIC_SUBMISSION_SQL); bei anonymen Beitraegen sind display_name,
        role_name, jahrgang_name serverseitig NULL. Eigene Beitraege immer,
        inkl. Moderationsstatus. 'nur_team'-Challenges liefern für Konfis
        404 (Existenz soll nicht durchsickern), ebenso Entwuerfe und noch
        nicht gestartete Challenges.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID der Challenge" }
      responses:
        '200':
          description: Detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge: { $ref: '#/components/schemas/KonfiChallenge' }
                  gallery:
                    type: array
                    items: { $ref: '#/components/schemas/GallerySubmission' }
                  own_submissions:
                    type: array
                    items: { $ref: '#/components/schemas/Submission' }
        '403': { description: Rolle ohne Zugriff ODER Jahrgang/Zuweisung passt nicht }
        '404': { description: Nicht gefunden / Entwurf / nicht gestartet / nur_team fuer Konfi }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [konfi, teamer, admin, org_admin]
        middleware: [rbacVerifier]
        org-scope: true
        objekt-pruefung: "participantMayAccess: konfi -> eigener Jahrgang zugeordnet; admin/teamer -> zugewiesener Jahrgang oder 'nur_team'; org_admin immer (geaendert 2026-08-31: admin jahrgangs-gebunden)"
        hinweis: "Anonymitaet wird serverseitig durchgesetzt (Name verlässt das Backend nicht)"

  /api/challenges/konfi/{id}/mark-read:
    post:
      tags: ["Challenges (Konfis)"]
      summary: Challenge als geoeffnet markieren (Neuigkeiten-Zaehler zuruecksetzen)
      description: >
        NEU 24.09.2026. Gegenstueck zu POST /api/chat/rooms/{roomId}/mark-read:
        Die Detailansicht ruft es beim Oeffnen. challenge_read_status merkt
        sich den Zeitpunkt je Challenge und Person; challengeUpdates in
        GET /api/notifications/badge-counts zaehlt ab dann neu (neue
        Galerie-Beitraege, Moderation eigener Beitraege). Zugriffsregeln wie
        GET /api/challenges/konfi/{id}: Wer die Challenge nicht oeffnen darf,
        kann sie auch nicht als gelesen markieren. Team-Rollen duerfen rufen
        (dieselbe Detailansicht), fuer sie wird aber nichts gezaehlt.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID der Challenge" }
      responses:
        '200': { description: Gelesen-Zeitpunkt gesetzt }
        '403': { description: Rolle ohne Zugriff ODER Jahrgang/Zuweisung passt nicht }
        '404': { description: Nicht gefunden / Entwurf / nicht gestartet / nur_team fuer Konfi }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [konfi, teamer, admin, org_admin]
        middleware: [rbacVerifier]
        org-scope: true
        objekt-pruefung: "participantMayAccess wie GET /api/challenges/konfi/{id}; Entwuerfe, ungestartete und (fuer Konfis) nur_team -> 404"

  /api/challenges/konfi/{id}/submissions:
    post:
      tags: ["Challenges (Konfis)"]
      summary: Beitrag einreichen
      description: >
        multipart (Feld 'file') für photo/audio/video, JSON für text/link.
        Links nur von Musikdiensten (Erlaubnisliste utils/musikLinks auf
        Hostname-Basis): Spotify, Apple Music, YouTube Music, Deezer —
        alles andere wird mit 400 abgelehnt (seit 24.08.2026). Der Server
        holt beim Einreichen einmalig Titel/Interpret (link_title,
        link_author); scheitert der Abruf, wird ohne Metadaten gespeichert.
        Nur bei Status 'active'. audience steuert, wer einreichen darf
        (maySubmit): konfi bei 'konfis'/'konfis_und_team', Team bei
        'konfis_und_team'/'nur_team'. konfi_consent nur bei
        visibility='konfi_choice' (Default 'publish'). Ohne Moderation
        Auto-Approve. Magic-Bytes-Prüfung der Datei; verschluesselte Ablage.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID des Beitrags" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [media_type]
              properties:
                media_type: { type: string, enum: [text, photo, audio, video, link] }
                text_content: { type: string }
                link_url: { type: string, description: "Pflicht bei media_type=link. Nur Musikdienst-Hosts: open.spotify.com, spotify.link, music.apple.com, geo.music.apple.com, music.youtube.com, deezer.com, www.deezer.com, link.deezer.com, dzr.page.link, deezer.page.link" }
                konfi_consent: { type: string, enum: [publish, private, anonymous] }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Erstellter Beitrag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Submission' }
        '400': { description: Ungueltige Medienart / Pflichtfeld fehlt / Consent ungueltig / Link nicht von einem erlaubten Musikdienst }
        '403': { description: Kein Zugriff auf die Challenge ODER Rolle darf bei dieser audience nicht einreichen }
        '404': { description: Challenge nicht gefunden oder Entwurf }
        '409': { description: Challenge nicht aktiv ODER bereits eingereicht (allow_multiple=false) }
        '415': { description: Dateityp nicht verifizierbar }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [konfi, teamer, admin, org_admin]
        middleware: [rbacVerifier, challengeUpload.single, rateLimiters.uploadLimiter]
        org-scope: true
        objekt-pruefung: "participantMayAccess + maySubmit(role, audience); Aktivitaets- und Mehrfach-Check"
        hinweis: "Push an Leitung immer; Abzeichen-Push an Einreicher bei erster Submission"

  /api/challenges/konfi/submissions/{id}:
    delete:
      tags: ["Challenges (Konfis)"]
      summary: Beitrag zurueckziehen — bewusst gesperrt
      description: >
        Antwortet IMMER 403, unabhaengig von Existenz und Eigentum
        (Design-Entscheidung: eingereichte Beitraege sind verbindlich;
        Ausblenden ist Sache der Leitung).
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID des Beitrags" }
      responses:
        '403': { description: Immer — Route ist absichtlich deaktiviert }
      x-berechtigung:
        rollen: []
        middleware: [rbacVerifier]
        org-scope: false
        objekt-pruefung: "Keine — pauschale 403 für alle"

  /api/challenges/files/{filename}:
    get:
      tags: ["Challenges (Konfis)"]
      summary: Challenge-Datei abrufen (entschluesselt)
      description: >
        Auth NUR per Authorization-Header (bewusst KEIN ?token=-Fallback).
        Beruecksichtigt X-Active-Organization (Multi-Org) wie rbacVerifier.
      parameters:
        - { name: filename, in: path, required: true, schema: { type: string, pattern: "^[a-f0-9]+$" }, description: "Serverseitiger Dateiname (Hex) aus der Upload-Antwort bzw. Nachricht" }
        - { name: X-Active-Organization, in: header, required: false, schema: { type: integer }, description: "Aktive Organisation für Multi-Org-Konten (wie beim übrigen API-Zugriff)" }
      responses:
        '200': { description: Dateiinhalt, content: { application/octet-stream: { schema: { type: string, format: binary } } } }
        '400': { description: Ungueltiger Dateiname }
        '401': { description: Token fehlt/ungueltig oder User geloescht }
        '403': { description: Zugriff verweigert (Sichtbarkeitsregeln) oder fremde aktive Org ohne Mitgliedschaft }
        '404': { description: Datei nicht gefunden (auch org-fremd) }
        '500': { description: Server-/Entschluesselungsfehler }
      x-berechtigung:
        rollen: [konfi, teamer, admin, org_admin]
        middleware: ["manuelle JWT-Pruefung + eigener Org-/Rollen-Lookup (identisch zur rbacVerifier-Logik)"]
        org-scope: true
        objekt-pruefung: >-
          Owner immer; org_admin org-weit; admin/teamer bei 'nur_team' org-weit,
          sonst nur zugewiesene Jahrgänge der Challenge (admin seit 2026-08-31
          ebenfalls jahrgangs-gebunden); konfi nur oeffentliche Beitraege
          (isSubmissionPublic) aus seinem Jahrgang und nie 'nur_team'

  # ==========================================================================
  # CHALLENGES — Leitungs-Endpunkte (org_admin / admin / teamer)
  # ==========================================================================

  /api/challenges/admin/authors:
    get:
      tags: ["Challenges (Leitung)"]
      summary: Moegliche Urheber:innen einer Challenge
      description: >
        Alle Rollen der Org inkl. Konfis (eine Challenge kann von einem
        Konfi stammen). admin und teamer sehen nur Konfis ihrer zugewiesenen
        Jahrgänge (admin seit 2026-08-31, vorher org-weit), org_admin alle;
        Team-Mitglieder sehen sie immer.
      responses:
        '200':
          description: Liste (id, display_name, role_name), Konfis zuletzt
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    display_name: { type: string }
                    role_name: { type: string, enum: [org_admin, admin, teamer, konfi] }
        '403': { description: Rolle nicht org_admin/admin/teamer (requireTeamer) }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [rbacVerifier, requireTeamer]
        org-scope: true
        objekt-pruefung: "Konfi-Eintraege auf die zugewiesenen Jahrgänge von admin bzw. teamer gefiltert (org_admin ungefiltert)"

  /api/challenges/admin:
    get:
      tags: ["Challenges (Leitung)"]
      summary: Alle Challenges der Org (inkl. Entwuerfe) mit Zaehlern
      description: >
        Verwaltungsliste inkl. submission_count, pending_count, eigener
        Teilnahme (has_badge/own_submission_count) und Jahrgangs-Zuordnung.
        admin und teamer sehen nur Challenges ihrer zugewiesenen Jahrgänge
        plus org-weite 'nur_team'-Challenges. org_admin sieht alle
        Challenges der Org.
        GEAENDERT 2026-08-31: admin war vorher org-weit.
        GEAENDERT 2026-09-01: Ist die Liste ausgeduennt, weil admin/teamer
        keine Jahrgangs-Zuweisung hat, traegt die Antwort zusaetzlich den
        Header X-Kein-Jahrgang-Zugewiesen: true (additiv; die Antwortform
        bleibt ein Array) — und die org-weiten 'nur_team'-Challenges bleiben
        auch OHNE Zuweisung sichtbar (vorher kam grundlos ein leeres Array,
        obwohl leadershipMayAccess und der Freigaben-Zaehler sie zugestehen;
        Widerspruch behoben).
      responses:
        '200':
          description: Challenge-Liste mit status (abgeleitet) und locked (nach Start)
          headers:
            X-Kein-Jahrgang-Zugewiesen:
              schema: { type: string, enum: ["true"] }
              description: >
                Nur gesetzt, wenn dem aufrufenden admin/teamer kein Jahrgang
                zugewiesen ist (gueltiger Fall, Entscheidung 2026-08-31) —
                die Liste enthaelt dann nur 'nur_team'-Challenges. Fehlt bei
                org_admin und bei einer Liste, die aus anderem Grund leer ist.
        '403': { description: requireTeamer }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [rbacVerifier, requireTeamer]
        org-scope: true
        objekt-pruefung: "admin und teamer: Jahrgangs-Filter via viewableJahrgangIds (ohne Zuweisung bleibt der 'nur_team'-Anteil, seit 2026-09-01); org_admin org-weit. Geaendert 2026-08-31: admin war vorher org-weit."
    post:
      tags: ["Challenges (Leitung)"]
      summary: Challenge anlegen (Entwurf oder geplant)
      description: >
        Defaults: audience 'konfis_und_team', visibility 'konfi_choice',
        moderated true, allow_multiple true, is_draft true, allowed_media
        [text, photo]. Bei 'nur_team' werden jahrgang_ids ignoriert/nicht
        gespeichert. admin und teamer duerfen nur eigene (zugewiesene)
        Jahrgänge bespielen (admin seit 2026-08-31), org_admin alle;
        Jahrgänge und Urheber werden org-gescopt validiert.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, badge_name, starts_at, ends_at]
              properties:
                title: { type: string, maxLength: 200 }
                description: { type: string }
                challenge_type: { type: string, enum: [wahrnehmung, beitrag, praxis, frei], default: frei }
                audience: { type: string, enum: [konfis, konfis_und_team, nur_team], default: konfis_und_team }
                visibility: { type: string, enum: [public, konfi_choice, private], default: konfi_choice }
                moderated: { type: boolean, default: true }
                allowed_media: { type: array, minItems: 1, items: { type: string, enum: [text, photo, audio, video, link] } }
                allow_multiple: { type: boolean, default: true }
                badge_icon: { type: string, maxLength: 50, default: flag }
                badge_name: { type: string, maxLength: 100 }
                author_user_id: { type: [integer, "null"] }
                author_freetext: { type: [string, "null"], maxLength: 200 }
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                is_draft: { type: boolean, default: true }
                jahrgang_ids: { type: array, items: { type: integer } }
      responses:
        '201': { description: Erstellte Challenge inkl. abgeleitetem status }
        '400': { description: Validierungsfehler / Ende vor Start / Urheber nicht gefunden }
        '403': { description: requireTeamer ODER fremde Jahrgaenge ODER admin/teamer ohne Zugriff auf gewaehlten Jahrgang }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [rbacVerifier, requireTeamer, validateCreate]
        org-scope: true
        objekt-pruefung: "jahrgang_ids müssen zur Org UND (bei admin/teamer) zu den eigenen Zuweisungen gehören; author_user_id org-gescopt"

  /api/challenges/admin/{id}:
    put:
      tags: ["Challenges (Leitung)"]
      summary: Challenge bearbeiten (Konsens-Felder nach Start eingefroren)
      description: >
        Vor Start: alles aenderbar. Nach Start (kein Draft, starts_at
        erreicht) sind audience, visibility, moderated, starts_at und
        allowed_media eingefroren (409 mit Klartext); auch challenge_type,
        allow_multiple und is_draft werden dann nicht mehr uebernommen.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID der Challenge" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Wie POST /challenges/admin, alle Felder optional
      responses:
        '200': { description: Aktualisierte Challenge mit status und locked }
        '400': { description: Validierungsfehler / Ende vor Start / Urheber nicht gefunden }
        '403': { description: requireTeamer / leadershipMayAccess / fremde bzw. nicht zugewiesene Jahrgaenge }
        '404': { description: Challenge nicht in eigener Org }
        '409': { description: Versuch, nach Start eingefrorene Felder zu aendern }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [rbacVerifier, requireTeamer, validateUpdate]
        org-scope: true
        objekt-pruefung: "leadershipMayAccess: org_admin immer; admin/teamer nur zugewiesene Jahrgänge bzw. 'nur_team' org-weit (admin seit 2026-08-31 jahrgangs-gebunden)"
    delete:
      tags: ["Challenges (Leitung)"]
      summary: Challenge löschen (gestartete nur mit force)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID der Challenge" }
        - { name: force, in: query, required: false, schema: { type: string, enum: ["true", "false"] }, description: "true: auch eine bereits gestartete Challenge löschen — samt Beiträgen und Dateien" }
      responses:
        '200': { description: Geloescht inkl. aller Beitraege und Dateien }
        '403': { description: requireTeamer / leadershipMayAccess }
        '404': { description: Challenge nicht in eigener Org }
        '409': { description: Bereits gestartet/beendet und force fehlt }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [rbacVerifier, requireTeamer]
        org-scope: true
        objekt-pruefung: "leadershipMayAccess (wie PUT)"

  /api/challenges/admin/{id}/submissions:
    get:
      tags: ["Challenges (Leitung)"]
      summary: Alle Beitraege einer Challenge (Leitungs-Sicht, immer mit Namen)
      description: >
        Sammelansicht: ALLE Beitraege inkl. Konsens, Status, hidden_at und
        Klarnamen — Anonymitaet gilt gegenueber der Gruppe, nicht gegenueber
        der Leitung. is_public/is_anonymous machen transparent, wie der
        Beitrag in der Galerie erscheint.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID des Beitrags" }
      responses:
        '200':
          description: Challenge + submissions[] (mit user_id, display_name, jahrgang_name, moderation_note, is_public, is_anonymous)
        '403': { description: requireTeamer / leadershipMayAccess }
        '404': { description: Challenge nicht in eigener Org }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [rbacVerifier, requireTeamer]
        org-scope: true
        objekt-pruefung: "leadershipMayAccess (Teamer nur zugewiesene Jahrgänge / 'nur_team')"

  /api/challenges/admin/submissions/{id}/moderate:
    put:
      tags: ["Challenges (Leitung)"]
      summary: Beitrag moderieren (approve/hide/unhide/anonymize)
      description: >
        approve und unhide setzen 'approved' und raeumen hidden-Metadaten
        (inkl. moderation_note) ab; hide setzt 'hidden' (schlägt jede
        Sichtbarkeit) und speichert optional eine Begruendung (reason), die
        die einreichende Person bei ihrem Beitrag sieht — das Ausblenden
        scheitert NIE am fehlenden Grund. anonymize ist eine Einbahnstrasse
        (einmal anonym, immer anonym) und seit 2026-08-24 fuer alle
        Sichtbarkeiten erlaubt (vorher 409 ausserhalb von 'konfi_choice');
        'private' (staerkste Konfi-Zusage) und bereits anonyme Beitraege
        liefern weiterhin 409. Pushes nach der Antwort: bei hide an die
        einreichende Person (challenge_submission_hidden, nicht beim eigenen
        Beitrag), bei approve der Abzeichen-Push (challenge_badge_earned),
        wenn es der erste freigegebene Beitrag der Person ist.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID des Beitrags" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, hide, unhide, anonymize] }
                reason: { type: string, maxLength: 500, description: "Optionale Begruendung beim Ausblenden (nur bei action=hide gespeichert)" }
      responses:
        '200': { description: "Neuer Status (id, moderation_status, moderation_note bzw. konfi_consent)" }
        '400': { description: Ungueltige Aktion oder reason laenger als 500 Zeichen (Validator) }
        '403': { description: requireTeamer / leadershipMayAccess }
        '404': { description: Beitrag nicht in eigener Org }
        '409': { description: "anonymize unzulaessig (private-Zusage, bereits anonym)" }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [rbacVerifier, requireTeamer, validateModerate]
        org-scope: true
        objekt-pruefung: "Submission org-gescopt + leadershipMayAccess auf die zugehoerige Challenge"

  /api/challenges/admin/submissions/{id}:
    delete:
      tags: ["Challenges (Leitung)"]
      summary: "Beitrag endgueltig löschen: Datei UND Datenbank-Zeile (NEU 2026-08-26)"
      description: >
        Entfernt einen einzelnen Beitrag unwiderruflich — erst die DB-Zeile,
        dann die verschluesselte Datei aus uploads/challenges/
        (deleteChallengeFile, fehlertolerant: eine fehlende Datei kippt
        nichts). Schliesst die Luecke aus Befund M8 (Loeschlogik-Audit
        2026-08-26): vorher liess sich eine einzelne rechtswidrige
        Challenge-Datei nur ueber Challenge- oder User-Löschung tilgen,
        Verbergen liess die Datei liegen. Das Ausblenden (moderate/hide)
        bleibt daneben als reversible Alternative bestehen. War es der
        einzige freigegebene Beitrag der Person, entfaellt damit auch das
        abgeleitete Abzeichen (wie beim Ausblenden). Live-Updates
        'submission_update' an Jahrgaenge und Leitung.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID des Beitrags" }
      responses:
        '200': { description: "{ message: 'Beitrag gelöscht' }" }
        '403': { description: requireTeamer / leadershipMayAccess }
        '404': { description: Beitrag nicht in eigener Org }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [rbacVerifier, requireTeamer]
        org-scope: true
        objekt-pruefung: "Submission org-gescopt + leadershipMayAccess auf die zugehoerige Challenge (wie moderate)"

  /api/challenges/admin/{id}/export:
    get:
      tags: ["Challenges (Leitung)"]
      summary: Beitraege als Text exportieren (Liturgie/Playlist/Wand)
      description: >
        text/plain-Download. Strenger als die Sammelansicht, weil der Export
        die Leitungssphaere verlässt — konfi_choice: nur approved mit
        publish/anonymous-Konsens ('private' NIE); public: nur approved;
        private Challenge: alle nicht-ausgeblendeten (Export ist dort der
        angekuendigte Rueckkanal). Anonyme Beitraege als "Anonym".
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID der Challenge" }
      responses:
        '200': { description: Text-Datei (Content-Disposition attachment), content: { text/plain: { schema: { type: string } } } }
        '403': { description: requireTeamer / leadershipMayAccess }
        '404': { description: Challenge nicht in eigener Org }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [rbacVerifier, requireTeamer]
        org-scope: true
        objekt-pruefung: "leadershipMayAccess; hidden-Beitraege und 'private'-Konsens (außer bei privater Challenge) bleiben draussen"

  # ==========================================================================
  # NOTIFICATIONS
  # ==========================================================================

  /api/notifications/badge-counts:
    get:
      tags: ["Benachrichtigungen"]
      summary: Leichtgewichtige Badge-Zähler für die Tab-Leiste
      description: >
        Chat-Ungelesen-Zähler je Raum (Semantik identisch zu GET
        /chat/rooms) plus Pending-Zähler: pendingRequests/pendingEvents nur
        für Admin-Typen; pendingChallenges für org_admin org-weit, für
        Teamer UND gebundene Admins (seit 01.09.2026) auf zugewiesene
        Jahrgänge begrenzt (nur_team zaehlt immer), für Konfis 0.
        Seit 01.09.2026 zaehlen auch pendingRequests und pendingEvents fuer
        die Rolle admin nur noch, was seine Listen zeigen: Antraege aus
        zugewiesenen Jahrgaengen (Teamer-Antraege immer), Termine nach dem
        Sichtbarkeits-Filter der Terminliste. org_admin bleibt org-weit.
        Seit 24.08.2026 zählen EIGENE Nachrichten nicht mehr als ungelesen —
        vorher stand nach der eigenen letzten Nachricht eine Eins am Reiter,
        bis der Raum erneut geoeffnet wurde. Der Hintergrunddienst hat sie
        seit jeher ausgeschlossen; die beiden Zählungen sind damit gleich.
        Seit 27.08.2026 kommt newBadges als fuenftes Feld dazu — die Anzahl
        der noch nicht gesehenen eigenen Abzeichen (user_badges.seen), fuer
        Konfis wie Teamer:innen aus derselben Tabelle. Vorher lief der
        Abzeichen-Zaehler ueber einen zweiten, eigenen Weg; jetzt kommen alle
        Reiter-Zahlen aus dieser einen Abfrage.
        Behoben 15.09.2026: pendingEvents zaehlt keine abgesagten Termine mehr
        (events.cancelled IS NOT TRUE — die Spalte ist nullable, NULL heisst
        "nicht abgesagt"). Der Verbuchen-Tab blendet sie aus, die Zahl stand
        also vor einer leeren Liste. Dieselbe Bedingung gilt in der
        App-Icon-Summe (utils/appIconBadge.js), damit Reiter und Icon gleich
        zaehlen.
        Seit 24.09.2026 kommt challengeUpdates additiv dazu (kein bestehendes
        Feld aendert Form oder Typ, aeltere Apps ignorieren es): die
        Challenge-Neuigkeiten fuer Konfis, je Challenge und als Summe -- das
        Gegenstueck zu chat.byRoom/chat.total. Fuer Team und Leitung ist es
        0/leer; ihr Challenge-Reiter zaehlt pendingChallenges.
        Seit 25.09.2026 kommt challengeApprovals additiv dazu: dieselbe
        Zaehlung wie pendingChallenges (gleiche Rollen- und Jahrgangsgrenzen),
        aufgeschluesselt je Challenge fuer die Zahl am Listeneintrag der
        Leitung. pendingChallenges bleibt unveraendert eine Zahl -- die
        Store-Apps 2.2.x lesen sie so. Fuer Konfis ist challengeApprovals
        0/leer; Neuigkeiten (Konfis) und offene Freigaben (Leitung) werden
        nie in ein Feld gemischt.
        Seit 25.09.2026 kommt postfach additiv dazu: die Zahl ungelesener
        Postfach-Mitteilungen des KONTOS ueber alle Organisationen (dieselbe
        Zaehlung wie GET /api/notifications/postfach.ungelesen). Sie speist
        die Glocke -- und seit demselben Tag auch die Zahl am App-Symbol:
        Der Client addiert sie in allen drei Rollen zu den Reiter-Zahlen,
        der Server rechnet dieselbe Summe fuer den Push (utils/appIconBadge.js,
        postfachZaehler; Paritaetstest appIconBadgeParitaet.test.js).
        Gemessen vorher am Geraet: Glocke 23, Challenges 9, Chat 3, Symbol 12
        -- jetzt 35. Ungelesene Mitteilungen zaehlen ALLE, auch die, deren
        Gegenstand ein Reiter schon zaehlt (offener Antrag + "Neuer Antrag
        eingegangen"); Begruendung in backend/utils/postfachArten.js.
        Kein bestehendes Feld aendert sich. Store-Apps 2.2.x addieren das
        Postfach nicht: Sie zeigen nach dem Oeffnen die kleinere Summe der
        Reiter, bis die naechste Fassung im Store ist.
      responses:
        '200':
          description: Zähler
          content:
            application/json:
              schema:
                type: object
                properties:
                  chat:
                    type: object
                    properties:
                      total: { type: integer }
                      byRoom:
                        type: object
                        additionalProperties: { type: integer }
                  pendingRequests: { type: integer }
                  pendingEvents: { type: integer }
                  pendingChallenges: { type: integer }
                  newBadges: { type: integer }
                  challengeUpdates:
                    type: object
                    description: >
                      NEU 24.09.2026, nur fuer Konfis gefuellt. Je laufender
                      Challenge des eigenen Jahrgangs, was seit dem letzten
                      Oeffnen (POST /api/challenges/konfi/{id}/mark-read)
                      dazukam: die Challenge selbst, wenn nie geoeffnet;
                      fremde sichtbare Galerie-Beitraege; Freigabe oder
                      Ausblenden eigener Beitraege durch andere. Dieselbe
                      Rechnung (utils/challengeNeuigkeiten.js) speist die
                      App-Icon-Summe in utils/appIconBadge.js.
                    properties:
                      total: { type: integer }
                      byChallenge:
                        type: object
                        description: Challenge-ID -> Anzahl; nur Challenges mit Anzahl > 0
                        additionalProperties: { type: integer }
                  challengeApprovals:
                    type: object
                    description: >
                      NEU 25.09.2026, nur fuer Team und Leitung gefuellt. Die
                      offenen Freigaben (challenge_submissions.moderation_status
                      = 'pending') je Challenge -- dieselbe Zaehlung wie
                      pendingChallenges mit denselben Grenzen: org_admin
                      org-weit, Teamer:innen und gebundene Admins nur
                      Challenges ihrer zugewiesenen Jahrgaenge sowie
                      nur_team-Challenges. total ist stets gleich
                      pendingChallenges.
                    properties:
                      total: { type: integer }
                      byChallenge:
                        type: object
                        description: Challenge-ID -> Anzahl wartender Beitraege; nur Challenges mit Anzahl > 0
                        additionalProperties: { type: integer }
                  postfach:
                    type: object
                    description: >
                      NEU 25.09.2026, additiv, fuer alle Rollen. Ungelesene
                      Postfach-Mitteilungen (notifications.read_at IS NULL)
                      des Kontos ueber ALLE Organisationen -- bewusst ohne
                      Org-Filter, siehe GET /api/notifications/postfach.
                      Zahl an der Glocke UND Anteil des Postfachs an der
                      App-Icon-Summe (seit 25.09.2026).
                    properties:
                      ungelesen: { type: integer }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Nur eigene Räume (chat_participants); Pending-Zähler rollenabhaengig gefiltert — Rolle admin seit 01.09.2026 auf zugewiesene Jahrgaenge begrenzt (Zaehler und Listen zaehlen gleich). postfach.ungelesen ist die einzige Zahl OHNE Org-Bezug (nur user_id)."

  /api/notifications/badge-counts/je-organisation:
    get:
      tags: ["Benachrichtigungen"]
      summary: Was je Gemeinde offen ist (Indikatoren am Gemeinde-Umschalter)
      description: >
        NEU 25.09.2026. Fuer jede Gemeinde, der die Person angehoert
        (Stamm-Organisation plus user_organizations, gesperrte Organisationen
        ausgenommen), die Zahl dessen, was dort offen ist -- damit die
        Auswahlliste des Gemeinde-Umschalters zeigt, wo Arbeit liegt, bevor
        man hineinwechselt.
        "Offen" meint dasselbe wie die App-Icon-Summe (utils/appIconBadge.js):
        je Rolle Chat, offene Antraege, unverarbeitete Termine,
        Challenge-Freigaben, ungesehene Abzeichen und Challenge-Neuigkeiten.
        Audit-Befund B1 (25.09.2026): Der Server rechnet das Icon ueber ALLE
        Gemeinden, die App zeigt nur die aktive -- diese Route ist die
        Aufteilung dieser Summe je Gemeinde.
        DIE ROLLE GILT JE GEMEINDE (utils/orgMitglieder.js,
        ladeMitgliedschaftenDerPerson): org_admin in A und Teamer:in in B
        ergibt fuer B die Teamer-Zaehler. Die Jahrgangsbindung gebundener
        Admins und Teamer:innen gilt ebenso je Gemeinde ueber die Zuweisungen
        auf DEREN Jahrgaenge (utils/jahrgangsZugriff.js) -- gezaehlt wird nur,
        was die Person dort auch sehen darf.
        EIGENE ROUTE statt eines weiteren Felds in badge-counts: badge-counts
        fragt jedes Konto bei jeder Zaehler-Aktualisierung ab, auch die vielen
        Single-Org-Konfis, die den Umschalter nie sehen. Diese Route ruft die
        App nur beim Oeffnen der Auswahlliste. badge-counts bleibt unveraendert
        (Alt-App-Vertrag, Store-Apps 2.2.x).
        Kosten: zwei Abfragen fuer die Zugehoerigkeit plus eine Zaehlrunde
        ueber alle Gemeinden zusammen (`= ANY`/unnest), nicht eine je Gemeinde.
        Unabhaengig von X-Active-Organization: dieselbe Aufteilung, egal in
        welcher Gemeinde die Person gerade arbeitet.
      responses:
        '200':
          description: Je Gemeinde ein Eintrag, auch bei 0
          content:
            application/json:
              schema:
                type: object
                properties:
                  jeOrganisation:
                    type: object
                    description: >
                      Organisations-ID -> Eintrag. Genau die Gemeinden der
                      Person; eine Gemeinde ohne Zugehoerigkeit fehlt, auch
                      wenn dort etwas offen ist. Ein Objekt je Gemeinde (nicht
                      nur eine Zahl), damit spaeter eine Aufschluesselung
                      dazukommen kann, ohne die Form zu aendern. Eintraege mit
                      offen = 0 stehen drin: "nichts offen" und "keine Angabe"
                      bleiben unterscheidbar.
                    additionalProperties:
                      type: object
                      properties:
                        offen: { type: integer, description: Summe wie am App-Symbol, nie negativ }
              example:
                jeOrganisation:
                  "1": { offen: 2 }
                  "2": { offen: 1 }
                  "4": { offen: 0 }
        '401': { description: Kein oder ungueltiges Token }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Ausschliesslich req.user.id aus dem Token; kein Parameter, mit dem sich eine fremde Gemeinde erfragen liesse. Rolle und Jahrgangsbindung je Gemeinde (Tests: tests/routes/badgeJeOrganisation.test.js)."

  /api/notifications/postfach:
    get:
      tags: ["Benachrichtigungen"]
      summary: Postfach lesen (eigene Mitteilungen, alle Gemeinden)
      description: >
        NEU 25.09.2026. Die Tabelle notifications wurde bis dahin an sechs
        Stellen geschrieben (Antragsentscheid, Abzeichen, Konfi- und
        Teamer-Meldungen), aber nirgends gelesen -- wer eine Push-Nachricht
        wegwischte, hatte sie verloren. Diese Route macht daraus ein
        Postfach.
        WAS DRINSTEHT (seit 25.09.2026, zweiter Schritt): Neben den vier
        alten Arten (badge_earned, new_activity_request,
        activity_request_submitted, activity_request_decision) schreibt der
        Push-Weg selbst (PushService.sendToUser/sendToMultipleUsers) 21
        weitere Arten mit -- gesteuert ueber die Positivliste in
        backend/utils/postfachArten.js: event_attendance, bonus_points,
        activity_assigned, level_up, challenge_badge_earned,
        waitlist_promotion, event_cancelled, event_changed,
        event_reactivated, event_registered, event_unregistered,
        challenge_submission_hidden (Konfis/Teamer:innen);
        event_unregistration, teamer_event_booking,
        teamer_event_cancellation, events_pending_approval,
        new_konfi_registration, challenge_submission,
        jahrgang_deletion_warning, event_opt_out, event_opt_in (Leitung und
        Team). Der Eintrag entsteht VOR der Token-Pruefung -- auch wer keinen
        Push bekommt, hat ihn. Bewusst NICHT im Postfach: event_reminder,
        new_event, mandatory_event_created, challenge_started, chat (eigene
        Listen und Zaehler); wrapped und certificate sind nicht entschieden.
        events_pending_approval ersetzt die noch ungelesene Mitteilung
        derselben Person und Gemeinde vom Vortag, statt sich taeglich zu
        stapeln. `data` traegt die Kennungen des Pushes (event_id bzw.
        eventId, challengeId, jahrgang_id, request_id, badge_id); die App
        navigiert damit wie bei einem Push-Tap. Mitteilungen sterben mit
        ihrem Gegenstand (backend/utils/postfachAufraeumen.js): mit dem
        Termin alle Termin-Arten, mit der Challenge Stempel/ausgeblendet/
        neuer Beitrag, mit dem Jahrgang die Loeschwarnung, mit dem Antrag
        die Zustandsmeldungen, mit dem Abzeichen "Neues Badge erhalten".
        Nach 365 Tagen werden Mitteilungen nachts entfernt.
        ENTSCHEIDUNG ORG-BEZUG: Das Postfach ist persoenlich wie das
        Mitteilungszentrum des Handys; Push-Nachrichten kommen ja auch
        unabhaengig von der aktiven Gemeinde an. Wer mehrere Gemeinden
        betreut (org_admin in Org 1, 2 und 4), muss einen "Neuen Antrag" aus
        Gemeinde 2 sehen, waehrend er in Gemeinde 1 arbeitet. Deshalb liest
        die Route ueber ALLE Organisationen des Kontos (nur
        notifications.user_id = eigene id, kein Filter auf die aktive Org).
        Jeder Eintrag traegt organization_id und organization_name
        (COALESCE(display_name, name), null wenn die Organisation fehlt); die
        App wechselt beim Antippen bei Bedarf die Gemeinde ueber den
        vorhandenen Push-Weg.
        Neueste zuerst (ORDER BY id DESC). Cursor ueber `vor` (nur id < vor):
        stabil auch, wenn waehrend des Blaetterns neue Eintraege dazukommen.
        `data` ist IMMER ein Objekt (jsonb; NULL wird zu {}).
        `ungelesen` ist die Gesamtzahl ungelesener Mitteilungen des Kontos,
        unabhaengig von der Seite -- dieselbe Zahl wie
        badge-counts.postfach.ungelesen. `weitere` sagt, ob es aeltere
        Eintraege gibt.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
          description: >
            Eintraege je Seite. Groessere Werte werden still auf 100 gekappt,
            ungueltige (nicht-numerisch, 0, negativ) fallen auf 30 zurueck.
        - name: vor
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
          description: >
            Cursor: nur Eintraege mit id < vor (die kleinste id der vorigen
            Seite). Ungueltige Werte werden ignoriert (erste Seite).
      responses:
        '200':
          description: Eine Seite des Postfachs
          content:
            application/json:
              schema:
                type: object
                required: [eintraege, ungelesen, weitere]
                properties:
                  eintraege:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        title: { type: string }
                        message: { type: [string, 'null'] }
                        type: { type: string, description: "Art der Mitteilung, z.B. badge_earned, activity_request_decision, bonus_points, event_attendance, event_registered -- die Liste steht in description" }
                        data:
                          type: object
                          description: Immer ein Objekt; {} wenn in der Datenbank NULL steht
                        read_at: { type: [string, 'null'], format: date-time }
                        created_at: { type: string, format: date-time }
                        organization_id: { type: integer }
                        organization_name:
                          type: [string, 'null']
                          description: COALESCE(display_name, name) der Organisation
                  ungelesen:
                    type: integer
                    description: Alle ungelesenen des Kontos, unabhaengig von der Seite
                  weitere:
                    type: boolean
                    description: true, wenn es aeltere Eintraege als die letzte dieser Seite gibt
        '401': { description: Token fehlt oder ungueltig }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: >
          Nur eigene Mitteilungen (notifications.user_id aus dem geprueften
          Token). org-scope BEWUSST false: gelesen wird ueber alle
          Organisationen des Kontos, weil das Postfach persoenlich ist und
          nicht an die aktive Gemeinde gebunden (Begruendung in description).

  /api/notifications/postfach/gelesen:
    put:
      tags: ["Benachrichtigungen"]
      summary: Alle eigenen Mitteilungen als gelesen markieren
      description: >
        NEU 25.09.2026. Setzt read_at = NOW() auf allen eigenen Mitteilungen
        mit read_at IS NULL -- ueber alle Organisationen des Kontos, wie das
        Postfach selbst. `anzahl` ist die Zahl der tatsaechlich geaenderten
        Zeilen; bereits gelesene zaehlen nicht mit. Ohne Body.
      responses:
        '200':
          description: Markiert
          content:
            application/json:
              schema:
                type: object
                required: [success, anzahl]
                properties:
                  success: { type: boolean, const: true }
                  anzahl: { type: integer, description: Anzahl der soeben als gelesen markierten Mitteilungen }
        '401': { description: Token fehlt oder ungueltig }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Nur eigene Mitteilungen (user_id aus dem Token); fremde bleiben ungelesen. org-scope bewusst false, siehe GET /api/notifications/postfach."

  /api/notifications/postfach/{id}/gelesen:
    put:
      tags: ["Benachrichtigungen"]
      summary: Eine eigene Mitteilung als gelesen markieren
      description: >
        NEU 25.09.2026. Setzt read_at = NOW() auf genau einer eigenen
        Mitteilung. Idempotent: Eine bereits gelesene Mitteilung liefert 200
        mit dem VORHANDENEN read_at, nicht einem neuen. Fremde und nicht
        vorhandene Mitteilungen antworten beide mit 404 -- ein 403 wuerde
        verraten, dass die id existiert. Ohne Body.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: Mitteilungs-ID; nicht-numerisch -> 400
      responses:
        '200':
          description: Gelesen (neu markiert oder bereits gelesen)
          content:
            application/json:
              schema:
                type: object
                required: [success, id, read_at]
                properties:
                  success: { type: boolean, const: true }
                  id: { type: integer }
                  read_at: { type: string, format: date-time }
        '400': { description: id ist keine positive Ganzzahl }
        '401': { description: Token fehlt oder ungueltig }
        '404':
          description: Mitteilung nicht gefunden -- auch bei fremden Mitteilungen (kein 403)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, const: "Mitteilung nicht gefunden" }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "UPDATE ... WHERE id = $1 AND user_id = $2 -- fremde Mitteilungen 404 und unveraendert (Test: erlaubter und verbotener Fall). org-scope bewusst false, siehe GET /api/notifications/postfach."

  /api/notifications/push-diagnose:
    post:
      tags: ["Benachrichtigungen"]
      summary: Meldet, warum KEINE Push-Registrierung zustande kam
      description: >
        NEU 23.09.2026. Speichert nichts, protokolliert nur.
        Hintergrund: Kommt auf dem Geraet gar kein Push-Token zustande, gibt es
        auch keinen POST /device-token — und damit serverseitig keine Spur. "Die
        App fragt nicht" und "die App fragt, bekommt aber nichts" sahen identisch
        aus, naemlich wie Stille. Genau daran scheiterte eine Fehlersuche zu
        fehlenden Android-Push-Nachrichten: drei Anmeldungen eines Testers, kein
        Eintrag, kein Fehler.
        Absichtlich ohne Schema-Zwang ausser dem Grund: Die App soll melden
        koennen, auch wenn sie selbst nicht weiss, was schiefgeht.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                grund: { type: string, description: "z.B. kein-token-nach-anmeldung, getToken-fehler" }
                berechtigung: { type: string, description: "granted | denied | prompt" }
                plattform: { type: string }
                app_version: { type: string }
                app_build: { type: string }
                hinweis: { type: string, description: "Freitext, auf 200 Zeichen gekuerzt" }
      responses:
        '200': { description: Aufgenommen }
        '401': { $ref: '#/components/responses/Unauthorized' }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Meldet nur ueber das eigene Geraet; nichts wird gespeichert"

  /api/notifications/preferences:
    get:
      tags: ["Benachrichtigungen"]
      summary: Push-Einstellungen lesen (Hauptschalter und stummgeschaltete Gruppen)
      description: >
        ADDITIV 25.09.2026: Bis dahin nur `push_enabled`. Neu `stumm` (rohe
        Kennungen der abgewaehlten Gruppen) und `gruppen` -- die Gruppen, die
        DIESE Rolle zur Auswahl bekommt (Konfis ohne konfi_verwaltung), mit
        Text und aktuellem Stand. Die Gruppen sind die Android-Kanaele
        (backend/utils/pushGruppen.js). Die Abwahl unterdrueckt nur den Versand
        aufs Geraet; der Postfach-Eintrag entsteht unabhaengig davon.
        Store-Apps 2.2.x rufen die Route nicht.
      responses:
        '200':
          description: push_enabled (Default true), stumm (Default leer), gruppen je Rolle
          content:
            application/json:
              schema:
                type: object
                properties:
                  push_enabled: { type: boolean }
                  stumm:
                    type: array
                    items: { type: string, enum: [konfi_chat, konfi_termine, konfi_fortschritt, konfi_verwaltung] }
                  gruppen:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        beschreibung: { type: string }
                        aktiv: { type: boolean }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Nur eigener User-Datensatz"
    put:
      tags: ["Benachrichtigungen"]
      summary: Push-Hauptschalter und/oder stummgeschaltete Gruppen setzen
      description: >
        ADDITIV 25.09.2026: `push_enabled` war Pflicht, jetzt reicht eines von
        `push_enabled` und `stumm`. Was nicht mitgeschickt wird, bleibt wie es
        ist. `stumm` ersetzt die gesamte Abwahl-Liste (leere Liste = alles an);
        nur bekannte Gruppen-Kennungen, sonst 400. Eine Kennung, die die Rolle
        nicht zur Auswahl hat, ist erlaubt und wirkungslos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                push_enabled: { type: boolean }
                stumm:
                  type: array
                  items: { type: string, enum: [konfi_chat, konfi_termine, konfi_fortschritt, konfi_verwaltung] }
      responses:
        '200':
          description: Gespeichert
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  push_enabled: { type: boolean }
                  stumm: { type: array, items: { type: string } }
        '400': { description: push_enabled kein Boolean, stumm keine Liste oder unbekannte Gruppe, oder beides fehlt }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "Nur eigener User-Datensatz"

  /api/notifications/device-token:
    post:
      tags: ["Benachrichtigungen"]
      summary: Push-Token registrieren/aktualisieren
      description: >
        Upsert auf (user_id, platform, device_id). Ein Token existiert
        global genau einmal: Vorkommen bei anderen Usern/Geraeten werden
        vorher gelöscht (Account-Wechsel, Neuinstallation).
        ADDITIV 23.09.2026: app_version und app_build (Migration 156). Anlass war
        eine Fehlersuche, bei der nicht feststellbar war, ob auf einem Geraet die
        korrigierte Fassung lief oder noch die alte — beides sah serverseitig
        identisch aus. Jede Registrierung wird seither auch protokolliert
        (ohne den Token selbst, nur dessen letzte sechs Zeichen).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token: { type: string }
                platform: { type: string, enum: [ios, android, web] }
                device_id: { type: string, description: Optional, wird sonst generiert }
                app_version: { type: string, maxLength: 32, nullable: true, description: "ADDITIV 23.09.2026 (Migration 156) - Marketing-Version der App, z.B. 2.3.0. Optional; ausgelieferte Fassungen schicken es nicht, dann bleibt die Spalte NULL (= unbekannt). Eine Registrierung OHNE die Angabe ueberschreibt eine bereits bekannte Fassung nicht (COALESCE im Upsert)." }
                app_build: { type: string, maxLength: 32, nullable: true, description: "ADDITIV 23.09.2026 (Migration 156) - Build-Nummer als Text, z.B. 117 (Android versionCode) oder 211 (iOS). Text, weil beide Plattformen unterschiedlich zaehlen." }
      responses:
        '200': { description: Gespeichert }
        '400': { description: Token/Plattform fehlt oder ungueltig }
        '409': { description: Unique-Konflikt }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC, validateDeviceToken]
        org-scope: false
        objekt-pruefung: "Token wird immer dem eigenen User zugeordnet"
    delete:
      tags: ["Benachrichtigungen"]
      summary: Push-Token entfernen (Logout)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_id, platform]
              properties:
                device_id: { type: string }
                platform: { type: string }
      responses:
        '200': { description: Entfernt (changes = Anzahl geloeschter Zeilen) }
        '400': { description: device_id/platform fehlt }
        '500': { description: Datenbankfehler }
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC, validateDeleteToken]
        org-scope: false
        objekt-pruefung: >
          Nur eigene Tokens (user_id aus dem geprueften Token). BEHOBEN
          2026-08-28: Die Route verengte zusaetzlich ueber
          users.organization_id und verglich damit die PRIMAER-Org des Kontos
          mit der AKTIVEN Org aus dem Token. Bei Mehrfach-Mitgliedschaft
          loeschte sie nichts und meldete trotzdem Erfolg.

