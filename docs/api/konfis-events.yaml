# =====================================================================
# Konfi Quest API - OpenAPI 3.1 - BLOCK 2 von 3
# Dokumentierte Dateien (Stand main, 22.08.2026, am Code verifiziert):
#   backend/routes/konfi.js            -> Prefix /api/konfi            (24 Routen)
#   backend/routes/events/ (aufgeteilt) -> Prefix /api/events          (21 Routen)
#   backend/routes/konfi-management.js -> Prefix /api/admin/konfis     (16 Routen)
#   backend/routes/activities.js       -> Prefix /api/admin/activities (10 Routen)
#
# Rollen: super_admin, org_admin, admin, teamer, konfi
# Middleware (backend/middleware/rbac.js):
#   verifyTokenRBAC  = JWT prüfen, User inkl. aktiver Organisation (Header
#                      X-Active-Organization) und assigned_jahrgaenge laden.
#                      req.user.type: konfi | teamer | admin (admin = alles andere,
#                      auch super_admin!)
#   requireAdmin     = requireRole('org_admin', 'admin')
#   requireTeamer    = requireRole('org_admin', 'admin', 'teamer')
#
# =====================================================================
# SCHWERPUNKT-ANALYSE (alle Aussagen am Code verifiziert)
# =====================================================================
#
# 1. WELCHE DATEN SIEHT EIN KONFI VON ANDEREN KONFIS?
#    - GET /api/konfi/dashboard: Top-3-Ranking des eigenen Jahrgangs. Die
#      Response enthält pro Rang id, initials UND den VOLLEN display_name
#      samt exakter Punktzahl (Spread `...r` uebernimmt display_name).
#      # LÜCKE (Datenminimierung): Das Frontend zeigt nur Initialen, die API
#      liefert aber Klarnamen + Punkte der drei Punktbesten an jeden Konfi
#      des Jahrgangs.
#    - GET /api/konfi/events/:id/participants: bewusst anonymisiert zu
#      "Vorname N.", Teamer werden herausgefiltert, Organisation wird geprüft
#      (Fix 22.08.2026). KEIN Jahrgang-Check: ein Konfi kann die anonymisierte
#      Teilnehmerliste JEDES Events der eigenen Org abrufen (auch fremder
#      Jahrgänge). Nur Hinweis, da anonymisiert.
#    - GET /api/events/:id: für Konfis werden qr_token entfernt sowie
#      participants und unregistrations geleert (Fix 22.08.2026, dokumentiert).
#    - GET /api/events (Liste): liefert nur Zähler (registered_count etc.),
#      keine Namen anderer Konfis - ABER siehe LÜCKE qr_token unten.
#    - rank_in_jahrgang / total_in_jahrgang (dashboard, profile): nur Aggregat.
#    - Alle uebrigen /api/konfi-Routen liefern ausschliesslich eigene Daten
#      (WHERE user_id = req.user.id).
#
# 2. TEAMER-ZUGRIFF (assigned_jahrgaenge)
#    Jahrgangs-Beschraenkung GREIFT bei:
#    - GET /api/admin/konfis (Liste): nur can_view-Jahrgänge; keine Zuweisung
#      -> leere Liste. ACHTUNG: Der Filter greift für ALLE Rollen außer
#      org_admin/super_admin, also auch für Rolle "admin" - ein admin ohne
#      Jahrgangs-Zuweisungen sieht hier NICHTS (Abweichung vom sonstigen
#      Muster, wo admin org-weit sieht).
#    - POST /api/admin/activities/assign-activity: Teamer nur für Konfis in
#      can_view-Jahrgängen (403 sonst).
#    - GET /api/events (Liste): Teamer sieht jahrgangs-gebundene Events nur
#      für zugewiesene Jahrgänge (+ allgemeine + teamer_only/teamer_needed).
#      # LÜCKE (klein): Der Filter greift nur bei assigned_jahrgaenge.length > 0.
#      Ein Teamer OHNE jede Zuweisung sieht die komplette Event-Liste der Org.
#    Jahrgangs-Beschraenkung GREIFT NICHT (nur Org-Scope) bei:
#    - # LÜCKE: GET /api/admin/konfis/:id - Teamer erhält das VOLLE Detail-
#      Profil jedes Konfis der Org (Punkte, Aktivitäten, Bonuspunkte,
#      Konfispruch, Konfirmationstermin), auch außerhalb der eigenen
#      Jahrgänge. Die Listen-Route filtert, die Detail-Route nicht.
#    - # LÜCKE: GET /api/admin/konfis/:id/event-points und
#      GET /api/admin/konfis/:id/badges - gleiche Klasse, kein Jahrgang-Check.
#    - # BEHOBEN 27.08.2026: POST /api/admin/konfis/:id/bonus-points - ein
#      Teamer konnte Konfis JEDES Jahrgangs der Org Bonuspunkte geben
#      (nachgemessen: 201, Eintrag angelegt). Inkonsistent zu
#      assign-activity, das den Jahrgang prüft, und zum Handbuch
#      (45-jahrgaenge.md:180). Jetzt derselbe Check wie dort, mit 403
#      "Kein Zugriff auf diesen Konfi". Die Leitung bleibt org-weit
#      berechtigt.
#    - GET /api/events/:id (Detail): Teamer sieht Teilnehmerliste (Klarnamen,
#      Anwesenheit, Opt-out-Gruende) und Abmeldungen ALLER Events der Org,
#      auch solcher, die die Listen-Route für ihn ausblendet. Ebenso alle
#      Teilnehmer-/Anwesenheits-/Buchungs-Verwaltungsrouten (requireTeamer,
#      nur Org-Scope).
#    - GET /api/admin/konfis/teamer: alle Teamer der Org (unkritisch).
#
# 3. WER DARF PUNKTE VERGEBEN UND ENTZIEHEN? (vollstaendige Liste)
#    VERGEBEN:
#    a) POST /api/admin/activities/assign-activity
#       org_admin, admin, teamer (Teamer nur eigene can_view-Jahrgänge).
#    b) PUT /api/admin/activities/requests/:id mit status=approved
#       org_admin, admin (Antrag genehmigen -> user_activities + Punkte).
#    c) POST /api/admin/konfis/:id/activities
#       org_admin, admin (Aktivität direkt zuweisen).
#    d) POST /api/admin/konfis/:id/bonus-points
#       org_admin, admin, teamer (OHNE Jahrgang-Check, siehe LÜCKE oben).
#    e) PUT /api/events/:id/participants/:participantId/attendance
#       (attendance_status=present) org_admin, admin, teamer -> event_points.
#    f) PUT /api/events/:id/participants/attendance-all
#       org_admin, admin, teamer (Bulk-Verbuchung aller Angemeldeten).
#    g) POST /api/events/qr-checkin - der KONFI SELBST via gueltigem QR-Token
#       im Check-in-Zeitfenster (einzige Selbst-Vergabe; Teamer erhalten keine
#       Punkte).
#    ENTZIEHEN:
#    h) DELETE /api/admin/konfis/:id/activities/:activityId  org_admin, admin.
#    i) DELETE /api/admin/konfis/:id/bonus-points/:bonusId   org_admin, admin.
#    j) PUT /api/admin/activities/requests/:id/reset         org_admin, admin
#       (Reset eines genehmigten Antrags zieht die Punkte zurück).
#    k) PUT .../attendance (attendance_status=absent)        org_admin, admin, teamer.
#    l) PUT /api/events/:id/participants/:participantId/status (-> waitlist)
#       org_admin, admin, teamer (Degradierung löscht event_points).
#    m) DELETE /api/events/:id/bookings/:bookingId           org_admin, admin, teamer
#       (war der Konfi 'present', werden die Event-Punkte zurückgenommen).
#    n) DELETE /api/events/:id/book - Konfi/Teamer selbst; war der Konfi
#       'present', werden die eigenen Event-Punkte zurückgenommen.
#    Löschen eines Konfis (DELETE /api/admin/konfis/:id, org_admin/admin)
#    entfernt kaskadiert alle Punkte.
#
# 4. FOTOS (Nachweisfotos zu Aktivitaets-Anträgen)
#    - Upload: POST /api/konfi/upload-photo (konfi ODER teamer). Magic-Bytes-
#      Prüfung (nur echte Bilder), AES-256-GCM-verschlüsselt at-rest,
#      zufaelliger 64-Hex-Dateiname. uploads/ wird NICHT statisch ausgeliefert
#      - Abruf ausschliesslich über die zwei geschuetzten Routen unten.
#    - GET /api/konfi/activity-requests/:id/photo: Eigentuemer (konfi/teamer)
#      sieht das eigene Foto NUR solange der Antrag 'pending' ist; danach 403.
#      req.user.type==='admin' (org_admin/admin) sieht es immer. Org-Scope
#      über activity_requests.organization_id.
#    - GET /api/admin/activities/requests/:id/photo: NUR admin/org_admin
#      (explizite Rollenpruefung, Teamer 403), Org-Scope, statusunabhaengig.
#      Foto-Referenz bleibt nach Genehmigung bewusst erhalten (Duplikats-
#      Erkennung), Löschung manuell per DELETE .../photo.
#    - DELETE /api/admin/activities/requests/:id/photo: admin/org_admin.
#    -> Konfis können NIE Fotos anderer Konfis abrufen (user_id-Check).
#       Teamer können ausschliesslich ihre EIGENEN Antragsfotos sehen.
#
# NEUE LÜCKEN IN DIESEM BLOCK (zusammengefasst):
#   L1  BEHOBEN 22.08.2026. GET /api/events lieferte e.* inklusive qr_token an
#       ALLE Rollen. Ein Konfi konnte sich damit per POST /api/events/qr-checkin
#       aus der Ferne als anwesend eintragen und Punkte gutschreiben; der Fix an
#       GET /events/:id war so umgehbar. Live nachgewiesen (2 Token sichtbar),
#       jetzt aus allen Listen-Responses entfernt.
#   L2  GET /api/admin/konfis/:id (+ /event-points, /badges): Teamer sieht
#       Konfis außerhalb der zugewiesenen Jahrgänge im Detail.
#   L3  POST /api/admin/konfis/:id/bonus-points: Teamer ohne Jahrgang-Check.
#   L4  GET /api/konfi/dashboard: Klarnamen + Punkte der Top 3 an alle Konfis.
#   L5  BEHOBEN 22.08.2026. Der Jahrgangs-Filter verlangte length > 0 und
#       entfiel damit für Teamer:innen ohne jede Zuweisung - sie sahen alle
#       Events der Organisation. Der Filter greift jetzt immer.
# =====================================================================
openapi: 3.1.0
info:
  title: Konfi Quest API - Konfis & Events (Block 2)
  version: "1.0.0"
  description: >
    Teil 2 der API-Dokumentation: Konfi-Selbstbedienung (/api/konfi),
    Events (/api/events), Konfi-Verwaltung (/api/admin/konfis) und
    Aktivitäten/Antraege (/api/admin/activities). Berechtigungen sind je
    Route in der Erweiterung x-berechtigung dokumentiert.
servers:
  - url: https://konfi-quest.de
tags:
  - name: "Abzeichen"
    description: "Abzeichen-Verwaltung und die verdienten Abzeichen von Konfis und Teamer:innen."
  - name: "Aktivitäten & Anträge"
    description: "Aktivitäten-Katalog, Punkte-Anträge der Konfis und ihre Bearbeitung durch die Leitung."
  - name: "Konfi-Profil & Dashboard"
    description: "Eigene Daten der Konfis: Profil, Dashboard, Konfispruch, Tageslosung."
  - name: "Konfis (Verwaltung)"
    description: "Konfi-Konten aus Sicht der Leitung: anlegen, Punkte, Passwort, Beförderung zu Teamer:in."
  - name: "Termine (Konfis)"
    description: "Termine aus Konfi-Sicht: ansehen, anmelden, abmelden, Warteliste, Zeitfenster."
  - name: "Termine (Verwaltung)"
    description: "Termine und Serien anlegen, Teilnahme und Anwesenheit pflegen, QR-Check-in, Absagen."
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT im Authorization-Header. Optional Header X-Active-Organization
        (Multi-Org): schaltet die aktive Organisation um, sofern der User dort
        Mitglied ist (sonst 403).
  parameters:
    pathId:
      description: "Numerische ID des Objekts im Pfad (welches Objekt, sagt die jeweilige Route)"
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Message:
      type: object
      properties:
        message: { type: string }
  responses:
    Unauthorized:
      description: Kein/ungueltiges/abgelaufenes Token, inaktiver Account oder inaktive Organisation
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Rolle nicht erlaubt oder kein Zugriff auf das Objekt
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Objekt nicht gefunden (in der aktiven Organisation)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ServerError:
      description: Datenbank-/Serverfehler
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

paths:
  # ===================================================================
  # backend/routes/konfi.js  (Prefix /api/konfi)
  # Alle Routen: verifyTokenRBAC + Inline-Check req.user.type === 'konfi'
  # (Ausnahme upload-photo: konfi ODER teamer). Immer nur EIGENE Daten.
  # ===================================================================
  /api/konfi/dashboard:
    get:
      tags: ["Konfi-Profil & Dashboard"]
      summary: Konfi-Dashboard (eigene Punkte, Level, Ranking, Badges, Termine)
      description: >
        Liefert das komplette Dashboard des eingeloggten Konfis: Stammdaten,
        Punkte, Level-Fortschritt, Konfirmationstermin (aus gebuchtem
        is_konfirmation-Event), Dashboard-Konfiguration der Org, Top-3-Ranking
        des Jahrgangs, letzte Badges und Events, Wrapped-Verfuegbarkeit.
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigene Daten (user_id = Token); Ranking aggregiert über den eigenen Jahrgang"
        hinweis: >
          # LÜCKE L4: ranking[] enthält display_name (Klarname) und exakte
          Punktzahl der drei Punktbesten des Jahrgangs - zusaetzlich zu den
          im Frontend genutzten Initialen.
      responses:
        "200":
          description: Dashboard-Daten
          content:
            application/json:
              schema:
                type: object
                properties:
                  konfi: { type: object, description: "id, display_name, Punkte, Jahrgang, Level-Felder, confirmation_location/-event_date" }
                  point_config: { type: object, description: "gottesdienst_enabled, gemeinde_enabled, target_*" }
                  dashboard_config: { type: object, description: "show_*-Flags, section_order" }
                  recent_badges: { type: array, items: { type: object } }
                  badge_count: { type: integer }
                  recent_events: { type: array, items: { type: object } }
                  event_count: { type: integer }
                  ranking:
                    type: array
                    description: Top 3 des Jahrgangs (id, display_name, points, initials)
                    items: { type: object }
                  total_points: { type: integer }
                  rank_in_jahrgang: { type: [integer, "null"] }
                  total_in_jahrgang: { type: [integer, "null"] }
                  days_to_confirmation: { type: [integer, "null"] }
                  confirmation_date: { type: [string, "null"] }
                  has_wrapped: { type: boolean }
                  konfspruch_visible: { type: boolean, description: "true nur wenn jahrgaenge.konfspruch_enabled UND der Org-Schalter dashboard_show_konfispruch nicht false ist" }
                  level_info: { type: object, description: "current_level, next_level, progress_percentage, points_to_next_level, all_levels" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/profile:
    get:
      tags: ["Konfi-Profil & Dashboard"]
      summary: Eigenes Konfi-Profil
      description: >
        Profil des eingeloggten Konfis mit Punkten (inkl. Bonus-Summe),
        Statistiken (Badges, Aktivitäten, Events, offene Anträge), Rang im
        Jahrgang, Konfirmationstermin/-ort und aufgeloestem Konfispruch.
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigene Daten"
      responses:
        "200":
          description: Profil
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  display_name: { type: string }
                  email: { type: [string, "null"] }
                  username: { type: string }
                  jahrgang_name: { type: string }
                  konfspruch: { type: [object, "null"], description: "source: liste|freitext, text, reference" }
                  total_points: { type: integer }
                  gottesdienst_points: { type: integer }
                  gemeinde_points: { type: integer }
                  bonus_points: { type: integer }
                  badge_count: { type: integer }
                  activity_count: { type: integer }
                  event_count: { type: integer }
                  pending_requests: { type: integer }
                  rank_in_jahrgang: { type: [integer, "null"] }
                  total_in_jahrgang: { type: [integer, "null"] }
                  confirmation_date: { type: [string, "null"] }
                  confirmation_location: { type: [string, "null"] }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }
    patch:
      tags: ["Konfi-Profil & Dashboard"]
      summary: Eigenen Konfispruch setzen (Listen-Wahl oder Freitext)
      description: >
        Setzt den Konfispruch: entweder konfspruch_id + translation
        (luther2017 | bigs | gute_nachricht | elberfelder) aus der kuratierten
        Liste ODER konfspruch_freitext + konfspruch_freitext_referenz
        (Pflicht, max 100 Zeichen; Freitext max 1000). Genau eine Quelle aktiv.
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigenes Profil (WHERE user_id = req.user.id); Spruch muss org-sichtbar und aktiv sein"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                konfspruch_id: { type: integer }
                translation: { type: string, enum: [luther2017, bigs, gute_nachricht, elberfelder] }
                konfspruch_freitext: { type: string, maxLength: 1000 }
                konfspruch_freitext_referenz: { type: string, maxLength: 100 }
      responses:
        "200":
          description: "success: true, konfspruch (source, id/text, translation/reference)"
        "400": { description: Ungueltige Kombination, leerer Text, fehlende Referenz oder zu lang }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Konfispruch nicht gefunden (Listen-Wahl) }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/points-history:
    get:
      tags: ["Aktivitäten & Anträge"]
      summary: Eigene Punkte-Historie (Aktivitäten, Bonus, Events)
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigene Daten"
      responses:
        "200":
          description: history[] (id, title, points, category, date, comment, source_type activity|bonus|event) + totals {gottesdienst, gemeinde, total}
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/requests:
    get:
      tags: ["Aktivitäten & Anträge"]
      summary: Eigene Aktivitaets-Anträge auflisten
      description: >
        Liefert nur Anträge auf Aktivitäten mit target_role='konfi' — bis
        27.08.2026 fehlte dieser Filter (Befund N3, behoben). Anträge zu einer
        inzwischen GELÖSCHTEN Aktivität bleiben bewusst in der Liste (LEFT
        JOIN, activity_name dann leer); der Teamer-Weg lässt sie über einen
        inneren JOIN wegfallen.
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigene Anträge (user_id = Token), nur Aktivitäten mit target_role='konfi'"
      responses:
        "200": { description: "Array von Antraegen (ar.* + activity_name, activity_points, activity_type)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }
    post:
      tags: ["Aktivitäten & Anträge"]
      summary: Neuen Aktivitaets-Antrag einreichen
      description: >
        Legt einen Antrag (status pending) an. Idempotent über optionale
        client_id (UUID): existiert der Antrag bereits, kommt 200 mit dem
        bestehenden Datensatz. Benachrichtigt die gesamte Leitung (Rollen
        admin UND org_admin) per In-App-Mitteilung und Push — bis 26.08.2026
        ging die In-App-Mitteilung nur an admin (Befund M6, behoben).


        Die Aktivität muss target_role='konfi' haben; sonst 404. Bis
        27.08.2026 fehlte diese Prüfung — ein Antrag auf eine
        Teamer-Aktivität wurde angenommen und war von der Leitung
        bestätigbar (Befund N3, behoben).
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC, validateCreateRequest]
        org-scope: true
        objekt-pruefung: "Aktivität muss zur eigenen Org gehören UND target_role='konfi' sein (404 sonst)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activity_id, requested_date]
              properties:
                activity_id: { type: integer }
                requested_date: { type: string, format: date }
                description: { type: string, description: "Kommentar (Spalte comment)" }
                photo_filename: { type: string, description: "Dateiname aus POST /api/konfi/upload-photo" }
                client_id: { type: string, format: uuid }
      responses:
        "200": { description: Bereits vorhandener Antrag (Idempotenz ueber client_id) }
        "201": { description: "id + message" }
        "400": { description: Validierungsfehler }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Aktivitaet nicht gefunden }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/requests/{id}:
    delete:
      tags: ["Aktivitäten & Anträge"]
      summary: Eigenen offenen Antrag löschen
      description: Nur Anträge mit status pending; zugehoeriges Nachweisfoto wird mitgeloescht.
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigener Antrag (id + user_id + organization_id)"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: Geloescht }
        "400": { description: Antrag nicht mehr pending }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/upload-photo:
    post:
      tags: ["Aktivitäten & Anträge"]
      summary: Nachweisfoto für Antrag hochladen (verschlüsselt at-rest)
      description: >
        multipart/form-data, Feld "photo". Magic-Bytes-Prüfung (nur echte
        Bilder, sonst 415), AES-256-GCM-Verschluesselung, zufaelliger
        64-Hex-Dateiname wird zurueckgegeben (für POST /api/konfi/requests).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary, description: "Bilddatei, max. 5 MB" }
      x-berechtigung:
        rollen: [konfi, teamer]
        middleware: [verifyTokenRBAC, "multer requestUpload.single('photo')"]
        org-scope: false
        objekt-pruefung: "keine (Datei ist noch keinem Antrag zugeordnet)"
        hinweis: "Einzige /api/konfi-Route, die auch Teamern offensteht (Teamer-Nachweise)."
      responses:
        "200": { description: "filename (64 Hex) + message" }
        "400": { description: Kein Foto im Request }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "415": { description: Datei ist kein Bild (Magic-Bytes) }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/activity-requests/{id}/photo:
    get:
      tags: ["Aktivitäten & Anträge"]
      summary: Nachweisfoto eines Antrags abrufen (Eigentuemer/Admin)
      description: Liefert das entschluesselte Bild (image/jpeg).
      x-berechtigung:
        rollen: [konfi, teamer, admin, org_admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: >
          Konfi/Teamer nur den EIGENEN Antrag (user_id-Vergleich) und nur
          solange status='pending' (danach 403); req.user.type==='admin'
          (org_admin/admin) sieht alle Fotos der Org statusunabhaengig.
        hinweis: "Antrag wird org-gescopt geladen; fremde Org -> 404."
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: Bild (image/jpeg), content: { image/jpeg: {} } }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: Fremder Antrag oder Antrag bereits bearbeitet (Nicht-Admin) }
        "404": { description: Antrag/Foto/Datei nicht gefunden }
        "500": { description: Entschluesselung fehlgeschlagen / Serverfehler }

  /api/konfi/activities:
    get:
      tags: ["Aktivitäten & Anträge"]
      summary: Beantragbare Aktivitäten auflisten
      description: >
        Aktivitäten der Org mit target_role konfi (oder NULL), gefiltert auf
        die im Jahrgang aktivierten Punkt-Typen.
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "keine personenbezogenen Daten"
      responses:
        "200": { description: "Array (id, name, points, type, category_names)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/badges:
    get:
      tags: ["Abzeichen"]
      summary: Eigene Badges mit Fortschritt
      description: >
        Gemeinsame Berechnung mit der Admin-Sicht (utils/konfiBadgeProgress.js).
        Der Fortschritt selbst kommt seit 27.08.2026 aus dem gemeinsamen
        Rechenkern utils/badgeProgress.js, den sich Konfi- und Teamer-Pfad
        teilen (Befund N2). Die Antwortform ist unveraendert:
        {available, earned, stats}.
        stats.totalVisible/totalSecret zaehlen NUR ERREICHBARE und AKTIVE
        Abzeichen. Vorher kamen sie aus einer eigenen organisationsweiten
        Query, die von der Ausblendung unerreichbarer Abzeichen nichts wusste —
        das Dashboard nannte dann ein Ziel, das niemand vollmachen konnte.
        Verdiente Abzeichen bleiben in earned sichtbar, auch wenn sie
        inzwischen abgeschaltet sind; als offenes Ziel zaehlen sie nicht.
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigene Daten"
      responses:
        "200": { description: "{available[], earned[], stats:{totalVisible,totalSecret}} — stats zaehlt nur erreichbare und aktive Abzeichen" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/badges/stats:
    get:
      tags: ["Abzeichen"]
      summary: Eigene Badge-Statistik (total/earned)
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigene Daten"
      responses:
        "200": { description: "total_badges, earned_badges" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/badges/mark-seen:
    post:
      tags: ["Abzeichen"]
      summary: Eigene Badges als gesehen markieren
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigene user_badges"
      responses:
        "200": { description: "success: true" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/events:
    get:
      tags: ["Termine (Konfis)"]
      summary: Events des eigenen Jahrgangs (Konfi-Sicht)
      description: >
        Events, die dem Jahrgang des Konfis zugewiesen sind, ohne teamer_only;
        abgesagte nur, wenn der Konfi gebucht war. Standard-Datumsfenster:
        letzte 12 Monate + Zukunft (?all=true für alles). Enthaelt eigene
        Buchung (booking_status, attendance_status, Timeslot,
        waitlist_position) und Konfi-Zähler (Teamer-Kontingent getrennt).
        BEHOBEN 25.08.2026 (Befund 1): registration_status kennt jetzt wie die
        Admin-Liste den > 0-Guard (max_participants=0 = unbegrenzt, nicht
        'closed') und den Wert 'mandatory' für Pflichttermine.
        NEU 27.08.2026: chat_room_id liefert den Event-Chatraum, aber NUR wenn
        der Konfi selbst Teilnehmer des Raums ist (sonst null). Damit bildet
        der Chat-Einstieg im Termin-Detail genau die Berechtigung ab, die
        darfRaumOeffnen in chat.js durchsetzt.
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur Events des eigenen Jahrgangs; Konfi ohne Jahrgang -> leere Liste"
        hinweis: "BEHOBEN 22.08.2026: qr_token wird aus der Response gefiltert (war dieselbe Klasse wie L1 in /api/events)."
      parameters:
        - name: all
          in: query
          required: false
          schema: { type: string, enum: ["true"] }
          description: Gesamte Historie statt 12-Monats-Fenster
      responses:
        "200": { description: "Array von Events (e.*, registered_count, waitlist_count, teamer_count, registration_status, is_registered, can_register, waitlist_position, categories[], chat_room_id)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/events/{id}/status:
    get:
      tags: ["Termine (Konfis)"]
      summary: Eigener Anmeldestatus für ein Event
      description: >
        BEHOBEN 25.08.2026 (Befund 1): event_status mit > 0-Guard
        (max_participants=0 = unbegrenzt) und 'mandatory'-Wert wie die
        Admin-Liste; confirmed_count/waitlist_count zählen jetzt konfi-rein
        (Teamer-Kontingent getrennt, vorher ohne Rollenfilter).
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Event org-gescopt; Buchungsdaten nur eigene; kein Jahrgang-Check (nur Zähler)"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "is_registered, registration_status, can_register, event_status, confirmed_count, waitlist_count, waitlist_position, max_participants, waitlist_enabled" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/events/{id}/participants:
    get:
      tags: ["Termine (Konfis)"]
      summary: Anonymisierte Teilnehmerliste eines Events (Konfi-Sicht)
      description: >
        Bestaetigte Teilnehmer als "Vorname N." (anonymisiert), Teamer werden
        herausgefiltert. Organisation wird geprüft (Fix 22.08.2026).
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Event muss zur eigenen Org gehören; Namen anonymisiert"
        hinweis: "Kein Jahrgang-Check - anonymisierte Listen beliebiger Org-Events abrufbar (nur Hinweis)."
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "Array {id, display_name: 'Vorname N.'}" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/events/{id}/timeslots:
    get:
      tags: ["Termine (Konfis)"]
      summary: Zeitslots eines Events (Konfi-Sicht)
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Event org-gescopt; nur Slot-Daten + Zähler"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "Array von Timeslots (et.*, registered_count, waitlist_count); leer wenn has_timeslots=false" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/events/{id}/register:
    post:
      tags: ["Termine (Konfis)"]
      summary: Für Event anmelden (primaere Konfi-Buchungsroute)
      description: >
        Transaktional (FOR UPDATE). Prueft Doppelbuchung (409),
        Konfirmations-Sperre (nur EIN Konfirmationstermin, 409),
        Registrierungsfenster, Timeslot-Pflicht und Kapazität (Konfi- und
        Teamer-Kontingent getrennt). Ergebnis confirmed oder waitlist. Traegt
        die Person seit 24.08.2026 in den Chat zum Termin ein, falls es einen
        gibt (idempotent) — vorher kam nur hinein, wer beim Anlegen des Chats
        schon gebucht war.


        Seit 27.08.2026 zusaetzlich: reine Teamer-Termine (teamer_only)
        werden mit 403 abgelehnt, abgesagte Termine (cancelled) mit 400.
        Beide Pruefungen fehlten hier, waehrend der regulaere Weg sie hatte
        (Befund N1, behoben). Das ABMELDEN von einem abgesagten Termin bleibt
        bewusst moeglich (DELETE, siehe unten) — sonst waeren bereits
        Angemeldete eingesperrt.
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "bucht nur sich selbst; Event + Timeslot org-gescopt; nicht teamer_only, nicht cancelled"
        hinweis: "Kein Jahrgang-Check - Konfi kann sich per API auch für Events fremder Jahrgänge der Org anmelden (nur Hinweis)."
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timeslot_id: { type: integer, description: Pflicht bei Timeslot-Events }
      responses:
        "200": { description: "message, registration_id, status (confirmed|waitlist), timeslot_id" }
        "400": { description: "Anmeldefenster zu, Slot fehlt/voll ohne Warteliste, oder Termin abgesagt" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: "Keine Konfi-Rolle, oder Termin nur für Teamer:innen" }
        "404": { description: Event/Zeitslot nicht gefunden }
        "409": { description: Bereits angemeldet oder bereits ein Konfirmationstermin gebucht }
        "500": { $ref: '#/components/responses/ServerError' }
    delete:
      tags: ["Termine (Konfis)"]
      summary: Von Event abmelden (bis 2 Tage vorher)
      description: >
        Loescht die eigene Buchung (Pflicht-Events nur per Opt-out, 400),
        entfernt die Person aus dem Event-Chat (seit 24.08.2026 — vorher
        blieb sie dort Teilnehmerin; wer nachrueckt, wird umgekehrt
        eingetragen), protokolliert die Abmeldung
        (event_unregistrations, optionaler reason), laesst bei freiem
        bestaetigtem Platz von der Konfi-Warteliste nachruecken und
        benachrichtigt Admins.
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigene Buchung"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: Optionaler Abmeldegrund }
      responses:
        "200": { description: Abmeldung erfolgreich }
        "400": { description: Pflicht-Event, nicht angemeldet oder Frist (2 Tage) verstrichen }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/events/{id}/opt-out:
    post:
      tags: ["Termine (Konfis)"]
      summary: Von Pflicht-Event abmelden (Opt-out mit Begruendung)
      description: >
        Status confirmed -> opted_out. Begruendung min. 5 Zeichen. Nur
        zukuenftige Pflicht-Events. Wiederholbar: Wer bereits abgemeldet ist,
        bekommt 200 mit bereits_abgemeldet=true statt eines Fehlers — ein
        Doppelversand aus der Offline-Warteschlange soll nicht als Fehlschlag
        ankommen (28.08.2026). Der Grund der ersten Abmeldung bleibt stehen.
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigene Buchung; Event org-gescopt"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5 }
      responses:
        "200": { description: "Abmeldung erfolgreich; bereits_abgemeldet=true wenn schon vorher abgemeldet" }
        "400": { description: Begruendung zu kurz, kein Pflicht-Event, Event vorbei oder gar keine Anmeldung vorhanden }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/events/{id}/opt-in:
    post:
      tags: ["Termine (Konfis)"]
      summary: Opt-out bei Pflicht-Event rueckgaengig machen
      description: Status opted_out -> confirmed (Begruendung bleibt gespeichert).
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigene Buchung; Event org-gescopt"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: Wieder angemeldet }
        "400": { description: Kein Pflicht-Event, Event vorbei oder kein Opt-out vorhanden }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/tageslosung:
    get:
      tags: ["Konfi-Profil & Dashboard"]
      summary: Tageslosung in der eigenen Bibeluebersetzung
      description: Mit DB-Cache und mehrstufigem Fallback (letzte gecachte Losung, statischer Vers).
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "liest nur eigene Uebersetzungs-Praeferenz"
      responses:
        "200": { description: "success, data (losung, lehrtext, translation), ggf. fallback: true" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/konfi/bible-translation:
    put:
      tags: ["Konfi-Profil & Dashboard"]
      summary: Bibeluebersetzung für Tageslosung setzen
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC, validateBibleTranslation]
        org-scope: false
        objekt-pruefung: "nur eigenes Profil"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [translation]
              properties:
                translation: { type: string, enum: [LUT, ELB, GNB, BIGS, NIV, LSG, RVR60] }
      responses:
        "200": { description: "success, translation" }
        "400": { description: Ungueltige Uebersetzung }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/konfsprueche:
    get:
      tags: ["Konfi-Profil & Dashboard"]
      summary: Kuratierte Konfsprueche auflisten (org-gefiltert)
      description: Aktive Sprueche (global oder org-eigen) mit allen 4 Uebersetzungen (fehlende als leerer String).
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "keine personenbezogenen Daten"
      responses:
        "200": { description: "Array (id, reference, book, chapter, verse, uebersetzungen{luther2017,bigs,gute_nachricht,elberfelder})" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  # ===================================================================
  # backend/routes/events/ (seit 28.08.2026 aufgeteilt, Prefix /api/events)
  # Schreibende Verwaltungs-Routen: requireTeamer (org_admin, admin, teamer).
  # Lese-/Buchungsrouten: nur rbacVerifier (alle Rollen, inkl. Konfi).
  # ===================================================================
  /api/events:
    get:
      tags: ["Termine (Verwaltung)"]
      summary: Alle Events der Organisation (rollenabhaengig gefiltert)
      description: >
        Liefert Events der aktiven Org mit Zaehlern (Konfi- und Teamer-Kontingent
        getrennt), Kategorien, Jahrgängen, registration_status und eigener
        Buchung (is_registered, booking_status, attendance_status).
        Datumsfenster: letzte 12 Monate + Zukunft (?all=true für alles).
        Nachgelagerte Filter: Teamer mit Jahrgangs-Zuweisungen sehen
        jahrgangs-gebundene Events nur für can_view-Jahrgänge (allgemeine,
        teamer_only- und teamer_needed-Events immer); Konfis sehen keine
        teamer_only-Events.
        NEU 27.08.2026: chat_room_id liefert den Event-Chatraum, aber NUR wenn
        die abrufende Person Teilnehmer des Raums ist (sonst null) — dieselbe
        Regel wie in der Konfi-Liste.
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Teamer: Jahrgangs-Filter (nur wenn Zuweisungen vorhanden); Konfi: teamer_only ausgeblendet"
        hinweis: >
          # BEHOBEN 22.08.2026 (war LÜCKE L1): qr_token wird nicht mehr
          ausgeliefert - weder an Konfis noch an die Leitung. Der Token kommt
          ausschliesslich über POST /api/events/:id/generate-qr, das die
          QR-Anzeige ohnehin nutzt. Vorher lag er in der Liste und war damit
          für jeden Konfi lesbar (Selbst-Checkin aus der Ferne).
          # BEHOBEN 22.08.2026 (war LÜCKE L5): Der Jahrgangs-Filter greift
          jetzt IMMER. Vorher entfiel er ohne jede Zuweisung und die Teamer:in
          sah alle Events der Organisation.
      parameters:
        - name: all
          in: query
          required: false
          schema: { type: string, enum: ["true"] }
          description: "true: gesamte Termin-Historie statt nur letztes Jahr plus Zukunft"
      responses:
        "200": { description: "Array von Events (e.* ohne qr_token, Zaehler, categories[], jahrgaenge[], registration_status, is_registered, booking_status, attendance_status, material_count, pending_bookings_count, chat_room_id)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "500": { $ref: '#/components/responses/ServerError' }
    post:
      tags: ["Termine (Verwaltung)"]
      summary: Event erstellen
      description: >
        Legt ein Event an inkl. Kategorien, Jahrgängen und optionalen
        Timeslots. Serverseitige Zwangsregeln: Pflicht-/Konfirmations-Events
        ohne Punkte und ohne Timeslots; Pflicht-Events ohne Warteliste und mit
        Auto-Enrollment aller Konfis der Jahrgänge; teamer_needed/teamer_only
        schliessen sich aus; checkin_window 5-120 Minuten. Cross-Org-Referenzen
        (jahrgang_ids, category_ids) werden abgewiesen.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer, validateCreateEvent]
        org-scope: true
        objekt-pruefung: "jahrgang_ids/category_ids müssen der eigenen Org gehören"
        hinweis: "Teamer duerfen Events für ALLE Jahrgänge der Org anlegen (kein Jahrgang-Check beim Schreiben)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, event_date]
              properties:
                name: { type: string, maxLength: 200 }
                description: { type: string }
                event_date: { type: string, format: date-time }
                event_end_time: { type: string, format: date-time }
                location: { type: string }
                location_maps_url: { type: string }
                points: { type: integer }
                point_type: { type: string, enum: [gottesdienst, gemeinde], default: gemeinde }
                type: { type: string, default: event }
                max_participants: { type: integer, description: "Konfi-Plaetze; Pflicht ausser bei mandatory/teamer_only" }
                registration_opens_at: { type: string, format: date-time }
                registration_closes_at: { type: string, format: date-time }
                has_timeslots: { type: boolean }
                timeslots: { type: array, items: { type: object, properties: { start_time: { type: string }, end_time: { type: string }, max_participants: { type: integer } } } }
                waitlist_enabled: { type: boolean, default: true }
                max_waitlist_size: { type: integer, default: 10 }
                category_ids: { type: array, items: { type: integer } }
                jahrgang_ids: { type: array, items: { type: integer } }
                mandatory: { type: boolean }
                is_konfirmation: { type: boolean }
                bring_items: { type: string }
                checkin_window: { type: integer, minimum: 5, maximum: 120, default: 30 }
                teamer_needed: { type: boolean }
                teamer_only: { type: boolean }
                teamer_max_participants: { type: integer, description: "0 = unbegrenzt" }
