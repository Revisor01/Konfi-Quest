        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/events/{id}/register:
    post:
      summary: Fuer Event anmelden (primaere Konfi-Buchungsroute)
      description: >
        Transaktional (FOR UPDATE). Prueft Doppelbuchung (409),
        Konfirmations-Sperre (nur EIN Konfirmationstermin, 409),
        Registrierungsfenster, Timeslot-Pflicht und Kapazitaet (Konfi- und
        Teamer-Kontingent getrennt). Ergebnis confirmed oder waitlist.
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "bucht nur sich selbst; Event + Timeslot org-gescopt"
        hinweis: "Kein Jahrgang-Check - Konfi kann sich per API auch fuer Events fremder Jahrgaenge der Org anmelden (nur Hinweis)."
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timeslot_id: { type: integer, description: Pflicht bei Timeslot-Events }
      responses:
        "200": { description: "message, registration_id, status (confirmed|waitlist), timeslot_id" }
        "400": { description: Anmeldefenster zu, Slot fehlt/voll ohne Warteliste }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Event/Zeitslot nicht gefunden }
        "409": { description: Bereits angemeldet oder bereits ein Konfirmationstermin gebucht }
        "500": { $ref: '#/components/responses/ServerError' }
    delete:
      summary: Von Event abmelden (bis 2 Tage vorher)
      description: >
        Loescht die eigene Buchung (Pflicht-Events nur per Opt-out, 400),
        protokolliert die Abmeldung (event_unregistrations, optionaler
        reason), laesst bei freiem bestaetigtem Platz von der
        Konfi-Warteliste nachruecken und benachrichtigt Admins.
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigene Buchung"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: Optionaler Abmeldegrund }
      responses:
        "200": { description: Abmeldung erfolgreich }
        "400": { description: Pflicht-Event, nicht angemeldet oder Frist (2 Tage) verstrichen }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/events/{id}/opt-out:
    post:
      summary: Von Pflicht-Event abmelden (Opt-out mit Begruendung)
      description: Status confirmed -> opted_out. Begruendung min. 5 Zeichen. Nur zukuenftige Pflicht-Events.
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigene Buchung; Event org-gescopt"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5 }
      responses:
        "200": { description: Abmeldung erfolgreich }
        "400": { description: Begruendung zu kurz, kein Pflicht-Event, Event vorbei oder keine aktive Anmeldung }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/events/{id}/opt-in:
    post:
      summary: Opt-out bei Pflicht-Event rueckgaengig machen
      description: Status opted_out -> confirmed (Begruendung bleibt gespeichert).
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigene Buchung; Event org-gescopt"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: Wieder angemeldet }
        "400": { description: Kein Pflicht-Event, Event vorbei oder kein Opt-out vorhanden }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/tageslosung:
    get:
      summary: Tageslosung in der eigenen Bibeluebersetzung
      description: Mit DB-Cache und mehrstufigem Fallback (letzte gecachte Losung, statischer Vers).
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "liest nur eigene Uebersetzungs-Praeferenz"
      responses:
        "200": { description: "success, data (losung, lehrtext, translation), ggf. fallback: true" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/konfi/bible-translation:
    put:
      summary: Bibeluebersetzung fuer Tageslosung setzen
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC, validateBibleTranslation]
        org-scope: false
        objekt-pruefung: "nur eigenes Profil"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [translation]
              properties:
                translation: { type: string, enum: [LUT, ELB, GNB, BIGS, NIV, LSG, RVR60] }
      responses:
        "200": { description: "success, translation" }
        "400": { description: Ungueltige Uebersetzung }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/konfsprueche:
    get:
      summary: Kuratierte Konfsprueche auflisten (org-gefiltert)
      description: Aktive Sprueche (global oder org-eigen) mit allen 4 Uebersetzungen (fehlende als leerer String).
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "keine personenbezogenen Daten"
      responses:
        "200": { description: "Array (id, reference, book, chapter, verse, uebersetzungen{luther2017,bigs,gute_nachricht,elberfelder})" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  # ===================================================================
  # backend/routes/events.js  (Prefix /api/events)
  # Schreibende Verwaltungs-Routen: requireTeamer (org_admin, admin, teamer).
  # Lese-/Buchungsrouten: nur rbacVerifier (alle Rollen, inkl. Konfi).
  # ===================================================================
  /api/events:
    get:
      summary: Alle Events der Organisation (rollenabhaengig gefiltert)
      description: >
        Liefert Events der aktiven Org mit Zaehlern (Konfi- und Teamer-Kontingent
        getrennt), Kategorien, Jahrgaengen, registration_status und eigener
        Buchung (is_registered, booking_status, attendance_status).
        Datumsfenster: letzte 12 Monate + Zukunft (?all=true fuer alles).
        Nachgelagerte Filter: Teamer mit Jahrgangs-Zuweisungen sehen
        jahrgangs-gebundene Events nur fuer can_view-Jahrgaenge (allgemeine,
        teamer_only- und teamer_needed-Events immer); Konfis sehen keine
        teamer_only-Events.
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Teamer: Jahrgangs-Filter (nur wenn Zuweisungen vorhanden); Konfi: teamer_only ausgeblendet"
        hinweis: >
          # LÜCKE L1: Die Response uebernimmt e.* UNGEFILTERT - inklusive
          qr_token. Ein Konfi erhaelt damit den Check-in-Token jedes Events
          und kann sich via POST /api/events/qr-checkin aus der Ferne als
          anwesend eintragen (Punkte!). Der qr_token-Filter existiert nur in
          GET /api/events/:id.
          # LÜCKE L5: Teamer OHNE jede Jahrgangs-Zuweisung wird nicht
          gefiltert und sieht alle Events der Org.
      parameters:
        - name: all
          in: query
          required: false
          schema: { type: string, enum: ["true"] }
      responses:
        "200": { description: "Array von Events (e.* inkl. qr_token, Zaehler, categories[], jahrgaenge[], registration_status, is_registered, booking_status, attendance_status, material_count, pending_bookings_count)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "500": { $ref: '#/components/responses/ServerError' }
    post:
      summary: Event erstellen
      description: >
        Legt ein Event an inkl. Kategorien, Jahrgaengen und optionalen
        Timeslots. Serverseitige Zwangsregeln: Pflicht-/Konfirmations-Events
        ohne Punkte und ohne Timeslots; Pflicht-Events ohne Warteliste und mit
        Auto-Enrollment aller Konfis der Jahrgaenge; teamer_needed/teamer_only
        schliessen sich aus; checkin_window 5-120 Minuten. Cross-Org-Referenzen
        (jahrgang_ids, category_ids) werden abgewiesen.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer, validateCreateEvent]
        org-scope: true
        objekt-pruefung: "jahrgang_ids/category_ids muessen der eigenen Org gehoeren"
        hinweis: "Teamer duerfen Events fuer ALLE Jahrgaenge der Org anlegen (kein Jahrgang-Check beim Schreiben)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, event_date]
              properties:
                name: { type: string, maxLength: 200 }
                description: { type: string }
                event_date: { type: string, format: date-time }
                event_end_time: { type: string, format: date-time }
                location: { type: string }
                location_maps_url: { type: string }
                points: { type: integer }
                point_type: { type: string, enum: [gottesdienst, gemeinde], default: gemeinde }
                type: { type: string, default: event }
                max_participants: { type: integer, description: "Konfi-Plaetze; Pflicht ausser bei mandatory/teamer_only" }
                registration_opens_at: { type: string, format: date-time }
                registration_closes_at: { type: string, format: date-time }
                has_timeslots: { type: boolean }
                timeslots: { type: array, items: { type: object, properties: { start_time: { type: string }, end_time: { type: string }, max_participants: { type: integer } } } }
                waitlist_enabled: { type: boolean, default: true }
                max_waitlist_size: { type: integer, default: 10 }
                category_ids: { type: array, items: { type: integer } }
                jahrgang_ids: { type: array, items: { type: integer } }
                mandatory: { type: boolean }
                is_konfirmation: { type: boolean }
                bring_items: { type: string }
                checkin_window: { type: integer, minimum: 5, maximum: 120, default: 30 }
                teamer_needed: { type: boolean }
                teamer_only: { type: boolean }
                teamer_max_participants: { type: integer, description: "0 = unbegrenzt" }
                teamer_waitlist_enabled: { type: boolean, default: true }
                teamer_max_waitlist_size: { type: integer, default: 10 }
      responses:
        "201": { description: "id + message" }
        "400": { description: Validierungs-/Regel-Fehler (fehlende Felder, fremde IDs, Kontingent ungueltig) }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "409": { description: Unique-Konflikt }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/cancelled:
    get:
      summary: Abgesagte Events auflisten (Leitungssicht)
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "kein Jahrgang-Filter (alle abgesagten Events der Org)"
      responses:
        "200": { description: "Array abgesagter Events (e.*, Zaehler, categories[], jahrgaenge[], registration_status='cancelled')" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/qr-checkin:
    post:
      summary: Selbst-Check-in per QR-Token (vergibt Event-Punkte)
      description: >
        Der eingeloggte User checkt sich mit dem QR-Token des Events ein.
        Prueft Token-Signatur (QR_SECRET) UND Abgleich mit events.qr_token,
        Organisation, Zeitfenster (event_date +/- checkin_window Minuten) und
        bestaetigte Buchung. Setzt attendance_status='present'. Konfis
        erhalten bei points > 0 und nicht-Pflicht-Event die Event-Punkte
        (einmalig, ON CONFLICT DO NOTHING) inkl. Badge-/Level-Check; Teamer
        werden nur als anwesend verbucht.
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigene Buchung (event_bookings des Token-Users); Event-Org muss der aktiven Org entsprechen"
        hinweis: "Punkte-Selbstvergabe-Weg g) der Analyse. Sicherheit haengt an der Geheimhaltung des qr_token - siehe LÜCKE L1 in GET /api/events."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: JWT aus dem QR-Code }
      responses:
        "200": { description: "message, event_name, event_id, points_awarded (bzw. already_checked_in)" }
        "400": { description: "error_type: missing_token | invalid_token | too_early | too_late | not_registered | opted_out | not_confirmed" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: "error_type: wrong_organization" }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/{id}/generate-qr:
    post:
      summary: QR-Token fuer Event erzeugen/abrufen
      description: Gibt vorhandenen qr_token zurueck oder erzeugt einen neuen (HS256, kein Ablauf - Zeitfenster laeuft ueber event_date).
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "Event org-gescopt; kein Jahrgang-Check"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "qr_token" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/{id}/attendance-count:
    get:
      summary: Live-Zaehler eingecheckter Teilnehmer
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "Event org-gescopt; nur Zahlen"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "checked_in, total" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/{id}/timeslots:
    get:
      summary: Zeitslots eines Events (alle Rollen)
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Event org-gescopt; nur Slot-Daten + Zaehler"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "Array von Timeslots (et.*, registered_count, waitlist_count); leer wenn keine Timeslots" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/{id}:
    get:
      summary: Event-Details mit Teilnehmern (rollenabhaengig reduziert)
      description: >
        Volle Event-Details inkl. Timeslots, Serien-Events, Jahrgaengen,
        Kategorien, Zaehlern, eigener Buchung und chat_room_id. Fuer
        Leitungsrollen zusaetzlich: participants[] (Klarname, Jahrgang,
        Timeslot, attendance_status, opt_out_reason/-date) und
        unregistrations[] (Klarname, Grund). Fuer KONFIS werden qr_token
        entfernt sowie participants und unregistrations geleert
        (Fix 22.08.2026) - Konfis nutzen die anonymisierte Route
        /api/konfi/events/:id/participants.
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Event org-gescopt; Konfi-Response ohne qr_token/participants/unregistrations"
        hinweis: "Teamer: KEIN Jahrgang-Check - Teilnehmer-Klarnamen und Opt-out-Gruende aller Org-Events einsehbar (siehe Analyse Punkt 2)."
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "Event-Objekt + participants[], timeslots[], series_events[], jahrgaenge[], categories[], unregistrations[], Zaehler, booking_status, is_registered, chat_room_id" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }
    put:
      summary: Event aktualisieren (inkl. Nachrueck-Logik)
      description: >
        Aktualisiert alle Event-Felder, Kategorien, Jahrgaenge und Timeslots
        (buchungserhaltend). Zwangsregeln wie beim Erstellen. Bei
        Kapazitaetserhoehung ruecken Wartelisten-Eintraege nach (Konfi- und
        Teamer-Kontingent strikt getrennt); Umwandlung in Pflicht-Event loest
        Auto-Enrollment aus; relevante Aenderungen (Termin/Ort) pushen an
        Gebuchte.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer, validateUpdateEvent]
        org-scope: true
        objekt-pruefung: "UPDATE mit organization_id-Bedingung (404 sonst); jahrgang_ids/category_ids org-geprueft"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "Gleiche Felder wie POST /api/events" }
      responses:
        "200": { description: "message, promoted_count, promoted_teamer_count" }
        "400": { description: Validierungs-/Regel-Fehler }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }
    delete:
      summary: Event loeschen (mit force-Bestaetigung)
      description: >
        Loescht Event samt Buchungen, Timeslots, Kategorien, Jahrgangs-
        Zuweisungen und Event-Chat (inkl. Dateien). Ohne ?force=true blockt
        die Route mit 409, wenn Anmeldungen (error_code event_has_bookings)
        oder Chat-Nachrichten (event_has_chat) existieren. Gebuchte Konfis
        werden per Push informiert.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer, validateEventId]
        org-scope: true
        objekt-pruefung: "Event org-gescopt"
      parameters:
        - { $ref: '#/components/parameters/pathId' }
        - name: force
          in: query
          required: false
          schema: { type: string, enum: ["true"] }
      responses:
        "200": { description: Geloescht }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: "error_code: event_has_bookings | event_has_chat (ohne force)" }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/{id}/book:
    post:
      summary: Event selbst buchen (Konfi- oder Teamer-Kontingent)
      description: >
        Aeltere Buchungsroute (Admin-Frontend/Teamer). Konfi-Pfad: wie
        /api/konfi/events/:id/register inkl. Anmeldefenster, Timeslot- und
        Kapazitaets-/Wartelistenlogik sowie Konfirmations-Sperre. Teamer-Pfad:
        eigenes Kontingent (teamer_max_participants, eigene Warteliste), ohne
        Anmeldefenster- und Timeslot-Logik; nur bei teamer_needed/teamer_only.
      x-berechtigung:
        rollen: [konfi, teamer]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "bucht nur sich selbst; Event/Timeslot org-gescopt; Konfis nicht bei teamer_only (403)"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timeslot_id: { type: integer }
      responses:
        "201": { description: "id, message, status (confirmed|waitlist)" }
        "400": { description: Anmeldefenster/Slot/Kapazitaets-Fehler }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: Rolle nicht buchbar bzw. Event nicht fuer diese Rolle }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: Bereits gebucht oder Konfirmations-Sperre }
        "500": { $ref: '#/components/responses/ServerError' }
    delete:
      summary: Eigene Buchung stornieren
      description: >
        Loescht die eigene Buchung transaktional, entfernt den User aus dem
        Event-Chat, nimmt bei attendance_status='present' die Event-Punkte
        zurueck und laesst rollenrichtig aus der passenden Warteliste
        nachruecken (Konfi-Platz nur an Konfis, Teamer-Platz nur an Teamer).
      x-berechtigung:
        rollen: [konfi, teamer]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigene Buchung (user_id + organization_id)"
        hinweis: "Punkte-Entzugs-Weg n) der Analyse. Keine 2-Tage-Frist wie bei /api/konfi/events/:id/register (nur Hinweis)."
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: Storniert }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Buchung nicht gefunden }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/{id}/participants:
    post:
      summary: Teilnehmer manuell hinzufuegen (Leitung)
      description: >
        Fuegt einen User der eigenen Org zum Event hinzu. status='auto'
        entscheidet rollenrichtig (Konfi- vs. Teamer-Kontingent, Timeslot-
        Kapazitaet, Warteliste); explizites status wird uebernommen.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "Event UND Ziel-User muessen zur eigenen Org gehoeren; kein Jahrgang-Check"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer }
                status: { type: string, enum: [auto, confirmed, waitlist], default: auto }
                timeslot_id: { type: [integer, "null"] }
      responses:
        "201": { description: "id, status, timeslot_id, message" }
        "400": { description: Slot fehlt, Event nicht fuer Rolle des Users vorgesehen }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Event/Benutzer/Zeitslot nicht gefunden }
        "409": { description: Bereits angemeldet oder Event+Warteliste voll }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/{id}/bookings/{bookingId}:
    delete:
      summary: Buchung eines Teilnehmers entfernen (Leitung)
      description: >
        Loescht eine fremde Buchung; war der Konfi als anwesend verbucht,
        werden die Event-Punkte zurueckgenommen. Danach rollenrichtiges
        Nachruecken aus der passenden Warteliste.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "User-Org UND Event-Org muessen der eigenen Org entsprechen (403 sonst); kein Jahrgang-Check"
        hinweis: "Punkte-Entzugs-Weg m) der Analyse."
      parameters:
        - { $ref: '#/components/parameters/pathId' }
        - name: bookingId
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: Teilnehmer entfernt }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Buchung nicht gefunden }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/user/bookings:
    get:
      summary: Eigene Buchungen auflisten (Konfi/Teamer)
      x-berechtigung:
        rollen: [konfi, teamer]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigene Buchungen (confirmed/waitlist)"
      responses:
        "200": { description: "Array (eb.*, event_name, event_date, location, mandatory, bring_items)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/series:
    post:
      summary: Event-Serie erstellen (2-26 Termine, max 12 Monate)
      description: >
        Erzeugt eine Serie ("Name #n") mit Intervall day | week | 2weeks |
        month. Gleiche Zwangsregeln und Org-Checks wie POST /api/events,
        inkl. Auto-Enrollment bei Pflicht-Serien.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "jahrgang_ids/category_ids org-geprueft"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, event_date, series_count]
              properties:
                series_count: { type: integer, minimum: 2, maximum: 26 }
                series_interval: { type: string, enum: [day, week, 2weeks, month], default: week }
              description: "Zusaetzlich alle Felder von POST /api/events"
      responses:
        "201": { description: "message, series_id, events_created" }
        "400": { description: Serien-Limits/Validierung verletzt }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/{id}/participants/{participantId}/status:
    put:
      summary: Teilnehmer zwischen bestaetigt und Warteliste verschieben
      description: >
        status confirmed <-> waitlist. Degradierung auf waitlist loescht
        attendance_status und nimmt vergebene Event-Punkte zurueck;
        Befoerderung von der Warteliste pusht an die betroffene Person.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "Buchung muss zu Event der eigenen Org gehoeren (403 sonst); kein Jahrgang-Check"
        hinweis: "Punkte-Entzugs-Weg l) der Analyse."
      parameters:
        - { $ref: '#/components/parameters/pathId' }
        - name: participantId
          in: path
          required: true
          schema: { type: integer, description: "ID der Buchung (event_bookings.id)" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [confirmed, waitlist] }
      responses:
        "200": { description: "message, status" }
        "400": { description: Ungueltiger Status oder Status unveraendert }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Buchung nicht gefunden }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/{id}/participants/attendance-all:
    put:
      summary: Alle unverbuchten Angemeldeten als anwesend verbuchen (Bulk)
      description: >
        Setzt fuer alle bestaetigten Konfis ohne attendance_status 'present'
        und vergibt (bei points > 0, nicht-Pflicht, aktiviertem Punkt-Typ)
        die Event-Punkte inkl. Badge-/Level-Check. Warteliste und bereits
        Verbuchte bleiben unberuehrt.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "Event-Org muss der eigenen Org entsprechen (403); kein Jahrgang-Check"
        hinweis: "Punkte-Vergabe-Weg f) der Analyse."
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "message, confirmed (Anzahl), points_awarded (Anzahl)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/{id}/participants/{participantId}/attendance:
    put:
      summary: Anwesenheit eines Teilnehmers setzen (vergibt/entzieht Punkte)
      description: >
        attendance_status present | absent. present: Konfis erhalten einmalig
        die Event-Punkte (nicht bei Pflicht-Events; 400 bei deaktiviertem
        Punkt-Typ), Teamer nur Anwesenheit. absent: vergebene Event-Punkte
        werden zurueckgenommen.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "Event + Buchung org-gescopt (404 sonst); kein Jahrgang-Check"
        hinweis: "Punkte-Wege e) und k) der Analyse."
      parameters:
        - { $ref: '#/components/parameters/pathId' }
        - name: participantId
          in: path
          required: true
          schema: { type: integer, description: "ID der Buchung (event_bookings.id)" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attendance_status]
              properties:
                attendance_status: { type: string, enum: [present, absent] }
      responses:
        "200": { description: "message, points_awarded / points_removed" }
        "400": { description: Ungueltiger Status oder Punkt-Typ im Jahrgang deaktiviert }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/{id}/chat:
    post:
      summary: Gruppenchat fuer Event erstellen
      description: >
        Legt den Event-Chat an und fuegt Ersteller plus alle bestaetigten
        Teilnehmer (rollenrichtiger user_type) hinzu. Pro Event nur ein Chat.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "Event org-gescopt"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "201": { description: "chat_room_id, message, participants_added" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: Chat existiert bereits }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/{id}/cancel:
    put:
      summary: Event absagen (mit Teilnehmer-Benachrichtigung)
      description: Setzt cancelled=true + cancelled_at und pusht an alle Gebuchten (confirmed + waitlist).
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "Event org-gescopt"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notification_message: { type: string, default: "Das Event wurde abgesagt." }
      responses:
        "200": { description: "message, participants_notified, notification_message" }
        "400": { description: Event bereits abgesagt }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }
