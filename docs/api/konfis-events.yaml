  /api/konfi/requests:
    get:
      tags: ["Aktivitäten & Anträge"]
      summary: Eigene Aktivitaets-Anträge auflisten
      description: >
        Liefert nur Anträge auf Aktivitäten mit target_role='konfi' — bis
        27.08.2026 fehlte dieser Filter (Befund N3, behoben). Anträge zu einer
        inzwischen GELÖSCHTEN Aktivität bleiben bewusst in der Liste (LEFT
        JOIN, activity_name dann leer); der Teamer-Weg lässt sie über einen
        inneren JOIN wegfallen.
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigene Anträge (user_id = Token), nur Aktivitäten mit target_role='konfi'"
      responses:
        "200": { description: "Array von Antraegen (ar.* + activity_name, activity_points, activity_type)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }
    post:
      tags: ["Aktivitäten & Anträge"]
      summary: Neuen Aktivitaets-Antrag einreichen
      description: >
        Legt einen Antrag (status pending) an. Idempotent über optionale
        client_id (UUID): existiert der Antrag bereits, kommt 200 mit dem
        bestehenden Datensatz. Benachrichtigt die gesamte Leitung (Rollen
        admin UND org_admin) per In-App-Mitteilung und Push — bis 26.08.2026
        ging die In-App-Mitteilung nur an admin (Befund M6, behoben).


        Die Aktivität muss target_role='konfi' haben; sonst 404. Bis
        27.08.2026 fehlte diese Prüfung — ein Antrag auf eine
        Teamer-Aktivität wurde angenommen und war von der Leitung
        bestätigbar (Befund N3, behoben).


        Ein mitgeschicktes photo_filename muss genau 64 Hexzeichen lang sein
        (der Name, den POST /api/konfi/upload-photo vergibt); jeder andere
        Wert wird mit 400 "Ungültiger Dateiname" abgewiesen (seit 14.09.2026).
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC, validateCreateRequest]
        org-scope: true
        objekt-pruefung: >
          Aktivität muss zur eigenen Org gehören UND target_role='konfi' sein
          (404 sonst); photo_filename wird gegen ^[a-f0-9]{64}$ geprüft
          (utils/photoStorage.istSichererDateiname), sonst 400.
        hinweis: >
          BEHOBEN 14.09.2026 (Pfad-Traversal): Der Dateiname aus dem Body ging
          ungeprüft in den Pfad der gespeicherten Datei — ein Wert wie
          '../../../../etc/passwd' verließ damit das Upload-Verzeichnis. Zum
          Auslesen genügten Konfi-Rechte: eigener Antrag, Status 'pending',
          Abruf über GET /api/konfi/activity-requests/{id}/photo. Der
          Dateiname wird jetzt hier beim Anlegen und beim Abruf erneut
          geprüft.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activity_id, requested_date]
              properties:
                activity_id: { type: integer }
                requested_date: { type: string, format: date }
                description: { type: string, description: "Kommentar (Spalte comment)" }
                photo_filename:
                  type: string
                  pattern: "^[a-f0-9]{64}$"
                  description: >
                    Dateiname aus POST /api/konfi/upload-photo — genau 64
                    Hexzeichen. Jeder andere Wert wird mit 400 "Ungültiger
                    Dateiname" abgewiesen (seit 14.09.2026).
                client_id: { type: string, format: uuid }
      responses:
        "200": { description: Bereits vorhandener Antrag (Idempotenz ueber client_id) }
        "201": { description: "id + message" }
        "400": { description: "Validierungsfehler; seit 14.09.2026 auch 'Ungültiger Dateiname' bei einem photo_filename ausserhalb von ^[a-f0-9]{64}$" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Aktivitaet nicht gefunden }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/requests/{id}:
    delete:
      tags: ["Aktivitäten & Anträge"]
      summary: Eigenen offenen Antrag löschen
      description: >
        Nur Anträge mit status pending; zugehoeriges Nachweisfoto wird mitgeloescht.
        Seit 25.09.2026 gehen die Postfach-Mitteilungen zum Antrag mit
        ("Antrag eingereicht" bei der Konfi, "Neuer Antrag eingegangen" bei der
