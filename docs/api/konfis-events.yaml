  /api/events/{id}:
    get:
      tags: ["Termine (Verwaltung)"]
      summary: Event-Details mit Teilnehmern (rollenabhaengig reduziert)
      description: >
        Volle Event-Details inkl. Timeslots, Serien-Events, Jahrgängen,
        Kategorien, Zaehlern, eigener Buchung und chat_room_id. Für
        Leitungsrollen zusaetzlich: participants[] (Klarname, Jahrgang,
        Timeslot, attendance_status, opt_out_reason/-date) und
        unregistrations[] (Klarname, Grund). Für KONFIS werden qr_token
        entfernt sowie participants und unregistrations geleert
        (Fix 22.08.2026) - Konfis nutzen die anonymisierte Route
        /api/konfi/events/:id/participants.
        BEHOBEN 25.08.2026 (Befund 2): registered_count/pending_count zählen
        jetzt konfi-rein wie die Liste (vorher inkl. Teamer - Detail konnte
        "Ausgebucht" melden, die Liste "Offen"); Teamer stehen getrennt in
        teamer_count/teamer_waitlist_count.
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Event org-gescopt; Konfi-Response ohne qr_token/participants/unregistrations"
        hinweis: "Teamer: KEIN Jahrgang-Check - Teilnehmer-Klarnamen und Opt-out-Gruende aller Org-Events einsehbar (siehe Analyse Punkt 2)."
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "Event-Objekt + participants[], timeslots[], series_events[], jahrgaenge[], categories[], unregistrations[], Zaehler, booking_status, is_registered, chat_room_id" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }
    put:
      tags: ["Termine (Verwaltung)"]
      summary: Event aktualisieren (inkl. Nachrueck-Logik)
      description: >
        Aktualisiert alle Event-Felder, Kategorien, Jahrgänge und Timeslots
        (buchungserhaltend). Zwangsregeln wie beim Erstellen. Bei
        Kapazitaetserhoehung ruecken Wartelisten-Eintraege nach (Konfi- und
        Teamer-Kontingent strikt getrennt). Bei einem Pflicht-Event läuft das
        Auto-Enrollment bei JEDEM Speichern (idempotent, ON CONFLICT DO
        NOTHING): seit 24.08.2026 werden damit auch die Konfis eines
        nachträglich ergaenzten Jahrgangs gebucht — vorher nur bei der
        Umwandlung freiwillig -> Pflicht. Abgemeldete (opted_out) bleiben
        abgemeldet. Relevante Änderungen (Termin/Ort) pushen an Gebuchte.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer, validateUpdateEvent]
        org-scope: true
        objekt-pruefung: "UPDATE mit organization_id-Bedingung (404 sonst); jahrgang_ids/category_ids org-geprüft"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: "Gleiche Felder wie POST /api/events" }
      responses:
        "200": { description: "message, promoted_count, promoted_teamer_count" }
        "400": { description: Validierungs-/Regel-Fehler }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }
    delete:
      tags: ["Termine (Verwaltung)"]
      summary: Event löschen (mit force-Bestaetigung)
      description: >
        Loescht Event samt Buchungen, Timeslots, Kategorien, Jahrgangs-
        Zuweisungen und Event-Chat (inkl. Dateien). Bereits vergebene
        Event-Punkte werden dabei aus konfi_profiles zurueckgerechnet
        (GREATEST(0, ...), Befund H1, behoben 26.08.2026). Ohne ?force=true
        blockt die Route mit EINEM 409 (error_code event_delete_confirm),
        wenn Anmeldungen, Chat-Nachrichten oder vergebene Punkte existieren —
        mit booking_count, message_count, points_count und points_total fuer
        die Rueckfrage im Frontend (Befund M2/M3, behoben 26.08.2026; vorher
        zwei getrennte 409er event_has_bookings/event_has_chat, die das
        Frontend per pauschalem force=true umging). Gebuchte Konfis werden
        per Push informiert.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer, validateEventId]
        org-scope: true
        objekt-pruefung: "Event org-gescopt"
      parameters:
        - { $ref: '#/components/parameters/pathId' }
        - name: force
          in: query
          required: false
          schema: { type: string, enum: ["true"] }
          description: "true: Termin trotz Anmeldungen/Chat-Nachrichten/vergebener Punkte löschen (sonst 409 mit Zahlen)"
      responses:
        "200": { description: Geloescht }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: "error_code: event_delete_confirm mit booking_count, message_count, points_count, points_total (ohne force)" }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/{id}/book:
    post:
      tags: ["Termine (Verwaltung)"]
      summary: Event selbst buchen (Konfi- oder Teamer-Kontingent)
      description: >
        Aeltere Buchungsroute (Admin-Frontend/Teamer). Konfi-Pfad: wie
        /api/konfi/events/:id/register inkl. Anmeldefenster, Timeslot- und
        Kapazitaets-/Wartelistenlogik sowie Konfirmations-Sperre. Teamer-Pfad:
        eigenes Kontingent (teamer_max_participants, eigene Warteliste), ohne
        Anmeldefenster- und Timeslot-Logik; nur bei teamer_needed/teamer_only.
      x-berechtigung:
        rollen: [konfi, teamer]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "bucht nur sich selbst; Event/Timeslot org-gescopt; Konfis nicht bei teamer_only (403)"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timeslot_id: { type: integer }
      responses:
        "201": { description: "id, message, status (confirmed|waitlist)" }
        "400": { description: Anmeldefenster/Slot/Kapazitaets-Fehler }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: Rolle nicht buchbar bzw. Event nicht fuer diese Rolle }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: Bereits gebucht oder Konfirmations-Sperre }
        "500": { $ref: '#/components/responses/ServerError' }
    delete:
      tags: ["Termine (Verwaltung)"]
      summary: Eigene Buchung stornieren
      description: >
        Loescht die eigene Buchung transaktional, entfernt den User aus dem
        Event-Chat, nimmt bei attendance_status='present' die Event-Punkte
        zurück und laesst rollenrichtig aus der passenden Warteliste
        nachruecken (Konfi-Platz nur an Konfis, Teamer-Platz nur an Teamer).
        Wiederholbar: Ist die Buchung schon weg, der Termin aber vorhanden,
        kommt 200 mit bereits_storniert=true statt 404 — ein Doppelversand aus
        der Offline-Warteschlange soll nicht als Fehlschlag ankommen
        (28.08.2026). Fuer einen Termin, den es nicht gibt, bleibt es bei 404.
      x-berechtigung:
        rollen: [konfi, teamer]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigene Buchung (user_id + organization_id)"
        hinweis: "Punkte-Entzugs-Weg n) der Analyse. Keine 2-Tage-Frist wie bei /api/konfi/events/:id/register (nur Hinweis)."
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "Storniert; bereits_storniert=true wenn keine Buchung mehr vorhanden war" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Termin existiert nicht in dieser Organisation }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/{id}/participants:
    post:
      tags: ["Termine (Verwaltung)"]
      summary: Teilnehmer manuell hinzufuegen (Leitung)
      description: >
        Fuegt einen User der eigenen Org zum Event hinzu. status='auto'
        entscheidet rollenrichtig (Konfi- vs. Team-Kontingent, Timeslot-
        Kapazität, Warteliste); explizites status wird uebernommen.
        Wer hinzugefuegt wird, kommt zugleich in den Chat zum Termin, sofern
        einer existiert — angelegt wird dabei keiner.
        GEAENDERT 31.08.2026: Die Rollenweiche trennt nach Konfi / Nicht-Konfi
        statt nach Teamer / Nicht-Teamer. Damit laesst sich auch die Leitung
        (admin, org_admin) einem Termin zuordnen — bewusst pro Termin, wie eine
        Teamer:in, um in den Chat zum Termin zu kommen. Sie zaehlt gegen das
        TEAM-Kontingent (teamer_max_participants) und belegt keinen Konfi-Platz.
        Vorher wurde eine so uebergebene Leitung als Konfi verbucht: Sie nahm
        einen Konfi-Platz und wurde an teamer_only-Terminen mit 400 abgewiesen.
        Die Antwortform ist unveraendert.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "Event UND Ziel-User müssen zur eigenen Org gehören; kein Jahrgang-Check"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: integer }
                status: { type: string, enum: [auto, confirmed, waitlist], default: auto }
                timeslot_id: { type: [integer, "null"] }
      responses:
        "201": { description: "id, status, timeslot_id, message" }
        "400": { description: Slot fehlt, Event nicht fuer Rolle des Users vorgesehen }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Event/Benutzer/Zeitslot nicht gefunden }
        "409": { description: Bereits angemeldet oder Event+Warteliste voll }
        "500": { $ref: '#/components/responses/ServerError' }

