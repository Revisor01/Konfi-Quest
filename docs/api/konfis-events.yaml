  /api/events/{id}/participants/{participantId}/status:
    put:
      tags: ["Termine (Verwaltung)"]
      summary: Teilnehmer zwischen bestaetigt und Warteliste verschieben
      description: >
        status confirmed <-> waitlist. Degradierung auf waitlist löscht
        attendance_status und nimmt vergebene Event-Punkte zurück;
        Befoerderung von der Warteliste pusht an die betroffene Person.
        BEHOBEN 15.09.2026: Die Degradierung gibt einen bestaetigten Platz
        frei — dort rueckt jetzt die naechste wartende Person derselben
        Kontingent-Seite nach (Push, war_auf_warteliste, Termin-Chat). Die
        gerade Herabgestufte kann sich dabei nicht selbst zurueckholen. Die
        Befoerderung VON HAND setzt jetzt ebenfalls war_auf_warteliste
        (Migration 145) — sie folgt bewusst nicht FIFO, die Leitung waehlt
        die Person aus. An einem abgesagten Termin rueckt niemand nach.


        ABGESAGTE TERMINE seit 16.09.2026: Die Befoerderung auf 'confirmed'
        wird mit 400 "Dieser Termin ist abgesagt" abgelehnt — sie ist eine
        Anmeldung wie jede andere. Der Weg auf die WARTELISTE bleibt offen:
        Das ist keine Anmeldung, sondern das Gegenteil, und der damit
        verbundene Punkteentzug muss auch an einem abgesagten Termin
        moeglich bleiben.


        BEHOBEN 16.09.2026 — KAPAZITAET: Die Befoerderung auf 'confirmed' hatte
        KEINE Kapazitaetspruefung. Solange nichts automatisch nachrueckte, fiel
        das nicht auf; seit dem Nachruecken vom 15.09. buchte der Weg
        "herabstufen, dann wieder bestaetigen" den Termin still ueber (beim
        Herabstufen rueckt Y nach, beim Bestaetigen kommt X ungeprueft dazu).
        Ist das Kontingent voll, antwortet die Route jetzt 400 "Der Termin ist
        voll. Erhöhe die Teilnehmerzahl, um weitere Plätze zu vergeben."
        Gezaehlt wird pro Kontingent-Seite (Konfi/Team) und ggf. pro Zeitfenster,
        ueber denselben Helfer wie das Nachruecken. Ohne Obergrenze (0/NULL)
        aendert sich nichts. Der Weg auf die Warteliste bleibt ungeprueft.
        Bewusstes Ueberbuchen laeuft ueber das Erhoehen der Teilnehmerzahl.


        GEPRUEFT 16.09.2026 — war_auf_warteliste: Die Spalte wird beim
        Bestaetigen nur gesetzt, wenn die Buchung wirklich auf 'waitlist'
        stand. Der Verdacht, sie werde auch bei einer Befoerderung aus
        'excused' gesetzt, hat sich am Code NICHT bestaetigt; ein Test haelt
        das jetzt fest.


        GEPRUEFT 25.09.2026 — Jahrgang der betroffenen Person: BEWUSST NICHT
        geprueft. Der Riegel sitzt beim Eintragen (POST
        /api/events/{id}/participants); wer hier steht, ist bereits
        eingetragen. Der Weg auf die Warteliste ist das Gegenteil einer
        Anmeldung und muss offen bleiben (Punkteentzug). Die Befoerderung
        einer Altbuchung, die vor dem 25.09.2026 oder durch einen spaeteren
        Jahrgangswechsel nicht mehr passt, wuerde sonst dauerhaft haengen —
        weder bestaetigen noch anders aufloesen als durch Loeschen. Der
        Jahrgangswechsel eines Konfis raeumt kuenftige Buchungen fremder
        Jahrgangstermine ohnehin selbst ab (PUT /api/admin/konfis/{id}).
      x-berechtigung:
        rollen: [org_admin, admin]
        x-geaendert: >
          16.09.2026: von requireTeamer auf requireAdmin umgestellt.
          Terminverwaltung ist Leitungssache (Entscheidung Simon);
          Teamer:innen erhalten hier 403 "Keine Berechtigung".
          Unveraendert fuer das Team: POST /{id}/generate-qr,
          GET /{id}/attendance-count, GET /cancelled und die eigene
          Zusage POST /api/teamer/events/{id}/zusage.
        middleware: [verifyTokenRBAC, requireAdmin]
        org-scope: true
        objekt-pruefung: "Buchung muss zu Event der eigenen Org gehören (403 sonst)"
        jahrgangs-bindung: >
          Seit 14.09.2026: darfTermin (can_view-Stufe) — ein Termin aus einem
          fremden Jahrgang wird mit 403 "Kein Zugriff auf diesen Termin"
          abgewiesen. Reine Teamer-Termine (teamer_only) und Termine ohne
          Jahrgangszuordnung bleiben allen Leitungsrollen offen; org_admin und
          super_admin sind ausgenommen.
        hinweis: >
          Punkte-Entzugs-Weg l) der Analyse.
          BEHOBEN 14.09.2026: Vorher kein Jahrgang-Check — die Degradierung
          auf die Warteliste und der damit verbundene Punkteentzug waren an
          jedem Termin der Organisation moeglich.
      parameters:
        - { $ref: '#/components/parameters/pathId' }
        - name: participantId
          in: path
          required: true
          schema: { type: integer, description: "ID der Buchung (event_bookings.id)" }
          description: "ID des Buchungs-Eintrags (event_bookings.id), nicht die User-ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [confirmed, waitlist] }
      responses:
        "200": { description: "message, status" }
        "400": { description: Ungueltiger Status oder Status unveraendert }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: "Fremde Organisation; seit 14.09.2026 auch 'Kein Zugriff auf diesen Termin' bei fremdem Jahrgang" }
        "404": { description: Buchung nicht gefunden }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/{id}/participants/attendance-all:
    put:
      tags: ["Termine (Verwaltung)"]
      summary: Alle unverbuchten Angemeldeten als anwesend verbuchen (Bulk)
      description: >
        Setzt für alle bestaetigten Konfis ohne attendance_status 'present'
        und vergibt (bei points > 0, nicht-Pflicht, aktiviertem Punkt-Typ)
        die Event-Punkte inkl. Badge-/Level-Check. Warteliste und bereits
        Verbuchte bleiben unberuehrt. Abgemeldete (status <> 'confirmed')
        ebenfalls: eine Abmeldung bleibt eine ausdrueckliche Einzelentscheidung
        (PUT .../{participantId}/attendance).
        ADDITIV 13.09.2026 (Migration 148): Jede verbuchte Zeile haelt Urheber
        und Zeitpunkt fest (attendance_set_by = req.user.id, attendance_set_at
        = NOW()) — "Alle verbuchen" ist eine Entscheidung der Leitung, und
        dass es viele auf einmal waren, aendert nichts daran, wer sie getroffen
        hat. Am Request aendert sich nichts.
        ADDITIV 15.09.2026 (Migration 151): Jede verbuchte Zeile haelt
        zusaetzlich checkin_quelle='manuell' und checked_in_at=NOW() fest —
        dieselbe Entscheidung der Leitung, nur ueber den Sammelknopf. Damit
