        letzte 12 Monate + Zukunft (?all=true fuer alles). Enthaelt eigene
        Buchung (booking_status, attendance_status, Timeslot,
        waitlist_position) und Konfi-Zaehler (Teamer-Kontingent getrennt).
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur Events des eigenen Jahrgangs; Konfi ohne Jahrgang -> leere Liste"
