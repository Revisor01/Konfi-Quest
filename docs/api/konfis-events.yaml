      parameters:
        - name: all
          in: query
          required: false
          schema: { type: string, enum: ["true"] }
          description: Gesamte Historie statt 12-Monats-Fenster
      responses:
        "200": { description: "Array von Events (e.*, registered_count, waitlist_count, teamer_count, registration_status, is_registered, can_register, waitlist_position, categories[])" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/events/{id}/status:
