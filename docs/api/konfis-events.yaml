  /api/konfi/events:
    get:
      tags: ["Termine (Konfis)"]
      summary: Events des eigenen Jahrgangs (Konfi-Sicht)
      description: >
        Events, die dem Jahrgang des Konfis zugewiesen sind, ohne teamer_only;
        abgesagte nur, wenn der Konfi gebucht war. Standard-Datumsfenster:
        letzte 12 Monate + Zukunft (?all=true für alles). Enthaelt eigene
        Buchung (booking_status, attendance_status, Timeslot,
        waitlist_position) und Konfi-Zähler (Teamer-Kontingent getrennt).
        BEHOBEN 25.08.2026 (Befund 1): registration_status kennt jetzt wie die
        Admin-Liste den > 0-Guard (max_participants=0 = unbegrenzt, nicht
        'closed') und den Wert 'mandatory' für Pflichttermine.
        ZUSAMMENGELEGT 01.09.2026: registration_status wird nicht mehr je
        Ansicht in SQL wiederholt, sondern in allen drei Listen (diese,
        GET /api/events, GET /api/konfi/events/{id}/status) aus
        utils/terminAnmeldeStatus.js gebildet. Werte und Reihenfolge
        unveraendert ('cancelled' vor 'mandatory' vor 'upcoming'/'closed'
        vor 'open'); die Abweichungen vom 25.08. und 27.08. koennen so nicht
        wieder entstehen.
        NEU 27.08.2026: chat_room_id liefert den Event-Chatraum, aber NUR wenn
        der Konfi selbst Teilnehmer des Raums ist (sonst null). Damit bildet
        der Chat-Einstieg im Termin-Detail genau die Berechtigung ab, die
        darfRaumOeffnen in chat.js durchsetzt.
        NEU 15.09.2026: cancelled_reason und cancelled_by_name kommen additiv
        mit (Migration 150). Der Absagegrund ist ausdruecklich fuer ALLE
        Teilnehmenden bestimmt — die Konfi-Liste ist der Ort, an dem er
        ankommen muss. Beide nullable.
        ADDITIV 16.09.2026: abgemeldet_count (integer) — abgemeldete Konfis,
        Selbstabmeldung und Abmeldung durch die Leitung zusammen, aus
        event_booking_stats. Die Konfi-Sicht trennt die beiden Abmelde-Arten
        bewusst NICHT: Aus ihrer Sicht ist beides dasselbe ("diese Person ist
        nicht dabei"), und wer wen abgemeldet hat, geht sie nichts an. Die
        Ansicht braucht die Zahl fuer abgesagte Termine: Dort stehen alle auf
        'excused', registered_count ist 0 (richtig — niemand nimmt teil), und
        ohne diese Zahl liesse sich nicht erkennen, um wie viele es ging.
        Kein vorhandenes Feld wurde entfernt, umbenannt oder im Typ geaendert.
        BEHOBEN 16.09.2026: registered_count, waitlist_count, teamer_count und
        abgemeldet_count kamen an einem Termin OHNE jede Buchung als null statt
        als 0. Die Zaehler stammen aus einer LATERAL-Unterabfrage auf
        event_booking_stats; diese View entsteht mit GROUP BY ueber
        event_bookings und hat fuer einen leeren Termin keine Zeile. Das
        COALESCE stand INNERHALB der Unterabfrage und wurde deshalb nie
        ausgewertet — es schuetzt vor einer NULL-Spalte, nicht vor einer
        fehlenden Zeile. Jetzt steht es aussen, wie bei
        GET /api/konfi/events/{id}/status. Alle vier Zaehler sind damit
        durchgaengig integer und nie null.
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur Events des eigenen Jahrgangs; Konfi ohne Jahrgang -> leere Liste"
        hinweis: "BEHOBEN 22.08.2026: qr_token wird aus der Response gefiltert (war dieselbe Klasse wie L1 in /api/events)."
      parameters:
        - name: all
          in: query
          required: false
          schema: { type: string, enum: ["true"] }
          description: Gesamte Historie statt 12-Monats-Fenster
      responses:
        "200": { description: "Array von Events (e.*, registered_count, waitlist_count, teamer_count, abgemeldet_count, registration_status, is_registered, can_register, waitlist_position, categories[], chat_room_id). can_register ist seit 26.09.2026 (Audit Screens BF-01) auch fuer eine abgemeldete Buchung wahr (status excused/opted_out), sofern Anmeldefenster offen und Termin nicht abgesagt -- die Abmeldung ist keine Anmeldung, bucheTermin reaktiviert die Zeile. Nur confirmed/waitlist/pending sperren." }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/events/{id}/status:
    get:
      tags: ["Termine (Konfis)"]
      summary: Eigener Anmeldestatus für ein Event
      description: >
        BEHOBEN 25.08.2026 (Befund 1): event_status mit > 0-Guard
        (max_participants=0 = unbegrenzt) und 'mandatory'-Wert wie die
        Admin-Liste; confirmed_count/waitlist_count zählen jetzt konfi-rein
