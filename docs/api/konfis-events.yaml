  /api/events/{id}/cancel:
    put:
      tags: ["Termine (Verwaltung)"]
      summary: Event absagen (mit Teilnehmer-Benachrichtigung)
      description: >
        Setzt cancelled=true + cancelled_at und pusht an alle Gebuchten
        (confirmed + waitlist).

        AUTOMATISCHES ABMELDEN (15.09.2026): In DERSELBEN Transaktion werden
        alle Buchungen mit status IN ('confirmed','waitlist') auf
        attendance_status='excused' gesetzt,
        excuse_reason = der Absagegrund (ohne Grund: der feste Text
        "Termin abgesagt"). Bereits vergebene event_points werden geloescht
        und die Salden in konfi_profiles zurueckgerechnet. Schlaegt das
        Abmelden fehl, faellt auch die Absage zurueck (500).

        GEAENDERT 15.09.2026 (Migration 153) — DER BUCHUNGSSTATUS ZIEHT MIT:
        Dasselbe Mengen-UPDATE setzt jetzt auch status='excused' und
        abgemeldet_durch_absage=TRUE. Bis dahin blieb status auf
        'confirmed'/'waitlist' stehen, begruendet mit dem Alt-App-Vertrag
        (ausgelieferte Fassungen filtern Teilnehmerlisten ueber
        status === 'confirmed'). Der Preis war zu hoch: Am Buchungsstatus
        haengen Erinnerungen, Kapazitaet, Nachruecken und Sortierung — dort
        blieb die Abmeldung unsichtbar, und zwar SERVERSEITIG, wo keine
        App-Fassung sie heilen kann. Nachgemessen stuerzt 2.1.1 an dem neuen
        Wert nicht ab; die Person erscheint dort als "Gebucht".

        abgemeldet_durch_absage=TRUE ist der Unterschied zur EINZELnen
        Abmeldung ueber PUT .../attendance (dort FALSE). Nur Abmeldungen mit
        TRUE werden aufgehoben, wenn die Absage zurueckgenommen wird; wer
        vorher von Hand oder selbst abgemeldet wurde, bleibt abgemeldet.

        ANTWORTFORM UNVERAENDERT: kein Feld entfaellt, keines wird umbenannt,
        keines wechselt den Typ — status traegt einen WERT mehr.

        GEAENDERT 16.09.2026 — AUCH BEREITS VERBUCHTE WERDEN ABGEMELDET
        (Entscheidung Simon: "Auch die auf abgemeldet setzen"). Bis dahin
        stand in der Auswahl zusaetzlich attendance_status IS NULL; wer schon
        auf 'present' oder 'absent' stand, blieb unveraendert. Ein abgesagter
        Termin hat keine Anwesenden -- die Bedingung ist entfallen, present
        und absent fallen mit, und ihre event_points werden ebenfalls
        zurueckgenommen (die Punkte-Abfrage fasst dieselbe Menge, ein
        doppelter Abzug ist damit ausgeschlossen).

        NICHT angetastet wird, wer bereits ABGEMELDET war: status='opted_out'
        (Selbstabmeldung, Teamer-Absage) und status='excused'
        (Einzelabmeldung ueber PUT .../attendance, Migration 153) stehen nicht
        in der Auswahl. Ein eigener excuse_reason ("krank, Mutter hat
        angerufen") wird deshalb NICHT vom Absagegrund ueberschrieben, und
        abgemeldet_durch_absage bleibt dort FALSE.

        attendance_set_by, attendance_set_at, checkin_quelle und
        checked_in_at werden auf NULL gesetzt: Die Absage ist keine
        Anwesenheitsbeurteilung (Begruendung Migration 148/151) und traegt
        deshalb keine Urheberin ein -- sie raeumt die der aufgehobenen
        Verbuchung nur mit ab, damit an einer abgemeldeten Zeile nicht
        "Selbst eingecheckt" stehen bleibt. Wer abgesagt hat, steht in
        events.cancelled_by.

        KEIN BACKFILL: gilt nur fuer Absagen ab dem 15.09.2026, bereits
        abgesagte Termine bleiben unveraendert.

        DER TERMIN BLEIBT BEARBEITBAR: PUT /:id/participants/:pid/attendance
        und /:id/participants/attendance-all funktionieren an einem
        abgesagten Termin unveraendert weiter -- die Leitung kann einzelne
        Personen nachtraeglich auf 'present' setzen und ihnen Punkte
        vergeben.

        ABSAGEGRUND (Migration 150, 15.09.2026): Optional laesst sich
        cancelled_reason mitschicken — Freitext, getrimmt, auf 500 Zeichen
        begrenzt, leer wird zu NULL. Der Grund wird gespeichert
        (events.cancelled_reason), an ALLE Teilnehmenden ausgeliefert und im
        Push-Text sowie unter data.cancelled_reason mitgeschickt. Ohne Grund
        bleibt der Push-Text unveraendert. cancelled_by haelt fest, wer
        abgesagt hat.

        TERMIN-KENNUNG IM PUSH (BEHOBEN 15.09.2026): data.event_id kommt
        additiv dazu. Der Absage-Push war der einzige Termin-Push ohne sie
        (sendEventChangedToKonfis, sendMandatoryEventCreated und
        sendEventRegisteredToKonfi tragen sie seit jeher) — ein Tipp auf die
        Meldung landete deshalb auf der Terminliste statt am Termin, wo der
        Grund ausfuehrlich steht. Alte App-Fassungen lesen den Schluessel
        nicht und verhalten sich unveraendert. Beim LOESCHEN eines Termins
        faellt er weg: Den Termin gibt es dann nicht mehr.

        notification_message bleibt unveraendert bestehen: Das Feld wurde nie
        gespeichert oder verschickt, es kommt nur in der Antwort zurueck.
        Ausgelieferte App-Fassungen schicken es mit — es ist NICHT der
        Absagegrund.
      x-berechtigung:
        rollen: [org_admin, admin]
        x-geaendert: >
          16.09.2026: von requireTeamer auf requireAdmin umgestellt.
          Terminverwaltung ist Leitungssache (Entscheidung Simon);
          Teamer:innen erhalten hier 403 "Keine Berechtigung".
          Unveraendert fuer das Team: POST /{id}/generate-qr,
          GET /{id}/attendance-count, GET /cancelled und die eigene
          Zusage POST /api/teamer/events/{id}/zusage.
        middleware: [verifyTokenRBAC, requireAdmin]
        org-scope: true
        objekt-pruefung: "Event org-gescopt"
        jahrgangs-bindung: >
          Seit 14.09.2026: darfTermin (can_view-Stufe) — ein Termin aus einem
          fremden Jahrgang wird mit 403 "Kein Zugriff auf diesen Termin"
          abgewiesen. Reine Teamer-Termine (teamer_only) und Termine ohne
          Jahrgangszuordnung bleiben allen Leitungsrollen offen; org_admin und
          super_admin sind ausgenommen.
        hinweis: >
          BEHOBEN 14.09.2026: Vorher kein Jahrgang-Check — ein fremder Termin
          liess sich absagen, samt Push an alle Gebuchten.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notification_message:
                  type: string
                  default: "Das Event wurde abgesagt."
                  description: >
                    Echo-Feld, wird NICHT gespeichert und NICHT verschickt —
                    kommt nur in der Antwort zurueck. Ausgelieferte
                    App-Fassungen schicken es mit; es bleibt erhalten.
                cancelled_reason:
                  type: string
                  nullable: true
                  maxLength: 500
                  description: >
                    Freiwilliger Absagegrund (seit 15.09.2026). Wird getrimmt,
                    auf 500 Zeichen gekuerzt, leer wird zu NULL. Sichtbar fuer
                    ALLE Teilnehmenden und im Push.
      responses:
        "200": { description: "message, participants_notified, notification_message, cancelled_reason (seit 15.09.2026, null wenn kein Grund)" }
        "400": { description: "Event bereits abgesagt. BLEIBT SO (15.09.2026): Der Nachtrage-Fall laeuft ueber die eigene Route PUT /{id}/absagegrund, damit sich diese hier fuer ausgelieferte App-Fassungen nicht aendert." }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: "Kein Zugriff auf diesen Termin (seit 14.09.2026, fremder Jahrgang)" }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/{id}/absagegrund:
    put:
      tags: ["Termine (Verwaltung)"]
      summary: Absagegrund eines bereits abgesagten Termins aendern, nachtragen oder loeschen
      description: >
        NEU 15.09.2026 (Migration 152). Setzt events.cancelled_reason an einem
        Termin, der BEREITS abgesagt ist — und schreibt den Text in derselben
        Transaktion an die Buchungen der Abgemeldeten mit.


        BEHOBEN 15.09.2026: Bis dahin schrieb die Route ALLEIN an
        events.cancelled_reason. Die Absage traegt den Grund aber auch als
        event_bookings.excuse_reason bei jeder abgemeldeten Person ein
        (bookingUtils.meldeAlleAbBeiAbsage). Nach einer Korrektur stand am
        Termin der neue Text und in der Teilnehmerliste bei jeder Einzelnen
        weiter der alte — derselbe Sachverhalt an zwei Stellen mit zwei
        Texten.


        NUR WER DURCH DIE ABSAGE ABGEMELDET WURDE: Das UPDATE waehlt ueber
        event_bookings.abgemeldet_durch_absage = TRUE (Migration 153). Ein von
        Hand eingetragener Grund ("krank, Mutter hat angerufen") steht auf
        FALSE und bleibt unberuehrt — er gehoert der Person, nicht dem Termin.
        Wird der Grund geleert, steht bei den Abgemeldeten wieder der feste
        Text 'Termin abgesagt' (ABSAGE_OHNE_GRUND) und nicht NULL, genau wie
        beim Absagen ohne Grund.

        BEHOBEN 15.09.2026: Bis hierher liess sich der Absagegrund nach der
        Absage nicht mehr anfassen — PUT /{id}/cancel lehnt einen bereits
        abgesagten Termin mit 400 ab. Wer beim Absagen in Eile nichts
        eingetragen oder sich vertippt hatte, kam nie wieder heran.

        EIGENE ROUTE STATT ERWEITERUNG VON /cancel: Die 400 dort ist Vertrag.
        Ausgelieferte App-Fassungen verlassen sich darauf, dass ein zweiter
        Aufruf abprallt (Doppeltippen auf wackeligem Netz). Naehme /cancel den
        Fall mit, wuerde aus einem folgenlosen Fehlschlag ein zweiter
        Schreibvorgang — und weil alte Apps kein cancelled_reason schicken,
        waere ein vorhandener Grund nach jedem Doppeltipp weg.

        NORMALISIERUNG wie bei /cancel: getrimmt, auf 500 Zeichen begrenzt,
        leer wird NULL. Ein fehlendes Feld ist dasselbe wie ein leeres — die
        Route SETZT den Grund, sie ergaenzt ihn nicht.

        cancelled, cancelled_at und cancelled_by BLEIBEN UNVERAENDERT: Wer
        abgesagt hat, hat abgesagt; eine spaetere Korrektur am Begleittext
        aendert daran nichts. Festgehalten wird stattdessen
        cancelled_reason_set_by/_at (Migration 152). Beide Lese-Pfade liefern
        zusaetzlich cancelled_reason_set_by_name.

        KEIN PUSH (Entscheidung Simon, 15.09.2026): Die Absage ist schon
        gemeldet. Ein zweiter "Leider abgesagt"-Push wegen eines getauschten
        Buchstabens laese sich wie eine zweite Absage. Das Live-Update
        ('events'/'update', action 'cancelled') geht raus — es aktualisiert
        nur, was ohnehin offen auf dem Bildschirm steht.
      x-berechtigung:
        rollen: [org_admin, admin]
        x-geaendert: >
          16.09.2026: von requireTeamer auf requireAdmin umgestellt.
          Terminverwaltung ist Leitungssache (Entscheidung Simon);
          Teamer:innen erhalten hier 403 "Keine Berechtigung".
          Unveraendert fuer das Team: POST /{id}/generate-qr,
          GET /{id}/attendance-count, GET /cancelled und die eigene
          Zusage POST /api/teamer/events/{id}/zusage.
        middleware: [verifyTokenRBAC, requireAdmin]
        org-scope: true
        objekt-pruefung: "Event org-gescopt; muss cancelled = TRUE sein, sonst 400"
        jahrgangs-bindung: >
          darfTermin (can_view-Stufe) — identisch zur Absage: Wer den Termin
          nicht haette absagen duerfen, aendert auch den Grund nicht. Reine
          Teamer-Termine (teamer_only) und Termine ohne Jahrgangszuordnung
          bleiben allen Leitungsrollen offen; org_admin und super_admin sind
          ausgenommen.
        oberflaeche: >
          BEHOBEN 15.09.2026: Die Rolle 'teamer' stand hier von Anfang an,
          einen Weg dorthin gab es aber nur in der Leitungsansicht. Seither
          zeigt auch die Teamer-Detailansicht den Knopf "Grund nachtragen" /
          "Grund bearbeiten" (TeamerEventsPage). Konfis rufen die Route nicht
          auf — requireTeamer laesst sie nicht durch, und sie bekommen dort
          bewusst keinen Knopf.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cancelled_reason:
                  type: string
                  nullable: true
                  maxLength: 500
                  description: >
                    Der neue Absagegrund. Wird getrimmt, auf 500 Zeichen
                    gekuerzt; leer oder fehlend loescht ihn (NULL). Sichtbar
                    fuer ALLE Teilnehmenden.
      responses:
        "200": { description: "message, cancelled_reason (null wenn geloescht)" }
        "400": { description: "Event ist nicht abgesagt — einen Absagegrund gibt es nur an einem abgesagten Termin" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: "Kein Zugriff auf diesen Termin (fremder Jahrgang oder Konfi-Rolle)" }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/{id}/reaktivieren:
    put:
      tags: ["Termine (Verwaltung)"]
      summary: Eine Absage zuruecknehmen — der Termin findet doch statt
      description: >
        NEU 16.09.2026 (Migration 155). Setzt events.cancelled zurueck und hebt
        in derselben Transaktion GENAU DIE Abmeldungen auf, die aus dieser
        Absage stammen.


        BEHOBEN 16.09.2026: Bis dahin war eine Absage endgueltig. Ist die
        Heizung doch rechtzeitig repariert, blieb nur, den Termin neu
        anzulegen — ohne Angemeldete, ohne Chat, ohne Warteliste, mit neuer
        Kennung; alle mussten sich neu anmelden.


        NUR WER DURCH DIE ABSAGE ABGEMELDET WURDE: Das UPDATE waehlt ueber
        event_bookings.abgemeldet_durch_absage = TRUE (Migration 153). Wer sich
        VOR der Absage selbst abgemeldet hat ('opted_out') oder von der Leitung
        einzeln abgemeldet wurde ('excused' mit abgemeldet_durch_absage =
        FALSE), BLEIBT abgemeldet — samt eigenem Grund. Simons Fall, woertlich:
        "Könnte ja auch sein wir sagen eine Pflicht ab, manche sind
        entschuldigt, dann machen wir es doch. Status bei allen zurück außer
        bei denen."


        WER VOR DER ABSAGE 'present' ODER 'absent' WAR, KOMMT ALS UNVERBUCHT
        ZURUECK (Folge der Entscheidung vom 16.09.2026, dass die Absage auch
        Verbuchte abmeldet): Die Absage hat ihn abgemeldet und seine Punkte
        zurueckgenommen; dieses UPDATE setzt attendance_status auf NULL. Die
        alte Anwesenheit ist damit weg, die Punkte ebenfalls. Gewollt: Der
        Termin steht wieder BEVOR, verbucht wird, wenn er gelaufen ist.


        JEDE PERSON KEHRT AUF IHREN EIGENEN ALTEN STATUS ZURUECK
        (event_bookings.status_vor_absage, Migration 155): 'confirmed' bleibt
        'confirmed', 'waitlist' bleibt 'waitlist'. Die Spalte ist noetig, weil
        meldeAlleAbBeiAbsage beide Gruppen auf 'excused' setzt — danach sind
        sie nicht mehr zu unterscheiden. Alle auf 'confirmed' zurueckzusetzen
        haette die Warteliste aufgeloest und den Termin ueberbucht; alle auf
        'waitlist' haette die Angemeldeten hinten angestellt. Fehlt der Wert
        (Bestandszeilen von vor Migration 155), faellt es auf 'confirmed'
        zurueck. Die Abmelde-Spuren (attendance_status, excuse_reason,
        abgemeldet_durch_absage, status_vor_absage) werden geraeumt: Die
        Abmeldung hat es nicht mehr gegeben.


        PUNKTE KOMMEN NICHT ZURUECK (Entscheidung Simon, 16.09.2026: "Bleiben
        weg, neu vergeben"). Die Absage hat sie zurueckgenommen; der Termin
        steht jetzt wieder BEVOR. Punkte gibt es beim Verbuchen der
        Anwesenheit, wie an jedem anderen Termin.


        ALLE SECHS ABSAGE-FELDER WERDEN GERAEUMT: cancelled, cancelled_at,
        cancelled_by, cancelled_reason, cancelled_reason_set_by,
        cancelled_reason_set_at. Sie beschreiben EINEN Vorgang, und der ist
        aufgehoben. Der Grund einzeln stehen zu lassen haette ihn bei der
        naechsten Absage als Vorbelegung des Formulars zurueckgebracht
        ("Heizung defekt" an einer Absage wegen Sturm).


        KEINE UEBERBUCHUNG MOEGLICH, nachgeprueft: An einem abgesagten Termin
        rueckt niemand nach — promoteFromWaitlist prueft events.cancelled
        zentral und liefert null (bookingUtils, Guard vom 15.09.2026). Alle
        Nachrueck-Wege laufen darueber. Die Plaetze der wiederhergestellten
        Buchungen sind seit der Absage unberuehrt.


        PUSH 'event_reactivated' AN GENAU DIE REAKTIVIERTEN
        (sendEventReactivationToKonfis): "Termin findet doch statt" mit dem
        Hinweis, die eigene Zeit zu pruefen und sich sonst abzumelden. NICHT an
        die dauerhaft Abgemeldeten — "du bist wieder angemeldet" waere fuer sie
        falsch. Der Absagegrund geht NICHT mit: Er beschreibt eine Absage, die
        es nicht mehr gibt. event_id ist dabei, damit der Tipp am Termin landet
        (dort meldet man sich ab). Das Live-Update geht als 'events'/'update'
        mit action 'reactivated' raus.


        EIGENE ROUTE STATT PUT /events/{id}: Dieselbe Begruendung wie bei
        /absagegrund. Das Bearbeiten-Formular schickt den ganzen Termin; hier
        geht es um genau einen Vorgang mit genau einer Wirkung. Ein Feld, das
        eine alte App-Fassung versehentlich mitschicken koennte, haette einen
        Termin unbeabsichtigt wiederbeleben und zwanzig Push-Meldungen
        ausloesen koennen.


        ADDITIV IN DEN LESE-PFADEN: GET /events, GET /events/cancelled und GET
        /events/{id} liefern seit dem 16.09.2026 zusaetzlich
        durch_absage_abgemeldet_count — wie viele beim Zuruecknehmen wieder
        angemeldet wuerden. Die Rueckfrage in der Oberflaeche nennt genau diese
        Zahl. Bewusst NICHT konfi_excused + teamer_excused (Migration 154):
        Die zaehlen auch die einzeln Abgemeldeten, die abgemeldet BLEIBEN —
        die Rueckfrage kuendigte sonst mehr an, als dann passiert. Geloeschte
        Konten zaehlen nicht mit; sie bekommen keinen Push.
      x-berechtigung:
        rollen: [org_admin, admin]
        x-geaendert: >
          16.09.2026: von requireTeamer auf requireAdmin umgestellt.
          Terminverwaltung ist Leitungssache (Entscheidung Simon);
          Teamer:innen erhalten hier 403 "Keine Berechtigung".
          Unveraendert fuer das Team: POST /{id}/generate-qr,
          GET /{id}/attendance-count, GET /cancelled und die eigene
          Zusage POST /api/teamer/events/{id}/zusage.
        middleware: [verifyTokenRBAC, requireAdmin]
        org-scope: true
        objekt-pruefung: "Event org-gescopt; muss cancelled = TRUE sein, sonst 400"
        jahrgangs-bindung: >
          darfTermin (can_view-Stufe) — identisch zur Absage: Wer den Termin
          nicht haette absagen duerfen, nimmt die Absage auch nicht zurueck.
          Es ist derselbe Vorgang, nur andersherum, und er erreicht dieselben
          Leute mit einem Push. Reine Teamer-Termine (teamer_only) und Termine
          ohne Jahrgangszuordnung bleiben allen Leitungsrollen offen; org_admin
          und super_admin sind ausgenommen.
        oberflaeche: >
          Leitung und Team gleichermassen: der Knopf "Absage zurücknehmen" im
          Absage-Kasten beider Detailansichten (AbsageBlock) und zusaetzlich
          der Wisch in der Leitungs-Terminliste. Konfis bekommen ihn nicht —
          requireTeamer laesst sie nicht durch.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "message, reaktiviert (Anzahl wiederhergestellter Buchungen), participants_notified" }
        "400": { description: "Event ist nicht abgesagt — zurueckzunehmen gibt es dann nichts" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: "Kein Zugriff auf diesen Termin (fremder Jahrgang oder Konfi-Rolle)" }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  # ===================================================================
  # backend/routes/activities.js  (Prefix /api/admin/activities)
  # Masterliste der Aktivitäten + Antragsverwaltung.
  # Lesen der Masterliste und Direktvergabe: requireTeamer.
  # Anlegen/Aendern/Loeschen und Antragsentscheidung: requireAdmin.
  # Die beiden Foto-Routen haben KEINE Rollen-Middleware, sondern einen
  # Inline-Check auf role_name in ['admin','org_admin'] — Teamer:innen sind
  # dort also ausgeschlossen.
  # ===================================================================
  /api/admin/activities:
    get:
      tags: ["Aktivitäten & Anträge"]
      summary: Masterliste aller Aktivitäten der eigenen Organisation
      description: >
        Liefert alle Aktivitäten der aktiven Organisation samt zugeordneten
        Kategorien. Optionaler Query-Parameter target_role filtert auf
        Konfi- bzw. Teamer-Aktivitäten.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "WHERE a.organization_id = req.user.organization_id"
        hinweis: >
          super_admin fällt durch requireTeamer auf 403, außer er agiert per
          Multi-Org-Switch als org_admin/admin/teamer.
      parameters:
        - name: target_role
          in: query
          required: false
          schema: { type: string, enum: [konfi, teamer] }
          description: "Filter nach Zielgruppe: konfi oder teamer"
      responses:
        "200": { description: "Array von Aktivitaeten (id, name, points, type, target_role, categories)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }
    post:
      tags: ["Aktivitäten & Anträge"]
      summary: Neue Aktivität anlegen
      description: >
        Legt eine Aktivität in der aktiven Organisation an. Bei
        target_role=teamer sind points und type optional, sonst Pflicht.
        Uebergebene category_ids werden zugeordnet.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateCreateActivity]
        org-scope: true
        objekt-pruefung: "organization_id wird aus dem Token gesetzt, nicht aus dem Body"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                points: { type: integer }
                type: { type: string, enum: [gottesdienst, gemeinde] }
                target_role: { type: string, enum: [konfi, teamer], default: konfi }
                category_ids: { type: array, items: { type: integer } }
      responses:
        "201": { description: Angelegte Aktivitaet }
        "400": { description: Pflichtfelder fehlen oder Validierung fehlgeschlagen }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/activities/{id}:
    put:
      tags: ["Aktivitäten & Anträge"]
      summary: Aktivität ändern
      description: >
        Aendert Name, Punkte, Typ, Zielrolle und Kategorien einer Aktivität
        der eigenen Organisation.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateUpdateActivity]
        org-scope: true
        objekt-pruefung: "Aktivität muss zur eigenen Organisation gehören"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                points: { type: integer }
                type: { type: string }
                target_role: { type: string, enum: [konfi, teamer] }
                category_ids: { type: array, items: { type: integer } }
      responses:
        "200": { description: Aktualisierte Aktivitaet }
        "400": { description: Pflichtfelder fehlen }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }
    delete:
      tags: ["Aktivitäten & Anträge"]
      summary: Aktivität löschen (nur ohne Zuordnungen)
      description: >
        Loescht eine Aktivität. Existieren bereits Zuordnungen zu Konfis
        (user_activities), wird mit 409 abgelehnt. Anträge werden nach
        Gewicht unterschieden aufgeraeumt bzw. blockieren das Löschen.
        Seit 25.09.2026 gehen mit den abgelehnten Anträgen auch deren
        Zustands-Mitteilungen im Postfach ("Neuer Antrag eingegangen",
        "Antrag eingereicht"); die Ablehnungen selbst bleiben als Verlauf
        (utils/postfachAufraeumen.js).
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateDeleteActivity]
        org-scope: true
        objekt-pruefung: "Zuordnungspruefung über JOIN activities mit organization_id"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "Aktivitaet geloescht" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: Aktivitaet ist Konfis zugeordnet oder hat gewichtige Antraege }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/activities/requests:
    get:
      tags: ["Aktivitäten & Anträge"]
      summary: Alle Anträge der Organisation
      description: >
        Liefert die Aktivitaetsantraege der aktiven Organisation samt
        Konfi-Name, Aktivitaetsdaten und genehmigender Person. Ohne Filter
        alle, mit ?status= nur die des angegebenen Status.
        BEHOBEN 2026-08-28: ?status= wurde vorher stillschweigend verworfen —
        die Route lieferte immer alles.
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, approved, rejected] }
          description: Optionaler Filter. Ein unbekannter Wert ergibt 400.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin]
        org-scope: true
        objekt-pruefung: "WHERE a.organization_id = req.user.organization_id"
        hinweis: >
          GEAENDERT 2026-08-31: Jahrgangs-Filter fuer die Rolle admin.
          org_admin/super_admin sehen weiterhin die Anträge ALLER Jahrgänge;
          ein admin sieht nur die aus seinen can_view-Jahrgängen, ein admin
          ohne Zuweisung ein leeres Array (kein 403 — die Antwort bleibt in
          jedem Fall ein Array). Anträge zu Teamer-Aktivitäten
          (target_role='teamer') bleiben fuer jeden Admin sichtbar, weil
          Teamer:innen keinen Jahrgang haben und ein Admin sie alle sieht.
          Teamer:innen haben hier keinen Zugriff (dafuer gibt es
          GET /api/teamer/requests).
          GEAENDERT 2026-09-01: Fehlt dem admin die Jahrgangs-Zuweisung,
          traegt die Antwort zusaetzlich den Header
          X-Kein-Jahrgang-Zugewiesen: true (additiv; die Antwortform bleibt
          ein Array, Teamer-Antraege sind weiterhin enthalten). Die
          Oberflaeche erklaert damit, warum keine Konfi-Antraege kommen.
      responses:
        "200":
          description: "Array von Antraegen (ar.* + konfi_name, activity_name, activity_points, activity_type, activity_target_role, approved_by_name)"
          headers:
            X-Kein-Jahrgang-Zugewiesen:
              schema: { type: string, enum: ["true"] }
              description: >
                Nur gesetzt, wenn dem aufrufenden admin kein Jahrgang
                zugewiesen ist und Konfi-Antraege deshalb ausgeblendet sind
                (gueltiger Fall, Entscheidung 2026-08-31). Fehlt bei
                org_admin und bei einer Liste, die aus anderem Grund leer ist.
        "400": { description: "Unbekannter Wert fuer ?status=" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/activities/requests/{id}:
    put:
      tags: ["Aktivitäten & Anträge"]
      summary: Antrag genehmigen oder ablehnen
      description: >
        Setzt den Status eines ausstehenden Antrags auf approved oder
        rejected. Bei approved werden die Punkte gutgeschrieben und Badges
        geprüft. Bereits entschiedene Anträge werden mit 400 abgelehnt.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateRequestUpdate]
        org-scope: true
        objekt-pruefung: >
          Antrag über JOIN activities auf die eigene Organisation eingegrenzt;
          nur status=pending aenderbar.
          JAHRGANGS-BINDUNG seit 2026-08-31: Die Rolle admin darf dies nur fuer Konfis ihrer can_view-Jahrgaenge (403 "Kein Zugriff auf diesen Konfi"); org_admin/super_admin sind ausgenommen. Antraege zu Teamer-Aktivitaeten (target_role='teamer') sind ausgenommen.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, rejected] }
                admin_comment: { type: string }
      responses:
        "200": { description: Antrag entschieden }
        "400": { description: Ungueltiger Status oder Antrag nicht mehr ausstehend }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }
    delete:
      tags: ["Aktivitäten & Anträge"]
      summary: Abgelehnten Antrag endgueltig löschen
      description: >
        Entfernt einen abgelehnten Antrag samt Nachweisfoto. Seit 25.09.2026
        gehen die Zustands-Mitteilungen im Postfach mit ("Neuer Antrag
        eingegangen", "Antrag eingereicht"); die Entscheidung "Antrag
        abgelehnt" bleibt der Konfi als Verlauf erhalten
        (utils/postfachAufraeumen.js). Offene Anträge
        (409) und genehmigte Anträge (409) sind bewusst geschuetzt:
        offene werden entschieden, genehmigte zuerst zurückgesetzt.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, param-id-Validierung]
        org-scope: true
        objekt-pruefung: >
          Antrag über JOIN activities org-gescopt; nur status=rejected
          loeschbar.
          JAHRGANGS-BINDUNG seit 2026-08-31: Die Rolle admin darf dies nur fuer Konfis ihrer can_view-Jahrgaenge (403 "Kein Zugriff auf diesen Konfi"); org_admin/super_admin sind ausgenommen. Antraege zu Teamer-Aktivitaeten (target_role='teamer') sind ausgenommen.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "Antrag geloescht" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: Antrag ist offen oder bereits genehmigt }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/activities/requests/{id}/reset:
    put:
      tags: ["Aktivitäten & Anträge"]
      summary: Entschiedenen Antrag auf ausstehend zuruecksetzen
      description: >
        Setzt einen genehmigten oder abgelehnten Antrag zurück auf pending.
        Bei zuvor genehmigten Anträgen werden die gutgeschriebenen Punkte
        wieder abgezogen.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, param-id-Validierung]
        org-scope: true
        objekt-pruefung: >
          Antrag über JOIN activities org-gescopt; bereits ausstehende Anträge
          ergeben 400.
          JAHRGANGS-BINDUNG seit 2026-08-31: Die Rolle admin darf dies nur fuer Konfis ihrer can_view-Jahrgaenge (403 "Kein Zugriff auf diesen Konfi"); org_admin/super_admin sind ausgenommen. Antraege zu Teamer-Aktivitaeten (target_role='teamer') sind ausgenommen.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "Antrag zurueckgesetzt, Punkte ggf. abgezogen" }
        "400": { description: Antrag ist bereits ausstehend }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/activities/requests/{id}/photo:
    get:
      tags: ["Aktivitäten & Anträge"]
      summary: Nachweisfoto eines Antrags abrufen
      description: >
        Liefert das (verschlüsselt gespeicherte) Nachweisfoto entschluesselt
        als image/jpeg aus, unabhaengig vom Status des Antrags.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: >
          Inline-Rollencheck role_name in ['admin','org_admin']; danach
          Vergleich der organization_id des antragstellenden Users mit der
          eigenen.
          JAHRGANGS-BINDUNG seit 2026-08-31: Die Rolle admin darf dies nur fuer Konfis ihrer can_view-Jahrgaenge (403 "Kein Zugriff auf diesen Konfi"); org_admin/super_admin sind ausgenommen. Antraege zu Teamer-Aktivitaeten (target_role='teamer') sind ausgenommen.
        hinweis: >
          Bewusst KEIN requireAdmin, sondern ein Inline-Check — die Wirkung ist
          dieselbe Rollenmenge. Teamer:innen erhalten 403.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200":
          description: Foto
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Antrag, Foto-Eintrag oder Datei nicht gefunden }
        "500": { description: Foto konnte nicht entschluesselt werden }
    delete:
      tags: ["Aktivitäten & Anträge"]
      summary: Nachweisfoto eines Antrags löschen
      description: >
        Setzt photo_filename auf NULL und entfernt die Datei. Der Antrag
        selbst bleibt erhalten.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: >
          Inline-Rollencheck role_name in ['admin','org_admin']; danach
          Org-Vergleich über den antragstellenden User.
          JAHRGANGS-BINDUNG seit 2026-08-31: Die Rolle admin darf dies nur fuer Konfis ihrer can_view-Jahrgaenge (403 "Kein Zugriff auf diesen Konfi"); org_admin/super_admin sind ausgenommen. Antraege zu Teamer-Aktivitaeten (target_role='teamer') sind ausgenommen.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "Foto geloescht" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Antrag nicht gefunden oder kein Foto vorhanden }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/activities/assign-activity:
    post:
      tags: ["Aktivitäten & Anträge"]
      summary: Aktivität direkt einem Konfi zuweisen
      description: >
        Vergibt eine Aktivität ohne Antragsweg. Punkte werden gutgeschrieben
        und die Badge-Prüfung ausgelöst.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer, validateAssignActivity]
        org-scope: true
        objekt-pruefung: >
          Aktivität UND Ziel-User müssen zur eigenen Organisation gehören
          (Org-Prüfung des Ziel-Users ergaenzt 22.08.2026). Zusaetzlich muss
          der Jahrgang des Konfis in assigned_jahrgaenge mit can_view liegen —
          fuer Teamer:innen und, seit 2026-08-31, auch fuer die Rolle admin
          (403 "Kein Zugriff auf diesen Konfi"). org_admin/super_admin sind
          ausgenommen. Bei Aktivitäten mit target_role='teamer' entfaellt die
          Jahrgangs-Pruefung, weil die Zielperson keine Konfi ist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [konfiId, activityId]
              properties:
                konfiId: { type: integer }
                activityId: { type: integer }
                completed_date: { type: string, format: date }
      responses:
        "200": { description: "Aktivitaet zugewiesen, Punkte gutgeschrieben" }
        "400": { description: Pflichtfelder fehlen }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Aktivitaet oder Konfi nicht gefunden }
        "500": { $ref: '#/components/responses/ServerError' }

  # ===================================================================
  # backend/routes/konfi-management.js  (Prefix /api/admin/konfis)
  # Verwaltung der Konfis durch Leitung und Teamer:innen.
  # Lesen: requireTeamer. Anlegen/Aendern/Loeschen und Punktekorrekturen:
  # requireAdmin. Bonuspunkte VERGEBEN duerfen auch Teamer:innen,
  # ZURUECKNEHMEN nur org_admin/admin.
  #
  # JAHRGANGS-FILTER: Die Liste GET /api/admin/konfis filtert für
  # Teamer:innen (und admin) auf assigned_jahrgaenge mit can_view.
  # BEHOBEN 31.08.2026: Die SCHREIBWEGE POST /api/admin/konfis und
  # PUT /api/admin/konfis/{id} sind seither ebenfalls an die Jahrgaenge des
  # Aufrufers gebunden (can_edit) — vorher prüften sie nur die
  # organization_id, ein admin konnte also Konfis in Jahrgaenge anlegen und
  # verschieben, die er anschliessend nicht mehr sah. org_admin und
  # super_admin bleiben ausgenommen. Die lesenden Detail-Routen mit :id
  # prüfen weiterhin nur die organization_id.
  # ===================================================================
  /api/admin/konfis:
    get:
      tags: ["Konfis (Verwaltung)"]
      summary: Liste der Konfis (für Teamer:innen auf eigene Jahrgänge gefiltert)
      description: >
        Liefert die Konfis der aktiven Organisation mit Punkten, Jahrgang und
        Zaehlern. Für alle außer super_admin und org_admin wird auf die
        Jahrgänge aus assigned_jahrgaenge mit can_view eingeschraenkt.
        Geloeschte Konfis (deleted_at) sind ausgeschlossen.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "u.organization_id = Token-Org; zusaetzlich Jahrgangs-Filter für alle außer is_super_admin/org_admin"
      responses:
        "200":
          description: "Array von Konfis (id, name, username, Punkte, Jahrgang, badge_count, activity_count)"
          headers:
            # NACHDOKUMENTIERT 2026-09-01: Der Header existiert seit dem
            # 26.08.2026 im Code, fehlte hier aber.
            X-Kein-Jahrgang-Zugewiesen:
              schema: { type: string, enum: ["true"] }
              description: >
                Nur gesetzt, wenn die leere Liste daher ruehrt, dass dem
                aufrufenden admin/teamer kein Jahrgang zugewiesen ist
                (gueltiger Fall). Fehlt bei org_admin/super_admin und bei
                einer Liste, die aus anderem Grund leer ist.
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }
    post:
      tags: ["Konfis (Verwaltung)"]
      summary: Neuen Konfi anlegen
      description: >
        Legt User + konfi_profiles an, erzeugt Username und Startpasswort,
        hängt den Konfi an den Jahrgangs-Chat und bucht ihn in kuenftige
        Pflicht-Events des Jahrgangs ein. Das Konfi-Limit der Organisation
        wird geprüft.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateCreateKonfi]
        org-scope: true
        objekt-pruefung: >
          jahrgang_id muss zur eigenen Organisation gehören; seit 31.08.2026
          zusaetzlich zu den Jahrgaengen des Aufrufers (assigned_jahrgaenge
          mit can_edit) — sonst 403. org_admin und super_admin ausgenommen.
          Rolle konfi wird org-spezifisch aufgeloest; Limitpruefung über
          checkKonfiLimit
        hinweis: >
          Teamer:innen können keine Konfis anlegen (requireAdmin).
          BEHOBEN 31.08.2026: Vorher prüfte die Route nur die Organisation.
          Ein admin konnte damit Konfis in jeden Jahrgang der Gemeinde
          anlegen — und sah sie danach nicht mehr, weil die Liste sie
          ausblendet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, jahrgang_id]
              properties:
                name: { type: string }
                jahrgang_id: { type: integer }
                confirm: { type: boolean, description: Bestaetigung beim Ueberschreiten weicher Grenzen }
      responses:
        "201": { description: "Angelegter Konfi inkl. Startpasswort" }
        "400": { description: Validierung fehlgeschlagen }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Jahrgang oder Rolle nicht gefunden }
        "409": { description: Konfi-Limit der Organisation erreicht }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/teamer:
    get:
      tags: ["Konfis (Verwaltung)"]
      summary: Liste der Teamer:innen der Organisation
      description: >
        Liefert alle User mit Rolle teamer der aktiven Organisation samt
        Jahrgangsnamen, Abzeichen- und Zertifikatszaehler.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "WHERE r.name = 'teamer' AND u.organization_id = Token-Org"
        hinweis: >
          Kein Jahrgangs-Filter: Teamer:innen sehen hier alle Kolleg:innen der
          Organisation, auch aus fremden Jahrgängen. Es werden keine
          Login-Daten außer dem username ausgeliefert.
      responses:
        "200": { description: "Array (id, name, username, teamer_since, jahrgang_name, jahrgang_ids, badge_count, cert_count). ADDITIV 25.09.2026: jahrgang_ids (integer[], leer ohne Zuweisung) — die Teilnehmerauswahl am Termin bietet nur Personen aus den Jahrgaengen des Termins an und braucht die IDs statt der zusammengefuegten Namen." }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/leitung:
    get:
      tags: ["Konfis (Verwaltung)"]
      summary: Liste der Leitung (Admins/Org-Admins) der Organisation
      description: >
        Liefert alle User mit Rolle admin oder org_admin der aktiven
        Organisation. Zweck ist die Auswahl beim Zuordnen der Leitung zu einem
        Termin (POST /api/events/{id}/participants) — wer zugeordnet ist, kommt
        in den Chat zum Termin. Neu am 31.08.2026.
        Eigene Route statt eines Filters an /konfis/teamer: Deren Antwortform
        ist ein Vertrag der ausgelieferten Apps und bleibt unveraendert.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "WHERE r.name IN ('admin','org_admin') AND u.organization_id = Token-Org AND deleted_at IS NULL"
        hinweis: >
          Kein Jahrgangs-Filter (wie bei /konfis/teamer). Es werden keine
          Login-Daten ausser dem username ausgeliefert. Super-Admins ohne
          org_admin-Rolle stehen nicht in der Liste.
      responses:
        "200": { description: "Array (id, name, username, role_name, is_super_admin, jahrgang_ids). ADDITIV 25.09.2026: is_super_admin (boolean) und jahrgang_ids (integer[]) — die Teilnehmerauswahl am Termin zeigt Leitung mit Rolle admin nur bei gemeinsamem Jahrgang; org_admin und das Flag sind ausgenommen." }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/{id}:
    get:
      tags: ["Konfis (Verwaltung)"]
      summary: Einzelner Konfi oder Teamer mit voller Historie
      description: >
        Detailansicht: Stammdaten, Punkte, Aktivitäten, Bonuspunkte, Events,
        Abzeichen, Challenge-Stempel und aufgeloester Konfispruch. Für
        Teamer:innen als Zielobjekt zusaetzlich Zertifikate und
        Teamer-Historie.
        Seit 13.09.2026 liefert die Antwort zusaetzlich `challengeMarks`: die
        Challenges, zu denen die angesehene Person einen EIGENEN und
        FREIGEGEBENEN Beitrag hat (moderation_status='approved'), je Challenge
        genau einmal. Dieselbe Zaehlung wie GET /api/challenges/konfi (Feld
        `marks`). Rein additiv — kein bestehendes Feld faellt weg oder aendert
        seinen Typ.
        ERGAENZT 14.09.2026, ebenfalls additiv: Jeder Eintrag in
        `challengeMarks` traegt zusaetzlich `earned_at` (Zeitpunkt der
        Verleihung: der FRUEHESTE freigegebene eigene Beitrag, Rueckfall auf
        created_at bei Bestandszeilen vor Migration 146) und `description`
        (Challenge-Text) fuers Stempel-Popover. Daneben steht das neue Feld
        `offeneStempel`: die Challenges des Jahrgangs der angesehenen Person,
        die einen Stempel vergeben, zu denen sie aber KEINEN freigegebenen
        Beitrag hat — in der Oberflaeche grau. Laufende und abgelaufene,
        unterschieden ueber `status` (active|ended). Ohne Jahrgang
        (Teamer:innen haben keinen in konfi_profiles) bleibt die Liste leer
        statt org-weit zu werden. BEWUSST EIN EIGENES FELD statt eines
        Merkers in `challengeMarks`: die ausgelieferten Apps zeichnen jeden
        Eintrag daraus als erhaltenen Stempel.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "WHERE u.id = :id AND u.organization_id = Token-Org AND r.name IN ('konfi','teamer') AND deleted_at IS NULL"
        jahrgangs-bindung: >
          Die GANZE Route (seit 13.09.2026): Steht die angesehene Person in
          einem Jahrgang ausserhalb der eigenen Zuweisungen, antwortet die
          Route mit 403 (darfKonfi, view-Stufe). org_admin und super_admin
          sind ausgenommen. Teamer:innen als Zielobjekt sind nicht an einen
          Jahrgang gebunden ("admin sieht alle Teamer:innen"), ihr Profil
          bleibt fuer die ganze Leitung erreichbar. Gleiche Stufe wie die
          Schwesterroute GET /:id/event-points, die dieselben Daten zeigt.
        hinweis: >
          BEHOBEN 13.09.2026: Bis dahin hatte die uebrige Route KEINEN
          Jahrgangs-Check — eine Teamer:in konnte ueber eine direkt geratene
          ID das vollstaendige Profil samt Punktehistorie jedes Konfis der
          Organisation abrufen, auch aus Jahrgaengen ohne Zuweisung. Nur das
          am selben Tag ergaenzte Feld `challengeMarks` war gebunden; seit der
          Bindung am Kopf der Route braucht es dort keine eigene Pruefung mehr.
          Die Oberflaeche war nicht betroffen: Die Detailansicht haengt allein
          im Admin-Rollenbaum, und die ID stammt dort aus der bereits
          gefilterten Liste GET /api/admin/konfis (nachgemessen 13.09.2026).
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: Konfi-/Teamer-Detaildaten }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }
    put:
      tags: ["Konfis (Verwaltung)"]
      summary: Konfi ändern (Name, Jahrgang)
      description: >
        Aendert Anzeigename und/oder Jahrgang. Bei Jahrgangswechsel wird die
        Chat-Mitgliedschaft synchronisiert und der Konfi in kuenftige
        Pflicht-Events des neuen Jahrgangs eingebucht. Seit 24.08.2026 werden
        dabei auch die kuenftigen Pflicht-Events des ALTEN Jahrgangs
        ausgetragen — nur solange keine Anwesenheit erfasst ist und der Termin
        nicht auch zum neuen Jahrgang gehört. Vergangene Termine und erfasste
        Anwesenheiten bleiben unberuehrt.
        BEHOBEN 27.08.2026 (Mandantenluecke): Der Ziel-Jahrgang wird jetzt
        gegen die eigene Organisation geprueft. Vorher tat das nur der POST;
        gemessen antwortete der PUT mit 200 und schrieb die Konfi in den
        Jahrgang einer FREMDEN Organisation. Ueber die App war das nicht
        erreichbar (kein Aufrufer im Frontend), die Route stand aber offen.
        BEHOBEN 15.09.2026: Die ausgetragenen bestaetigten Buchungen geben
        Plaetze frei — dort rueckt jetzt die naechste wartende Konfi nach
        (Push, war_auf_warteliste, Termin-Chat). Der Kommentar im Code nannte
        den "Geisterplatz, auf den niemand nachruecken konnte" schon als
        geloest; geloest war aber nur das Liegenbleiben der Buchung.
        Ausgetragene Wartelisten-Buchungen loesen nichts aus, an abgesagten
        Terminen rueckt niemand nach.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateUpdateKonfi]
        org-scope: true
        objekt-pruefung: >
          UPDATE ... WHERE id = :id AND organization_id = Token-Org;
          zusaetzlich seit 27.08.2026 der ZIEL-JAHRGANG gegen dieselbe
          Organisation (400 bei fremdem oder unbekanntem Jahrgang);
          BEHOBEN 31.08.2026: fuer admin muessen QUELL- UND ZIEL-Jahrgang in
          seinen eigenen Zuweisungen liegen (can_edit), sonst 403. org_admin
          und super_admin ausgenommen"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                jahrgang_id: { type: integer }
      responses:
        "200": { description: Konfi aktualisiert }
        "400": { description: Validierung fehlgeschlagen }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }
    delete:
      tags: ["Konfis (Verwaltung)"]
      summary: Konfi löschen (inkl. abhaengiger Daten)
      description: >
        Loescht den Konfi und die daran haengenden Daten über
        deleteKonfiCascade (Aktivitäten, Bonuspunkte, Buchungen, Anträge,
        Chat-Mitgliedschaften, seit 24.08.2026 auch erhaltene Urkunden —
        deren Fremdschlüssel blockierte das Löschen vorher mit 500).
        Dieselbe Funktion trägt die Selbstloeschung über
        POST /auth/delete-account, dort für jede Rolle.
        BEHOBEN 15.09.2026: deleteKonfiCascade sammelt die bestaetigten
        Buchungen VOR dem Loeschen ein und laesst auf jeden frei gewordenen
        Platz die naechste wartende Person nachruecken — Kontingent-Seite
        nach der Rolle der geloeschten Person, damit ein Team-Platz nie an
        eine wartende Konfi geht. Die Funktion liefert die Nachgerueckten
        zurueck, der Push geht nach dem COMMIT raus. An abgesagten Terminen
        rueckt niemand nach.
        Seit 25.09.2026 nimmt deleteKonfiCascade auch die Postfach-Mitteilungen
        "Neuer Antrag eingegangen" bei der LEITUNG mit, die auf Anträge der
        geloeschten Person zeigten (die eigenen Mitteilungen gingen schon immer
        mit dem Konto; utils/postfachAufraeumen.js).
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, param-id-Validierung]
        org-scope: true
        objekt-pruefung: "Ziel muss Rolle konfi haben, zur eigenen Organisation gehören und darf nicht bereits gelöscht sein; seit 01.09.2026 zusaetzlich darfKonfi(edit) — 403 fuer admin ohne edit-Zuweisung auf den Jahrgang des Konfis (org_admin ausgenommen)"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: Konfi geloescht }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/{id}/regenerate-password:
    post:
      tags: ["Konfis (Verwaltung)"]
      summary: Neues Startpasswort für einen Konfi erzeugen
      description: >
        Erzeugt ein neues Passwort, speichert den Hash und gibt das
        Klartext-Passwort einmalig zurück.
        GEAENDERT 14.09.2026: Der Reset beendet jetzt alle Sitzungen der
        betroffenen Person — token_invalidated_at wird gesetzt, alle
        Refresh-Tokens werden widerrufen und die Push-Tokens geloescht.
        Die Person muss sich auf jedem Geraet mit dem neuen Passwort neu
        anmelden. Am Request und an der Antwortform aendert sich nichts.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, param-id-Validierung]
        org-scope: true
        objekt-pruefung: "Seit 01.09.2026: Ziel muss Rolle konfi haben (404 sonst) UND darfKonfi(edit) — 403 fuer admin ohne edit-Zuweisung auf den Jahrgang des Konfis (org_admin ausgenommen); dann UPDATE ... WHERE id = :id AND organization_id = Token-Org"
        hinweis: >
          BEHOBEN 01.09.2026: Vorher gab es keinen Rollen-Check auf das
          Zielobjekt — die Route setzte das Passwort JEDES Users der eigenen
          Organisation zurück, auch von Teamer:innen und Leitung, und ein
          admin konnte damit jedes Konfi-Konto der Gemeinde uebernehmen.
          Teamer-Passwoerter setzt die Benutzerverwaltung (routes/users.js)
          zurueck.
          BEHOBEN 14.09.2026: Der Reset beendet jetzt die bestehenden
          Sitzungen (token_invalidated_at, Widerruf aller Refresh-Tokens,
          Loeschen der Push-Tokens). Vorher lief die alte Sitzung weiter —
          das Access-Token bis zu 15 Minuten, das Refresh-Token mit Rotation
          bis zu 90 Tage. Genau diese Route wird benutzt, wenn ein Konto
          uebernommen wurde; das neue Passwort allein half dann nicht.
          Gleiche Behandlung wie bei PUT /api/auth/change-password.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "Neues Passwort (Klartext, einmalig); seit 14.09.2026 sind alle Sitzungen der Person beendet" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/{id}/event-points:
    get:
      tags: ["Konfis (Verwaltung)"]
      summary: Event-Punkte eines Konfis
      description: Liefert alle über Events vergebenen Punkte samt Event-Name und vergebender Person.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "Seit 01.09.2026: darfKonfi(view) — 404 wenn kein Konfi-Profil, 403 fuer admin/teamer ohne Zuweisung auf den Jahrgang (org_admin ausgenommen); dann WHERE ep.konfi_id = :id AND ep.organization_id = Token-Org"
        hinweis: >
          Jahrgangs-Check seit 01.09.2026 (vorher als Befund vermerkt:
          keiner) — gleiche Stufe wie GET /api/admin/konfis/{id}.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "Array von Event-Punkten (leeres Array, wenn keine)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: "Konfi ohne Profil (seit 01.09.2026; vorher leeres Array)" }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/{id}/badges:
    get:
      tags: ["Konfis (Verwaltung)"]
      summary: Abzeichen und Fortschritt eines Konfis (Leitungs-Einsicht)
      description: >
        Gleiche Wertung und gleicher Fortschritt wie die Konfi-eigene Ansicht
        (gemeinsame Quelle utils/konfiBadgeProgress.js).
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "Ziel muss Rolle konfi haben, zur eigenen Organisation gehören und nicht gelöscht sein; seit 01.09.2026 zusaetzlich darfKonfi(view) — 403 ohne Zuweisung auf den Jahrgang (org_admin ausgenommen)"
        hinweis: >
          Nur für Konfis; Teamer-Abzeichen laufen über /api/teamer/badges.
          Jahrgangs-Check seit 01.09.2026 (vorher als Befund vermerkt: keiner).
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: Abzeichen mit Fortschritt }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/{id}/attendance-stats:
    get:
      tags: ["Konfis (Verwaltung)"]
      summary: Anwesenheitsstatistik bei Pflicht-Events
      description: >
        Zaehlt Pflicht-Events des Jahrgangs, tatsaechliche Teilnahmen, Quote
        und verpasste Termine.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin]
        org-scope: true
        objekt-pruefung: "Events sind org-gescopt (e.organization_id); der Jahrgang wird über konfi_profiles des Ziel-Konfis ermittelt; seit 01.09.2026 zusaetzlich darfKonfi(view) — 403 fuer admin ohne Zuweisung auf den Jahrgang (org_admin ausgenommen)"
        hinweis: >
          Die Vorab-Abfrage auf konfi_profiles prüft NUR die user_id, nicht
          die Organisation. Für eine fremde ID wird der Jahrgang also
          ermittelt, die eigentliche Auswertung filtert danach aber auf die
          eigene Organisation und liefert deshalb Nullwerte statt fremder
          Daten. Teamer:innen haben hier keinen Zugriff.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "total_mandatory, attended, percentage, missed_events" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Konfi ohne Profil }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/{id}/bonus-points:
    post:
      tags: ["Konfis (Verwaltung)"]
      summary: Bonuspunkte vergeben
      description: >
        Traegt Bonuspunkte ein und schreibt sie dem passenden Punktekonto gut.
        Der Punkte-Typ muss für den Jahrgang des Konfis aktiviert sein.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer, validateBonusPoints]
        org-scope: true
        objekt-pruefung: >
          Gutschrift läuft über JOIN users mit organization_id = Token-Org;
          checkPointTypeEnabled prüft den Punkte-Typ gegen den Jahrgang;
          zusaetzlich Jahrgangs-Zugriff auf die Ziel-Konfi fuer teamer UND
          admin (darfKonfi aus backend/utils/jahrgangsZugriff.js).
        hinweis: >
          Vergeben duerfen auch Teamer:innen, zuruecknehmen nur org_admin und
          admin (DELETE unten). Teamer:innen sind seit 27.08.2026 auf ihre
          zugewiesenen Jahrgaenge begrenzt (403 "Kein Zugriff auf diesen
          Konfi") — vorher fand kein Jahrgangs-Check auf die Ziel-ID statt,
          was zu assign-activity und zum Handbuch inkonsistent war.
          GEAENDERT 2026-08-31: Dieselbe Grenze gilt jetzt auch fuer die Rolle
          admin (Simons Regel: ein Admin ist an seine Jahrgaenge gebunden).
          Nur org_admin/super_admin bleiben org-weit berechtigt.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points, type, description]
              properties:
                points: { type: integer }
                type: { type: string, enum: [gottesdienst, gemeinde] }
                description: { type: string }
      responses:
        "201": { description: "Bonuspunkte vergeben (konfi-management.js:861 — die Doku nannte hier bis 27.08.2026 faelschlich 200)" }
        "400": { description: Pflichtfelder fehlen oder Punkte-Typ fuer den Jahrgang deaktiviert }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: "Keine Teamer-Rolle, oder Teamer:in ohne Zugriff auf den Jahrgang der Ziel-Konfi" }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/{id}/bonus-points/{bonusId}:
    delete:
      tags: ["Konfis (Verwaltung)"]
      summary: Bonuspunkte zuruecknehmen
      description: Loescht den Bonuseintrag und zieht die Punkte wieder ab.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin]
        org-scope: true
        objekt-pruefung: "SELECT ... JOIN users u ON bp.konfi_id = u.id WHERE bp.id = :bonusId AND bp.konfi_id = :id AND u.organization_id = Token-Org; seit 01.09.2026 zusaetzlich darfKonfi(view) — 403 fuer admin ohne Zuweisung auf den Jahrgang, gleiche Stufe wie das Vergeben (org_admin ausgenommen)"
      parameters:
        - { $ref: '#/components/parameters/pathId' }
        - name: bonusId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: "ID des Bonuspunkte-Eintrags"
      responses:
        "200": { description: Bonuspunkte entfernt }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/{id}/activities:
    post:
      tags: ["Konfis (Verwaltung)"]
      summary: Aktivität nachtragen
      description: >
        Traegt eine erledigte Aktivität nach, schreibt die Punkte gut und
        löst die Badge-Prüfung aus. Bei Konfi-Aktivitäten muss der
        Punkte-Typ für den Jahrgang aktiviert sein.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateAddActivity]
        org-scope: true
        objekt-pruefung: "Aktivität muss zur eigenen Organisation gehören; bei Konfi-Aktivitäten seit 01.09.2026 darfKonfi(view) — 404/403 wie assign-activity (Teamer-Aktivitaeten ausgenommen: Teamer:innen sieht ein Admin alle); checkPointTypeEnabled bei Konfi-Aktivitäten"
        hinweis: >
          Anders als POST /api/admin/activities/assign-activity verlangt diese
          Route requireAdmin — Teamer:innen tragen über assign-activity nach.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activity_id, completed_date]
              properties:
                activity_id: { type: integer }
                completed_date: { type: string, format: date }
                comment: { type: string }
      responses:
        "200": { description: Aktivitaet nachgetragen }
        "400": { description: Pflichtfelder fehlen oder Punkte-Typ deaktiviert }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/{id}/activities/{activityId}:
    delete:
      tags: ["Konfis (Verwaltung)"]
      summary: Nachgetragene Aktivität entfernen
      description: Loescht die Zuordnung und zieht die gutgeschriebenen Punkte wieder ab.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin]
        org-scope: true
        objekt-pruefung: >
          SELECT über JOIN users mit organization_id — die Org-Bedingung
          wurde 22.08.2026 ergaenzt. Ohne sie fand der SELECT auch fremde
          Eintraege und der Punktabzug lief auf einem fremden Konfi.
          Seit 01.09.2026 zusaetzlich darfKonfi(view) bei Konfi-Aktivitaeten
          — 403 fuer admin ohne Zuweisung auf den Jahrgang, gleiche Stufe
          wie das Vergeben (Teamer-Aktivitaeten und org_admin ausgenommen).
      parameters:
        - { $ref: '#/components/parameters/pathId' }
        - name: activityId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: "ID des Punkte-Eintrags (user_activities.id), nicht der Aktivität"
      responses:
        "200": { description: Aktivitaet entfernt }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/{id}/teamer-since:
    put:
      tags: ["Konfis (Verwaltung)"]
      summary: Aktiv-seit-Datum einer Teamer:in setzen
      description: Setzt das Feld teamer_since des Ziel-Users.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, param-id-Validierung]
        org-scope: true
        objekt-pruefung: "UPDATE users ... WHERE id = :id AND organization_id = Token-Org"
        hinweis: >
          Kein Rollen-Check auf das Zielobjekt: das Datum laesst sich auch bei
          Usern setzen, die keine Teamer:innen sind.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamer_since]
              properties:
                teamer_since: { type: string, format: date }
      responses:
        "200": { description: "teamer_since" }
        "400": { description: teamer_since fehlt }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/{id}/promote-teamer:
    post:
      tags: ["Konfis (Verwaltung)"]
      summary: Konfi zur Teamer:in befoerdern
      description: >
        Setzt die Rolle auf teamer und teamer_since auf heute und löscht
        Event-Buchungen und offene Anträge. Seit 01.09.2026 wird der
        Konfi-Jahrgang NICHT mehr automatisch nach
        user_jahrgang_assignments uebertragen: Die frisch befoerderte Person
        bekam dadurch view+edit auf ihren alten Jahrgang (die eigene
        Peergroup) — Simons Regel sagt, Teamer:innen existieren auch ohne
        Jahrgang und die Zuweisung kommt bewusst spaeter ueber die
        Benutzerverwaltung. Die eigenen eingefrorenen Konfi-Daten bleiben
        davon unberuehrt (haengen an konfi_profiles, nicht an der Zuweisung).
        BEHOBEN 15.09.2026: Die geloeschten Buchungen geben Konfi-Plaetze
        frei — dort rueckt jetzt die naechste wartende KONFI nach (fest
        'konfi', nicht aus der bereits gewechselten Rolle abgeleitet). An
        abgesagten Terminen rueckt niemand nach.
        Seit 25.09.2026 gehen mit den geloeschten offenen Anträgen auch deren
        Postfach-Mitteilungen ("Neuer Antrag eingegangen" bei der Leitung,
        "Antrag eingereicht" bei der befoerderten Person;
        utils/postfachAufraeumen.js).
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, param-id-Validierung]
        org-scope: true
        objekt-pruefung: "Ziel-User muss zur eigenen Organisation gehören und aktuell Rolle konfi haben (sonst 400); seit 01.09.2026 zusaetzlich darfKonfi(edit) — 403 fuer admin ohne edit-Zuweisung auf den Jahrgang des Konfis (org_admin ausgenommen)"
        hinweis: >
          Die Teamer-Rolle wird org-spezifisch gesucht, mit Rueckfall auf die
          globale Rolle (organization_id IS NULL). Ohne Zuweisung faellt die
          befoerderte Person beim naechsten Chat-Sync aus dem Jahrgangs-Chat
          ihres alten Jahrgangs — konsequent zur Regel.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: Konfi befoerdert }
        "400": { description: Ziel-User ist kein Konfi }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { description: Teamer-Rolle nicht gefunden oder Datenbankfehler }
