      responses:
        "200": { description: Geloescht }
        "400": { description: Antrag nicht mehr pending }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/upload-photo:
    post:
      tags: ["Aktivitäten & Anträge"]
      summary: Nachweisfoto für Antrag hochladen (verschlüsselt at-rest)
      description: >
        multipart/form-data, Feld "photo". Magic-Bytes-Prüfung (nur echte
        Bilder, sonst 415), AES-256-GCM-Verschluesselung, zufaelliger
        64-Hex-Dateiname wird zurueckgegeben (für POST /api/konfi/requests).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo: { type: string, format: binary, description: "Bilddatei, max. 5 MB" }
      x-berechtigung:
        rollen: [konfi, teamer]
        middleware: [verifyTokenRBAC, "multer requestUpload.single('photo')"]
        org-scope: false
        objekt-pruefung: "keine (Datei ist noch keinem Antrag zugeordnet)"
        hinweis: "Einzige /api/konfi-Route, die auch Teamern offensteht (Teamer-Nachweise)."
      responses:
        "200": { description: "filename (64 Hex) + message" }
        "400": { description: Kein Foto im Request }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "415": { description: Datei ist kein Bild (Magic-Bytes) }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/activity-requests/{id}/photo:
    get:
      tags: ["Aktivitäten & Anträge"]
      summary: Nachweisfoto eines Antrags abrufen (Eigentuemer/Leitung im eigenen Jahrgang)
      description: >
        Liefert das entschluesselte Bild (image/jpeg). Der in der Datenbank
        hinterlegte Dateiname wird vor dem Lesen geprüft (genau 64 Hexzeichen);
        ein Antrag mit abweichendem Namen antwortet mit 400 "Ungültiger
        Dateiname" (seit 14.09.2026, greift auch für Bestandsdaten aus der
        Zeit davor).
      x-berechtigung:
        rollen: [konfi, teamer, admin, org_admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: >
          Konfi/Teamer nur den EIGENEN Antrag (user_id-Vergleich) und nur
          solange status='pending' (danach 403); Leitung
          (req.user.type==='admin') sieht Fotos statusunabhaengig, seit
          14.09.2026 aber nur im eigenen Jahrgang. Der Dateiname aus der
          Datenbank wird zusaetzlich gegen ^[a-f0-9]{64}$ geprüft
          (utils/photoStorage.istSichererDateiname), sonst 400.
        jahrgangs-bindung: >
          Für Leitungsrollen seit 14.09.2026: Gehört die antragstellende Person
          zu einem Jahrgang ausserhalb der eigenen Zuweisungen, antwortet die
          Route mit 403 "Kein Zugriff auf diesen Konfi" (darfKonfi, view-Stufe).
          org_admin und super_admin sind ausgenommen, ebenso Anträge auf
          Teamer-Aktivitäten (target_role='teamer') — Teamer:innen hängen an
          keinem Jahrgang. Die Konfi selbst kommt weiterhin an ihr eigenes Foto
          (nur solange status='pending').
        hinweis: >
          Antrag wird org-gescopt geladen; fremde Org -> 404.
          BEHOBEN 14.09.2026: Bis dahin sah jede Leitungsrolle jedes offene
          Nachweisfoto der Organisation, auch aus fremden Jahrgängen. Die
          Schwesterroute GET /api/admin/activities/requests/{id}/photo trägt
          dieselbe Bindung seit 31.08.2026 — das Nachweisfoto ist das
          persoenlichste Datum am Antrag.
          BEHOBEN 14.09.2026 (Pfad-Traversal): Der gespeicherte Dateiname ging
          ungeprüft in den Dateipfad; ein selbst gesetzter Wert aus POST
          /api/konfi/requests liess damit Dateien ausserhalb des
          Upload-Verzeichnisses lesen (unverschluesselte Dateien reicht die
          Entschluesselung unveraendert durch). Geprüft wird jetzt beim Anlegen
          UND hier beim Abruf.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: Bild (image/jpeg), content: { image/jpeg: {} } }
        "400": { description: "Ungültiger Dateiname (seit 14.09.2026: gespeicherter Name ausserhalb von ^[a-f0-9]{64}$)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: "Fremder Antrag oder Antrag bereits bearbeitet (Nicht-Leitung); seit 14.09.2026 fuer Leitung zusaetzlich 'Kein Zugriff auf diesen Konfi' bei fremdem Jahrgang" }
        "404": { description: Antrag/Foto/Datei nicht gefunden }
        "500": { description: Entschluesselung fehlgeschlagen / Serverfehler }

