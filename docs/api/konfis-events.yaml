        BEHOBEN 06.09.2026: Die Antwort traegt jetzt registration_status und
        teamer_registration_status — beide berechnet mit denselben Helfern wie
        GET /api/events (utils/terminAnmeldeStatus.js). Vorher lieferte nur die
        Liste den Status; die Leitungs-Detailansicht las ihn hier als undefined
