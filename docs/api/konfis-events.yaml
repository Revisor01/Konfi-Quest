        ADDITIV 12.09.2026 (Migration 147): participants[]-Eintraege tragen
        zusaetzlich excuse_reason und attendance_note (beide text, nullbar),
        und attendance_status kann jetzt auch 'excused' sein. Ausgelieferte
        Apps lesen die neuen Felder nicht und kennen den neuen Wert nicht —
        sie zeigen ihn wie einen unbekannten Status, kein Feld aendert Form
        oder Typ.
        ADDITIV 13.09.2026 (Migration 148): participants[]-Eintraege tragen
        zusaetzlich attendance_set_by (integer, nullbar), attendance_set_at
        (date-time, nullbar) und attendance_set_by_name (string, nullbar) —
        wer die Anwesenheit zuletzt gesetzt hat und wann. NULL heisst
        UNBEKANNT, nicht "niemand": Buchungen von vor der Migration und
        Selbst-Check-ins per QR-Code tragen keinen Urheber. Der Name kommt
        ueber einen LEFT JOIN auf users — eine Buchung ohne Urheber bleibt
        in der Liste. Kein vorhandenes Feld aendert Form oder Typ.
        ADDITIV 13.09.2026 (Migration 149): dazu note_set_by (integer,
        nullbar), note_set_at (date-time, nullbar) und note_set_by_name
        (string, nullbar) — wer die NOTIZ (attendance_note) zuletzt
        geschrieben hat. attendance_set_by/_at gelten seither fuer den STATUS
        samt excuse_reason; Name, Typ und Nullbarkeit dieser Felder bleiben
