          required: true
          schema: { type: integer, description: "ID der Buchung (event_bookings.id)" }
          description: "ID des Buchungs-Eintrags (event_bookings.id), nicht die User-ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attendance_status]
              properties:
                attendance_status: { type: string, enum: [present, absent] }
      responses:
        "200": { description: "message, points_awarded / points_removed" }
        "400": { description: Ungueltiger Status oder Punkt-Typ im Jahrgang deaktiviert }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/{id}/chat:
    post:
      tags: ["Termine (Verwaltung)"]
      summary: Gruppenchat für Event erstellen
      description: >
        Legt den Event-Chat an und fuegt Ersteller plus alle Gebuchten hinzu
        (rollenrichtiger user_type). Seit 24.08.2026 zählen dabei auch
        Wartende — vorher nur bestaetigte, obwohl Wartende beim Anmelden
        hineinkommen. Pro Event nur ein Chat. Die Mitgliedschaft wird ab jetzt
        laufend gepflegt: Anmelden trägt ein, Abmelden trägt aus.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "Event org-gescopt"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "201": { description: "chat_room_id, message, participants_added" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: Chat existiert bereits }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/{id}/cancel:
    put:
      tags: ["Termine (Verwaltung)"]
      summary: Event absagen (mit Teilnehmer-Benachrichtigung)
      description: Setzt cancelled=true + cancelled_at und pusht an alle Gebuchten (confirmed + waitlist).
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "Event org-gescopt"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notification_message: { type: string, default: "Das Event wurde abgesagt." }
      responses:
        "200": { description: "message, participants_notified, notification_message" }
        "400": { description: Event bereits abgesagt }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  # ===================================================================
  # backend/routes/activities.js  (Prefix /api/admin/activities)
  # Masterliste der Aktivitäten + Antragsverwaltung.
  # Lesen der Masterliste und Direktvergabe: requireTeamer.
  # Anlegen/Aendern/Loeschen und Antragsentscheidung: requireAdmin.
  # Die beiden Foto-Routen haben KEINE Rollen-Middleware, sondern einen
  # Inline-Check auf role_name in ['admin','org_admin'] — Teamer:innen sind
  # dort also ausgeschlossen.
  # ===================================================================
  /api/admin/activities:
    get:
      tags: ["Aktivitäten & Anträge"]
      summary: Masterliste aller Aktivitäten der eigenen Organisation
      description: >
        Liefert alle Aktivitäten der aktiven Organisation samt zugeordneten
        Kategorien. Optionaler Query-Parameter target_role filtert auf
        Konfi- bzw. Teamer-Aktivitäten.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "WHERE a.organization_id = req.user.organization_id"
        hinweis: >
          super_admin fällt durch requireTeamer auf 403, außer er agiert per
          Multi-Org-Switch als org_admin/admin/teamer.
      parameters:
        - name: target_role
          in: query
          required: false
          schema: { type: string, enum: [konfi, teamer] }
          description: "Filter nach Zielgruppe: konfi oder teamer"
      responses:
        "200": { description: "Array von Aktivitaeten (id, name, points, type, target_role, categories)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }
    post:
      tags: ["Aktivitäten & Anträge"]
      summary: Neue Aktivität anlegen
      description: >
        Legt eine Aktivität in der aktiven Organisation an. Bei
        target_role=teamer sind points und type optional, sonst Pflicht.
        Uebergebene category_ids werden zugeordnet.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateCreateActivity]
        org-scope: true
        objekt-pruefung: "organization_id wird aus dem Token gesetzt, nicht aus dem Body"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                points: { type: integer }
                type: { type: string, enum: [gottesdienst, gemeinde] }
                target_role: { type: string, enum: [konfi, teamer], default: konfi }
                category_ids: { type: array, items: { type: integer } }
      responses:
        "201": { description: Angelegte Aktivitaet }
        "400": { description: Pflichtfelder fehlen oder Validierung fehlgeschlagen }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/activities/{id}:
    put:
      tags: ["Aktivitäten & Anträge"]
      summary: Aktivität ändern
      description: >
        Aendert Name, Punkte, Typ, Zielrolle und Kategorien einer Aktivität
        der eigenen Organisation.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateUpdateActivity]
        org-scope: true
        objekt-pruefung: "Aktivität muss zur eigenen Organisation gehören"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                points: { type: integer }
                type: { type: string }
                target_role: { type: string, enum: [konfi, teamer] }
                category_ids: { type: array, items: { type: integer } }
      responses:
        "200": { description: Aktualisierte Aktivitaet }
        "400": { description: Pflichtfelder fehlen }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }
    delete:
      tags: ["Aktivitäten & Anträge"]
      summary: Aktivität löschen (nur ohne Zuordnungen)
      description: >
        Loescht eine Aktivität. Existieren bereits Zuordnungen zu Konfis
        (user_activities), wird mit 409 abgelehnt. Anträge werden nach
        Gewicht unterschieden aufgeraeumt bzw. blockieren das Löschen.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateDeleteActivity]
        org-scope: true
        objekt-pruefung: "Zuordnungspruefung über JOIN activities mit organization_id"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "Aktivitaet geloescht" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: Aktivitaet ist Konfis zugeordnet oder hat gewichtige Antraege }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/activities/requests:
    get:
      tags: ["Aktivitäten & Anträge"]
      summary: Alle Anträge der Organisation
      description: >
        Liefert die Aktivitaetsantraege der aktiven Organisation samt
        Konfi-Name, Aktivitaetsdaten und genehmigender Person. Ohne Filter
        alle, mit ?status= nur die des angegebenen Status.
        BEHOBEN 2026-08-28: ?status= wurde vorher stillschweigend verworfen —
        die Route lieferte immer alles.
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [pending, approved, rejected] }
          description: Optionaler Filter. Ein unbekannter Wert ergibt 400.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin]
        org-scope: true
        objekt-pruefung: "WHERE a.organization_id = req.user.organization_id"
        hinweis: >
          Kein Jahrgangs-Filter: org_admin und admin sehen die Anträge ALLER
          Jahrgänge der Organisation. Teamer:innen haben hier keinen Zugriff
          (dafuer gibt es GET /api/teamer/requests).
      responses:
        "200": { description: "Array von Antraegen (ar.* + konfi_name, activity_name, activity_points, activity_type, activity_target_role, approved_by_name)" }
        "400": { description: "Unbekannter Wert fuer ?status=" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/activities/requests/{id}:
    put:
      tags: ["Aktivitäten & Anträge"]
      summary: Antrag genehmigen oder ablehnen
      description: >
        Setzt den Status eines ausstehenden Antrags auf approved oder
        rejected. Bei approved werden die Punkte gutgeschrieben und Badges
        geprüft. Bereits entschiedene Anträge werden mit 400 abgelehnt.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateRequestUpdate]
        org-scope: true
        objekt-pruefung: "Antrag über JOIN activities auf die eigene Organisation eingegrenzt; nur status=pending aenderbar"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [approved, rejected] }
                admin_comment: { type: string }
      responses:
        "200": { description: Antrag entschieden }
        "400": { description: Ungueltiger Status oder Antrag nicht mehr ausstehend }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }
    delete:
      tags: ["Aktivitäten & Anträge"]
      summary: Abgelehnten Antrag endgueltig löschen
      description: >
        Entfernt einen abgelehnten Antrag samt Nachweisfoto. Offene Anträge
        (409) und genehmigte Anträge (409) sind bewusst geschuetzt:
        offene werden entschieden, genehmigte zuerst zurückgesetzt.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, param-id-Validierung]
        org-scope: true
        objekt-pruefung: "Antrag über JOIN activities org-gescopt; nur status=rejected loeschbar"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "Antrag geloescht" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: Antrag ist offen oder bereits genehmigt }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/activities/requests/{id}/reset:
    put:
      tags: ["Aktivitäten & Anträge"]
      summary: Entschiedenen Antrag auf ausstehend zuruecksetzen
      description: >
        Setzt einen genehmigten oder abgelehnten Antrag zurück auf pending.
        Bei zuvor genehmigten Anträgen werden die gutgeschriebenen Punkte
        wieder abgezogen.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, param-id-Validierung]
        org-scope: true
        objekt-pruefung: "Antrag über JOIN activities org-gescopt; bereits ausstehende Anträge ergeben 400"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "Antrag zurueckgesetzt, Punkte ggf. abgezogen" }
        "400": { description: Antrag ist bereits ausstehend }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/activities/requests/{id}/photo:
    get:
      tags: ["Aktivitäten & Anträge"]
      summary: Nachweisfoto eines Antrags abrufen
      description: >
        Liefert das (verschlüsselt gespeicherte) Nachweisfoto entschluesselt
        als image/jpeg aus, unabhaengig vom Status des Antrags.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Inline-Rollencheck role_name in ['admin','org_admin']; danach Vergleich der organization_id des antragstellenden Users mit der eigenen"
        hinweis: >
          Bewusst KEIN requireAdmin, sondern ein Inline-Check — die Wirkung ist
          dieselbe Rollenmenge. Teamer:innen erhalten 403.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200":
          description: Foto
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Antrag, Foto-Eintrag oder Datei nicht gefunden }
        "500": { description: Foto konnte nicht entschluesselt werden }
    delete:
      tags: ["Aktivitäten & Anträge"]
      summary: Nachweisfoto eines Antrags löschen
      description: >
        Setzt photo_filename auf NULL und entfernt die Datei. Der Antrag
        selbst bleibt erhalten.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Inline-Rollencheck role_name in ['admin','org_admin']; danach Org-Vergleich über den antragstellenden User"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "Foto geloescht" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Antrag nicht gefunden oder kein Foto vorhanden }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/activities/assign-activity:
    post:
      tags: ["Aktivitäten & Anträge"]
      summary: Aktivität direkt einem Konfi zuweisen
      description: >
        Vergibt eine Aktivität ohne Antragsweg. Punkte werden gutgeschrieben
        und die Badge-Prüfung ausgelöst.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer, validateAssignActivity]
        org-scope: true
        objekt-pruefung: >
          Aktivität UND Ziel-User müssen zur eigenen Organisation gehören
          (Org-Prüfung des Ziel-Users ergaenzt 22.08.2026). Teamer:innen
          zusaetzlich: der Jahrgang des Konfis muss in assigned_jahrgaenge mit
          can_view liegen.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [konfiId, activityId]
              properties:
                konfiId: { type: integer }
                activityId: { type: integer }
                completed_date: { type: string, format: date }
      responses:
        "200": { description: "Aktivitaet zugewiesen, Punkte gutgeschrieben" }
        "400": { description: Pflichtfelder fehlen }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Aktivitaet oder Konfi nicht gefunden }
        "500": { $ref: '#/components/responses/ServerError' }

  # ===================================================================
  # backend/routes/konfi-management.js  (Prefix /api/admin/konfis)
  # Verwaltung der Konfis durch Leitung und Teamer:innen.
  # Lesen: requireTeamer. Anlegen/Aendern/Loeschen und Punktekorrekturen:
  # requireAdmin. Bonuspunkte VERGEBEN duerfen auch Teamer:innen,
  # ZURUECKNEHMEN nur org_admin/admin.
  #
  # JAHRGANGS-FILTER: Die Liste GET /api/admin/konfis filtert für
  # Teamer:innen (und admin) auf assigned_jahrgaenge mit can_view.
  # BEHOBEN 31.08.2026: Die SCHREIBWEGE POST /api/admin/konfis und
  # PUT /api/admin/konfis/{id} sind seither ebenfalls an die Jahrgaenge des
  # Aufrufers gebunden (can_edit) — vorher prüften sie nur die
  # organization_id, ein admin konnte also Konfis in Jahrgaenge anlegen und
  # verschieben, die er anschliessend nicht mehr sah. org_admin und
  # super_admin bleiben ausgenommen. Die lesenden Detail-Routen mit :id
  # prüfen weiterhin nur die organization_id.
  # ===================================================================
  /api/admin/konfis:
    get:
      tags: ["Konfis (Verwaltung)"]
      summary: Liste der Konfis (für Teamer:innen auf eigene Jahrgänge gefiltert)
      description: >
        Liefert die Konfis der aktiven Organisation mit Punkten, Jahrgang und
        Zaehlern. Für alle außer super_admin und org_admin wird auf die
        Jahrgänge aus assigned_jahrgaenge mit can_view eingeschraenkt.
        Geloeschte Konfis (deleted_at) sind ausgeschlossen.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "u.organization_id = Token-Org; zusaetzlich Jahrgangs-Filter für alle außer is_super_admin/org_admin"
      responses:
        "200": { description: "Array von Konfis (id, name, username, Punkte, Jahrgang, badge_count, activity_count)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }
    post:
      tags: ["Konfis (Verwaltung)"]
      summary: Neuen Konfi anlegen
      description: >
        Legt User + konfi_profiles an, erzeugt Username und Startpasswort,
        hängt den Konfi an den Jahrgangs-Chat und bucht ihn in kuenftige
        Pflicht-Events des Jahrgangs ein. Das Konfi-Limit der Organisation
        wird geprüft.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateCreateKonfi]
        org-scope: true
        objekt-pruefung: >
          jahrgang_id muss zur eigenen Organisation gehören; seit 31.08.2026
          zusaetzlich zu den Jahrgaengen des Aufrufers (assigned_jahrgaenge
          mit can_edit) — sonst 403. org_admin und super_admin ausgenommen.
          Rolle konfi wird org-spezifisch aufgeloest; Limitpruefung über
          checkKonfiLimit
        hinweis: >
          Teamer:innen können keine Konfis anlegen (requireAdmin).
          BEHOBEN 31.08.2026: Vorher prüfte die Route nur die Organisation.
          Ein admin konnte damit Konfis in jeden Jahrgang der Gemeinde
          anlegen — und sah sie danach nicht mehr, weil die Liste sie
          ausblendet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, jahrgang_id]
              properties:
                name: { type: string }
                jahrgang_id: { type: integer }
                confirm: { type: boolean, description: Bestaetigung beim Ueberschreiten weicher Grenzen }
      responses:
        "201": { description: "Angelegter Konfi inkl. Startpasswort" }
        "400": { description: Validierung fehlgeschlagen }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Jahrgang oder Rolle nicht gefunden }
        "409": { description: Konfi-Limit der Organisation erreicht }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/teamer:
    get:
      tags: ["Konfis (Verwaltung)"]
      summary: Liste der Teamer:innen der Organisation
      description: >
        Liefert alle User mit Rolle teamer der aktiven Organisation samt
        Jahrgangsnamen, Abzeichen- und Zertifikatszaehler.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "WHERE r.name = 'teamer' AND u.organization_id = Token-Org"
        hinweis: >
          Kein Jahrgangs-Filter: Teamer:innen sehen hier alle Kolleg:innen der
          Organisation, auch aus fremden Jahrgängen. Es werden keine
          Login-Daten außer dem username ausgeliefert.
      responses:
        "200": { description: "Array (id, name, username, teamer_since, jahrgang_name, badge_count, cert_count)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/leitung:
    get:
      tags: ["Konfis (Verwaltung)"]
      summary: Liste der Leitung (Admins/Org-Admins) der Organisation
      description: >
        Liefert alle User mit Rolle admin oder org_admin der aktiven
        Organisation. Zweck ist die Auswahl beim Zuordnen der Leitung zu einem
        Termin (POST /api/events/{id}/participants) — wer zugeordnet ist, kommt
        in den Chat zum Termin. Neu am 31.08.2026.
        Eigene Route statt eines Filters an /konfis/teamer: Deren Antwortform
        ist ein Vertrag der ausgelieferten Apps und bleibt unveraendert.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "WHERE r.name IN ('admin','org_admin') AND u.organization_id = Token-Org AND deleted_at IS NULL"
        hinweis: >
          Kein Jahrgangs-Filter (wie bei /konfis/teamer). Es werden keine
          Login-Daten ausser dem username ausgeliefert. Super-Admins ohne
          org_admin-Rolle stehen nicht in der Liste.
      responses:
        "200": { description: "Array (id, name, username, role_name)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/{id}:
    get:
      tags: ["Konfis (Verwaltung)"]
      summary: Einzelner Konfi oder Teamer mit voller Historie
      description: >
        Detailansicht: Stammdaten, Punkte, Aktivitäten, Bonuspunkte, Events,
        Abzeichen und aufgeloester Konfispruch. Für Teamer:innen als
        Zielobjekt zusaetzlich Zertifikate und Teamer-Historie.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "WHERE u.id = :id AND u.organization_id = Token-Org AND r.name IN ('konfi','teamer') AND deleted_at IS NULL"
        hinweis: >
          # HINWEIS: Diese Route hat KEINEN Jahrgangs-Check. Eine Teamer:in
          kann über eine direkt geratene ID das vollstaendige Profil samt
          Punktehistorie jedes Konfis der Organisation abrufen, auch aus
          Jahrgängen ohne Zuweisung. Die Liste GET /api/admin/konfis filtert
          dagegen korrekt.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: Konfi-/Teamer-Detaildaten }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }
    put:
      tags: ["Konfis (Verwaltung)"]
      summary: Konfi ändern (Name, Jahrgang)
      description: >
        Aendert Anzeigename und/oder Jahrgang. Bei Jahrgangswechsel wird die
        Chat-Mitgliedschaft synchronisiert und der Konfi in kuenftige
        Pflicht-Events des neuen Jahrgangs eingebucht. Seit 24.08.2026 werden
        dabei auch die kuenftigen Pflicht-Events des ALTEN Jahrgangs
        ausgetragen — nur solange keine Anwesenheit erfasst ist und der Termin
        nicht auch zum neuen Jahrgang gehört. Vergangene Termine und erfasste
        Anwesenheiten bleiben unberuehrt.
        BEHOBEN 27.08.2026 (Mandantenluecke): Der Ziel-Jahrgang wird jetzt
        gegen die eigene Organisation geprueft. Vorher tat das nur der POST;
        gemessen antwortete der PUT mit 200 und schrieb die Konfi in den
        Jahrgang einer FREMDEN Organisation. Ueber die App war das nicht
        erreichbar (kein Aufrufer im Frontend), die Route stand aber offen.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateUpdateKonfi]
        org-scope: true
        objekt-pruefung: >
          UPDATE ... WHERE id = :id AND organization_id = Token-Org;
          zusaetzlich seit 27.08.2026 der ZIEL-JAHRGANG gegen dieselbe
          Organisation (400 bei fremdem oder unbekanntem Jahrgang);
          BEHOBEN 31.08.2026: fuer admin muessen QUELL- UND ZIEL-Jahrgang in
          seinen eigenen Zuweisungen liegen (can_edit), sonst 403. org_admin
          und super_admin ausgenommen"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                jahrgang_id: { type: integer }
      responses:
        "200": { description: Konfi aktualisiert }
        "400": { description: Validierung fehlgeschlagen }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }
    delete:
      tags: ["Konfis (Verwaltung)"]
      summary: Konfi löschen (inkl. abhaengiger Daten)
      description: >
        Loescht den Konfi und die daran haengenden Daten über
        deleteKonfiCascade (Aktivitäten, Bonuspunkte, Buchungen, Anträge,
        Chat-Mitgliedschaften, seit 24.08.2026 auch erhaltene Urkunden —
        deren Fremdschlüssel blockierte das Löschen vorher mit 500).
        Dieselbe Funktion trägt die Selbstloeschung über
        POST /auth/delete-account, dort für jede Rolle.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, param-id-Validierung]
        org-scope: true
        objekt-pruefung: "Ziel muss Rolle konfi haben, zur eigenen Organisation gehören und darf nicht bereits gelöscht sein"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: Konfi geloescht }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/{id}/regenerate-password:
    post:
      tags: ["Konfis (Verwaltung)"]
      summary: Neues Startpasswort für einen Konfi erzeugen
      description: Erzeugt ein neues Passwort, speichert den Hash und gibt das Klartext-Passwort einmalig zurück.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, param-id-Validierung]
        org-scope: true
        objekt-pruefung: "UPDATE ... WHERE id = :id AND organization_id = Token-Org"
        hinweis: >
          Kein Rollen-Check auf das Zielobjekt: die Route setzt das Passwort
          jedes Users der eigenen Organisation zurück, nicht nur von Konfis.
          Da nur org_admin/admin zugreifen duerfen, bleibt der Effekt
          innerhalb der Leitungsrechte.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "Neues Passwort (Klartext, einmalig)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/{id}/event-points:
    get:
      tags: ["Konfis (Verwaltung)"]
      summary: Event-Punkte eines Konfis
      description: Liefert alle über Events vergebenen Punkte samt Event-Name und vergebender Person.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "WHERE ep.konfi_id = :id AND ep.organization_id = Token-Org"
        hinweis: >
          Kein Jahrgangs-Check — wie bei GET /api/admin/konfis/{id}.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "Array von Event-Punkten (leeres Array, wenn keine)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/{id}/badges:
    get:
      tags: ["Konfis (Verwaltung)"]
      summary: Abzeichen und Fortschritt eines Konfis (Leitungs-Einsicht)
      description: >
        Gleiche Wertung und gleicher Fortschritt wie die Konfi-eigene Ansicht
        (gemeinsame Quelle utils/konfiBadgeProgress.js).
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "Ziel muss Rolle konfi haben, zur eigenen Organisation gehören und nicht gelöscht sein"
        hinweis: >
          Nur für Konfis; Teamer-Abzeichen laufen über /api/teamer/badges.
          Kein Jahrgangs-Check.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: Abzeichen mit Fortschritt }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/{id}/attendance-stats:
    get:
      tags: ["Konfis (Verwaltung)"]
      summary: Anwesenheitsstatistik bei Pflicht-Events
      description: >
        Zaehlt Pflicht-Events des Jahrgangs, tatsaechliche Teilnahmen, Quote
        und verpasste Termine.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin]
        org-scope: true
        objekt-pruefung: "Events sind org-gescopt (e.organization_id); der Jahrgang wird über konfi_profiles des Ziel-Konfis ermittelt"
        hinweis: >
          Die Vorab-Abfrage auf konfi_profiles prüft NUR die user_id, nicht
          die Organisation. Für eine fremde ID wird der Jahrgang also
          ermittelt, die eigentliche Auswertung filtert danach aber auf die
          eigene Organisation und liefert deshalb Nullwerte statt fremder
          Daten. Teamer:innen haben hier keinen Zugriff.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "total_mandatory, attended, percentage, missed_events" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { description: Konfi ohne Profil }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/{id}/bonus-points:
    post:
      tags: ["Konfis (Verwaltung)"]
      summary: Bonuspunkte vergeben
      description: >
        Traegt Bonuspunkte ein und schreibt sie dem passenden Punktekonto gut.
        Der Punkte-Typ muss für den Jahrgang des Konfis aktiviert sein.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer, validateBonusPoints]
        org-scope: true
        objekt-pruefung: "Gutschrift läuft über JOIN users mit organization_id = Token-Org; checkPointTypeEnabled prüft den Punkte-Typ gegen den Jahrgang; fuer Teamer:innen zusaetzlich Jahrgangs-Zugriff auf die Ziel-Konfi"
        hinweis: >
          Vergeben duerfen auch Teamer:innen, zuruecknehmen nur org_admin und
          admin (DELETE unten). Teamer:innen sind seit 27.08.2026 auf ihre
          zugewiesenen Jahrgaenge begrenzt (403 "Kein Zugriff auf diesen
          Konfi") — vorher fand kein Jahrgangs-Check auf die Ziel-ID statt,
          was zu assign-activity und zum Handbuch inkonsistent war. Die
          Leitung (admin/org_admin) bleibt org-weit berechtigt.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [points, type, description]
              properties:
                points: { type: integer }
                type: { type: string, enum: [gottesdienst, gemeinde] }
                description: { type: string }
      responses:
        "201": { description: "Bonuspunkte vergeben (konfi-management.js:861 — die Doku nannte hier bis 27.08.2026 faelschlich 200)" }
        "400": { description: Pflichtfelder fehlen oder Punkte-Typ fuer den Jahrgang deaktiviert }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: "Keine Teamer-Rolle, oder Teamer:in ohne Zugriff auf den Jahrgang der Ziel-Konfi" }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/{id}/bonus-points/{bonusId}:
    delete:
      tags: ["Konfis (Verwaltung)"]
      summary: Bonuspunkte zuruecknehmen
      description: Loescht den Bonuseintrag und zieht die Punkte wieder ab.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin]
        org-scope: true
        objekt-pruefung: "SELECT ... JOIN users u ON bp.konfi_id = u.id WHERE bp.id = :bonusId AND bp.konfi_id = :id AND u.organization_id = Token-Org"
      parameters:
        - { $ref: '#/components/parameters/pathId' }
        - name: bonusId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: "ID des Bonuspunkte-Eintrags"
      responses:
        "200": { description: Bonuspunkte entfernt }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/{id}/activities:
    post:
      tags: ["Konfis (Verwaltung)"]
      summary: Aktivität nachtragen
      description: >
        Traegt eine erledigte Aktivität nach, schreibt die Punkte gut und
        löst die Badge-Prüfung aus. Bei Konfi-Aktivitäten muss der
        Punkte-Typ für den Jahrgang aktiviert sein.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateAddActivity]
        org-scope: true
        objekt-pruefung: "Aktivität muss zur eigenen Organisation gehören; checkPointTypeEnabled bei Konfi-Aktivitäten"
        hinweis: >
          Anders als POST /api/admin/activities/assign-activity verlangt diese
          Route requireAdmin — Teamer:innen tragen über assign-activity nach.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activity_id, completed_date]
              properties:
                activity_id: { type: integer }
                completed_date: { type: string, format: date }
                comment: { type: string }
      responses:
        "200": { description: Aktivitaet nachgetragen }
        "400": { description: Pflichtfelder fehlen oder Punkte-Typ deaktiviert }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/{id}/activities/{activityId}:
    delete:
      tags: ["Konfis (Verwaltung)"]
      summary: Nachgetragene Aktivität entfernen
      description: Loescht die Zuordnung und zieht die gutgeschriebenen Punkte wieder ab.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin]
        org-scope: true
        objekt-pruefung: >
          SELECT über JOIN users mit organization_id — die Org-Bedingung
          wurde 22.08.2026 ergaenzt. Ohne sie fand der SELECT auch fremde
          Eintraege und der Punktabzug lief auf einem fremden Konfi.
      parameters:
        - { $ref: '#/components/parameters/pathId' }
        - name: activityId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
          description: "ID des Punkte-Eintrags (user_activities.id), nicht der Aktivität"
      responses:
        "200": { description: Aktivitaet entfernt }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/{id}/teamer-since:
    put:
      tags: ["Konfis (Verwaltung)"]
      summary: Aktiv-seit-Datum einer Teamer:in setzen
      description: Setzt das Feld teamer_since des Ziel-Users.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, param-id-Validierung]
        org-scope: true
        objekt-pruefung: "UPDATE users ... WHERE id = :id AND organization_id = Token-Org"
        hinweis: >
          Kein Rollen-Check auf das Zielobjekt: das Datum laesst sich auch bei
          Usern setzen, die keine Teamer:innen sind.
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [teamer_since]
              properties:
                teamer_since: { type: string, format: date }
      responses:
        "200": { description: "teamer_since" }
        "400": { description: teamer_since fehlt }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/admin/konfis/{id}/promote-teamer:
    post:
      tags: ["Konfis (Verwaltung)"]
      summary: Konfi zur Teamer:in befoerdern
      description: >
        Setzt die Rolle auf teamer und teamer_since auf heute, löscht
        Event-Buchungen und offene Anträge und uebertraegt den Jahrgang aus
        konfi_profiles in user_jahrgang_assignments.
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, param-id-Validierung]
        org-scope: true
        objekt-pruefung: "Ziel-User muss zur eigenen Organisation gehören und aktuell Rolle konfi haben (sonst 400)"
        hinweis: >
          Die Teamer-Rolle wird org-spezifisch gesucht, mit Rueckfall auf die
          globale Rolle (organization_id IS NULL).
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: Konfi befoerdert }
        "400": { description: Ziel-User ist kein Konfi }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { description: Teamer-Rolle nicht gefunden oder Datenbankfehler }
