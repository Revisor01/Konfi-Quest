        JAHRGANGSGRENZE seit 08.09.2026 (utils/bookingUtils.js,
        darfTeamerAnDiesenTermin): Der Teamer-Pfad lehnt einen Termin mit 403
        ab, dessen Jahrgang der Aufrufer nicht betreut -- dieselbe Regel wie im
        Chat. Ausgenommen sind teamer_only (haengt an keinem Jahrgang), Termine
        ohne jede Jahrgangs-Zuordnung sowie org_admin/super_admin. Dieselbe
        Pruefung sitzt in POST /api/teamer/events/{id}/zusage, weil beide Wege
        zur selben Buchung fuehren. GET /api/events blendet solche Termine seit
        derselben Aenderung auch aus der Liste aus (routes/events/lesen.js).


        NEU 01.09.2026 (Teamer-Pfad): Eine ABGESAGTE eigene Buchung
        (status opted_out aus POST /api/teamer/events/{id}/zusage) wird
        reaktiviert statt mit 409 abgewiesen — "Ich bin doch dabei" nach
        einer Absage. Die Zeile wird aktualisiert (Grund, Absage-Datum und
        absage_nach_zusage geleert), alle Kapazitaetsregeln gelten
        unveraendert.


        ERWEITERT 16.09.2026 — DIE REAKTIVIERUNG GILT JETZT FUER BEIDE
        ABMELDE-ARTEN UND BEIDE ROLLEN: Eine Buchung mit status opted_out
        ODER excused wird reaktiviert statt mit 409 abgewiesen, auf dem
        Konfi- wie auf dem Teamer-Pfad.


        Die frueher hier dokumentierte Einschraenkung ("Fuer Konfis bleibt
        der 409, ein Pflicht-Opt-out wird ausschliesslich ueber
        POST /api/konfi/events/{id}/opt-in zurueckgenommen") war nicht
        haltbar: Das UPDATE jener Route filtert fest auf status = 'opted_out'
        und antwortet bei excused mit 400 "Keine Opt-out-Anmeldung gefunden" —
        selbst an einem Pflichttermin. Wer von der Leitung abgemeldet worden
        war (status excused, Migration 153 vom 15.09.2026), hatte damit gar
        keinen Weg zurueck; der 409-Text "Du bist bereits fuer dieses Event
        angemeldet" war zudem sachlich falsch. Der Kommentar, der die
        Einschraenkung begruendete, stammte vom 01.09.2026 — zwei Wochen vor
        Einfuehrung des Status.


        KEINE SONDERREGEL: Nach der Reaktivierung laeuft die Buchung den
        normalen Weg (Anmeldefenster, Konfirmations-Sperre, Kapazitaet,
        Timeslot-Zwang, Warteliste). Eine abgemeldete Zeile belegt keinen
        Platz. Beim Reaktivieren werden attendance_status, excuse_reason und
        attendance_set_by/_at geleert — die neue Anmeldung ersetzt die
        Abmeldung. UNVERAENDERT bleibt die Check-in-Sperre in
        POST /api/events/qr-checkin (error_type excused): Der Weg zurueck
        fuehrt ueber die Anmeldung, nicht ueber den QR-Code.
