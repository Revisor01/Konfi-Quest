        "400": { description: Anmeldefenster/Slot/Kapazitaets-Fehler }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: Rolle nicht buchbar bzw. Event nicht fuer diese Rolle }
        # 400 deckt seit 01.09.2026 auch den abgesagten Termin ab (cancelled-Guard).
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { description: "Bereits gebucht oder Konfirmations-Sperre (eine abgesagte TEAMER-Buchung loest seit 01.09.2026 keinen 409 mehr aus, sondern wird reaktiviert)" }
