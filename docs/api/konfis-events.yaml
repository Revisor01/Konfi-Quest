  /api/events/{id}/participants/{participantId}/attendance:
    put:
      tags: ["Termine (Verwaltung)"]
      summary: Anwesenheit eines Teilnehmers setzen oder zuruecksetzen (vergibt/entzieht Punkte)
      description: >
        attendance_status present | absent | excused | null. present: Konfis erhalten
        einmalig die Event-Punkte (nicht bei Pflicht-Events; 400 bei
        deaktiviertem Punkt-Typ), Teamer nur Anwesenheit. absent: vergebene
        Event-Punkte werden zurückgenommen.
        ADDITIV 12.09.2026 (Migration 147): 'excused' ist die von der Leitung
        nachgetragene Abmeldung — jemand wurde ausserhalb der App abgemeldet.
        Punkte verhalten sich wie bei 'absent' (keine Vergabe, Abzug bereits
        vergebener); der Unterschied liegt in der Dokumentation. Bewusst KEIN
        Push an die Konfi, die Abmeldung kam von den Eltern.
        Dazu zwei optionale Freitexte, je auf 500 Zeichen gekuerzt, leer ->
        NULL: excuse_reason (Grund; gehoert zu 'excused' und wird beim Wechsel
        auf einen anderen Status geleert) und attendance_note (freie Notiz,
        unabhaengig vom Status, z. B. "ging um 14 Uhr"; bleibt stehen, solange
        nichts Neues geschickt wird). Kein bestehendes Feld aendert Form oder
        Typ — ausgelieferte Apps schicken weiterhin nur present/absent.
        GEAENDERT 13.09.2026 — NOTIZ LOESCHEN: Frueher stand im UPDATE
        "attendance_note = COALESCE(...)"; damit kam NULL nie durch und eine
        Notiz liess sich setzen und aendern, aber nicht entfernen. Jetzt
        gelten drei Faelle: attendance_note FEHLT -> Notiz bleibt unveraendert
        (so schicken ausgelieferte App-Fassungen, ihr Verhalten ist
        unveraendert); attendance_note hat Text -> Notiz wird gesetzt;
        attendance_note ist LEER ("" oder nur Leerzeichen) -> Notiz wird
        geloescht. Kein neues Feld, kein Flag: Der leere String sagt genau
        das, was die Nutzerin tut. Alt-App-Vertrag gewahrt — eine Bedeutung
        bekommt allein der Fall, der bisher nichts bewirken KONNTE.
        ADDITIV 16.09.2026 — EINTRAG ZURUECKSETZEN: attendance_status darf
        jetzt auch null sein (ebenso ein leerer String oder ein fehlendes
        Feld — dieselbe Normalisierung wie bei den Freitexten). Die Buchung
        ist danach "noch nicht verbucht": attendance_status, excuse_reason,
        attendance_set_by/_at, checkin_quelle und checked_in_at werden
        geleert, ein status='excused' faellt auf 'confirmed' zurueck
        (opted_out/cancelled/pending/waitlist bleiben unangetastet), und
        vergebene Event-Punkte werden zurueckgenommen. Die attendance_note
        BLEIBT — sie haengt nicht am Status und wird ueber ihr eigenes leeres
        Feld geloescht. Kein Nachruecken (es wird kein Platz frei, sondern
        einer zurueckgenommen) und KEIN Push an die Person: Die drei Pushes
        melden ein Ergebnis, eine Ruecknahme meldet nichts.
        KEIN vierter Status, sondern NULL — derselbe Zustand, in dem jede
        Buchung anfaengt; sonst muessten alle Abfragen auf
        "attendance_status IS NULL" einen zweiten Wert zusaetzlich kennen.
        Antwort-message: "Eintrag zurückgesetzt" bzw. "Eintrag zurückgesetzt
        und N Punkte entfernt"; Form und Felder der Antwort unveraendert.
        ALT-APP-VERTRAG: Ausgelieferte Fassungen schicken immer einen der drei
        Werte — fuer sie aendert sich nichts. Eine Bedeutung bekommt allein
        der Fall, der bisher 400 lieferte.
        ADDITIV 15.09.2026 (Migration 151): Aendert der Aufruf Status oder
        Grund, setzt die Route zusaetzlich checkin_quelle='manuell' und
        checked_in_at=NOW() — dieselbe Bedingung wie beim Urheber. Damit sind
        die drei Faelle unterscheidbar: 'manuell' (Leitung), 'qr'
        (Selbst-Check-in, POST /api/events/qr-checkin) und NULL (unbekannt,
        Altbestand). Ein manueller Eintrag nach einem QR-Check-in
        UEBERSCHREIBT die Quelle — es gilt, was zuletzt gesetzt wurde, sonst
        widersprechen sich die beiden Zeilen in der Anzeige. Eine reine
        NOTIZ-Aenderung laesst die Quelle in Ruhe: Ein Vermerk macht aus einem
        Selbst-Check-in keine Leitungsentscheidung.
        KEIN Buchungsstatus-Check (festgehalten 13.09.2026): Die Route setzt
        die Anwesenheit auch bei status='opted_out'. Das ist gewollt — die
        Leitung muss eine Selbstabmeldung nachtraeglich verbuchen koennen
        ("hatte sich abgemeldet, kam dann doch"). Der Buchungsstatus bleibt
        dabei 'opted_out' und wird NICHT umgeschrieben; die Abmeldung ist die
        Vorgeschichte des Eintrags. Anzeigen richten sich nach dem
        Anwesenheits-Status, sobald einer gesetzt ist.
        GEAENDERT 15.09.2026 (Migration 153) — DER BUCHUNGSSTATUS ZIEHT MIT:
        attendance_status='excused' setzt zusaetzlich status='excused',
        ein Wechsel auf 'present'/'absent' holt ihn von 'excused' zurueck auf
        'confirmed'. Grund: Am Buchungsstatus haengen Erinnerungen, Kapazitaet,
        Nachruecken und die Sortierung der Teilnehmerliste — solange er auf
        'confirmed' stand, war die Abmeldung fuer all das unsichtbar (die
        abgemeldete Person bekam Erinnerungen, belegte einen Platz, die
        Warteliste rueckte nicht nach, und sie stand in der Liste ganz oben).
        Umgeschaltet wird NUR zwischen 'confirmed'/'waitlist' und 'excused';
        'opted_out' (siehe oben), 'cancelled' und 'pending' bleiben
        unangetastet. 'waitlist' -> 'excused' -> zurueck landet auf
        'confirmed': Wer da war, hatte einen Platz.
        Zugleich wird abgemeldet_durch_absage=FALSE gesetzt — diese Abmeldung
        ist eine Einzelentscheidung und ueberlebt das Zuruecknehmen einer
        Terminabsage (dort steht TRUE, siehe PUT /api/events/{id}/cancel).
        ANTWORTFORM UNVERAENDERT: kein Feld entfaellt, keines wird umbenannt,
        keines wechselt den Typ — booking_status traegt lediglich einen WERT
        mehr. Ausgelieferte Fassungen (2.1.1) stuerzen daran nachgemessen
        nicht ab (alle Fundstellen haben Fallbacks); sie zeigen die Person als
        "Gebucht" und zaehlen sie an sieben Stellen nicht mit. Bei den zum
        Umstellungszeitpunkt sechs betroffenen Bestandsbuchungen bewusst
        hingenommen (Entscheidung Simon, 15.09.2026).
        ADDITIV 13.09.2026 (Migration 148): Jedes Schreiben haelt Urheber und
        Zeitpunkt fest. Festgehalten wird der aktuelle Stand, keine Historie.
        Am Request aendert sich nichts.
        GEAENDERT 13.09.2026 (Migration 149) — ZWEI URHEBER-PAARE: Bis dahin
        setzte JEDES Schreiben attendance_set_by/_at neu, auch wenn nur die
        Notiz geaendert wurde. Schrieb A den Grund und B spaeter die Notiz,
        ueberschrieb B damit A, und die Anzeige behauptete, B habe auch den
        Grund aufgenommen. Seither gilt attendance_set_by/_at fuer STATUS samt
        excuse_reason und note_set_by/_at fuer attendance_note. Geschrieben
        wird, was sich TATSAECHLICH geaendert hat (Vergleich mit dem Bestand
        per IS DISTINCT FROM), nicht, was mitgeschickt wurde — die Route
        verlangt attendance_status bei jedem Aufruf, "kam mit" heisst also
        nicht "wurde geaendert". Aendert ein Aufruf beides, werden beide Paare
        gesetzt; aendert er nichts, bleibt jeder Urheber stehen. Wird die
        Notiz geloescht, faellt ihr Paar auf NULL zurueck. Am Request aendert
        sich nichts.
        BEHOBEN 15.09.2026 — NACHRUECKEN: Eine Abmeldung durch die Leitung
        gibt den Platz frei (der Buchungsstatus zieht seit Migration 153 auf
        'excused' mit). Die naechste wartende Person derselben
        Kontingent-Seite rueckt jetzt nach, bekommt einen Push, traegt
        war_auf_warteliste und kommt in den Termin-Chat. Bis dahin rief diese
        Route bookingUtils gar nicht auf und der Platz verfiel. An einem
        abgesagten Termin rueckt niemand nach. Die Antwortform aendert sich
        nicht.
      x-berechtigung:
        rollen: [org_admin, admin]
        x-geaendert: >
          16.09.2026: von requireTeamer auf requireAdmin umgestellt.
          Terminverwaltung ist Leitungssache (Entscheidung Simon);
          Teamer:innen erhalten hier 403 "Keine Berechtigung".
          Unveraendert fuer das Team: POST /{id}/generate-qr,
          GET /{id}/attendance-count, GET /cancelled und die eigene
          Zusage POST /api/teamer/events/{id}/zusage.
        middleware: [verifyTokenRBAC, requireAdmin]
        org-scope: true
        objekt-pruefung: "Event + Buchung org-gescopt (404 sonst)"
        jahrgangs-bindung: >
          Seit 14.09.2026: darfTermin (can_view-Stufe) — ein Termin aus einem
          fremden Jahrgang wird mit 403 "Kein Zugriff auf diesen Termin"
          abgewiesen. Reine Teamer-Termine (teamer_only) und Termine ohne
          Jahrgangszuordnung bleiben allen Leitungsrollen offen; org_admin und
          super_admin sind ausgenommen.
        hinweis: >
          Punkte-Wege e) und k) der Analyse.
          BEHOBEN 14.09.2026: Vorher kein Jahrgang-Check — Anwesenheit,
          Punktegutschrift und Punkteentzug waren an jedem Termin der
          Organisation moeglich, obwohl die Liste ihn ausblendet.
      parameters:
        - { $ref: '#/components/parameters/pathId' }
        - name: participantId
          in: path
          required: true
          schema: { type: integer, description: "ID der Buchung (event_bookings.id)" }
          description: "ID des Buchungs-Eintrags (event_bookings.id), nicht die User-ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attendance_status]
              properties:
                attendance_status: { type: string, enum: [present, absent, excused] }
                excuse_reason:
                  type: string
                  maxLength: 500
                  description: "Grund der nachgetragenen Abmeldung; nur bei attendance_status='excused' gespeichert, sonst geleert"
                attendance_note:
                  type: string
                  maxLength: 500
                  description: "Freie Notiz zur Anwesenheit, unabhaengig vom Status. Feld weglassen -> bestehende Notiz bleibt (so schicken alte App-Fassungen); Text -> Notiz wird gesetzt; leerer String -> Notiz wird geloescht"
      responses:
        "200": { description: "message, points_awarded / points_removed" }
        "400": { description: Ungueltiger Status oder Punkt-Typ im Jahrgang deaktiviert }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: "Kein Zugriff auf diesen Termin (seit 14.09.2026, fremder Jahrgang)" }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

