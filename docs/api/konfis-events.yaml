        (Fix 22.08.2026) - Konfis nutzen die anonymisierte Route
        /api/konfi/events/:id/participants.
        BEHOBEN 25.08.2026 (Befund 2): registered_count/pending_count zählen
        jetzt konfi-rein wie die Liste (vorher inkl. Teamer - Detail konnte
