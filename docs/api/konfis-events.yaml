      responses:
        "200": { description: "is_registered, registration_status, can_register, event_status, confirmed_count, waitlist_count, waitlist_position, max_participants, waitlist_enabled. can_register folgt seit 26.09.2026 derselben Regel wie in GET /api/konfi/events: eine abgemeldete Zeile (excused/opted_out) sperrt nicht." }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/events/{id}/participants:
    get:
      tags: ["Termine (Konfis)"]
      summary: Anonymisierte Teilnehmerliste eines Events (Konfi-Sicht)
      description: >
        Bestaetigte Teilnehmer als "Vorname N." (anonymisiert), Teamer werden
        herausgefiltert. Organisation wird geprüft (Fix 22.08.2026).
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Event muss zur eigenen Org gehören; Namen anonymisiert"
        hinweis: "Kein Jahrgang-Check - anonymisierte Listen beliebiger Org-Events abrufbar (nur Hinweis)."
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "Array {id, display_name: 'Vorname N.'}" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/events/{id}/timeslots:
    get:
      tags: ["Termine (Konfis)"]
      summary: Zeitslots eines Events (Konfi-Sicht)
      description: >-
        Identische Antwort wie GET /api/events/{id}/timeslots. Seit 01.09.2026
        rechnen beide Routen ueber utils/terminAnmeldeStatus.js (ladeZeitfenster);
        vorher lag dieselbe Query zweimal im Code. Unterschied bleibt allein der
        Rollen-Guard: hier nur Konfis.
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Event org-gescopt; nur Slot-Daten + Zähler"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: "Array von Timeslots (et.*, registered_count, waitlist_count); leer wenn has_timeslots=false" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/events/{id}/register:
    post:
      tags: ["Termine (Konfis)"]
      summary: Für Event anmelden (primaere Konfi-Buchungsroute)
      description: >
        Transaktional (FOR UPDATE). Prueft Doppelbuchung (409),
        Konfirmations-Sperre (nur EIN Konfirmationstermin, 409),
        Registrierungsfenster, Timeslot-Pflicht und Kapazität (Konfi- und
        Teamer-Kontingent getrennt). Ergebnis confirmed oder waitlist. Traegt
        die Person seit 24.08.2026 in den Chat zum Termin ein, falls es einen
        gibt (idempotent) — vorher kam nur hinein, wer beim Anlegen des Chats
        schon gebucht war.


        Seit 27.08.2026 zusaetzlich: reine Teamer-Termine (teamer_only)
        werden mit 403 abgelehnt, abgesagte Termine (cancelled) mit 400.
        Beide Pruefungen fehlten hier, waehrend der regulaere Weg sie hatte
        (Befund N1, behoben). Das ABMELDEN von einem abgesagten Termin bleibt
        bewusst moeglich (DELETE, siehe unten) — sonst waeren bereits
        Angemeldete eingesperrt.


        Seit 01.09.2026 teilt sich diese Route den Buchungskern mit
        POST /api/events/{id}/book (utils/bookingUtils.bucheTermin). Die
        Antwortform bleibt unveraendert (200 mit message, registration_id,
        status, timeslot_id; kein error_code). Drei Fehler dieser Route sind
        dabei behoben: Zeitslot-Plaetze wurden ohne Rollen- und ohne
        deleted_at-Filter gezaehlt (geloeschte Konten belegten Plaetze), der
        Zeitslot wurde nicht gesperrt (zwei gleichzeitige Anmeldungen konnten
        denselben letzten Platz bekommen) und die Gemeinde des Zeitslots
        wurde nicht geprueft (jetzt 400 "Ungueltiger Zeitslot").
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "bucht nur sich selbst; Event + Timeslot org-gescopt (Slot mit FOR UPDATE); nicht teamer_only, nicht cancelled"
        hinweis: "Kein Jahrgang-Check - Konfi kann sich per API auch für Events fremder Jahrgänge der Org anmelden (nur Hinweis)."
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timeslot_id: { type: integer, description: Pflicht bei Timeslot-Events }
      responses:
        "200": { description: "message, registration_id, status (confirmed|waitlist), timeslot_id" }
        "400": { description: "Anmeldefenster zu, Slot fehlt/voll ohne Warteliste, oder Termin abgesagt" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: "Keine Konfi-Rolle, oder Termin nur für Teamer:innen" }
        "404": { description: Event/Zeitslot nicht gefunden }
        "409": { description: Bereits angemeldet oder bereits ein Konfirmationstermin gebucht }
        "500": { $ref: '#/components/responses/ServerError' }
    delete:
      tags: ["Termine (Konfis)"]
      summary: Von Event abmelden (bis 2 Tage vorher)
      description: >
        Loescht die eigene Buchung (Pflicht-Events nur per Opt-out, 400),
        entfernt die Person aus dem Event-Chat (seit 24.08.2026 — vorher
        blieb sie dort Teilnehmerin; wer nachrueckt, wird umgekehrt
        eingetragen), protokolliert die Abmeldung
        (event_unregistrations, optionaler reason), laesst bei freiem
        bestaetigtem Platz von der Konfi-Warteliste nachruecken und
        benachrichtigt Admins.
        FRIST NUR FUER BESTAETIGTE PLAETZE (26.09.2026, Audit Screens
        BF-02): Die Zwei-Tage-Frist schuetzt die Planung der Leitung vor
        kurzfristig frei werdenden Plaetzen. Wer auf der Warteliste steht
        (status waitlist/pending), belegt keinen und darf jederzeit
        herunter -- vorher endete das in den letzten 48 Stunden mit 400,
        die Wartende blieb auf der Liste und wurde beim Nachruecken als
        abwesend verbucht.
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigene Buchung"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, description: Optionaler Abmeldegrund }
      responses:
        "200": { description: Abmeldung erfolgreich }
        "400": { description: Pflicht-Event, nicht angemeldet oder Frist (2 Tage) verstrichen }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/events/{id}/opt-out:
    post:
      tags: ["Termine (Konfis)"]
      summary: Von Pflicht-Event abmelden (Opt-out mit Begruendung)
      description: >
        Status confirmed -> opted_out. Begruendung min. 5 Zeichen. Nur
        zukuenftige Pflicht-Events. Wiederholbar: Wer bereits abgemeldet ist,
        bekommt 200 mit bereits_abgemeldet=true statt eines Fehlers — ein
        Doppelversand aus der Offline-Warteschlange soll nicht als Fehlschlag
        ankommen (28.08.2026). Der Grund der ersten Abmeldung bleibt stehen.
        Der frei gewordene Platz wird nachbesetzt: Die erste wartende Konfi
        rueckt nach, bekommt einen Push und kommt in den Termin-Chat
        (behoben 15.09.2026 — bis dahin verfiel der Platz). An einem
        abgesagten Termin rueckt niemand nach. Die Route laeuft dafuer seit
        dem 15.09.2026 transaktional.
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigene Buchung; Event org-gescopt"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 5 }
      responses:
        "200": { description: "Abmeldung erfolgreich; bereits_abgemeldet=true wenn schon vorher abgemeldet" }
        "400": { description: Begruendung zu kurz, kein Pflicht-Event, Event vorbei oder gar keine Anmeldung vorhanden }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/events/{id}/opt-in:
    post:
      tags: ["Termine (Konfis)"]
      summary: Opt-out bei Pflicht-Event rueckgaengig machen
      description: >
        Status opted_out -> confirmed (Begruendung bleibt gespeichert).


        ABGESAGTE TERMINE seit 16.09.2026 mit 400 "Dieser Termin ist
        abgesagt" (Befund, live am Geraet reproduziert und behoben): Der
        cancelled-Guard fehlte hier als einzigem Anmelde-Weg. Wer sich von
        einem Pflichttermin abgemeldet hatte und danach die Absage erlebte,
        konnte sich ueber diese Route wieder anmelden und stand anschliessend
        als 'confirmed' an einem Termin, der nicht stattfindet. Simons
        Entscheidung: Zu einem abgesagten Termin meldet sich niemand an,
        weder Konfi noch Leitung.


        Das Zuruecknehmen der Absage (PUT /api/events/{id}/reaktivieren) ist
        davon NICHT betroffen: Es stellt die Buchungen mit einem eigenen
        UPDATE her (utils/bookingUtils.hebeAbsageAbmeldungenAuf) und laeuft
        nicht ueber diese Route.
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigene Buchung; Event org-gescopt"
      parameters: [ { $ref: '#/components/parameters/pathId' } ]
      responses:
        "200": { description: Wieder angemeldet }
        "400": { description: "Termin abgesagt (seit 16.09.2026), kein Pflicht-Event, Event vorbei oder kein Opt-out vorhanden" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/tageslosung:
    get:
      tags: ["Konfi-Profil & Dashboard"]
      summary: Tageslosung in der eigenen Bibeluebersetzung
      description: Mit DB-Cache und mehrstufigem Fallback (letzte gecachte Losung, statischer Vers).
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: false
        objekt-pruefung: "liest nur eigene Uebersetzungs-Praeferenz"
      responses:
        "200": { description: "success, data (losung, lehrtext, translation), ggf. fallback: true" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }

  /api/konfi/bible-translation:
    put:
      tags: ["Konfi-Profil & Dashboard"]
      summary: Bibeluebersetzung für Tageslosung setzen
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC, validateBibleTranslation]
        org-scope: false
        objekt-pruefung: "nur eigenes Profil"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [translation]
              properties:
                translation: { type: string, enum: [LUT, ELB, GNB, BIGS, NIV, LSG, RVR60] }
      responses:
        "200": { description: "success, translation" }
        "400": { description: Ungueltige Uebersetzung }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/konfi/konfsprueche:
    get:
      tags: ["Konfi-Profil & Dashboard"]
      summary: Kuratierte Konfsprueche auflisten (org-gefiltert)
      description: Aktive Sprueche (global oder org-eigen) mit allen 4 Uebersetzungen (fehlende als leerer String).
      x-berechtigung:
        rollen: [konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "keine personenbezogenen Daten"
      responses:
        "200": { description: "Array (id, reference, book, chapter, verse, uebersetzungen{luther2017,bigs,gute_nachricht,elberfelder})" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  # ===================================================================
  # backend/routes/events/ (seit 28.08.2026 aufgeteilt, Prefix /api/events)
  # Schreibende Verwaltungs-Routen: requireAdmin (org_admin, admin).
  #   GEAENDERT 16.09.2026: vorher requireTeamer (zusaetzlich 'teamer').
  #   Terminverwaltung ist Leitungssache -- anlegen, aendern, loeschen,
  #   absagen, Absagegrund, reaktivieren, Serien, Teilnehmerverwaltung,
  #   Anwesenheit und das Anlegen des Termin-Chats.
  # Weiterhin requireTeamer (org_admin, admin, teamer):
  #   POST /{id}/generate-qr, GET /{id}/attendance-count, GET /cancelled.
  # Lese-/Buchungsrouten: nur rbacVerifier (alle Rollen, inkl. Konfi).
  # ===================================================================
  /api/events:
    get:
      tags: ["Termine (Verwaltung)"]
      summary: Alle Events der Organisation (rollenabhaengig gefiltert)
      description: >
        Liefert Events der aktiven Org mit Zaehlern (Konfi- und Teamer-Kontingent
        getrennt), Kategorien, Jahrgängen, registration_status und eigener
        Buchung (is_registered, booking_status, attendance_status).
        Datumsfenster: letzte 12 Monate + Zukunft (?all=true für alles).
        Nachgelagerte Filter: teamer UND admin (admin seit 01.09.2026,
        Simons Regel vom 31.08.) sehen jahrgangs-gebundene Events nur für
        can_view-Jahrgänge (allgemeine und teamer_only-Events immer); ohne
        jede Zuweisung kommt der Header X-Kein-Jahrgang-Zugewiesen mit.
        GEAENDERT 08.09.2026: teamer_needed zaehlt NICHT mehr als eigener
        Sichtbarkeitsgrund. Ein Termin mit "Teamer:innen gesucht" an einem
        fremden Jahrgang liesse sich seit derselben Aenderung ohnehin nicht
        mehr buchen (403 aus darfTeamerAnDiesenTermin) -- sichtbar bliebe ein
        Termin, der beim Antippen abgewiesen wird. org_admin sieht alles. Konfis sehen
        keine teamer_only-Events.
        NEU 27.08.2026: chat_room_id liefert den Event-Chatraum, aber NUR wenn
        die abrufende Person Teilnehmer des Raums ist (sonst null) — dieselbe
        Regel wie in der Konfi-Liste.
        NEU 15.09.2026: cancelled_reason (freiwilliger Absagegrund),
        cancelled_by und cancelled_by_name (wer abgesagt hat) kommen additiv
        mit — alle nullable. NULL beim Namen heisst "unbekannt": Termine, die
        vor Migration 150 abgesagt wurden, haben keinen Urheber.
        ADDITIV 16.09.2026: abgemeldet_count (integer) — abgemeldete KONFIS,
        Selbstabmeldung ('opted_out') und Abmeldung durch die Leitung
        ('excused') zusammen, aus event_booking_stats
        (konfi_opted_out + konfi_excused). Konfi-rein wie registered_count
        daneben; das Team-Kontingent zaehlt nicht mit. NICHT zu verwechseln
        mit total_participants, das ausdruecklich ALLE Buchungen beider
        Kontingente meint. Kein vorhandenes Feld wurde entfernt, umbenannt
        oder im Typ geaendert.
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "teamer und admin: Jahrgangs-Filter über assigned_jahrgaenge mit can_view (admin seit 01.09.2026); org_admin/is_super_admin ungefiltert; Konfi: teamer_only ausgeblendet"
        hinweis: >
          # BEHOBEN 22.08.2026 (war LÜCKE L1): qr_token wird nicht mehr
          ausgeliefert - weder an Konfis noch an die Leitung. Der Token kommt
          ausschliesslich über POST /api/events/:id/generate-qr, das die
          QR-Anzeige ohnehin nutzt. Vorher lag er in der Liste und war damit
          für jeden Konfi lesbar (Selbst-Checkin aus der Ferne).
          # BEHOBEN 22.08.2026 (war LÜCKE L5): Der Jahrgangs-Filter greift
          jetzt IMMER. Vorher entfiel er ohne jede Zuweisung und die Teamer:in
          sah alle Events der Organisation.
      parameters:
        - name: all
          in: query
          required: false
          schema: { type: string, enum: ["true"] }
          description: "true: gesamte Termin-Historie statt nur letztes Jahr plus Zukunft"
      responses:
        "200": { description: "Array von Events (e.* ohne qr_token, Zaehler, categories[], jahrgaenge[], registration_status, is_registered, booking_status, attendance_status, material_count, pending_bookings_count, chat_room_id)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "500": { $ref: '#/components/responses/ServerError' }
    post:
      tags: ["Termine (Verwaltung)"]
      summary: Event erstellen
      description: >
        Legt ein Event an inkl. Kategorien, Jahrgängen und optionalen
        Timeslots. Serverseitige Zwangsregeln: Pflicht-/Konfirmations-Events
        ohne Punkte und ohne Timeslots; Pflicht-Events ohne Warteliste und mit
        Auto-Enrollment aller Konfis der Jahrgänge; teamer_needed/teamer_only
        schliessen sich aus; checkin_window 5-120 Minuten. Cross-Org-Referenzen
        (jahrgang_ids, category_ids) werden abgewiesen.
      x-berechtigung:
        rollen: [org_admin, admin]
        x-geaendert: >
          16.09.2026: von requireTeamer auf requireAdmin umgestellt.
          Terminverwaltung ist Leitungssache (Entscheidung Simon);
          Teamer:innen erhalten hier 403 "Keine Berechtigung".
          Unveraendert fuer das Team: POST /{id}/generate-qr,
          GET /{id}/attendance-count, GET /cancelled und die eigene
          Zusage POST /api/teamer/events/{id}/zusage.
        middleware: [verifyTokenRBAC, requireAdmin, validateCreateEvent]
        org-scope: true
        objekt-pruefung: "jahrgang_ids/category_ids müssen der eigenen Org gehören"
        jahrgangs-bindung: >
          Seit 14.09.2026: Jeder Jahrgang in jahrgang_ids muss ein eigener sein
          (darfJahrgang, can_edit-Stufe) — sonst 403 "Kein Zugriff auf diesen
          Jahrgang". Ein Termin ohne jahrgang_ids bleibt allen Leitungsrollen
          offen (allgemeiner Termin), ebenso ein reiner Teamer-Termin
          (teamer_only), der an keinem Jahrgang haengt. org_admin und
          super_admin sind ausgenommen.
        hinweis: >
          BEHOBEN 14.09.2026: Vorher durften Teamer:innen und admins Termine
          für JEDEN Jahrgang der Organisation anlegen — und sahen sie danach
          nicht mehr, weil die Liste sie ausblendet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, event_date]
              properties:
                name: { type: string, maxLength: 200 }
                description: { type: string }
                event_date: { type: string, format: date-time }
                event_end_time: { type: string, format: date-time }
                location: { type: string }
                location_maps_url: { type: string }
                points: { type: integer }
                point_type: { type: string, enum: [gottesdienst, gemeinde], default: gemeinde }
                type: { type: string, default: event }
                max_participants: { type: integer, description: "Konfi-Plaetze; Pflicht ausser bei mandatory/teamer_only" }
                registration_opens_at: { type: string, format: date-time }
                registration_closes_at:
                  type: string
                  format: date-time
                  description: >
                    SEIT 17.09.2026 geprueft: Liegt event_date in der ZUKUNFT
                    und registration_closes_at in der Vergangenheit, antwortet
                    die Route mit 400 — der Termin waere ab dem Anlegen
                    geschlossen (registration_status='closed'). Bei einem
                    event_date in der Vergangenheit (nachtraeglich eingetragene
                    Termine) bleibt ein vergangener Anmeldeschluss erlaubt;
                    null (kein Anmeldefenster) ebenso.
                has_timeslots: { type: boolean }
                timeslots: { type: array, items: { type: object, properties: { start_time: { type: string }, end_time: { type: string }, max_participants: { type: integer } } } }
                waitlist_enabled: { type: boolean, default: true }
                max_waitlist_size: { type: integer, default: 10 }
                category_ids: { type: array, items: { type: integer } }
                jahrgang_ids: { type: array, items: { type: integer } }
                mandatory: { type: boolean }
                is_konfirmation: { type: boolean }
                bring_items: { type: string }
                checkin_window: { type: integer, minimum: 5, maximum: 120, default: 30 }
                teamer_needed: { type: boolean }
                teamer_only: { type: boolean }
                teamer_max_participants: { type: integer, description: "0 = unbegrenzt" }
                teamer_waitlist_enabled: { type: boolean, default: true }
                teamer_max_waitlist_size: { type: integer, default: 10 }
      responses:
        "201": { description: "id + message" }
        "400": { description: "Validierungs-/Regel-Fehler (fehlende Felder, fremde IDs, Kontingent ungueltig; seit 17.09.2026 auch: Anmeldeschluss abgelaufen, waehrend der Termin noch bevorsteht)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: "Kein Zugriff auf diesen Jahrgang (seit 14.09.2026, wenn jahrgang_ids einen fremden Jahrgang nennt)" }
        "409": { description: Unique-Konflikt }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/cancelled:
    get:
      tags: ["Termine (Verwaltung)"]
      summary: Abgesagte Events auflisten (Leitungssicht)
      description: >
        GEAENDERT 2026-08-28: registered_count/waitlist_count/unprocessed_count
        zaehlen jetzt NUR Konfis, wie an allen anderen Stellen. Vorher hatte
        diese Route als einzige keinen Rollenfilter — derselbe Feldname
        bedeutete hier "Konfis und Teamer", in der normalen Liste "nur Konfis".
        Die Teamer stehen jetzt getrennt in teamer_count,
        teamer_waitlist_count und teamer_unprocessed_count. Grundlage ist wie
        bei den uebrigen Zaehlstellen die View event_booking_stats.
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "kein Jahrgang-Filter (alle abgesagten Events der Org)"
      responses:
        "200": { description: "Array abgesagter Events (e.*, Konfi-Zaehler registered_count/waitlist_count/unprocessed_count, Teamer-Zaehler teamer_count/teamer_waitlist_count/teamer_unprocessed_count, categories[], jahrgaenge[], registration_status='cancelled'; seit 15.09.2026 zusaetzlich cancelled_reason, cancelled_by und cancelled_by_name — alle nullable)" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "500": { $ref: '#/components/responses/ServerError' }

  /api/events/qr-checkin:
    post:
      tags: ["Termine (Verwaltung)"]
      summary: Selbst-Check-in per QR-Token (vergibt Event-Punkte)
      description: >
        Der eingeloggte User checkt sich mit dem QR-Token des Events ein.
        Prueft Token-Signatur (QR_SECRET) UND Abgleich mit events.qr_token,
        Organisation, Zeitfenster (event_date +/- checkin_window Minuten) und
        bestaetigte Buchung. Setzt attendance_status='present'. Konfis
        erhalten bei points > 0 und nicht-Pflicht-Event die Event-Punkte
        (einmalig, ON CONFLICT DO NOTHING) inkl. Badge-/Level-Check; Teamer
        werden nur als anwesend verbucht.
        KEIN Urheber (13.09.2026, Migration 148): attendance_set_by/_at
        bleiben hier bewusst NULL. Anders als beim Verbuchen durch die Leitung
        checkt sich die Person SELBST ein; die Spalte beantwortet "wer von uns
        hat das eingetragen" und hat darauf keine Antwort. Die Anzeige laesst
        die Urheber-Zeile dann weg.
        QUELLE STATT NAME (15.09.2026, Migration 151): Die Route setzt
        zusaetzlich checkin_quelle='qr' und checked_in_at=NOW(). Damit ist ein
        Selbst-Check-in vom Altbestand unterscheidbar, der ebenfalls keinen
        Urheber traegt -- vorher standen beide im selben NULL. Die Anzeige
        macht daraus "Eingecheckt per QR-Code, 15.09.", ohne eine Person zu
        benennen. Der manuelle Weg setzt 'manuell' (siehe PUT
        /api/events/{id}/participants/{participantId}/attendance); NULL heisst
        weiterhin unbekannt. Rein additiv, kein Backfill.
        ADDITIV 15.09.2026 (Migration 153) — ABGEMELDETE WERDEN ABGEWIESEN:
        Wer von der Leitung abgemeldet wurde, traegt status='excused' und
        bekommt 400 mit error_type 'excused' ("Du wurdest von diesem Termin
        abgemeldet"). Vorher fiel dieser Fall in den Sammelzweig
        'not_confirmed', dessen Text die Warteliste beschreibt. Erlaubt wird
        der Check-in bewusst NICHT: Er ist die Bestaetigung einer bestehenden
        Anmeldung, und es gibt keine mehr — sonst koennte eine krank gemeldete
        Person ihre Abmeldung selbst aufheben und sich Punkte gutschreiben.
        Der Rueckweg laeuft ueber die Leitung (PUT .../attendance mit
        'present', das holt status auf 'confirmed' zurueck). Ein neuer
        error_type ist ein neuer WERT, kein neues Feld; ausgelieferte
        Fassungen zeigen den mitgelieferten error-Text.
      x-berechtigung:
        rollen: [org_admin, admin, teamer, konfi]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "nur eigene Buchung (event_bookings des Token-Users); Event-Org muss der aktiven Org entsprechen"
        hinweis: "Punkte-Selbstvergabe-Weg g) der Analyse. Sicherheit hängt an der Geheimhaltung des qr_token; seit 22.08.2026 wird dieser nur noch über generate-qr ausgegeben (siehe BEHOBEN L1 in GET /api/events)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, description: JWT aus dem QR-Code }
      responses:
        "200": { description: "message, event_name, event_id, points_awarded (bzw. already_checked_in)" }
        "400": { description: "error_type: missing_token | invalid_token | too_early | too_late | not_registered | opted_out | excused (ADDITIV 15.09.2026, Migration 153: von der Leitung abgemeldet) | not_confirmed" }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { description: "error_type: wrong_organization" }
        "500": { $ref: '#/components/responses/ServerError' }

