# ============================================================================
# Konfi Quest API — Block 4: Stammdaten
# Dokumentiert: badges, levels, categories, jahrgaenge, settings, roles
# (27 Routen). organizations.js ist vollstaendig in verwaltung-auth.yaml
# dokumentiert und wird hier bewusst NICHT wiederholt (Liste am Dateiende).
# Stand: 2026-08-23, verifiziert am Code (Branch main-Stand des Repos)
# ============================================================================
#
# SCHWERPUNKT-ANALYSE
#
# 1. ROLLENHIERARCHIE (utils/roleHierarchy.js, Level 5..1):
#      super_admin(5) > org_admin(4) > admin(3) > teamer(2) > konfi(1)
#    Die Rollen-Helper in middleware/rbac.js sind reine Namens-Whitelists:
#      requireOrgAdmin = requireRole('org_admin')
#      requireAdmin    = requireRole('org_admin', 'admin')
#      requireTeamer   = requireRole('org_admin', 'admin', 'teamer')
#      requireSuperAdmin prüft req.user.is_super_admin (Rolle ODER DB-Flag)
#    Wichtig: die Rolle super_admin steht in KEINER dieser drei Whitelists.
#    Sie fällt in badges, categories und jahrgaenge deshalb mit 403 durch,
#    außer sie agiert per Multi-Org-Switch als org_admin/admin/teamer.
#
# 2. LESE-/SCHREIB-MUSTER DER STAMMDATEN:
#    - badges, categories, jahrgaenge: lesen requireTeamer, schreiben
#      requireAdmin. Einheitliches Muster, ueberall zusaetzlich
#      organization_id im WHERE (kein Cross-Org-Zugriff möglich).
#    - levels: KEINE Rollen-Middleware. Lesen darf jede authentifizierte
#      Rolle der Org (auch konfi), Schreiben prüft der Handler inline gegen
#      ['org_admin','admin'] — dieselbe Menge wie requireAdmin, nur anders
#      formuliert. Anders als bei den uebrigen Dateien fällt die Rolle
#      super_admin hier NICHT durch, weil es keinen requireRole-Guard gibt;
#      sie erhält beim Schreiben aber trotzdem 403 (Inline-Check).
#    - settings: lesen jede authentifizierte Rolle der Org, schreiben
#      requireOrgAdmin.
#    - roles: read-only, Inline-Rollen-Checks statt Middleware
#      (GET / und GET /:id: super_admin|org_admin; GET /list/assignable
#      zusaetzlich admin).
#
# 3. ORG-SCOPING: Alle 27 Routen dieser Datei filtern auf
#    req.user.organization_id — es gibt in diesem Block KEINE Route, die
#    Daten über Organisationsgrenzen hinweg liefert. Ausnahme in der
#    Wirkung, nicht im Scope: DELETE /levels/:id und DELETE
#    /admin/categories/:id prüfen die Verwendung über Zaehl-Queries, die
#    NICHT auf organization_id filtern (siehe S2/S3 unten).
#
# 4. TARGET_ROLE BEI BADGES: custom_badges kennt target_role
#    ('konfi' | 'teamer'). POST setzt default 'konfi'. Beim PUT wird
#    target_role NICHT mitgeschrieben — ein bestehender Teamer-Badge kann
#    per Update also nicht versehentlich zum Konfi-Badge werden, aber auch
#    nicht umgewidmet werden (siehe S4).
#
# BEFUNDE DIESES BLOCKS:
#  S1  GET /levels/konfi/{userId}: keinerlei Rollen- oder Selbst-Prüfung.
#      Jede authentifizierte Person der Organisation — auch jeder Konfi —
#      kann Punktestand, Level und Fortschritt JEDES anderen Konfis derselben
#      Organisation abrufen. Entspricht Befund N4 aus verwaltung-auth.yaml
#      und ist weiterhin offen.
#  S2  DELETE /levels/{id}: die Verwendungs-Prüfung zählt über
#      users.organization_id — korrekt org-gescopt. Aber der Zähler
#      berücksichtigt nur konfi_profiles.current_level_id; das Level wird
#      gelöscht, obwohl noch Konfis knapp darunter/darueber liegen. Fachlich
#      gewollt, hier nur zur Klarstellung dokumentiert.
#      BEHOBEN (2026-08-26, Befund M4 des Loeschlogik-Audits): die Prüfung
#      filterte zusaetzlich deleted_at IS NULL — trug ein SOFT-geloeschter
#      Konfi das Level, lief das DELETE in den FK-Fehler (kein ON DELETE am
#      current_level_id-FK) und antwortete 500. Jetzt zaehlt die Prüfung
#      ALLE Profile (auch soft-geloeschte) und liefert 409 mit Handlungs-
#      empfehlung; ein 23503 wird als Sicherheitsnetz ebenfalls auf 409
#      abgebildet.
#  S3  DELETE /admin/categories/{id}: die Verwendungs-Prüfung
#      (activity_categories/event_categories) filtert NICHT auf
#      organization_id. Da category_id systemweit eindeutig ist und die
#      DELETE-Query selbst org-gescopt ist, entsteht daraus KEIN
#      Datenabfluss und kein Fremdzugriff — die Prüfung kann aber theoretisch
#      zu streng sein, wenn dieselbe ID in einer anderen Org verwendet wuerde.
#      Praktisch nicht erreichbar (IDs sind global vergeben).
#  S4  PUT /admin/badges/{id}: das Feld target_role fehlt im UPDATE. Ein
#      versehentlich als 'konfi' angelegter Teamer-Badge laesst sich nur
#      durch Löschen und Neuanlegen korrigieren.
#  S5  PUT /admin/badges/{id}: is_active und is_hidden werden mit `!!wert`
#      gesetzt. Fehlt das Feld im Body, wird es still auf false gesetzt —
#      ein Teil-Update deaktiviert den Badge also unbeabsichtigt. Clients
#      müssen immer das vollstaendige Objekt senden.
#  S6  GET /settings: liefert alle Settings-Keys der Org an JEDE
#      authentifizierte Rolle, auch an Konfis. Inhaltlich sind das
#      Dashboard-Schalter und Wartelisten-Groessen — keine personenbezogenen
#      Daten; bewusst offen, damit das Konfi-Dashboard seine Widgets kennt.
#  S7  DELETE /admin/jahrgaenge/{id}?force=true löscht Chat-Räume samt
#      Nachrichten unwiderruflich. Der zugehoerige Datei-Cleanup (uploads/chat)
#      läuft ohne Entschluesselungs-Pfadpruefung und ignoriert Fehler still.
#  S8  POST /admin/jahrgaenge/{id}/matrix-email versendet Konfispruch- bzw.
#      Anwesenheitslisten ausschliesslich an die in users.email hinterlegte
#      Adresse der aufrufenden Person — kein frei waehlbarer Empfaenger. Das
#      ist der bewusste Schutz dieser Route.
# ============================================================================

openapi: 3.1.0
info:
  title: Konfi Quest API — Stammdaten (Block 4)
  version: "1.0"
  description: >
    Abzeichen (Badges), Level, Kategorien, Jahrgänge, Organisations-
    Einstellungen und Rollen. Alle Routen verlangen einen Bearer-JWT
    (15 Min), der von verifyTokenRBAC geprüft wird; die aktive Organisation
    kann per Header X-Active-Organization gewechselt werden. Saemtliche
    Abfragen sind auf req.user.organization_id gescopt.
servers:
  - url: https://konfi-quest.de
tags:
  - name: "Abzeichen"
    description: "Abzeichen-Verwaltung und die verdienten Abzeichen von Konfis und Teamer:innen."
  - name: "Benutzer & Rollen"
    description: "Team-Konten der Leitung: anlegen, ändern, Jahrgangszuweisung, Rollen. /admin/users und /users sind derselbe Router (Alias-Mount)."
  - name: "Jahrgänge"
    description: "Jahrgänge anlegen und verwalten, Anwesenheits-Matrix, Konfisprüche des Jahrgangs."
  - name: "Stammdaten & Einstellungen"
    description: "Kategorien, Level und Organisations-Einstellungen."
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT im Authorization-Header. Optional Header X-Active-Organization
        (Multi-Org): schaltet die aktive Organisation um, sofern der User dort
        Mitglied ist (sonst 403).
  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
  responses:
    Unauthorized:
      description: Kein/ungueltiges/abgelaufenes Token, inaktiver Account oder inaktive Organisation
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Rolle nicht erlaubt oder kein Zugriff auf das Objekt
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Objekt nicht gefunden (in der aktiven Organisation)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ServerError:
      description: Datenbank-/Serverfehler
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }

paths:
  # ==========================================================================
  # BADGES (backend/routes/badges.js — 6 Routen, Mount /api/admin/badges)
  # Muster: lesen requireTeamer, schreiben requireAdmin.
  # ==========================================================================
  /api/admin/badges/criteria-types:
    get:
      tags: ["Abzeichen"]
      summary: Katalog der verfuegbaren Badge-Kriterientypen (statisch, keine DB)
      description: >
        Liefert das im Code hinterlegte CRITERIA_TYPES-Objekt mit label,
        description und help je Kriterientyp. Enthaelt punktebasierte
        (total_points, gottesdienst_points, gemeinde_points, both_categories),
        aktivitaetsbasierte (activity_count, event_count,
        mandatory_event_count, unique_activities), spezifische
        (specific_activity, category_activities, activity_combination,
        time_based, streak, bonus_points) und den teamer-spezifischen Typ
        teamer_year. Rein statisch — kein Org-Bezug.
      responses:
        "200": { description: "Objekt Kriterientyp -> { label, description, help }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: false
        objekt-pruefung: "keine (statische Konstante)"
        hinweis: "Die Rolle super_admin steht nicht in der requireTeamer-Whitelist und erhält 403"

  /api/admin/badges:
    get:
      tags: ["Abzeichen"]
      summary: Alle Abzeichen der eigenen Organisation mit Vergabe-Zähler
      parameters:
        - name: target_role
          in: query
          required: false
          schema: { type: string, enum: [konfi, teamer] }
          description: >
            Optionaler Filter auf custom_badges.target_role. Ohne Angabe
            werden Konfi- UND Teamer-Abzeichen gemeinsam geliefert. Der Wert
            wird nicht gegen eine Whitelist geprüft, sondern als Parameter
            in die WHERE-Klausel gegeben (kein SQL-Injection-Risiko); ein
            unbekannter Wert liefert schlicht ein leeres Array.
      responses:
        "200": { description: "Array custom_badges.* + created_by_name + earned_count" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "WHERE cb.organization_id = req.user.organization_id"
        hinweis: "earned_count zählt user_badges OHNE Org-Filter — bei systemweit eindeutigen badge_id ist das korrekt, hängt aber an dieser Annahme"
    post:
      tags: ["Abzeichen"]
      summary: Neues Abzeichen anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, icon, criteria_type, criteria_value]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                icon: { type: string, description: "IonIcon-Name, z.B. trophy-outline" }
                description: { type: string }
                criteria_type: { type: string, description: "Einer der Werte aus GET /admin/badges/criteria-types" }
                criteria_value: { type: integer, minimum: 1, description: "Seit 24.08.2026 min. 1 — Wert 0 löste jedes Zähl-Kriterium sofort für alle aus" }
                criteria_extra: { type: object, description: "Zusatzparameter je Kriterientyp, wird als JSON gespeichert. Pflicht je nach Typ: specific_activity -> required_activity_name, activity_combination -> required_activities (nicht leer), category_activities -> required_category, time_based -> days oder weeks (seit 24.08.2026 validiert; vorher entstanden still unerreichbare Abzeichen)" }
                is_hidden: { type: boolean, default: false }
                color: { type: string, default: "#667eea" }
                target_role: { type: string, enum: [konfi, teamer], default: konfi }
      responses:
        "201": { description: "{ id, message }; Live-Update an Org-Admins UND Org-Konfis" }
        "400": { description: "Pflichtfeld fehlt oder Validierung verletzt (Name 2-100 Zeichen, criteria_value >= 1, fehlende Auswahl in criteria_extra je nach criteria_type)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateCreateBadge]
        org-scope: true
        objekt-pruefung: "organization_id und created_by werden aus dem Token gesetzt, nicht aus dem Body"
        hinweis: "criteria_type wird NICHT gegen CRITERIA_TYPES validiert — ein Tippfehler legt ein Abzeichen an, das nie vergeben wird"

  /api/admin/badges/{id}:
    get:
      tags: ["Abzeichen"]
      summary: Einzelnes Abzeichen der eigenen Organisation
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID des Abzeichens" }
      responses:
        "200": { description: "custom_badges.* + created_by_name + earned_count" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "WHERE cb.id = :id AND cb.organization_id = req.user.organization_id — fremde Org liefert 404, nicht 403"
    put:
      tags: ["Abzeichen"]
      summary: Abzeichen bearbeiten
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID des Abzeichens" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, icon, criteria_type]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                icon: { type: string }
                description: { type: string }
                criteria_type: { type: string }
                criteria_value: { type: integer, minimum: 1 }
                criteria_extra: { type: object, description: "Pflichtauswahl je nach criteria_type, wie beim POST" }
                is_active: { type: boolean, description: "Fehlt das Feld, wird es auf false gesetzt (siehe S5)" }
                is_hidden: { type: boolean, description: "Fehlt das Feld, wird es auf false gesetzt (siehe S5)" }
                color: { type: string, default: "#667eea" }
      responses:
        "200": { description: "Aktualisiert; Live-Update an Org-Admins UND Org-Konfis" }
        "400": { description: "Validierung verletzt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Abzeichen nicht in dieser Organisation" }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateUpdateBadge]
        org-scope: true
        objekt-pruefung: "WHERE id = :id AND organization_id = req.user.organization_id"
        hinweis: >
          S4: target_role wird vom UPDATE nicht erfasst und bleibt beim
          Anlagewert. S5: is_active/is_hidden werden per !!wert gesetzt —
          ein Teil-Update ohne diese Felder deaktiviert das Abzeichen still.
          criteria_value wurde hier (anders als beim POST) lange gar nicht
          geprüft — ohne Wert wurde NULL gespeichert und das Abzeichen ging
          an alle. Behoben 24.08.2026: jetzt wie beim POST >= 1 plus
          Pflichtauswahl in criteria_extra.
    delete:
      tags: ["Abzeichen"]
      summary: Abzeichen löschen (inklusive aller bereits vergebenen Exemplare)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID des Abzeichens" }
      responses:
        "200": { description: "Geloescht; Live-Update an Org-Admins UND Org-Konfis" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Abzeichen nicht in dieser Organisation" }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateBadgeId]
        org-scope: true
        objekt-pruefung: >
          Transaktional: erst DELETE FROM user_badges WHERE badge_id = :id
          (OHNE Org-Filter), dann DELETE FROM custom_badges WHERE id AND
          organization_id. Greift die zweite Löschung nicht (fremde Org),
          wird die Transaktion zurueckgerollt — die vergebenen Exemplare
          bleiben also erhalten.
        hinweis: "Bereits verdiente Abzeichen verschwinden bei allen Konfis ohne Rueckfrage; es gibt keine Verwendungs-Sperre wie bei Levels oder Kategorien"

  # ==========================================================================
  # LEVELS (backend/routes/levels.js — 5 Routen, Mount /api/levels)
  # Abweichendes Muster: KEINE Rollen-Middleware, Inline-Checks im Handler.
  # ==========================================================================
  /api/levels:
    get:
      tags: ["Stammdaten & Einstellungen"]
      summary: Alle Level der eigenen Organisation (aufsteigend nach Punktgrenze)
      responses:
        "200": { description: "Array levels.* (inkl. inaktiver Level), sortiert nach points_required ASC" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { description: "Fehler beim Laden der Level" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "WHERE organization_id = req.user.organization_id"
        hinweis: "Bewusst offen für Konfis — die Level-Leiste ist Teil des Konfi-Dashboards. Anders als GET /admin/badges liefert diese Route auch is_active = false"
    post:
      tags: ["Stammdaten & Einstellungen"]
      summary: Neues Level anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, title, points_required]
              properties:
                name: { type: string }
                title: { type: string }
                description: { type: string }
                points_required: { type: integer, minimum: 0, description: "Muss innerhalb der Organisation eindeutig sein" }
                icon: { type: string, default: "trophy-outline" }
                color: { type: string, default: "#3880ff" }
                reward_type: { type: string }
                reward_value: { type: string }
      responses:
        "201": { description: "Angelegtes Level (vollstaendige Zeile); Live-Update an Org-Admins" }
        "400": { description: "Pflichtfeld fehlt, points_required negativ, oder bereits ein Level mit dieser Punktzahl (auch als 23505-Unique-Violation)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Rolle nicht org_admin oder admin ('Keine Berechtigung zum Verwalten von Leveln')" }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, validateCreateLevel]
        org-scope: true
        objekt-pruefung: "Inline: ['org_admin','admin'].includes(req.user.role_name); organization_id und created_by aus dem Token"
        hinweis: "Der Inline-Check prüft strikt role_name — ein org_admin mit is_super_admin-Flag kommt durch (role_name bleibt org_admin), die Rolle super_admin selbst nicht"

  /api/levels/{id}:
    put:
      tags: ["Stammdaten & Einstellungen"]
      summary: Level bearbeiten
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID des Levels" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, title, points_required]
              properties:
                name: { type: string }
                title: { type: string }
                description: { type: string }
                points_required: { type: integer, minimum: 0 }
                icon: { type: string }
                color: { type: string }
                reward_type: { type: string }
                reward_value: { type: string }
                is_active: { type: boolean }
      responses:
        "200": { description: "Aktualisiertes Level (vollstaendige Zeile); Live-Update an Org-Admins" }
        "400": { description: "Pflichtfeld fehlt, points_required negativ, oder ein ANDERES Level hat bereits diese Punktzahl" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Rolle nicht org_admin oder admin" }
        "404": { description: "Level nicht in dieser Organisation" }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, validateUpdateLevel]
        org-scope: true
        objekt-pruefung: "Inline-Rollen-Check; Existenz-Query und UPDATE beide mit organization_id"
        hinweis: "icon und color werden ohne Fallback geschrieben — fehlen sie im Body, werden sie auf NULL gesetzt (anders als beim POST, der Defaults setzt)"
    delete:
      tags: ["Stammdaten & Einstellungen"]
      summary: Level löschen (nur wenn kein Konfi es aktuell trägt)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID des Levels" }
      responses:
        "200": { description: "Geloescht; Live-Update an Org-Admins" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Rolle nicht org_admin oder admin" }
        "404": { description: "Level nicht in dieser Organisation" }
        "409": { description: "Level noch vergeben: { error: 'Dieses Level ist noch vergeben — benenne es um oder ordne die betroffenen Konfis um.', usage_count }. Umbenennen (PUT) ist gefahrlos: vergebene Level haengen per ID an konfi_profiles.current_level_id, der neue Name erscheint sofort ueberall." }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, validateLevelId]
        org-scope: true
        objekt-pruefung: >
          Inline-Rollen-Check; Existenz-Query mit organization_id; die
          Verwendungs-Prüfung zählt konfi_profiles.current_level_id über
          users.organization_id (org-gescopt, seit 2026-08-26 BEWUSST
          inklusive soft-geloeschter Konfis — siehe Befund S2/M4 im Kopf).

  /api/levels/konfi/{userId}:
    get:
      tags: ["Stammdaten & Einstellungen"]
      summary: Level-Fortschritt eines Konfis (aktuelles Level, naechstes Level, Prozent)
      description: >
        Berechnet total_points aus gottesdienst_points und gemeinde_points,
        wobei nur die im Jahrgang aktivierten Kategorien
        (gottesdienst_enabled / gemeinde_enabled) mitzaehlen. Liefert
        zusaetzlich all_levels (nur is_active = true).
      parameters:
        - { name: userId, in: path, required: true, schema: { type: integer }, description: "User-ID des Konfis" }
      responses:
        "200": { description: "{ konfi_id, display_name, total_points, current_level, next_level, progress_percentage, points_to_next_level, all_levels }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "Konfi nicht in dieser Organisation oder geloescht" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "NUR WHERE u.id = :userId AND u.organization_id = req.user.organization_id AND u.deleted_at IS NULL — keine Rollen- und keine Selbst-Prüfung"
        # LUECKE (S1, identisch mit N4 aus verwaltung-auth.yaml, weiterhin offen):
        # jede authentifizierte Person der Organisation — auch jeder Konfi —
        # kann den Punktestand und Level-Fortschritt jedes anderen Konfis
        # derselben Organisation abrufen. userId ist eine fortlaufende
        # Ganzzahl, die Enumeration ist also trivial.

  # ==========================================================================
  # CATEGORIES (backend/routes/categories.js — 4 Routen,
  # Mount /api/admin/categories)
  # ==========================================================================
  /api/admin/categories:
    get:
      tags: ["Stammdaten & Einstellungen"]
      summary: Alle Kategorien der eigenen Organisation (alphabetisch)
      responses:
        "200": { description: "Array categories.* (id, name, description, type, organization_id)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "WHERE organization_id = req.user.organization_id"
    post:
      tags: ["Stammdaten & Einstellungen"]
      summary: Neue Kategorie anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                description: { type: string, maxLength: 500 }
                type: { type: string, enum: [gottesdienst, gemeinde, both], default: both }
      responses:
        "201": { description: "{ id, message }; Live-Update an Org-Admins" }
        "400": { description: "Name fehlt / Validierung verletzt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Kategoriename existiert bereits (Unique-Violation 23505)" }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateCreateCategory]
        org-scope: true
        objekt-pruefung: "organization_id aus dem Token"

  /api/admin/categories/{id}:
    put:
      tags: ["Stammdaten & Einstellungen"]
      summary: Kategorie bearbeiten
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID der Kategorie" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                description: { type: string, maxLength: 500 }
                type: { type: string, enum: [gottesdienst, gemeinde, both] }
      responses:
        "200": { description: "Aktualisiert; Live-Update an Org-Admins" }
        "400": { description: "Name fehlt / Validierung verletzt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Kategorie nicht in dieser Organisation" }
        "409": { description: "Kategoriename existiert bereits" }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateUpdateCategory]
        org-scope: true
        objekt-pruefung: "WHERE id = :id AND organization_id = req.user.organization_id"
        hinweis: "type ist im Body optional, wird aber ohne Fallback geschrieben — fehlt es, wird die Spalte auf NULL gesetzt"
    delete:
      tags: ["Stammdaten & Einstellungen"]
      summary: Kategorie löschen (nur wenn keiner Aktivität und keinem Event zugeordnet)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID der Kategorie" }
      responses:
        "200": { description: "Geloescht; Live-Update an Org-Admins" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Kategorie nicht in dieser Organisation" }
        "409": { description: "Kategorie ist X Aktivitaet(en) und/oder Y Event(s) zugeordnet" }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateCategoryId]
        org-scope: true
        objekt-pruefung: "DELETE mit organization_id im WHERE; die vorgelagerte Verwendungs-Prüfung zählt activity_categories und event_categories"
        hinweis: "S3: die Verwendungs-Prüfung filtert NICHT auf organization_id. Da category_id systemweit vergeben wird, ist das praktisch folgenlos — es entsteht kein Fremdzugriff, weil das DELETE selbst org-gescopt bleibt"

  # ==========================================================================
  # JAHRGAENGE (backend/routes/jahrgaenge.js — 7 Routen,
  # Mount /api/admin/jahrgaenge)
  # ==========================================================================
  /api/admin/jahrgaenge:
    get:
      tags: ["Jahrgänge"]
      summary: Alle Jahrgänge der eigenen Organisation mit Konfi- und Punkte-Zaehlern
      responses:
        "200": { description: "Array jahrgaenge.* + konfi_count, gottesdienst_points_total, gemeinde_points_total; sortiert nach name DESC" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
      x-berechtigung:
        rollen: [org_admin, admin, teamer]
        middleware: [verifyTokenRBAC, requireTeamer]
        org-scope: true
        objekt-pruefung: "WHERE j.organization_id = req.user.organization_id"
        hinweis: >
          KEINE Jahrgangs-Einschraenkung: ein Teamer sieht alle Jahrgänge
          der Organisation, nicht nur die ihm zugewiesenen
          (filterByJahrgangAccess wird hier nicht verwendet). Die
          Punkte-Summen zählen über konfi_profiles.jahrgang_id ohne
          eigenen Org-Filter — bei org-eindeutigen jahrgang_id korrekt.
    post:
      tags: ["Jahrgänge"]
      summary: Neuen Jahrgang anlegen (legt zugleich den Jahrgangs-Chat an)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                gottesdienst_enabled: { type: boolean, default: true }
                gemeinde_enabled: { type: boolean, default: true }
                konfspruch_enabled: { type: boolean, default: true }
                target_gottesdienst: { type: integer, minimum: 0, default: 10 }
                target_gemeinde: { type: integer, minimum: 0, default: 10 }
      responses:
        "201": { description: "Angelegter Jahrgang (vollstaendige Zeile); Live-Update an Org-Admins" }
        "400": { description: "Name fehlt / Validierung verletzt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Jahrgang-Name existiert bereits in dieser Organisation" }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateCreateJahrgang]
        org-scope: true
        objekt-pruefung: "organization_id aus dem Token; syncJahrgangChat legt den Chat an und synchronisiert Org-Admins, zugewiesene Admins/Teamer und Konfis"
        hinweis: "Ein Fehler beim Chat-Anlegen wird geloggt, laesst die Jahrgangs-Anlage aber bewusst nicht scheitern — der Jahrgang existiert dann ohne Chat"

  /api/admin/jahrgaenge/{id}:
    put:
      tags: ["Jahrgänge"]
      summary: Jahrgang bearbeiten (mit Warnungen bei Deaktivierung belegter Punkt-Kategorien)
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID des Jahrgangs" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 2, maxLength: 100 }
                gottesdienst_enabled: { type: boolean, description: "Nicht uebergeben = unveraendert (COALESCE)" }
                gemeinde_enabled: { type: boolean, description: "Nicht uebergeben = unveraendert (COALESCE)" }
                konfspruch_enabled: { type: boolean, description: "Nicht uebergeben = unveraendert (COALESCE)" }
                target_gottesdienst: { type: integer, minimum: 0 }
                target_gemeinde: { type: integer, minimum: 0 }
      responses:
        "200":
          description: >
            { message } und optional warnings[] — je ein Eintrag
            { type, affected_count, message }, wenn eine Punkt-Kategorie
            deaktiviert wird, obwohl Konfis darin bereits Punkte haben. Die
            Änderung wird trotzdem durchgeführt; die Warnung ist rein
            informativ.
        "400": { description: "Name fehlt / Validierung verletzt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Jahrgang nicht in dieser Organisation" }
        "409": { description: "Jahrgang-Name existiert bereits" }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateUpdateJahrgang]
        org-scope: true
        objekt-pruefung: "Vorab-Lookup und UPDATE beide mit organization_id"
        hinweis: "Das Konfirmationsdatum wird seit Phase 119 nicht mehr beschrieben; der Termin hängt am gebuchten is_konfirmation-Event des einzelnen Konfis"
    delete:
      tags: ["Jahrgänge"]
      summary: Jahrgang löschen (blockiert bei aktiven Konfis, Chat-Nachrichten nur per force)
      description: >
        Aktive Konfis (Rolle konfi) blockieren die Löschung immer.
        Befoerderte Ex-Konfis (Rolle teamer/admin) blockieren nicht — ihr
        konfi_profiles-Eintrag bleibt erhalten und wird lediglich vom
        Jahrgang gelöst (jahrgang_id = NULL), damit Punkte-Historie und
        Konfispruch weiter einsehbar bleiben. Enthaelt der Jahrgangs-Chat
        Nachrichten, ist force=true nötig; dann werden Chat-Raum,
        Nachrichten, Umfragen, Lesestatus und die zugehörigen Dateien
        entfernt.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID des Jahrgangs" }
        - name: force
          in: query
          required: false
          schema: { type: string, enum: ["true"] }
          description: "force=true löscht den Jahrgangs-Chat samt aller Nachrichten unwiderruflich"
      responses:
        "200": { description: "Geloescht; Live-Update an Org-Admins" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Jahrgang nicht in dieser Organisation" }
        "409": { description: "Aktive Konfis zugeordnet ODER Chat enthaelt Nachrichten ({ error, canForceDelete: true })" }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateJahrgangId]
        org-scope: true
        objekt-pruefung: >
          Das abschliessende DELETE ist mit organization_id gescopt. Die
          vorgelagerten Prüfungen und Chat-Loeschungen laufen über
          jahrgang_id OHNE eigenen Org-Filter — bei org-eindeutigen
          Jahrgangs-IDs korrekt, aber eine Reihenfolgen-Abhaengigkeit:
          faende der Handler den Jahrgang erst am Ende nicht in der eigenen
          Org, wären die Chat-Daten bereits gelöscht.
        hinweis: >
          S7: Die Chat-Löschung läuft NICHT in einer Transaktion
          (Einzel-Queries ohne BEGIN/COMMIT). Bricht sie in der Mitte ab,
          bleibt ein halb abgeraeumter Chat zurück. Datei-Loeschfehler
          werden nur geloggt.

  /api/admin/jahrgaenge/{id}/attendance-matrix:
    get:
      tags: ["Jahrgänge"]
      summary: Anwesenheitsmatrix eines Jahrgangs (Pflicht-Events x Konfis)
      description: >
        Liefert alle aktiven Konfis des Jahrgangs, alle nicht abgesagten
        Pflicht-Events mit Jahrgangs-Zuweisung und die dazugehoerigen
        Buchungen (status, attendance_status) als drei getrennte Arrays; die
        Matrix baut das Frontend daraus zusammen.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID des Jahrgangs" }
      responses:
        "200": { description: "{ jahrgang: { id, name }, konfis[], events[], bookings[] }" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Jahrgang nicht in dieser Organisation" }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateJahrgangId]
        org-scope: true
        objekt-pruefung: "Jahrgang, Konfis und Events werden alle drei mit organization_id geprüft; die Buchungs-Query ist über die zuvor org-gefilterten Event- und User-IDs eingegrenzt"
        hinweis: "teamer erhält hier 403 — die Anwesenheitsuebersicht ist bewusst auf org_admin und admin beschraenkt, obwohl GET /admin/jahrgaenge für teamer offen ist"

  /api/admin/jahrgaenge/{id}/sprueche:
    get:
      tags: ["Jahrgänge"]
      summary: Konfisprueche aller Konfis eines Jahrgangs (Listen-Wahl oder Freitext)
      description: >
        Loest je Konfi den gewaehlten Konfispruch auf: bei Listen-Wahl wird
        die Uebersetzung aus konfspruch_uebersetzungen nachgeladen (Spalte
        kp.konfspruch_translation, NICHT die Tageslosungs-Praeferenz
        users.bible_translation; Standard luther2017), bei Freitext werden Text
        und Pflicht-Referenz direkt geliefert. konfirmation_date stammt aus
        dem individuell gebuchten is_konfirmation-Event, nicht aus dem
        Jahrgang.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID des Jahrgangs" }
      responses:
        "200": { description: "Array { user_id, display_name, konfspruch, konfirmation_date }; konfspruch kann null sein" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Jahrgang nicht in dieser Organisation" }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateJahrgangId]
        org-scope: true
        objekt-pruefung: >
          Jahrgang und Konfis mit organization_id geprüft (u.deleted_at IS
          NULL, Rolle konfi). Die Konfispruch-Texte kommen aus
          konfsprueche mit is_active = true UND (organization_id IS NULL
          ODER organization_id = eigene Org) — der globale Spruch-Katalog
          ist bewusst org-uebergreifend lesbar, enthält aber nur
          Bibeltexte, keine personenbezogenen Daten.
        hinweis: "teamer erhält 403 — Konfisprueche sind persoenliche Angaben und bleiben auf org_admin/admin beschraenkt"

  /api/admin/jahrgaenge/{id}/matrix-email:
    post:
      tags: ["Jahrgänge"]
      summary: Anwesenheits- oder Spruchliste per E-Mail an die eigene Adresse senden
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer }, description: "ID des Jahrgangs" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  type: string
                  enum: [anwesenheit, sprueche]
                  description: >
                    anwesenheit = je Konfi present_count/total_count über
                    alle nicht abgesagten Pflicht-Events des Jahrgangs;
                    sprueche = Konfispruch-Liste wie GET /sprueche.
      responses:
        "200": { description: "{ success: true }" }
        "400": { description: "type ungueltig ODER die aufrufende Person hat keine E-Mail-Adresse hinterlegt" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Jahrgang nicht in dieser Organisation" }
        "502": { description: "SMTP-Fehler — E-Mail konnte nicht versendet werden" }
        "500": { description: "Fehler beim Senden der E-Mail" }
      x-berechtigung:
        rollen: [org_admin, admin]
        middleware: [verifyTokenRBAC, requireAdmin, validateMatrixEmail]
        org-scope: true
        objekt-pruefung: >
          S8: Der Empfaenger ist NICHT frei waehlbar — es wird
          ausschliesslich users.email der aufrufenden Person geladen und
          angeschrieben. Fehlt sie, bricht die Route mit 400 ab. Damit
          laesst sich die Route nicht als Versand-Relais missbrauchen.
        hinweis: "Kein eigener Rate-Limiter; nur der globale General-Limiter (2000/15min). Ein Admin kann sich also viele Mails schicken — Missbrauchspotenzial gegen Dritte besteht wegen S8 nicht"

  # ==========================================================================
  # SETTINGS (backend/routes/settings.js — 2 Routen, Mount /api/settings)
  # ==========================================================================
  /api/settings:
    get:
      tags: ["Stammdaten & Einstellungen"]
      summary: Einstellungen der eigenen Organisation (typisiert aufbereitet)
      description: >
        Liefert alle settings-Zeilen der Organisation als flaches Objekt.
        dashboard_section_order und teamer_dashboard_section_order werden als
        JSON geparst (mit Fallback auf die Standard-Reihenfolgen), alle Keys
        mit Praefix dashboard_show_ / teamer_dashboard_show_ als Boolean.
        Alles Uebrige bleibt String.
        BEHOBEN 27.08.2026 (Befund N7): waitlist_enabled und
        max_waitlist_size wurden hier als Organisations-Einstellung
        ausgeliefert, aber von keiner Buchungslogik gelesen — die
        Wartelisten-Logik haengt ausschliesslich an den gleichnamigen Feldern
        des jeweiligen Termins (events.waitlist_enabled). Ersatzlos entfernt.
      responses:
        "200": { description: "Objekt key -> Wert (typisiert)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
      x-berechtigung:
        rollen: [alle authentifizierten]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "WHERE organization_id = req.user.organization_id — auch super_admin wird auf die aktive Org gescopt, sonst wuerden Keys mehrerer Orgs kollidieren"
        hinweis: "S6: bewusst für alle Rollen offen, weil Konfi- und Teamer-Dashboards ihre Widget-Schalter daraus lesen. Inhalt sind Anzeige-Einstellungen, keine personenbezogenen Daten"
    put:
      tags: ["Stammdaten & Einstellungen"]
      summary: Einstellungen der eigenen Organisation setzen (Teil-Update)
      description: >
        Nur die im Body vorhandenen Felder werden per Upsert geschrieben
        (ON CONFLICT (organization_id, key)); nicht uebergebene Keys bleiben
        unverändert. Anschliessend geht ein Live-Update 'dashboard' an die
        gesamte Organisation.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dashboard_show_konfirmation: { type: boolean }
                dashboard_show_events: { type: boolean }
                dashboard_show_losung: { type: boolean }
                dashboard_show_badges: { type: boolean }
                dashboard_show_ranking: { type: boolean }
                dashboard_show_challenges: { type: boolean }
                dashboard_show_konfispruch: { type: boolean }
                teamer_dashboard_show_zertifikate: { type: boolean }
                teamer_dashboard_show_challenges: { type: boolean }
                teamer_dashboard_show_konfispruch: { type: boolean }
                teamer_dashboard_show_events: { type: boolean }
                teamer_dashboard_show_badges: { type: boolean }
                teamer_dashboard_show_losung: { type: boolean }
                dashboard_section_order: { type: string, description: "JSON-String, Standard: [konfirmation, events, losung, badges, ranking]" }
                teamer_dashboard_section_order: { type: string, description: "JSON-String, Standard: [zertifikate, events, badges, losung]" }
      responses:
        "200": { description: "Einstellungen erfolgreich aktualisiert" }
        "400": { description: "Validierung verletzt (Boolean/Integer/JSON)" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Nur org_admin" }
        "500": { $ref: "#/components/responses/ServerError" }
      x-berechtigung:
        rollen: [org_admin]
        middleware: [verifyTokenRBAC, requireOrgAdmin, validateSettings]
        org-scope: true
        objekt-pruefung: "orgId ausschliesslich aus dem Token — der Body kann keine fremde Organisation adressieren"
        hinweis: >
          BEHOBEN 27.08.2026 (Befund N7): waitlist_enabled und
          max_waitlist_size wurden hier entgegengenommen und geschrieben,
          ohne dass sie irgendwo gewirkt haetten (waitlist_enabled zudem
          ungeprueft). Beide sind ersatzlos entfernt; die Warteliste wird
          weiterhin am einzelnen Termin eingestellt. Die Schreib-Vorgänge
          laufen als Einzel-Queries ohne Transaktion — ein Fehler in der
          Mitte hinterlaesst ein Teil-Update.

  # ==========================================================================
  # ROLES (backend/routes/roles.js — 3 Routen, Mount /api/roles)
  # Read-only: die 5 Systemrollen sind hardcoded, Permissions statisch.
  # ==========================================================================
  /api/roles:
    get:
      tags: ["Benutzer & Rollen"]
      summary: Alle Rollen der eigenen Organisation mit Nutzer-Zähler
      responses:
        "200": { description: "Array (id, name, display_name, description, is_system_role, is_active, created_at, user_count), sortiert org_admin > admin > teamer > konfi. Fuer die Rolle admin auf die verwaltbaren Rollen (teamer, konfi) eingeschraenkt." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Rolle nicht in [super_admin, org_admin, admin]" }
        "500": { $ref: "#/components/responses/ServerError" }
      x-berechtigung:
        rollen: [super_admin, org_admin, admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Inline: ['super_admin','org_admin','admin'].includes(req.user.role_name); WHERE r.organization_id = req.user.organization_id; danach filterRolesByHierarchy fuer admin"
        hinweis: >
          GEAENDERT 31.08.2026: admin darf die Liste sehen, weil die Leitung
          Teamer:innen anlegen darf und der Anlege-Dialog seine Rollenauswahl
          hier holt. Die Antwort wird fuer admin per filterRolesByHierarchy auf
          die Rollen reduziert, die canManageRole ihm erlaubt (teamer, konfi) —
          sonst boete der Dialog Rollen an, die POST /users danach mit 403
          zurueckweist. super_admin und org_admin bekommen weiterhin alle
          Rollen der Organisation samt Nutzer-Zaehlern. Die Antwortform bleibt
          ein Array.
          Der Inline-Check prüft strikt role_name und NICHT das
          is_super_admin-Flag — abweichend von der Projekt-Regel und von
          GET /roles/list/assignable, das beides berücksichtigt. Praktisch
          folgenlos, weil ein org_admin mit Flag ohnehin über role_name
          durchkommt. Die Rolle super_admin selbst hat keine
          organization_id, erhält hier also ein leeres Array.
    # Hinweis: Es gibt bewusst KEINE Schreib-Routen. Rollen sind 5 hardcodete
    # Systemrollen, die beim Anlegen einer Organisation erzeugt werden
    # (organizations.js POST /); Permissions sind statisch pro Rollenname.

  /api/roles/{id}:
    get:
      tags: ["Benutzer & Rollen"]
      summary: Einzelne Rolle mit statischer Berechtigungsliste
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 }, description: "ID der Rolle" }
      responses:
        "200": { description: "Rolle + permissions[] ({ name, description }) aus der hardcodeten getRolePermissions-Tabelle" }
        "400": { description: "Ungueltige ID" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Rolle weder super_admin noch org_admin" }
        "404": { description: "Rolle nicht in dieser Organisation" }
      x-berechtigung:
        rollen: [super_admin, org_admin]
        middleware: [verifyTokenRBAC, "param('id').isInt", handleValidationErrors]
        org-scope: true
        objekt-pruefung: "Inline-Rollen-Check; WHERE r.id = :id AND r.organization_id = req.user.organization_id"
        hinweis: >
          permissions kommt NICHT aus der Datenbank, sondern aus einer
          Konstante im Code (getRolePermissions). Sie beschreibt die
          Rechtevergabe rein deklarativ für die Anzeige; durchgesetzt wird
          sie an den Routen selbst per requireRole. Die Liste kann daher von
          der tatsaechlichen Durchsetzung abweichen.

  /api/roles/list/assignable:
    get:
      tags: ["Benutzer & Rollen"]
      summary: Rollen, die die aufrufende Person zuweisen darf
      description: >
        Whitelist nach eigener Rolle: super_admin (oder is_super_admin-Flag)
        darf org_admin, admin, teamer, konfi zuweisen; org_admin darf admin,
        teamer, konfi; admin darf teamer, konfi. Die Namen werden gegen die
        roles-Tabelle der eigenen Organisation aufgeloest.
      responses:
        "200": { description: "Array (id, name, display_name), sortiert admin > teamer > konfi" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { description: "Rolle nicht in [super_admin, org_admin, admin]" }
        "500": { $ref: "#/components/responses/ServerError" }
      x-berechtigung:
        rollen: [super_admin, org_admin, admin]
        middleware: [verifyTokenRBAC]
        org-scope: true
        objekt-pruefung: "Inline-Rollen-Check; WHERE r.organization_id = req.user.organization_id AND r.name = ANY(erlaubte)"
        hinweis: >
          Einzige Route dieser Datei, die das is_super_admin-Flag korrekt
          mitprueft (role_name === 'super_admin' || req.user.is_super_admin).
          Der Rueckgabewert ist nur eine Anzeige-Hilfe für die
          Nutzerverwaltung — die tatsaechliche Durchsetzung der Hierarchie
          leistet checkUserHierarchy in routes/users.js (siehe
          verwaltung-auth.yaml).

