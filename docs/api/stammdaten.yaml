# Alle 15 Routen aus backend/routes/organizations.js sind dort vollstaendig
# beschrieben (Abschnitt "ORGANIZATIONS", Mount /api/organizations) und werden
# hier nicht wiederholt:
#   GET    /organizations                       (super_admin)
#   POST   /organizations                       (super_admin)
#   GET    /organizations/search-users          (super_admin, org-uebergreifend)
#   GET    /organizations/current               (Verwaltungsrollen der eigenen Org)
#   GET    /organizations/{id}                  (super_admin oder Verwaltungsrolle der Org)
#   PUT    /organizations/{id}                  (super_admin oder org_admin der Org)
#   DELETE /organizations/{id}                  (super_admin)
#   PATCH  /organizations/{id}/limit            (super_admin)
#   GET    /organizations/{id}/users            (super_admin oder org_admin der Org)
#   GET    /organizations/{id}/admins           (super_admin oder org_admin der Org)
#   POST   /organizations/{id}/admins           (super_admin oder org_admin der Org)
#   GET    /organizations/{id}/members          (super_admin)
#   POST   /organizations/{id}/members          (super_admin)
#   DELETE /organizations/{id}/members/{userId} (super_admin)
#   GET    /organizations/{id}/stats            (super_admin oder Verwaltungsrolle der Org)
#
# Zwei org-uebergreifende Routen sind dabei besonders zu beachten und dort
# bereits so vermerkt:
#   - GET /organizations liefert JEDE Organisation samt Kontakt-, Trial- und
#     Lizenzdaten (nur super_admin).
#   - GET /organizations/search-users durchsucht ALLE Organisationen nach
#     Nicht-Konfi-Usern (nur super_admin, bewusst org-uebergreifend für die
#     Multi-Org-Zuweisung).
# Alle uebrigen organizations-Routen prüfen inline
# "is_super_admin ODER eigene Organisation".
#
# Ebenfalls nicht hier: auth.js und users.js (verwaltung-auth.yaml),
# teamer.js, material.js und wrapped.js (docs/api/teamer-material.yaml).
