services:
  e2e-db:
    image: postgres:16-alpine
    ports:
      - "5444:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    tmpfs:
      - /var/lib/postgresql/data
    # Schema beim Start einspielen. Ohne das startete die E2E-Datenbank leer,
    # das Backend brach mit `relation "events" does not exist` ab und der
    # ganze Stack kam nie hoch (gefunden 30.08.2026) — die E2E-Specs liefen
    # deshalb faktisch nie.
    #
    # Genommen wird derselbe Produktions-Dump wie in den Backend-Tests
    # (backend/tests/schema/prod-schema.sql, aktualisierbar mit
    # backend/tests/schema/refresh-schema.sh). Aus den Migrationen bauen geht
    # nicht: Die Kette beginnt erst bei 064, mehrere Objekte haben nirgends
    # ein DDL — wer daraus baut, testet ein Schema, das es so nie gab.
    volumes:
      - ./backend/tests/schema/prod-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 10

  e2e-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5555:5000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@e2e-db:5432/postgres
      JWT_SECRET: e2e-test-secret-key-min-32-chars!!
      CORS_ORIGINS: "http://localhost:5556"
      PORT: "5000"
      NODE_ENV: test
    depends_on:
      e2e-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10

  e2e-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:5555/api"
    ports:
      - "5556:80"
    depends_on:
      e2e-backend:
        condition: service_healthy
