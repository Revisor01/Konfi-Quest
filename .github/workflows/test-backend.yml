name: Test-Backend Image

# Baut ein Backend-Image aus dem AKTUELLEN Branch und legt es unter einem
# eigenen Tag ab — fuer das Test-Backend auf test-api.konfi-quest.de.
#
# Bewusst getrennt von ci.yml:
#   - ci.yml baut NUR auf main und vergibt 'latest' + den Commit-SHA.
#     Ein Branch-Build dort wuerde 'latest' ueberschreiben und damit den
#     naechsten Live-Redeploy auf ungetesteten Code ziehen.
#   - Dieser Workflow vergibt AUSSCHLIESSLICH 'test-<sha>' und 'test-latest'
#     und loest KEINEN Deploy aus. Der Live-Stack sieht davon nichts.
#
# Kein Frontend: Die TestFlight-App bringt ihre Oberflaeche selbst mit und
# spricht ueber VITE_API_URL mit dem Test-Backend.

on:
  workflow_dispatch:
    inputs:
      # KEINE Vorgabe (29.09.2026, Audit CI BF-15): Sie stand auf
      # 'feat/ionic-9', einem seit dem 01.09.2026 gemergten Branch -- ein
      # Aufruf ohne Angabe baute still einen alten Stand. Jetzt muss der
      # Branch genannt werden: gh workflow run test-backend.yml -f branch=<name>
      branch:
        description: 'Branch, aus dem gebaut wird (z. B. main oder ein Feature-Branch)'
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Kleingeschrieben: Docker lehnt Grossbuchstaben im Repository-Namen ab,
  # und github.repository_owner liefert 'Revisor01'.
  BACKEND_IMAGE: revisor01/konfi-quest-backend

jobs:
  build-test-image:
    runs-on: ubuntu-latest
    # Wie alle anderen Jobs mit Grenze statt GitHubs Vorgabe von sechs Stunden.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}

      # Schema-Waechter: Das Test-Backend laeuft gegen die ECHTE Datenbank und
      # fuehrt Migrationen beim Start automatisch aus (database.js).
      # Eine neue Migration wuerde also die Live-Daten ALLER Gemeinden
      # veraendern — nicht nur die Demo-Organisation. Deshalb bricht der Build
      # hier ab und verlangt eine bewusste Entscheidung.
      - name: Auf neue Migrationen pruefen
        run: |
          git fetch --no-tags origin main
          NEU=$(git diff --name-only origin/main...HEAD -- backend/migrations/ || true)
          if [ -n "$NEU" ]; then
            echo "::error::Dieser Branch bringt neue Migrationen mit:"
            echo "$NEU"
            echo "::error::Das Test-Backend laeuft auf der ECHTEN Datenbank."
            echo "::error::Erst Backup pruefen und die Migration bewusst ausrollen."
            exit 1
          fi
          echo "Keine neuen Migrationen — Schema bleibt unveraendert."

      # github.sha zeigt auf den Commit, aus dem der Workflow DISPATCHT wurde
      # (main) — nicht auf den ausgecheckten Branch. Dadurch trugen Image-Tag
      # und GIT_SHA den falschen Stand: Der Container meldete ueber
      # /api/status einen alten Commit, und 'test-latest' zeigte auf
      # unveraenderten Inhalt, sodass docker pull "up to date" sagte
      # (31.08.2026, zwei Builds lang unbemerkt).
      - name: Commit des Branches ermitteln
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build und Push (nur test-Tags)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:test-latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:test-${{ steps.commit.outputs.sha }}
          cache-from: type=gha
          build-args: |
            GIT_SHA=${{ steps.commit.outputs.sha }}

      - name: Hinweis
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:test-latest"
          echo "Der Live-Stack ist unberuehrt ('latest' wurde NICHT angefasst)."
