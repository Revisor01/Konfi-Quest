name: Test-Backend Image

# Baut ein Backend-Image aus dem AKTUELLEN Branch und legt es unter einem
# eigenen Tag ab — fuer das Test-Backend auf test-api.konfi-quest.de.
#
# Bewusst getrennt von ci.yml:
#   - ci.yml baut NUR auf main und vergibt 'latest' + den Commit-SHA.
#     Ein Branch-Build dort wuerde 'latest' ueberschreiben und damit den
#     naechsten Live-Redeploy auf ungetesteten Code ziehen.
#   - Dieser Workflow vergibt AUSSCHLIESSLICH 'test-<sha>' und 'test-latest'
#     und loest KEINEN Deploy aus. Der Live-Stack sieht davon nichts.
#
# Kein Frontend: Die TestFlight-App bringt ihre Oberflaeche selbst mit und
# spricht ueber VITE_API_URL mit dem Test-Backend.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch, aus dem gebaut wird'
        required: false
        default: 'feat/ionic-9'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # Kleingeschrieben: Docker lehnt Grossbuchstaben im Repository-Namen ab,
  # und github.repository_owner liefert 'Revisor01'.
  BACKEND_IMAGE: revisor01/konfi-quest-backend

jobs:
  build-test-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.branch }}

      # Schema-Waechter: Das Test-Backend laeuft gegen die ECHTE Datenbank und
      # fuehrt Migrationen beim Start automatisch aus (database.js).
      # Eine neue Migration wuerde also die Live-Daten ALLER Gemeinden
      # veraendern — nicht nur die Demo-Organisation. Deshalb bricht der Build
      # hier ab und verlangt eine bewusste Entscheidung.
      - name: Auf neue Migrationen pruefen
        run: |
          git fetch --no-tags origin main
          NEU=$(git diff --name-only origin/main...HEAD -- backend/migrations/ || true)
          if [ -n "$NEU" ]; then
            echo "::error::Dieser Branch bringt neue Migrationen mit:"
            echo "$NEU"
            echo "::error::Das Test-Backend laeuft auf der ECHTEN Datenbank."
            echo "::error::Erst Backup pruefen und die Migration bewusst ausrollen."
            exit 1
          fi
          echo "Keine neuen Migrationen — Schema bleibt unveraendert."

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build und Push (nur test-Tags)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:test-latest
            ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:test-${{ github.sha }}
          cache-from: type=gha
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Hinweis
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ env.BACKEND_IMAGE }}:test-latest"
          echo "Der Live-Stack ist unberuehrt ('latest' wurde NICHT angefasst)."
