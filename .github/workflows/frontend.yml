name: Build and Deploy Frontend

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/konfi-quest-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Portainer Webhook
        run: |
          # --fail laesst curl bei 4xx/5xx mit Exit != 0 abbrechen, damit ein
          # fehlgeschlagener Rollout den Job rot macht. Vorher stand hier
          # "|| true": der Webhook lief monatelang gegen eine tote Stack-ID
          # ("Unable to find the stack by webhook ID") und der Job meldete
          # trotzdem success — das Image lag in der Registry, ausgerollt
          # wurde es nie.
          if [ -z "${{ secrets.PORTAINER_WEBHOOK }}" ]; then
            echo "::error::PORTAINER_WEBHOOK ist nicht gesetzt — kein Rollout."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "${{ secrets.PORTAINER_WEBHOOK }}"
