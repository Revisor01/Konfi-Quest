name: Build and Deploy Frontend

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/konfi-quest-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Portainer
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
          STACK_ID: "249"
        run: |
          # Die Images im Stack sind bewusst auf Commit-SHAs gepinnt, nicht auf
          # :latest — so bleibt nachvollziehbar, welcher Stand laeuft, und ein
          # Rollback ist ein Klick auf die vorige Portainer-Version.
          #
          # Ein blosser Webhook-Aufruf reicht deshalb NICHT: Portainer wuerde
          # nur die bestehende Definition neu ausrollen, die weiter auf den
          # alten SHA zeigt. Wir schreiben den neuen Tag also in die Definition
          # und lassen Portainer diese deployen.
          set -euo pipefail
          SHA_TAG="${GITHUB_SHA::7}"
          echo "Rollout auf Tag: $SHA_TAG"

          for v in PORTAINER_URL PORTAINER_API_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v ist nicht gesetzt — kein Rollout."
              exit 1
            fi
          done

          AUTH="X-API-Key: $PORTAINER_API_KEY"
          API="$PORTAINER_URL/api/stacks/$STACK_ID"

          curl --fail --silent --show-error -H "$AUTH" "$API/file" -o stack.json

          # Nur den Frontend-Tag ersetzen. Das Backend bleibt bewusst auf
          # seinem Stand — sonst wuerde ein Frontend-Deploy ungefragt auch
          # Backend und Datenbankmigrationen mitziehen.
          python3 - "$SHA_TAG" <<'PY'
          import json, re, sys
          tag = sys.argv[1]
          content = json.load(open("stack.json"))["StackFileContent"]
          new, n = re.subn(
              r"(ghcr\.io/[^/]+/konfi-quest-frontend:)\S+",
              rf"\g<1>{tag}",
              content,
          )
          if n != 1:
              sys.exit(f"Erwartete genau 1 Frontend-Image-Zeile, {n} gefunden — Abbruch.")
          json.dump({"stackFileContent": new, "env": [], "prune": False, "pullImage": True},
                    open("payload.json", "w"))
          print(f"Frontend-Tag auf {tag} gesetzt.")
          PY

          curl --fail --silent --show-error -X PUT -H "$AUTH" \
            -H "Content-Type: application/json" \
            --data @payload.json "$API?endpointId=1" -o result.json

          python3 -c "
          import json
          d = json.load(open('result.json'))
          print('Stack', d.get('Name'), 'aktualisiert.')
          "
