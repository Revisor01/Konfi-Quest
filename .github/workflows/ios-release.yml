name: iOS Release Build

# Baut das iOS-Release auf einem GitHub-Runner mit RELEASE-macOS und laedt es
# zu App Store Connect hoch. Hintergrund: Builds von Beta-macOS-Maschinen werden
# von Apple mit ITMS-90111 abgelehnt (Beta-Host-Stempel im Binary) — der lokale
# Entwickler-Mac laeuft auf macOS-Beta, daher baut die CI.
#
# Version/Build-Nummer kommen aus frontend/version.json (Quelle der Wahrheit,
# via scripts/apply-version.sh). Vor dem Dispatch dort bumpen und committen.
#
# RELEASE-TOR (26.09.2026): Der Job ci-gate laesst den Build erst zu, wenn der
# Commit auf main liegt und der CI-Lauf (ci.yml) GENAU dieses Commits gruen
# ist -- siehe .github/scripts/release-gate.py. Dispatch wie bisher, z. B.
#   gh workflow run ios-release.yml --ref main

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API-Basis (LEER = Produktion). Fuer Tests: https://test-api.konfi-quest.de/api'
        required: false
        default: ''
      allow_non_main:
        description: 'Build von einem anderen Ref als main zulassen (Standard AUS). Nur fuer bewusste Testbuilds; die CI des Commits muss trotzdem gruen sein.'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci-gate:
    # RELEASE-TOR (26.09.2026, Release-Audit CI BF-01). Bis dahin baute dieser
    # Workflow jeden Ref, den man ihm per Dispatch vorsetzte -- ohne Blick auf
    # die CI. Nachgewiesen: Build 227 (b3b6ded1) und Build 222 (830257e9)
    # gingen aus Commits mit ROTER CI zu App Store Connect; die Release-Laeufe
    # starteten Sekunden nach dem Push, lange bevor die Tests durch waren. Der
    # Web-Deploy in ci.yml war immer gegatet, der Store-Build nicht -- und ein
    # Store-Build laesst sich nicht per Redeploy zurueckholen.
    #
    # Der Job prueft (a) der Commit liegt auf main -- oder die Eingabe
    # allow_non_main wurde bewusst gesetzt -- und (b) ci.yml ist fuer GENAU
    # diesen SHA gruen; laeuft die CI noch, wartet er bis 45 Minuten. Details
    # und Fehlertexte: .github/scripts/release-gate.py. Eigener Ubuntu-Job,
    # damit das Warten keine macOS-Minuten kostet und nicht am 60-Minuten-
    # Rahmen des Builds knabbert. Rechte: actions:read fuer `gh run list` --
    # kein neues Secret, das GITHUB_TOKEN des Laufs reicht.
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout (fuer das Skript)
        uses: actions/checkout@v7

      - name: Auf main? CI fuer diesen Commit gruen?
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          ALLOW_NON_MAIN: ${{ inputs.allow_non_main }}
        run: python3 .github/scripts/release-gate.py

  build-upload:
    needs: [ci-gate]
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Gebauter Commit ist der geprüfte Commit
        # Das Tor hat github.sha geprueft; gebaut wird, was der Checkout
        # ausgeliefert hat. Beides muss derselbe Commit sein.
        run: |
          IST=$(git rev-parse HEAD)
          if [ "$IST" != "${{ github.sha }}" ]; then
            echo "::error::Checkout steht auf $IST, geprueft wurde ${{ github.sha }}."
            exit 1
          fi
          echo "Baue $IST (vom Release-Tor geprueft)."

      - name: Neuestes stabiles Xcode waehlen
        run: |
          # Beta-Installationen ausschliessen — genau deren Stempel verursachen ITMS-90111.
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -iv beta | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=/Applications/Xcode.app; fi
          echo "Verwende: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          SDK_STAMP=$(plutil -extract ProductBuildVersion raw "$XCODE/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/"iPhoneOS*.sdk/SDKSettings.plist 2>/dev/null | head -1 || true)
          echo "iOS-SDK ProductBuildVersion: ${SDK_STAMP:-unbekannt}"

      - name: Store-Texte auf Plattform-Verweise pruefen
        # Apple lehnt unter Guideline 2.3.10 ab, wenn die Store-Texte andere
        # Plattformen nennen. Am 29.08.2026 hat genau ein Halbsatz ("der
        # Anzeige auf Android") 2.0.0 gekippt — zwei Tage Wartezeit fuer nichts,
        # der Build war in Ordnung. Die Pruefung sieht nur den iOS-Abschnitt an;
        # der Android-Abschnitt darf und soll Android nennen.
        run: |
          python3 - <<'PRUEF'
          import glob, re, sys
          schlecht = []
          for datei in glob.glob('docs/store-texte-*.md'):
              text = open(datei, encoding='utf-8').read()
              if '## iOS' not in text:
                  continue
              start = text.index('## iOS')
              ende = text.index('## Android') if '## Android' in text else len(text)
              # Hinweisbloecke (Zeilen mit ">") sind Anweisungen an uns,
              # kein Store-Text — die duerfen die Woerter nennen.
              zeilen = [z for z in text[start:ende].split('\n')
                        if not z.strip().startswith('>')]
              for treffer in re.finditer(r'(?i)android|google play|play store|windows',
                                         '\n'.join(zeilen)):
                  schlecht.append(f"{datei}: {treffer.group()}")
          if schlecht:
              print('Plattform-Verweise im iOS-Abschnitt gefunden:')
              for z in schlecht:
                  print('  ', z)
              print('Apple lehnt das unter Guideline 2.3.10 ab. Bitte entfernen.')
              sys.exit(1)
          print('iOS-Store-Texte sauber.')
          PRUEF

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Gegen das richtige Backend bauen
        # SIMONS ANSAGE (18.09.2026): "wir duerfen nicht mehr gegen das test
        # backend arbeiten, es muss das richtige backend sein". Bis hierher
        # haette ein versehentlich gefuelltes Eingabefeld eine Fassung in den
        # Store geschickt, die auf test-api zeigt -- und das faellt erst auf,
        # wenn niemand mehr seine Daten sieht. Die Eingabe bleibt fuer
        # TestFlight-Sonderfaelle erhalten, kostet aber jetzt eine bewusste
        # Entscheidung statt eines Versehens.
        run: |
          if [ -n "${{ inputs.api_url }}" ]; then
            echo "VITE_API_URL ist gesetzt: ${{ inputs.api_url }}"
            echo "Ein Store-Build muss gegen die Produktion laufen (Feld LEER lassen)."
            echo "Nur fuer bewusste Testflights: diesen Schritt im Workflow anpassen."
            exit 1
          fi
          echo "API-Basis leer -> Produktion (https://konfi-quest.de/api). Richtig so."

      - name: Web-Build + Capacitor-Sync
        working-directory: frontend
        # VITE_API_URL lenkt API UND Socket um (services/api.ts,
        # services/websocket.ts lesen dieselbe Variable). LEER bedeutet
        # Produktion — der normale Release-Weg aendert sich dadurch nicht.
        env:
          VITE_API_URL: ${{ inputs.api_url }}
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx cap sync ios
          # Firebase-Config wiederherstellen UND verifizieren. Das nackte `cp`,
          # das hier bis 24.09.2026 stand, kopierte ohne jede Pruefung — die
          # Fehlerklasse des Android-Push-Ausfalls 1.5.0 war auf der iOS-Seite
          # also weiterhin offen. Das Skript bricht hart ab, wenn Config,
          # Crashlytics-Pod oder die dSYM-Upload-Phase fehlen.
          ./scripts/prepare-ios.sh
          ./scripts/apply-version.sh

      - name: Signing-Keychain einrichten
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > dist.p12
          security create-keychain -p ci-build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-build build.keychain
          security set-keychain-settings -t 3600 build.keychain
          security import dist.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-build build.keychain >/dev/null
          rm dist.p12

      - name: ASC-API-Key ablegen
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Provisioning-Profil laden und installieren
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        # Das App-Store-Profil muss als DATEI auf dem Runner liegen, sonst
        # findet Xcode es nicht ("No profile for team ... matching ...") — ein
        # Profil in App Store Connect allein genuegt nicht.
        #
        # Geholt wird es ueber die ASC-API mit dem Schluessel, der schon fuer
        # den Upload da ist. Bewusst KEIN neues GitHub-Secret mit dem Profil
        # als base64: Ein Profil laeuft ab (ein Jahr) und muesste dann von Hand
        # erneuert werden — ein Geheimnis, das lautlos verfaellt, ist eine
        # Falle. Die API liefert immer den gueltigen Stand.
        run: |
          set -euo pipefail
          # cryptography fuer die ES256-Signatur des ASC-Tokens. Auf den
          # macOS-Runnern ist es nicht zugesichert, deshalb hier sicherstellen
          # (still, falls schon vorhanden).
          python3 -m pip install --quiet --disable-pip-version-check cryptography 2>/dev/null || \
            python3 -m pip install --quiet --break-system-packages cryptography
          python3 - <<'PYEOF'
          import base64, json, os, time, urllib.request, pathlib
          kid = os.environ['ASC_KEY_ID']; iss = os.environ['ASC_ISSUER_ID']
          p8 = pathlib.Path.home() / '.appstoreconnect/private_keys' / f'AuthKey_{kid}.p8'
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import ec, utils as asym
          def b64(d): return base64.urlsafe_b64encode(d).rstrip(b'=')
          now = int(time.time())
          hdr = b64(json.dumps({"alg":"ES256","kid":kid,"typ":"JWT"}).encode())
          clm = b64(json.dumps({"iss":iss,"iat":now,"exp":now+600,"aud":"appstoreconnect-v1"}).encode())
          si = hdr + b'.' + clm
          key = serialization.load_pem_private_key(p8.read_bytes(), password=None)
          der = key.sign(si, ec.ECDSA(hashes.SHA256()))
          r, sv = asym.decode_dss_signature(der)
          jwt = (si + b'.' + b64(r.to_bytes(32,'big') + sv.to_bytes(32,'big'))).decode()

          req = urllib.request.Request(
              'https://api.appstoreconnect.apple.com/v1/profiles?limit=200'
              '&fields[profiles]=name,profileType,profileState,profileContent',
              headers={'Authorization': f'Bearer {jwt}'})
          data = json.load(urllib.request.urlopen(req, timeout=30))

          ZIEL = 'Konfi Quest AppStore CI'
          treffer = [x for x in data.get('data', [])
                     if x['attributes'].get('name') == ZIEL]
          if not treffer:
              raise SystemExit(f'FEHLER: Profil "{ZIEL}" nicht in App Store Connect gefunden.')
          a = treffer[0]['attributes']
          if a.get('profileState') != 'ACTIVE':
              raise SystemExit(f'FEHLER: Profil "{ZIEL}" ist {a.get("profileState")}, nicht ACTIVE.')

          ziel_dir = pathlib.Path.home() / 'Library/MobileDevice/Provisioning Profiles'
          ziel_dir.mkdir(parents=True, exist_ok=True)
          out = ziel_dir / f'{ZIEL}.mobileprovision'
          out.write_bytes(base64.b64decode(a['profileContent']))
          print(f'Profil installiert: {out} ({out.stat().st_size} Bytes)')
          PYEOF

      - name: Archiv bauen
        working-directory: frontend/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          # KEIN -allowProvisioningUpdates beim Archivieren (24.09.2026).
          #
          # Mit dieser Option legt Xcode fehlende Zertifikate und Profile SELBST
          # ueber die ASC-API an. Auf einem CI-Runner ist der Keychain bei jedem
          # Lauf leer, also legte jeder Build ein NEUES Development-Zertifikat an.
          # Gemessen am 24.09.2026: 11 Development-Zertifikate im Konto, 10 davon
          # "Created via API" — sechs allein vom 23.09. Danach bricht jeder
          # weitere Build ab: "Your account has reached the maximum number of
          # certificates", gefolgt von "No profiles for 'de.godsapp.konfiquest'
          # were found". Das Limit ist kontoweit, betrifft also auch jedes andere
          # Projekt und die Arbeit am Mac.
          #
          # Ein Release braucht die Option gar nicht: Das Distribution-
          # Zertifikat liegt im Schritt "Signing-Keychain einrichten" bereits im
          # Keychain. Es fehlte nur die Ansage, dass genau das benutzt werden
          # soll — ohne sie versuchte Xcode Development-Signierung und wollte
          # sich dafuer neue Anmeldedaten besorgen.
          #
          # WARUM DIE OPTION TROTZDEM HIER STEHT: Ein erster Versuch setzte
          # stattdessen CODE_SIGN_STYLE=Manual samt Profilnamen auf die
          # Kommandozeile. Das schlug fehl, denn Einstellungen auf der
          # xcodebuild-Zeile gelten fuer JEDES Ziel im Workspace — also auch
          # fuer jeden Pod, und Bibliotheken nehmen kein Profil:
          # "FirebaseSessions does not support provisioning profiles" (und so
          # weiter fuer 14 weitere Pods).
          #
          # Was das Anlegen neuer Zertifikate wirklich verhindert, ist der
          # Schritt davor: Das App-Store-Profil liegt jetzt VOR dem Build als
          # Datei auf dem Runner, und das Distribution-Zertifikat steckt im
          # Keychain. Xcode findet damit alles vor und muss nichts erzeugen —
          # die Option erlaubt ihm nur noch, Vorhandenes zu benutzen.
          #
          # Gegenprobe nach dem naechsten Lauf: Die Zahl der Zertifikate im
          # Konto darf NICHT steigen. Beim zweiten Anlauf stand die Option hier
          # entgegen diesem Kommentar noch drin — deshalb stieg sie von 3 auf 5.
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive archive \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40

      - name: Absturz-Symbole (dSYM) nachreichen
        working-directory: frontend/ios/App
        # ABSTURZDIAGNOSE, zweiter Weg. Die Build-Phase im Xcode-Projekt
        # ("Crashlytics dSYM hochladen") laeuft schon beim `archive` und
        # erledigt das im Normalfall. Dieser Schritt ist die Gegenprobe
        # darauf, und zwar aus einem konkreten Grund:
        #
        #   - Die Build-Phase laeuft VOR dem Export. Der Export setzt hier
        #     stripSwiftSymbols=true, und was danach an Symbolen im IPA fehlt,
        #     ist dem Upload von vorher gleichgueltig — aber wenn die Phase aus
        #     irgendeinem Grund uebersprungen wurde (Pods nicht installiert,
        #     Sandboxing), faellt das NIE auf. Ein iOS-Absturzbericht ohne dSYM
        #     zeigt nur Speicheradressen.
        #   - Das Archiv enthaelt die dSYMs ohnehin; sie noch einmal aus dem
        #     Archiv zu schicken kostet Sekunden und ist unschaedlich
        #     (Crashlytics nimmt dieselbe UUID zweimal widerspruchslos an).
        #
        # KEIN zusaetzliches GitHub-Secret: upload-symbols zieht seine
        # Berechtigung aus der GoogleService-Info.plist, die prepare-ios.sh
        # oben wiederhergestellt und gegen Projekt und Bundle verifiziert hat.
        #
        # `continue-on-error`: Ein fehlgeschlagener Symbol-Upload darf das
        # Release NICHT aufhalten. Fehlende Symbole sind aergerlich, ein
        # blockierter Release ist schlimmer — dieselbe Abwaegung wie auf der
        # Android-Seite. Dass Pod und Build-Phase ueberhaupt vorhanden sind,
        # prueft prepare-ios.sh dagegen hart ab; das ist der stille Fehlerfall.
        continue-on-error: true
        run: |
          UPLOAD="Pods/FirebaseCrashlytics/upload-symbols"
          if [ ! -x "$UPLOAD" ]; then
            echo "upload-symbols nicht gefunden ($UPLOAD) — uebersprungen."
            exit 0
          fi
          DSYMS="build/App.xcarchive/dSYMs"
          if [ ! -d "$DSYMS" ]; then
            echo "Keine dSYMs im Archiv ($DSYMS) — uebersprungen."
            exit 0
          fi
          echo "Gefundene dSYMs:"
          ls -1 "$DSYMS"
          "$UPLOAD" -gsp App/GoogleService-Info.plist -p ios "$DSYMS"

      - name: IPA exportieren
        working-directory: frontend/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > ExportOptions-ci.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <!-- manual + festes Profil: Anders als auf der xcodebuild-Zeile
                 gilt das hier NUR fuer das App-Ziel, nicht fuer die Pods —
                 der Export verarbeitet nur das Archiv der App. Das Profil
                 liegt seit dem Schritt "Provisioning-Profil laden und
                 installieren" als Datei auf dem Runner. -->
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>de.godsapp.konfiquest</key>
              <string>Konfi Quest AppStore CI</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>teamID</key><string>J459G9CJT5</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          # KEIN -allowProvisioningUpdates, an KEINER der beiden Stellen
          # (24.09.2026, dritter Anlauf — die beiden vorigen haben es nicht
          # behoben).
          #
          # Die Option laesst Xcode fehlende Anmeldedaten selbst ueber die
          # ASC-API anlegen. Auf einem CI-Runner ist der Keychain bei jedem Lauf
          # leer, also entstand pro Build ein NEUES Development-Zertifikat.
          # Gemessen: 12 Zertifikate im Konto, 10 davon "Created via API".
          # Das Limit ist KONTOWEIT und blockiert damit auch jedes andere
          # Projekt und die Arbeit am Mac.
          #
          # WARUM DER ZWEITE ANLAUF NICHT REICHTE: Ich hatte die Option nur beim
          # Archivieren entfernt und hier "mit Absicht" stehen lassen — der
          # Export brauche das Profil als Datei. Das war falsch: Der Export
          # zieht dann ebenfalls Anmeldedaten nach und legt sein eigenes
          # Zertifikat an. Genau das erklaert die Messung "3 -> 5 nach einem
          # Build": zwei neue, nicht eines. Den Hinweis darauf hat die
          # Moin-Kark-Sitzung geliefert, die dasselbe Problem an ihrem Projekt
          # gemessen hat (dort 6 Zertifikate, 4 "Created via API").
          #
          # Gebraucht wird die Option an beiden Stellen nicht: Das
          # Distribution-Zertifikat liegt im Keychain (Schritt
          # "Signing-Keychain einrichten"), das App-Store-Profil liegt als Datei
          # auf dem Runner (Schritt "Provisioning-Profil laden und
          # installieren"), und die Signiereinstellungen stehen in der
          # Release-Konfiguration des Xcode-Projekts. Xcode findet alles vor und
          # muss nichts erzeugen. Fehlt doch etwas, bricht der Build mit klarer
          # Meldung ab, statt still Muell im Konto anzulegen — das ist das
          # bessere Verhalten.
          #
          # Gegenprobe nach dem naechsten Lauf: Die Zahl der Zertifikate im
          # Konto darf NICHT steigen.
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportPath build/export -exportOptionsPlist ExportOptions-ci.plist \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -10

      - name: Zu App Store Connect hochladen
        working-directory: frontend/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f build/export/App.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
