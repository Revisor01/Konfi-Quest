name: Notfall-Deploy

# Rollt EINEN bereits gebauten Stand sofort aus — ohne Tests, ohne Build.
#
# Wofuer: Wenn in Produktion etwas brennt und der regulaere Weg zu lange
# dauert. Der CI-Deploy laeuft erst nach backend-test (rund 9 Minuten, im
# Zweifel laenger) und dann nach build-and-push. Am 27.08.2026 kostete das
# bei einem Absturz-Fix ueber 20 Minuten, in denen das Backend weiter alle
# paar Minuten neu startete. Und zum ZURUECKROLLEN auf einen frueheren Stand.
#
# WICHTIG — was diese Action NICHT tut:
# Sie baut KEINE Images. Sie rollt aus, was auf ghcr bereits unter dem
# angegebenen Tag liegt. Das ist bewusst so: Der Notfall ist "der Fix ist
# gebaut, aber die Pipeline haelt ihn auf", nicht "bau mir schnell was".
# Gibt es das Image nicht, schlaegt der Deploy fehl und Produktion bleibt
# unveraendert — das ist der sichere Ausgang.
#
# WANN NICHT BENUTZEN:
# Fuer den Normalfall. Ungetestet auszurollen ist eine Ausnahme mit Ansage;
# der regulaere Weg ueber main prueft vorher. Diese Action laeuft nur von
# Hand und schreibt in die Zusammenfassung, wer sie ausgeloest hat.
#
# DERSELBE WEG WIE DER CI-DEPLOY (29.09.2026, Audit CI BF-10): Der Workflow
# war seit seiner Einfuehrung nie gelaufen, also auch nie geprobt, und
# tauschte alle Dienste mit EINEM update_stack (Luecke). Jetzt ruft er
# deploy/rollend.sh -- das Skript, das bei jedem Push auf main ausrollt und
# dort laufend geprobt wird: zwei Stufen, Warten auf gesund, Verify gegen den
# vollen Commit. Anders als im CI-Deploy ohne NUR_VORWAERTS, denn
# Zurueckrollen ist hier der Zweck.
#
# PROBELAUF: Mit probelauf=true geht der Workflow denselben Weg bis
# unmittelbar vor update_stack (Image auf ghcr, Portainer-Zugang,
# Tag-Umschreibung auf einer Kopie, Gegenprobe auf backend-test, Status) und
# aendert nichts. So laesst sich der Rueckrollweg jederzeit gefahrlos proben
# (Auftrag docs/auftraege/lokaler-agent/05-sicherung-und-notfall.md).
#
# RUECKROLLEN UND MIGRATIONEN: Zurueckgedreht wird nur der Code. Migrationen
# bleiben (sie laufen additiv, CLAUDE.md) -- der aeltere Code muss mit dem
# neueren Schema laufen. Beim Rueckrollen ueber eine Migration hinweg vorher
# pruefen, ob sie Spalten entfernt oder umbenennt; das darf nach CLAUDE.md
# nicht vorkommen.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image-Tag (7 Zeichen, z.B. 712263d). Leer = juengster main-Stand mit gebauten Images"
        required: false
        default: ""
      grund:
        description: "Warum? (steht spaeter im Protokoll)"
        required: true
      probelauf:
        description: "Probelauf: alles pruefen, NICHTS aendern (zum Ueben des Rueckrollwegs)"
        type: boolean
        default: false

# packages: read fuer `docker manifest inspect` auf ghcr (29.09.2026, Audit
# CI BF-10): Bis dahin klappte die Pruefung nur, weil die Pakete oeffentlich
# sind -- mit angemeldetem Token ohne dieses Recht haette ghcr die Anfrage
# ablehnen koennen, und der Notfall-Deploy haette "Image fehlt" gemeldet.
permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Nie gleichzeitig mit einem CI-Deploy (dieselbe Gruppe wie in ci.yml).
    # Ein laufender Deploy wird nicht abgebrochen; ein wartender CI-Deploy
    # wird durch diesen ersetzt -- beim Zurueckrollen gewollt.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag bestimmen und pruefen, ob das Image existiert
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          EINGABE_TAG: ${{ inputs.image_tag }}
          AKTEUR: ${{ github.actor }}
        # Leer = juengster Stand MIT gebauten Images, nicht blind HEAD: Ein
        # Commit nur an docs/ baut keine (30.09.2026, Probelauf). Logik und
        # Tests: deploy/notfall-tag.sh, frontend/src/__tests__/betrieb/notfallTag.test.ts.
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "$AKTEUR" --password-stdin
          bash deploy/notfall-tag.sh

      - name: Rollend ausrollen (deploy/rollend.sh) + Verify
        env:
          P_URL: ${{ secrets.PORTAINER_URL }}
          P_KEY: ${{ secrets.PORTAINER_API_KEY }}
          STACK_ID: "249"
          ENDPOINT_ID: "1"
          GIT_SHA: ${{ steps.tag.outputs.voll }}
          # Immer gegen den Commit pruefen: Beide Backends muessen den
          # gewaehlten Stand melden.
          BACKEND_CHANGED: "1"
          STATUS_URL: https://konfi-quest.de/api/status
          PROBELAUF: ${{ inputs.probelauf && '1' || '0' }}
          GRUND: ${{ inputs.grund }}
          AKTEUR: ${{ github.actor }}
        run: |
          echo "Notfall-Deploy von ${GIT_SHA:0:7} — ausgeloest von $AKTEUR"
          echo "Grund: $GRUND"
          if [ "$PROBELAUF" = "1" ]; then echo "PROBELAUF: nichts wird geaendert."; fi
          bash deploy/rollend.sh

      - name: Zusammenfassung
        if: success()
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          PROBELAUF: ${{ inputs.probelauf && '1' || '0' }}
          GRUND: ${{ inputs.grund }}
          AKTEUR: ${{ github.actor }}
        run: |
          {
            if [ "$PROBELAUF" = "1" ]; then
              echo "### Notfall-Deploy: Probelauf erfolgreich"
              echo ""
              echo "Nichts wurde geaendert. Der echte Lauf mit diesem Stand wuerde ausrollen."
            else
              echo "### Notfall-Deploy erfolgreich"
              echo ""
              echo "Ohne Tests ausgerollt. Der regulaere Lauf auf \`main\` prueft nach."
            fi
            echo ""
            echo "- **Stand:** \`$TAG\`"
            echo "- **Ausgeloest von:** @$AKTEUR"
            echo "- **Grund:** $GRUND"
          } >> "$GITHUB_STEP_SUMMARY"
