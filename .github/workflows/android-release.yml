name: Android Release Build

# Baut das signierte AAB und laedt es per Google-Play-API in die Tracks.
# Google startet die Review automatisch, sobald "production" dabei ist.
#
# Version/versionCode kommen aus frontend/version.json (Quelle der Wahrheit,
# build.gradle liest sie direkt). Vor dem Dispatch: versionCode bumpen,
# frontend/release-notes-de.txt aktualisieren, committen.
#
# RELEASE-TOR (26.09.2026): Der Job ci-gate laesst den Build erst zu, wenn der
# Commit auf main liegt und der CI-Lauf (ci.yml) GENAU dieses Commits gruen
# ist -- siehe .github/scripts/release-gate.py. Dispatch wie bisher, z. B.
#   gh workflow run android-release.yml --ref main -f tracks=internal,alpha
#
# WARUM DIE VORGABE NUR DIE TESTKANAELE NENNT (15.09.2026): Sie stand auf
# "internal,alpha,production". Ein Dispatch ohne gesetzte Eingabe — per CLI
# der Normalfall, dort ist die Vorgabe unsichtbar — reichte damit
# ungefragt einen Production-Release ein und ersetzte die laufende
# Google-Pruefung. Genau so ist versionCode 102 am 15.09.2026
# versehentlich in die Produktion gegangen.
#
# Ein Produktions-Release ist nicht umkehrbar: Eine falsche Einreichung
# laesst sich nicht zurueckziehen, nur durch eine weitere ersetzen. Deshalb
# muss "production" ausdruecklich hingeschrieben werden. Wer nichts angibt,
# bekommt die Testkanaele — der sichere Fall.

on:
  workflow_dispatch:
    inputs:
      tracks:
        description: "Ziel-Tracks (kommagetrennt). production NUR bewusst setzen — das reicht sofort zur Pruefung ein."
        default: "internal,alpha"
        required: true
      dry_run:
        description: "Dry-Run: kompletter Durchlauf, aber Play-Edit wird verworfen (kein Release)"
        type: boolean
        default: false
      allow_non_main:
        description: "Build von einem anderen Ref als main zulassen (Standard AUS). Nur fuer bewusste Testbuilds; die CI des Commits muss trotzdem gruen sein."
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ci-gate:
    # RELEASE-TOR (26.09.2026, Release-Audit CI BF-01). Bis dahin baute dieser
    # Workflow jeden Ref, den man ihm per Dispatch vorsetzte -- ohne Blick auf
    # die CI. Nachgewiesen: Android-Lauf 53 (Commit b3b6ded1, versionCode 123)
    # ging aus einem Commit mit ROTER CI in die Play-Tracks; der Release-Lauf
    # startete 15 Sekunden nach dem Push, lange bevor die Tests durch waren.
    # Ein Production-Release ist nicht umkehrbar (siehe oben, versionCode 102).
    #
    # Der Job prueft (a) der Commit liegt auf main -- oder die Eingabe
    # allow_non_main wurde bewusst gesetzt -- und (b) ci.yml ist fuer GENAU
    # diesen SHA gruen; laeuft die CI noch, wartet er bis 45 Minuten. Details
    # und Fehlertexte: .github/scripts/release-gate.py. Rechte: actions:read
    # fuer `gh run list` -- kein neues Secret, das GITHUB_TOKEN des Laufs reicht.
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout (fuer das Skript)
        uses: actions/checkout@v7

      - name: Auf main? CI fuer diesen Commit gruen?
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
          ALLOW_NON_MAIN: ${{ inputs.allow_non_main }}
        run: python3 .github/scripts/release-gate.py

  build-upload:
    needs: [ci-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Gebauter Commit ist der geprüfte Commit
        # Das Tor hat github.sha geprueft; gebaut wird, was der Checkout
        # ausgeliefert hat. Beides muss derselbe Commit sein.
        run: |
          IST=$(git rev-parse HEAD)
          if [ "$IST" != "${{ github.sha }}" ]; then
            echo "::error::Checkout steht auf $IST, geprueft wurde ${{ github.sha }}."
            exit 1
          fi
          echo "Baue $IST (vom Release-Tor geprueft)."

      - name: JDK 21 einrichten
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Node einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: "Dry-Run: versionCode temporaer anheben"
        if: ${{ inputs.dry_run }}
        working-directory: frontend
        run: |
          # +10000, damit der Upload nicht am bereits releasten Code scheitert.
          # Die Edit wird am Ende verworfen — der Code wird NICHT verbraucht.
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('version.json'));v.androidVersionCode+=10000;fs.writeFileSync('version.json',JSON.stringify(v,null,2)+'\n');console.log('Dry-Run versionCode:',v.androidVersionCode)"

      - name: Web-Build + Capacitor-Sync + Firebase-Config
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npx cap sync android
          ./scripts/prepare-android.sh

      - name: Keystore ablegen
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.jks

      - name: Signiertes AAB bauen
        working-directory: frontend/android
        # ABSTURZDIAGNOSE: Die R8-Mapping-Datei wird hier MIT hochgeladen, ohne
        # eigenen Schritt und ohne zusaetzliches Geheimnis.
        #
        # Warum das genuegt (am Plugin-JAR 3.0.8 nachgesehen, nicht geraten):
        # Das Crashlytics-Gradle-Plugin legt je Variante einen Task
        # `uploadCrashlyticsMappingFile<Variante>` an und haengt ihn per
        # `finalizedBy` an `minify<Variante>WithR8`. Da der Release-Bau seit
        # 19.09.2026 mit minifyEnabled true laeuft, laeuft dieser Task als Teil
        # von bundleRelease automatisch mit.
        #
        # Die Berechtigung kommt aus der google-services.json, die
        # prepare-android.sh oben wiederherstellt und verifiziert — deshalb
        # braucht der Upload KEIN Dienstkonto und kein weiteres GitHub-Secret.
        #
        # Ein fehlgeschlagener Upload bricht den Bau NICHT ab: Das Plugin
        # meldet ihn als Warnung. Das ist hier die richtige Abwaegung — ein
        # Release ohne Mapping ist aergerlich (Berichte zeigen a.b.c), ein
        # blockierter Release ist schlimmer. Dass das Plugin ueberhaupt
        # angewendet WIRD und der Upload eingeschaltet ist, prueft dagegen
        # prepare-android.sh hart ab; genau das ist der stille Fehlerfall.
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease \
            "-PKONFI_KEYSTORE_PATH=/tmp/release.jks" \
            "-PKONFI_KEYSTORE_PASSWORD=$KS_PASS" \
            "-PKONFI_KEY_ALIAS=$KEY_ALIAS" \
            "-PKONFI_KEY_PASSWORD=$KEY_PASS"
          ls -la app/build/outputs/bundle/release/app-release.aab

      - name: Zu Google Play hochladen
        env:
          GPLAY_SA_JSON_BASE64: ${{ secrets.GPLAY_SA_JSON_BASE64 }}
        run: |
          echo "$GPLAY_SA_JSON_BASE64" | base64 --decode > /tmp/gplay-sa.json
          python3 .github/scripts/upload-play.py /tmp/gplay-sa.json \
            frontend/android/app/build/outputs/bundle/release/app-release.aab \
            frontend/release-notes-de.txt \
            "${{ inputs.tracks }}" \
            "${{ inputs.dry_run && 'validate' || 'commit' }}"
