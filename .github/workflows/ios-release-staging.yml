name: iOS Staging Build (TestFlight)

# Kopie von ios-release.yml, baut aber mit VITE_API_URL auf die STAGING-API
# (staging.konfi-quest.de) statt Prod. Fuer interne TestFlight-Tests von
# Feature-Branches — gleiche Bundle-ID, eigene Build-Nummer aus version.json.
# Vor dem Dispatch iosBuildNumber in frontend/version.json bumpen und committen.
# Den Prod-Workflow (ios-release.yml) NICHT anfassen.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'API-Basis-URL, die in die App einkompiliert wird'
        required: false
        default: 'https://staging.konfi-quest.de/api'

permissions:
  contents: read

jobs:
  build-upload:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Neuestes stabiles Xcode waehlen
        run: |
          # Beta-Installationen ausschliessen — genau deren Stempel verursachen ITMS-90111.
          XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | grep -iv beta | sort -V | tail -1)
          if [ -z "$XCODE" ]; then XCODE=/Applications/Xcode.app; fi
          echo "Verwende: $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          SDK_STAMP=$(plutil -extract ProductBuildVersion raw "$XCODE/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/"iPhoneOS*.sdk/SDKSettings.plist 2>/dev/null | head -1 || true)
          echo "iOS-SDK ProductBuildVersion: ${SDK_STAMP:-unbekannt}"

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Web-Build + Capacitor-Sync
        working-directory: frontend
        env:
          VITE_API_URL: ${{ inputs.api_url || 'https://staging.konfi-quest.de/api' }}
        run: |
          echo "Baue gegen API: $VITE_API_URL"
          npm ci --no-audit --no-fund
          npm run build
          npx cap sync ios
          # Firebase-Config aus der versionierten Master-Kopie wiederherstellen
          # (ios/App/App/GoogleService-Info.plist ist gitignored — gleiche
          # Fehlerklasse wie der Android-Push-Ausfall 1.5.0)
          cp config/GoogleService-Info.plist ios/App/App/GoogleService-Info.plist
          ./scripts/apply-version.sh

      - name: Signing-Keychain einrichten
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        run: |
          echo "$P12_BASE64" | base64 --decode > dist.p12
          security create-keychain -p ci-build build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci-build build.keychain
          security set-keychain-settings -t 3600 build.keychain
          security import dist.p12 -k build.keychain -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci-build build.keychain >/dev/null
          rm dist.p12

      - name: ASC-API-Key ablegen
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archiv bauen
        working-directory: frontend/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive archive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -40

      - name: IPA exportieren
        working-directory: frontend/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > ExportOptions-ci.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>automatic</string>
            <key>stripSwiftSymbols</key><true/>
            <key>teamID</key><string>J459G9CJT5</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/App.xcarchive \
            -exportPath build/export -exportOptionsPlist ExportOptions-ci.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -10

      - name: Zu App Store Connect hochladen
        working-directory: frontend/ios/App
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app -f build/export/App.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
