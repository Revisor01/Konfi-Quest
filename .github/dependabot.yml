version: 2

# Ohne diese Datei erzeugt Dependabot nur Einzel-PRs aus Security-Alerts, wann
# immer eine Luecke gemeldet wird. Hier wird daraus ein fester woechentlicher
# Termin mit gebuendelten PRs: Patch- und Minor-Updates je Oekosystem in einem
# PR, Major-Updates einzeln (die brauchen ohnehin einen Blick).

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      backend-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      root-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # Actions in den Release- und CI-Workflows aktuell halten (Node-Setup,
  # Checkout, Upload-Artefakte). Monatlich reicht, die aendern sich selten.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns:
          - "*"

  # Basis-Images der beiden Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /frontend
      - /backend
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
