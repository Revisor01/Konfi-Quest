version: 2

# Ohne diese Datei erzeugt Dependabot nur Einzel-PRs aus Security-Alerts, wann
# immer eine Luecke gemeldet wird. Hier wird daraus ein fester woechentlicher
# Termin mit gebuendelten PRs: Patch- und Minor-Updates je Oekosystem in einem
# PR, Major-Updates einzeln (die brauchen ohnehin einen Blick).

updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      frontend-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      frontend-security:
        applies-to: security-updates
        patterns:
          - "*"
    # REACT-ROUTER BLEIBT AUF 6 (nachgemessen 09.09.2026):
    # @ionic/react-router@9 verlangt `react-router: >=6.4.0 <7`. Version 7
    # und 8 sind mit Ionic 9 UNVEREINBAR, nicht bloss riskant -- Dependabot
    # legte dafuer trotzdem PRs an (#159, #160), die niemand mergen kann.
    # Ein Wechsel geht nur zusammen mit einem Ionic-Hauptversionssprung.
    #
    # Patch- und Minor-Updates INNERHALB von 6 kommen weiterhin durch; nur
    # die Hauptversionen sind ausgenommen.
    #
    # Seit 29.09.2026 per `versions` statt `update-types` (Release-Audit
    # Toolchain BF-09): `update-types` wirkt nur auf Versions-Updates, nicht
    # auf Sicherheits-Updates. Deshalb legte Dependabot am 29.09.2026 trotz
    # Ignore den Sicherheits-PR #188 an (react-router 6.30.6 -> 7.18.2, im
    # Gruppen-PR frontend-security) -- `npm ci` scheitert dort am
    # Peer-Konflikt mit @ionic/react-router. Ein `versions`-Bereich gilt fuer
    # beide Arten. Die zwei moderaten react-router-Meldungen bleiben damit als
    # Warnung stehen, bekommen aber keinen unmergebaren PR mehr; im Code sind
    # sie nicht erreichbar (kein SSR, feste Pfad-Praefixe, nachgeprueft im
    # Release-Audit vom 26.09.2026).
    #
    # TYPESCRIPT BLEIBT AUF 6 (29.09.2026): typescript-eslint 8.71 verlangt
    # `typescript: >=4.8.4 <6.1.0`. TypeScript 7 (PR #157) scheitert deshalb
    # schon bei `npm ci`. Erst wieder zulassen, wenn typescript-eslint
    # TypeScript 7 in seinen peerDependencies traegt.
    ignore:
      - dependency-name: react-router
        versions: [">= 7.0.0"]
      - dependency-name: react-router-dom
        versions: [">= 7.0.0"]
      - dependency-name: "@ionic/react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      backend-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      backend-security:
        applies-to: security-updates
        patterns:
          - "*"
    # Hauptversionen kommen einzeln und werden bewusst gemergt. Die
    # vitest-Hauptversion Backend und Frontend GEMEINSAM anheben (PR #167
    # hier, #158 im Frontend), damit nicht zwei Hauptversionen desselben
    # Testwerkzeugs nebeneinander laufen (Release-Audit Toolchain BF-09).

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(deps)
      prefix-development: chore(deps-dev)
    groups:
      root-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # Actions in den Release- und CI-Workflows aktuell halten (Node-Setup,
  # Checkout, Upload-Artefakte). Monatlich reicht, die aendern sich selten.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore(ci)
    groups:
      actions:
        patterns:
          - "*"

  # Basis-Images der beiden Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /frontend
      - /backend
    schedule:
      interval: monthly
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore(deps)
    # NODE-LINIE (29.09.2026, Audit CI BF-11): Die Node-Hauptversion steht in
    # .nvmrc und gilt fuer CI, beide Images und engines zugleich (Test
    # nodeVersionEineLinie). Ein Sprung nur im Dockerfile risse die Linie auf
    # und liefe in Produktion auf einer Fassung, die CI nie gesehen hat.
    # Hauptversion deshalb bewusst von Hand an allen Stellen; Patch und Minor
    # innerhalb der Linie kommen weiter durch.
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
